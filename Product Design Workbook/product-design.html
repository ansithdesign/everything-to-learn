## 1. AI in your workflow

### Where AI helps and hurts

| Task type | AI is often useful for | Watch out for |
| --- | --- | --- |
| **Exploring** (ideas, angles, analogies) | Widening the option set fast | Sameness: everyone gets the same ideas |
| **Drafting** (copy, first layouts, boilerplate) | A fast first version to react to | Generic output; accepting the first draft |
| **Transforming** (reformatting, summarizing, translating) | Mechanical changes at volume | Dropped detail, shifts in meaning |
| **Checking** (consistency, contrast, missing states, typos) | A fast second pair of eyes | False confidence, missed context |
| **Deciding** (what to build, what's right for users) | Little; it can structure options | Delegating judgment you should keep |

### A workflow, end to end

- **Discovery:** summarize background reading, draft interview guides, find questions to ask. Don't replace participants (see [[ch:04]] on synthetic users).
- **Framing:** stress-test a problem statement, list assumptions, generate counterarguments.
- **Ideation:** produce wide starting points, then choose deliberately.
- **Design:** generate layout and copy variations within your system, build prototypes (see [[ch:09]]), create sample data.
- **Review:** run mechanical checks (states, contrast, labels), draft test scripts and acceptance criteria.
- **Communication:** structure and tighten documents; keep your voice and verify facts (see [[ch:07]]).

### What surveys say

Surveys point the same way: heavy, rising use. Figma's State of the Designer 2026, as relayed by secondary coverage of a gated report, reports that 72 percent of surveyed designers use generative AI and that heavy users say it improves quality and speed. Another survey summary says 91 percent of designers use AI at least weekly. I couldn't verify either report, the two come from different surveys and are often confused, and both are self-reported by people who chose to respond.[[ref:figma-sotd-2026]] Read them as evidence that adoption is widespread, not as measurements of benefit.

### Your operating principles

1. **Start from the problem, not the tool.**
2. **Keep the decisions.** Let the tool produce options; you choose and can say why.
3. **Verify.** Facts, numbers, citations and behavior must be checked.
4. **Constrain.** Give the tool your system, tokens, content rules and accessibility requirements.
5. **Keep a record** of what you asked, what it produced and what you changed.
6. **Protect people's data.** Don't put confidential or personal data into tools you aren't authorized to use.
7. **Keep practicing the underlying skill.** Do some work without the tool so your judgment doesn't atrophy.

:::exercise Try it: map your own workflow (1 hour)
List what you did last week. Mark each task as exploring, drafting, transforming, checking or deciding. For each, note whether you used AI, what it saved and what you had to fix. Choose one task to hand more to AI and one to keep entirely yours, and say why.
:::

## 2. Prompting for design

### What it really is

Prompting is writing a clear brief for a system that has no context beyond what you give it. It's much closer to writing a good ticket or design brief than to finding a magic phrase. Model vendors publish guidance for their own models, and the common elements are consistent.[[ref:prompt-guide]]

:::framework A prompt that works
**Goal:** what you want and what it's for. **Context:** users, product, situation, constraints. **Inputs:** the material to work from, clearly separated. **Constraints:** what must and must not happen (tokens, accessibility rules, tone, length). **Output format:** the shape you want. **Examples:** one or two of good (and sometimes bad). **Criteria:** how you'll judge it, which the model can also use to check itself.
:::

### Techniques that help

- **Be specific about outcome and audience.** "A settings page for a finance admin who changes permissions weekly" beats "a settings page."
- **Provide the system:** tokens, component names, content guidelines, accessibility requirements.
- **Show examples** of the style or structure you want.
- **Break big tasks into steps.** Ask for a plan, review it, then ask for the next piece.
- **Ask for alternatives and trade-offs,** not one answer.
- **Ask it to check against your criteria** and say what it's unsure about.
- **Iterate on the brief,** not just the output. If results are consistently off, the brief is usually the problem.
- **Keep a library** of prompts that work, with context and date, since models change.

### Prompts in the product

When a product uses a model, the instructions it sends (system prompts, templates, examples) are part of the design. They set tone, scope, refusals and behavior. Designers should help write and test them with the same care as copy and states: version them, test them across varied inputs and document why they say what they say.

### 2026 shift

Models increasingly handle underspecified requests and longer, multi-step tasks, and agents can act across tools. That moves the skill from clever phrasing to **good specification and good review**: say what "done" means, give constraints, check the result. Tool-specific tricks expire quickly; a clear brief doesn't.

:::exercise Try it: write a brief, then improve it (1 hour)
Pick a design task (say, a tokenized empty state for a table). Write a one-line prompt and save the result. Then write a full brief using the framework and compare. Change one element at a time (add the system, an example, criteria) and note which helped most.
:::

## 3. Evaluating and directing

When producing options is cheap, **judging them well** is the job. Use the vocabulary from [[ch:01]] and the states thinking from [[ch:02]].

### A rubric for generated work

| Dimension | Questions |
| --- | --- |
| **Fit to the problem** | Does it solve the user's task? Is anything missing or invented? |
| **Hierarchy and clarity** | What's the first read? Is it the right one? |
| **System consistency** | Real tokens and components, or hardcoded and invented ones? |
| **States and edge cases** | Empty, loading, error, long text, other languages? |
| **Accessibility** | Contrast, keyboard, labels, focus, motion? (See [[ch:11]]) |
| **Content accuracy** | Are facts, numbers and labels correct? |
| **Behavior** | For code and prototypes: does it work, and for which inputs? |
| **Originality** | Specific to us, or generic? |

### How generated work fails

- **Plausible and wrong:** fluent text with incorrect facts, UI that looks right and doesn't work.
- **Sameness:** generic layouts and stock phrases. NN/g notes decent-looking UI is easy for anyone to make, so your edge is elsewhere.[[ref:nng-state-ux-2026]]
- **Invented structure:** props, components, tokens or behaviors that don't exist in your system (see [[ch:03]]).
- **Missing the unhappy paths:** generated designs tend to show success.
- **Inaccessible output:** poor structure, missing labels, low contrast. The industry baseline is already poor (see [[ch:11]]), and models learn from it.
- **Sycophancy:** models tend to agree with you, which undermines asking one to critique your work.
- **Confident numbers and citations:** check any statistic or reference against the original.

:::warning Common trap: fluency isn't accuracy
Because generated text and interfaces look finished, it's easy to skip checks you'd do on a colleague's draft. Apply at least that scrutiny, and more where the output asserts facts or will reach users unreviewed.
:::

### Directing

Directing is turning critique into a better next attempt:

1. **Name the problem specifically** ("the secondary action competes with the primary because both are filled").
2. **Say what to keep.**
3. **Give a constraint or example** that points the way.
4. **Change one thing at a time** so you learn what works.
5. **Know when to stop and do it by hand.** Past a point, directing costs more than doing.

For features that use models, evaluation is systematic: build a set of representative inputs (including hard ones), write a rubric for acceptable and unacceptable output, review samples with real users and track failure categories over time. Product Talk presents AI evals as a core discovery habit.[[ref:product-talk]] See also [[ch:02]] and [[ch:04]].

:::exercise Try it: score five generated options (2 hours)
Generate five versions of a screen with a tool. Score each on the rubric, noting the most serious problem in each. Choose one, direct two rounds of improvement with specific critiques and write what you had to fix by hand. Record how long each step took.
:::

## 4. Responsible AI

### Why designers are involved

Designers decide what a product asks of people, what it shows, how it explains itself and what happens when it fails. Those choices determine whether an AI feature is understandable, fair, safe and under the user's control. Responsible AI isn't only an engineering or legal concern.

| Area | What can go wrong | Design responses |
| --- | --- | --- |
| **Bias and fairness** | Worse performance or harm for some groups, languages or contexts | Test across groups; include diverse users; make failure recoverable; avoid sensitive attributes without need |
| **Privacy and data** | Personal data used or exposed without consent | Minimize and explain data use; real consent; control and deletion |
| **Safety and misuse** | Harmful or false output; abuse by bad actors | Limits, warnings where useful, escalation, abuse reporting |
| **Transparency** | People don't know they're dealing with AI or how it reached a result | Clear disclosure, explanation, sources |
| **Oversight and accountability** | No one is responsible; people can't intervene | Approval points, stop controls, audit trails, named owners (see [[ch:02]]) |
| **Manipulation** | Persuasive, sycophantic or dependency-forming design | Avoid dark patterns; test for overreliance; offer ways out |
| **IP** | Training data, generated output or imitation of creators | Provenance, licensing, clear asset policy |
| **Environmental and economic cost** | Heavy compute for low-value features | Ask whether it's worth it (see [[ch:05]]) |

### Regulation in 2026

This area is moving, and this isn't legal advice. Verify with counsel.

- **EU AI Act.** Obligations phase in over several years. Secondary legal analyses I found (law firm and compliance sources, not the legal text) say the Article 50 transparency duties, covering disclosure of chatbot interaction and labeling of AI-generated content and deepfakes, still apply from **2 August 2026**. They also report that an agreement to postpone high-risk deadlines was endorsed in June 2026, moving the main high-risk deadline from August 2026 to December 2027 and some product-related categories to August 2028. One source noted Official Journal publication was unconfirmed. Check the current legal position before relying on any date.[[ref:eu-ai-act-omnibus]]
- **NIST AI Risk Management Framework.** NIST published the voluntary Generative AI Profile (NIST AI 600-1) in July 2024 as a companion to its AI RMF, identifying risks specific to generative AI with suggested actions, including recording who provides human oversight and planning how to halt a system posing unacceptable risk.[[ref:nist-ai-600-1]] It's written mostly for governance, development and evaluation teams, not designers, but it's a useful vocabulary for talking to them.
- **Sector and local rules** on automated decisions, health, finance, employment and children's data vary widely.

:::framework Before you ship an AI feature
**Who** could be harmed or excluded, and how? **What data** is used, with what consent, and where does it go? **What's the worst plausible failure,** and can the person notice and recover? **Can the person tell** it's AI and what it used? **Who's accountable,** and how can people reach them? **How do we monitor** after release, and who acts? **Is the benefit worth the cost?** Record the answers with the date and decision owner.
:::

### Responsible use

- Follow your organization's policy on tools and data.
- Don't present generated content as human-made research or testimonials. Label synthetic content as synthetic (see [[ch:04]]).
- Respect others' intellectual property and check licenses for generated assets.
- Be honest with colleagues, clients and users about where AI was used when it matters to them.

:::exercise Try it: run a risk review (1 hour)
Take an AI feature (yours or one you use). Walk through the framework above and write answers. Identify the two highest risks and propose a design change for each. Present them to an engineer or PM and note what they'd change.
:::

## 5. Staying current

### What's emerging

- **Agents** that perform multi-step tasks with tools, and the approval and visibility patterns they need (see [[ch:02]]).
- **Interfaces generated at runtime,** and the systems and constraints that keep them coherent (see [[ch:03]]).
- **Design and code converging,** with design tools adding agents and code layers (see [[ch:09]]).
- **Voice, multimodal and ambient interaction,** where the screen is one channel among several.
- **Spatial and wearable computing,** niche for most product teams but shaping platform direction.
- **Evaluation as a design material,** with rubrics and eval sets as artifacts.

Each may or may not matter for your product. Your skill is judging which do.

### A method for tracking change

1. **Read primary sources:** vendor docs, standards bodies, regulators, original research. This book marks which sources were opened and which weren't.
2. **Keep a dated log:** what changed, the source, why it might matter. Revisit it quarterly.
3. **Run small experiments:** give a few hours to a new tool on a real task and write down results, rather than reading ten opinions.
4. **Be skeptical of statistics:** trace numbers to the original. Many figures about AI and design circulate without a source, get attributed to the wrong report or come from vendor surveys.
5. **Talk to peers.** What a colleague tried last month beats a headline.
6. **Separate durable from perishable.** Principles (problem framing, critique, accessibility, trust, ethics) last. Tool names and features expire.

### What it means for your career

NN/g reports a field that contracted and then stabilized unevenly, with senior and generalist roles recovering faster than entry-level and organizations expecting breadth and judgment.[[ref:nng-state-ux-2026]] What you can show matters: a portfolio that demonstrates your reasoning, measured outcomes (see [[ch:06]]), accessible and well-evaluated AI work, and the ability to build working prototypes. A small number of job postings I reviewed asked explicitly for prototyping in code with AI tools; job boards are noisy, so check what the roles you want actually request.

## Case: a prompt in three rounds

Let's watch a vague request become a useful one. The task: an empty state for an invoices table in a B2B finance tool.

**Round 1: the one-liner.**
> "Design an empty state for an invoices table."

The result: a cartoon of a clipboard, a cheery headline ("Nothing here yet!") and a button saying "Get started". Generic, no guidance, and the cartoon doesn't match your product's tone.

**Round 2: add context and constraints.**
> "You're designing for a finance admin at a mid-size company who has not created any invoices yet. Tone: calm and professional, no cartoons. Use only these tokens: \`color-text-primary\`, \`color-text-muted\`, \`space-4\`, \`space-6\`, \`radius-lg\`; the button component is \`Button\` with \`emphasis="primary"\`. The empty state must say what will appear here, why it's useful and what to do first. Return HTML and CSS."

Better: the structure is right and it uses your tokens. But the copy is still vague and there's no secondary path (import existing invoices).

**Round 3: add criteria and ask it to check itself.**
> "Same task. Additional requirements: the primary action is 'Create invoice'; offer a secondary text link 'Import from CSV'. The headline must be a statement, not an exclamation. Body copy: 2 sentences max, no jargon. Meet WCAG 2.2 AA: contrast 4.5:1, a heading element, a real button. After the code, list any assumptions you made and any requirement you couldn't meet."

Now the result is something you can review quickly, and its "assumptions" list tells you where to look (for example, it assumed a heading level).

**Then you review it against the rubric**, because the tool's answer is a draft: Does the copy match your voice? Is the heading level right for the page? Does the secondary link have a clear focus style? What would a first-time user think "Import from CSV" means?

What changed between rounds wasn't magic wording. It was *specification*: audience, constraints, tokens, content rules, acceptance criteria and a request for self-checking.

## A paste-ready rubric

\`\`\`text
FIT:            Does it solve the user's task? (1 to 5)  notes:
HIERARCHY:      First read is the right one?            notes:
SYSTEM:         Real tokens/components, none invented?  notes:
STATES:         Empty/loading/error/long text covered?  notes:
ACCESSIBILITY:  Contrast, keyboard, labels, focus?      notes:
ACCURACY:       Facts, numbers, labels verified?        notes:
BEHAVIOR:       Works for varied inputs?                notes:
ORIGINALITY:    Specific to us, or generic?             notes:
VERDICT:        ship / fix / redo      what I changed by hand:
\`\`\`

Fill it in for five generated options and you'll start seeing patterns in what tools get wrong, which lets you write better briefs.

## Prompt patterns worth trying

| Pattern | Example |
| --- | --- |
| **Act as a critic** | "Review this onboarding flow against NN/g's heuristics. List the three biggest risks and the evidence in the design for each. Don't suggest fixes yet." |
| **Generate options with trade-offs** | "Give me three approaches to bulk editing in a table. For each, list one advantage, one risk and what research would settle it." |
| **Stress test** | "Here's my problem statement. List five assumptions that might be false and a cheap test for each." |
| **Transform with rules** | "Rewrite this error message in the voice described below. Keep under 20 words. Say what happened and what to do." |
| **Checklist check** | "Here's the component spec. Which of these states are missing: loading, error, empty, disabled, long text, RTL?" |
| **Explain your reasoning** | "Before answering, state the three assumptions you're making about the users." |

A caution: models tend to agree with you. Ask for *disagreement*, "what's the strongest argument against this?", to get something useful.

## A personal AI policy

Write yours down; it keeps you honest. Example:

- **I use AI for:** first drafts, mechanical checks, summarizing my own notes, generating options to react to.
- **I don't use AI for:** final research insights, claims about users I haven't verified, anything with confidential data unless approved.
- **I always:** verify facts and numbers, check output against my system and accessibility needs, keep a record of what I asked and changed.
- **I disclose AI use when:** it affects trust in research, imagery or authorship, or when a client or policy requires it.
- **I practice without it:** one task a week done by hand, so my judgment doesn't fade.
- **I review this policy:** every three months, because tools and rules change.

## Where to go deeper

- **Evaluation design:** rubrics, eval sets and review processes.
- **AI literacy:** how models behave and fail (see [[ch:10]]).
- **Policy and governance literacy:** your organization's rules and the regulations that apply.
- **Critical reading** of research and vendor claims.
- **Teaching others:** helping your team adopt tools well, with norms and checks (see [[ch:08]]).

## Quick check

:::check Knowledge check 1
A tool generates a clean settings page in seconds. What do you check before it goes to design review?
---
Check against the problem and rubric: does it fit the user's task; is the hierarchy right; does it use your system's real tokens and components; are states and edge cases covered; does it meet accessibility requirements; is every label and fact accurate? Note what you had to fix, and say in the review which parts were generated.
:::

:::check Knowledge check 2
Your team wants to launch an AI feature that summarizes customer support tickets. What responsible-AI questions do you raise?
---
Who could be harmed or misled by wrong summaries; what data is used, with what permissions and retention; how people can see what a summary is based on; how errors are noticed and corrected; who's accountable and reviews quality; whether people are told it's AI; how quality is monitored after launch; and whether the benefit justifies the cost and risk. Record the answers and owners.
:::

`,"./content/fundamentals/12-ai-emerging-design-practice.md":`"AI" gets used to mean everything from a spell-checker to a self-driving car. Before you can use it well in your design work (or design good AI features), you need a clear picture of what these systems are, how they work, what they're good and bad at, and what responsible use looks like.

This edition explains the foundations: what AI and generative AI are, how large language models work in plain terms, how designers use AI in their workflow, how prompting works, how to evaluate AI output, and the basics of ethical and responsible AI.

:::pull
AI doesn't replace judgment. It makes judgment the most valuable thing you bring.
:::

## What AI is

### The family tree

| Term | What it means |
| --- | --- |
| Artificial intelligence (AI) | The broad field of making computers do tasks that usually need human intelligence |
| Machine learning (ML) | AI systems that learn patterns from data rather than following hand-written rules |
| Deep learning | Machine learning using large neural networks with many layers |
| Generative AI | AI that creates new content: text, images, audio, video, code |
| Large language model (LLM) | A generative AI model trained on huge amounts of text to understand and produce language |

### Traditional vs. generative AI

- **Traditional (predictive) AI** classifies or predicts: Is this email spam? What will sales be next month? Which product will this user like?
- **Generative AI** produces new content: write a paragraph, generate an image, draft code, summarize a document.

### What "learning" means

ML models learn by looking at many examples and adjusting internal settings (called **parameters** or **weights**) to get better at a task. They don't "understand" like people do; they find statistical patterns that are often remarkably useful.

## How LLMs work

### Tokens

LLMs work with **tokens**: chunks of text, roughly parts of words. "Unbelievable" might be split into "un," "believ" and "able." Costs and limits are measured in tokens.

### Predicting the next token

At its core, an LLM predicts what token is likely to come next, given everything before it. Repeating that prediction produces sentences, paragraphs and code. Training on vast amounts of text, followed by further training to follow instructions and be helpful, makes these predictions surprisingly capable.

### Context window

The **context window** is how much text the model can consider at once: your prompt, any documents you give it and the conversation so far. Information outside the context isn't available to it unless it's provided or retrieved.

### Training vs. inference

- **Training** is the expensive process of creating the model from data.
- **Inference** is using the trained model to respond to a prompt.

### Key behaviors to understand

| Behavior | What it means | Design implication |
| --- | --- | --- |
| Probabilistic | The same prompt can produce different answers | Allow regeneration; don't assume consistency |
| Hallucination | It can confidently state false information | Verify facts; show sources where possible |
| Knowledge cutoff | Training data ends at a point in time | It may not know recent events unless given them |
| Sensitivity to wording | Small prompt changes can change results | Prompts are design material |
| Bias | It can reflect biases in training data | Test across groups; review outputs |

### Ways AI products add knowledge

- **Retrieval-augmented generation (RAG):** the system searches relevant documents and gives them to the model, so answers are based on specific sources.
- **Fine-tuning:** further training a model on specific examples.
- **Tools and agents:** the model can call tools (search, calculators, other software) and take multi-step actions.

### Multimodal AI

**Multimodal** models work with several types of input and output: text, images, audio, video. Some can look at a screenshot and describe it, or generate an image from a description.

## AI in the design workflow

### Where designers use AI

| Stage | Example uses |
| --- | --- |
| Research | Summarizing articles, drafting interview guides, transcribing sessions, first-pass tagging |
| Ideation | Generating many ideas, alternative approaches, "what if" variations |
| Content | Drafting UX copy, error messages, placeholder content, translations |
| Visual design | Generating images, icons, mood boards, layout variations |
| Prototyping | Turning descriptions or sketches into interactive prototypes or code |
| Review | Checking consistency, finding missing states, spotting accessibility issues |
| Documentation | Drafting specs, summaries, release notes |

### Kinds of AI design tools

- **Chat assistants:** general-purpose helpers for writing, thinking and analysis.
- **AI features inside design tools:** generating layouts, renaming layers, creating variants.
- **Image generators:** creating visuals from text descriptions.
- **AI coding and prototyping tools:** building working interfaces from descriptions.
- **Research tools:** transcription, summarization, clustering of feedback.

### Human in the loop

A healthy workflow keeps people in charge: AI generates options or drafts, and humans decide, edit and take responsibility. Think of AI as a fast, tireless junior collaborator whose work always needs review.

## Prompting

### What a prompt is

A **prompt** is the instruction and context you give an AI model. Better prompts produce better results, mostly because they give the model the information it needs.

### Parts of a good prompt

| Part | Example |
| --- | --- |
| Role or perspective | "Act as a UX writer for a banking app." |
| Task | "Write three error messages for a failed transfer." |
| Context | "Users are often anxious about money; our tone is calm and clear." |
| Constraints | "Under 20 words each. No technical jargon." |
| Format | "Return a table with message and reasoning." |
| Examples | "Here's a message we like: …" |

### Prompting techniques

- **Be specific:** vague prompts get generic answers.
- **Give examples** (few-shot prompting): show what good looks like.
- **Break tasks into steps:** ask for an outline first, then details.
- **Ask for options:** "Give me five different approaches."
- **Ask for reasoning:** "Explain why you chose this."
- **Iterate:** refine the prompt based on what you get.
- **Ask it to critique:** "What's weak about this draft?"

Model providers publish prompting guides for their own models, which are worth reading.[[ref:prompt-guide]]

### Image prompts

For image generation, describe the **subject**, **style**, **composition**, **lighting**, **color palette** and **mood**, and mention what to avoid.

## Evaluating AI output

### Why evaluation matters

AI output often *looks* polished, which makes it easy to trust too quickly. Evaluation is where your expertise matters most.

### What to check

| Check | Questions |
| --- | --- |
| Accuracy | Are facts, numbers and claims correct? |
| Relevance | Does it solve the actual problem and fit the users? |
| Quality | Is the hierarchy, clarity and craft good? |
| Consistency | Does it match the brand, design system and tone? |
| Accessibility | Does it meet contrast, structure and labeling needs? |
| Originality | Is it generic, or specific to this product? |
| Bias | Does it stereotype or exclude anyone? |
| Rights | Can you legally use it (images, text, code)? |

### Directing AI

1. Say specifically what's wrong ("The headline is too long and too formal").
2. Say what to keep.
3. Give a direction or example.
4. Change one thing at a time.
5. Know when to finish it yourself.

### Evaluating AI features

When designing AI features, teams use **evaluations ("evals")**: sets of test inputs plus criteria for good and bad outputs. Instead of checking one demo, they check many cases to see how often the feature succeeds or fails.[[ref:product-talk]]

## Designing AI experiences

When AI is part of the product itself, a few principles help:

- **Set expectations:** explain what the AI can and can't do.
- **Show it's AI:** make it clear when content is generated.
- **Explain where answers come from:** sources, data used, confidence where possible.
- **Keep users in control:** easy to edit, undo, regenerate or turn off.
- **Design for errors:** graceful failure, easy correction, a way to reach a human.
- **Collect feedback:** thumbs up/down, corrections, reports.
- **Earn trust gradually:** start with suggestions before automating actions.

Google's People + AI Research (PAIR) guidebook and Microsoft's Guidelines for Human-AI Interaction are well-known resources for these patterns.

## Ethical and responsible AI

### Core principles

| Principle | What it means |
| --- | --- |
| Fairness | Doesn't disadvantage people based on characteristics like race, gender or age |
| Transparency | People know when AI is used and roughly how it works |
| Privacy | Personal data is protected and used with consent |
| Safety | Harmful outputs are prevented or minimized |
| Accountability | Humans are responsible for AI systems and their effects |
| Human oversight | People can review, override and stop AI actions |
| Inclusivity | Works well for diverse users and languages |

### Common risks

- **Bias:** models trained on biased data can produce biased results (for example in hiring or lending).
- **Misinformation:** confident but false answers.
- **Privacy leaks:** sensitive data shared with tools or exposed in outputs.
- **Intellectual property:** unclear rights for generated content or training data.
- **Over-reliance:** people trusting AI too much and not checking.
- **Manipulation:** using AI to persuade users against their interests.
- **Environmental cost:** training and running large models uses significant energy.

### Frameworks and regulation

- The **NIST AI Risk Management Framework** (US) gives organizations a voluntary structure for managing AI risks.[[ref:nist-ai-600-1]]
- The **EU AI Act** classifies AI systems by risk and sets obligations accordingly (see the 2026 edition for current dates).[[ref:eu-ai-act-omnibus]]
- Many companies publish their own **responsible AI principles.**

### Responsible use in your own work

- Don't paste confidential or personal data into tools you're not authorized to use.
- Check rights and licenses for generated images and content.
- Disclose AI use when it matters (in research, imagery, client work).
- Never present AI-generated "user feedback" as real research.
- Always review and take responsibility for what you ship.

## Emerging design practice

A few areas designers increasingly encounter:

- **Conversational interfaces:** chat and voice experiences.
- **Agents:** AI that performs multi-step tasks on a user's behalf.
- **Generative UI:** interfaces partly created by AI at runtime.
- **Multimodal experiences:** combining voice, image, text and gesture.
- **Spatial computing:** augmented and virtual reality interfaces.

The fundamentals of good design (understanding users, clear interaction, accessibility, trust) apply to all of them.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Machine learning | Systems that learn patterns from data |
| Generative AI | AI that creates new content |
| LLM | A large model trained on text to generate language |
| Token | A chunk of text the model processes |
| Context window | How much text a model can consider at once |
| Hallucination | Confident but false output |
| RAG | Giving the model retrieved documents to answer from |
| Agent | AI that takes multi-step actions with tools |
| Prompt | The instructions and context given to a model |
| Few-shot prompting | Including examples in a prompt |
| Eval | A structured test of AI output quality |
| Human in the loop | People review and control AI outputs |
| Responsible AI | Fair, transparent, private, safe, accountable AI |

## Quick check

:::check Knowledge check 1
Why can the same prompt give different answers?
---
LLMs are probabilistic: they generate text by predicting likely next tokens, with some randomness. Design for this by allowing regeneration and not assuming identical output.
:::

:::check Knowledge check 2
What is a hallucination, and how should a product handle the risk?
---
A confident but false output. Reduce the risk by grounding answers in sources (for example RAG), showing citations, encouraging verification and making it easy to report or correct errors.
:::

:::check Knowledge check 3
Name four parts of a strong prompt.
---
Any four of: role, task, context, constraints, output format and examples.
:::

m final rule. The page does not show the earlier dates.", "chapters": ["11"], "verified": true}, {"key": "eaa-directive", "org": "European Union", "title": "Directive (EU) 2019/882 (European Accessibility Act)", "url": "https://eur-lex.europa.eu/eli/dir/2019/882/oj", "tier": 1, "kind": "law", "annotation": "Not opened. The applicability date of 28 June 2025 and the 2030 transition for existing services come from secondary commentary and need checking against the legal text and national laws.", "chapters": ["11"], "verified": false}, {"key": "using-aria", "org": "W3C", "title": "Using ARIA", "url": "https://www.w3.org/TR/using-aria/", "tier": 1, "kind": "official guidance", "annotation": "Not re-opened. Source of the guidance to prefer native HTML over ARIA where possible.", "chapters": ["11"], "verified": false}, {"key": "inclusive-microsoft", "org": "Microsoft", "title": "Inclusive Design", "url": "https://inclusive.microsoft.design/", "tier": 2, "kind": "expert practice", "annotation": "Not re-opened. Source of the permanent, temporary and situational spectrum.", "chapters": ["11"], "verified": false}, {"key": "mdn", "org": "Mozilla", "title": "MDN Web Docs", "url": "https://developer.mozilla.org/", "tier": 1, "kind": "reference", "annotation": "Standard reference for HTML, CSS and JavaScript. Not opened for a specific claim.", "chapters": ["10"], "verified": false}, {"key": "web-vitals", "org": "Google (web.dev)", "title": "Core Web Vitals", "url": "https://web.dev/articles/vitals", "tier": 1, "kind": "official guidance", "annotation": "Not re-opened. LCP, INP and CLS as the loading, responsiveness and visual stability measures.", "chapters": ["10"], "verified": false}, {"date": "2018", "key": "mckinsey-design", "org": "McKinsey & Company", "title": "The Business Value of Design", "url": "https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/the-business-value-of-design", "tier": 2, "kind": "industry research", "annotation": "Seen only through search summaries (about 300 public companies; top performers outperformed benchmarks by as much as two to one). Correlational, partly self-reported; check the original before quoting figures.", "chapters": ["06"], "verified": false}, {"date": "2019", "key": "fortune-design-value", "org": "Fortune", "title": "The controversial debate over the value of design", "url": "https://fortune.com/2019/11/19/the-controversial-debate-over-the-values-of-design", "tier": 3, "kind": "journalism", "annotation": "Seen only through a search summary. Discusses the debate and that design appears on the balance sheet as a cost.", "chapters": ["06"], "verified": false}, {"key": "musemind-ai-ux", "org": "Musemind", "title": "AI in UX design", "url": "https://musemind.agency/blog/ai-in-ux-design", "tier": 3, "kind": "agency blog", "annotation": "Seen only through a search summary. Source of a reported 65% of designers doing more work overlapping with product or engineering. Agency marketing content; figure unverified.", "chapters": ["06", "08"], "verified": false}, {"key": "i-like-i-wish", "org": "Third Way", "title": "I Like, I Wish, What If", "url": "https://www.thirdway.org/thinking-tool/i-like-i-wish-what-if", "tier": 2, "kind": "practice guide", "annotation": "Seen through a search summary, which attributes the method to the Stanford d.school. Not opened.", "chapters": ["07"], "verified": false}, {"key": "gv-sprint", "org": "Google Ventures", "title": "The Design Sprint", "url": "https://www.gv.com/sprint/", "tier": 2, "kind": "expert practice", "annotation": "Not re-opened. Five-day process developed by Jake Knapp and colleagues.", "chapters": ["07"], "verified": false}, {"key": "prompt-guide", "org": "Anthropic", "title": "Prompt engineering overview (Claude documentation)", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview", "tier": 1, "kind": "official guidance", "annotation": "Not re-opened for this book. Use the current guide for whichever model you use, and re-read it when the model changes. Other vendors publish their own.", "chapters": ["12"], "verified": false}, {"key": "eu-ai-act-omnibus", "org": "Gibson Dunn (law firm)", "title": "EU AI Act Omnibus Agreement: postponed high-risk deadlines and other key changes", "url": "https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/", "tier": 3, "kind": "legal analysis", "annotation": "Seen through search summaries only. Reports Article 50 transparency from 2 August 2026 and postponed high-risk deadlines; Official Journal publication unconfirmed. Not the legal text. Verify with counsel.", "chapters": ["12"], "verified": false}, {"date": "July 2024", "key": "nist-ai-600-1", "org": "NIST", "title": "Artificial Intelligence Risk Management Framework: Generative AI Profile (NIST AI 600-1)", "url": "https://doi.org/10.6028/NIST.AI.600-1", "tier": 1, "kind": "official guidance", "annotation": "Seen through search summaries. Voluntary profile published July 2024. Not read in full.", "chapters": ["12"], "verified": false}],Dn=[{"term": "Visual hierarchy", "definition": "The order in which attention moves through a screen, controlled by size, weight, contrast, space, position and motion.", "why": "If you cannot name the first, second and third read, the screen has decoration, not hierarchy.", "chapters": ["01"]}, {"term": "Taste", "definition": "The ability to judge which acceptable option is right for this product, user and moment, and to explain why.", "why": "Execution is increasingly automated; judgment is the harder-to-automate part.", "contrast": "Craft is the ability to execute; taste is the ability to judge.", "chapters": ["01"]}, {"term": "Type scale", "definition": "A small, named set of font sizes related by a consistent ratio.", "why": "It replaces ad hoc sizes with decisions a team can reuse.", "chapters": ["01"]}, {"term": "Semantic color", "definition": "Naming colors by role (text-muted, accent, danger) rather than appearance (gray-200, blue-600).", "why": "Roles let you theme, support dark mode and rebrand without redesigning screens.", "chapters": ["01"]}, {"term": "OKLCH", "definition": "A color model with lightness, chroma and hue designed so equal lightness steps look perceptually even.", "why": "Makes tonal scales with predictable contrast far easier than HSL.", "chapters": ["01"]}, {"term": "Contrast ratio", "definition": "A measure of luminance difference between two colors. WCAG 2.2 requires 4.5:1 for normal text and 3:1 for large text and UI components.", "why": "It is the contrast standard you can be held to today.", "chapters": ["01"]}, {"term": "APCA", "definition": "Advanced Perceptual Contrast Algorithm, an exploratory contrast method removed from the July 2023 WCAG 3 draft.", "why": "Often misreported as the replacement for WCAG 2 contrast. It is not, as of the September 2026 WCAG 3 draft.", "chapters": ["01"]}, {"term": "WCAG 2.2", "definition": "The current normative W3C accessibility guideline set, with Level A, AA and AAA success criteria.", "why": "The basis for most accessibility requirements and legal references.", "chapters": ["01", "02"]}, {"term": "Container query", "definition": "A CSS feature that lets a component change styles based on the size of its container rather than the viewport.", "why": "Makes components reusable across layouts in a design system.", "chapters": ["01", "02"]}, {"term": "Affordance", "definition": "What an object allows a person to do.", "why": "Distinguish from signifiers, which communicate the affordance.", "contrast": "A signifier is the cue that tells you the affordance exists.", "chapters": ["02"]}, {"term": "Signifier", "definition": "A perceivable cue that communicates what can be done and how.", "why": "Most unclear UI is missing signifiers.", "chapters": ["02"]}, {"term": "State matrix", "definition": "A table of every state a component or screen can be in (empty, loading, partial, error, success, disabled, offline) and its design.", "why": "Most late rework comes from undesigned states.", "chapters": ["02"]}, {"term": "Progressive disclosure", "definition": "Showing what most people need first and revealing the rest on demand.", "why": "Reduces overload when done well and hides necessary things when done badly.", "chapters": ["02"]}, {"term": "Information architecture", "definition": "How content and functions are organized, grouped and labeled so people can find and understand them.", "why": "In complex products it is domain modeling that shapes the entire product.", "chapters": ["02", "05"]}, {"term": "Tree testing", "definition": "Testing whether people can find items in a proposed structure with the visual design removed.", "why": "The most direct check of an IA before you build it.", "chapters": ["02"]}, {"term": "Human-in-the-loop", "definition": "A design in which a person reviews or approves an automated system's actions at chosen points.", "why": "Scale oversight to risk and reversibility.", "chapters": ["02"]}, {"term": "Generative UI", "definition": "Interfaces assembled or chosen by an AI at runtime, rather than fully predefined.", "why": "Makes the underlying component library and constraints the guardrail for coherence and accessibility.", "chapters": ["02"]}, {"term": "Evals", "definition": "Structured tests of AI output quality against a rubric across many inputs.", "why": "You judge an AI feature by behavior over many cases, not by a mockup.", "chapters": ["02", "04", "05"]}, {"term": "Design token", "definition": "A named, platform-neutral design decision, such as a color or spacing value.", "why": "One place to change a decision across design and code.", "chapters": ["03"]}, {"term": "Semantic token", "definition": "A token named by meaning that references a primitive token.", "why": "Components that use semantic tokens survive theming and rebranding.", "chapters": ["03"]}, {"term": "Design Tokens Specification 2025.10", "definition": "The first stable version of the Design Tokens Community Group's vendor-neutral token format, announced 28 October 2025.", "why": "A shared format for moving tokens between design tools and code. A community group specification, not a W3C Standard.", "chapters": ["03"]}, {"term": "Design system governance", "definition": "The decision-making, contribution and versioning processes that keep a system healthy.", "why": "A system without governance becomes a style guide that is going out of date.", "chapters": ["03"]}, {"term": "Synthetic users", "definition": "AI-generated stand-ins for research participants.", "why": "NN/g found them overly agreeable and shallow in re-run studies; use only as a supplement, with disclosure.", "chapters": ["04"]}, {"term": "Reflexive thematic analysis", "definition": "A rigorous qualitative method of coding data and developing themes that treats the researcher's interpretation as part of the method.", "why": "A model for the kind of interpretation AI first-pass coding cannot replace.", "chapters": ["04"]}, {"term": "Journey map", "definition": "A visualization of a person's experience over time as they try to achieve a goal, with actions, thoughts, emotions and touchpoints.", "why": "Only useful when grounded in research and tied to decisions.", "chapters": ["04", "05"]}, {"term": "Service blueprint", "definition": "A journey map extended with the back-stage actions, systems and people that support each step.", "why": "Exposes operational cost and handoffs behind the screen.", "chapters": ["04", "05"]}, {"term": "Opportunity solution tree", "definition": "A map from a desired outcome to customer opportunities, solutions and assumption tests, from Teresa Torres's continuous discovery approach.", "why": "Makes learning visible and ties solutions to evidence.", "chapters": ["05"]}, {"term": "Product trio", "definition": "A product manager, a designer and an engineer who do discovery together.", "why": "Shared understanding of the problem and shared ownership of risk.", "chapters": ["05"]}, {"term": "Four product risks", "definition": "Value, usability, feasibility and viability, per Marty Cagan.", "why": "Discovery exists to reduce these before committing to build.", "chapters": ["05"]}, {"term": "Outcome versus output", "definition": "An outcome is a change in behavior or result; an output is something you ship.", "why": "Strategy and discovery are organized around outcomes.", "chapters": ["05"]}, {"term": "Design engineer", "definition": "A role that combines design craft with front-end building, often including AI-assisted prototyping.", "why": "A direction in job postings reviewed in October 2026, though job-board data is noisy.", "chapters": ["02", "05"]}, {"term": "Product sense", "definition": "The ability to judge quickly, and with reasons, whether an idea is valuable, usable, feasible and viable.", "why": "Built by critiquing products out loud: who it is for, what job it does, how it makes money, what to test.", "chapters": ["06"]}, {"term": "Activation", "definition": "The share of new users who reach their first meaningful value.", "why": "Onboarding is design's biggest lever on growth.", "chapters": ["06"]}, {"term": "Retention", "definition": "The share of users who keep coming back over time.", "why": "A product people leave cannot grow; a flattening curve means a core finds lasting value.", "chapters": ["06"]}, {"term": "Net revenue retention", "definition": "Revenue from existing customers over time, including expansion and loss.", "why": "In B2B, expansion depends on adoption and satisfaction.", "chapters": ["06"]}, {"term": "Unit economics", "definition": "The revenue and cost of a single customer or transaction.", "why": "Shows whether growth is profitable and why AI per-use cost matters.", "chapters": ["06"]}, {"term": "RICE", "definition": "A prioritization score from reach, impact, confidence and effort.", "why": "Makes assumptions visible; the score is a guess, not an answer.", "chapters": ["06"]}, {"term": "McKinsey Design Index", "definition": "A 2018 McKinsey analysis linking design performance to financial results across about 300 public companies.", "why": "Correlational and partly self-reported; use it with caveats.", "chapters": ["06"]}, {"term": "Pyramid principle", "definition": "Leading with the answer or recommendation and then supporting it.", "why": "Helps busy audiences decide faster.", "chapters": ["07"]}, {"term": "Design critique", "definition": "A structured conversation to improve work against its goals.", "why": "Not a vote, an approval or a place for preference.", "chapters": ["07"], "contrast": "Feedback gathered informally or a stakeholder review."}, {"term": "I like, I wish, what if", "definition": "A feedback structure attributed to Stanford's d.school: what works, what falls short, and an alternative as a question.", "why": "Frames criticism as collaboration.", "chapters": ["07"]}, {"term": "Design sprint", "definition": "A five-day process for defining, sketching, deciding, prototyping and testing an idea.", "why": "Useful for high-stakes ideas; overused when a smaller exercise would do.", "chapters": ["07"]}, {"term": "Decision record", "definition": "A short written account of an important decision, its options and reasons.", "why": "Prevents repeated debate and shows the reasoning later.", "chapters": ["08"]}, {"term": "DACI", "definition": "A decision role framework: driver, approver, contributors, informed.", "why": "Its value is forcing the team to name who decides.", "chapters": ["08"]}, {"term": "Working agreement", "definition": "A short team agreement on how disciplines work together and decide.", "why": "Reduces friction from unstated expectations.", "chapters": ["08"]}, {"term": "Fidelity", "definition": "How closely a prototype resembles the final product in look, behavior or content.", "why": "Match fidelity to the question you need to answer.", "chapters": ["09"]}, {"term": "Wizard of Oz prototype", "definition": "A prototype in which a person secretly simulates the system's behavior.", "why": "Tests an AI or complex interaction before building it.", "chapters": ["09"]}, {"term": "Acceptance criteria", "definition": "A list of conditions that mean something is built correctly.", "why": "The contract you review generated or built work against.", "chapters": ["09"]}, {"term": "Design QA", "definition": "Reviewing the built product against the design and acceptance criteria.", "why": "Catches differences that matter before release.", "chapters": ["09"]}, {"term": "Semantic HTML", "definition": "Using elements that describe what content is, such as button, nav and label.", "why": "The foundation for accessibility, search and maintainability.", "chapters": ["10", "11"]}, {"term": "Box model", "definition": "The model in which every element is content, padding, border and margin.", "why": "Most spacing bugs are box model questions.", "chapters": ["10"]}, {"term": "Core Web Vitals", "definition": "Google's measures of loading (LCP), responsiveness (INP) and visual stability (CLS).", "why": "Performance is part of the experience.", "chapters": ["10"]}, {"term": "Pull request", "definition": "A proposed code change that others review before it is merged.", "why": "A place designers can review behavior, accessibility and consistency.", "chapters": ["10"]}, {"term": "Context window", "definition": "The amount of text a model can consider at once.", "why": "What is not in context cannot reliably be used.", "chapters": ["10", "12"]}, {"term": "Retrieval-augmented generation", "definition": "Fetching relevant documents and giving them to a model to answer from.", "why": "Enables citations; only as good as what is retrieved.", "chapters": ["10"]}, {"term": "POUR", "definition": "WCAG's four principles: perceivable, operable, understandable, robust.", "why": "A quick structure for thinking about accessibility.", "chapters": ["11"]}, {"term": "Accessible name", "definiti /* ---------- tokens ---------- */
:root{

  --sans:var(--font);--serif:var(--font);

  /* paper */
  --paper:#fcfcfd;--wash:#f4f5f8;--wash-2:#f8f9fb;
  --ink:#161d2b;--body:#353e50;--muted:#5d6679;
  --line:#e9ebf0;--line-2:#dde1ea;
  --accent:#0369a1;--accent-2:#075985;--tint:#e7f2fb;

  /* aliases used by app markup */

  /* geometry */
  --gap:16px;--r:24px;--side:20rem;--toc:18rem;--bar:60px;

}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + var(--gap) + 28px);-webkit-text-size-adjust:100%;scrollbar-color:#1c3550 var(--night)}

  background-color:var(--night);background-image:var(--aur);background-attachment:fixed;background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

img,svg{max-width:100%}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:10px}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame: covers + rounded corners that survive scrolling ---------- */
body::before,body::after{content:"";position:fixed;left:0;right:0;height:var(--gap);background:inherit;background-attachment:fixed;z-index:21;pointer-events:none}
body::before{top:0}body::after{bottom:0}

.layout:not(:has(.right)) main{grid-column:2/-1;border-radius:var(--r)}

.toc a[aria-current]{background:var(--tint);color:var(--accent);font-weight:500}

/* ---------- reading bar ---------- */
#readbar{display:none;position:fixed;z-index:22;top:var(--gap);left:var(--side);right:var(--gap);height:var(--bar);background:var(--paper);border-radius:var(--r) var(--r) 0 0;box-shadow:inset 0 -1px 0 var(--line)}
body.reading #readbar{display:block}
#readbar .in{height:100%;display:flex;align-items:center;gap:20px;padding:0 28px 0 var(--pad)}
#readbar .now{flex:1;min-width:0;display:flex;align-items:center}
#readbar .ch{display:none}
#readbar .sec{font:600 14.5px/1.3 var(--font);color:var(--ink);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readbar .eta{flex:none;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#readbar .ring{order:2;display:block}
#readbar .trk{fill:none;stroke:var(--line-2);stroke-width:4}
#readbar .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .2s linear}
#readbar .pct{display:none}
#readbar .line{position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,#38a6e8,var(--accent));transform-origin:0 50%;transform:scaleX(0);transition:transform .15s linear;border-radius:0 2px 2px 0}

/* ---------- chapter header ---------- */
.eyebrow{margin-block:0 14px;font-size:13px;color:var(--muted);letter-spacing:.005em}
.chapter h1{margin:0 0 14px;font-size:clamp(2rem,1.5rem + 1.8vw,2.65rem);line-height:1.1;letter-spacing:-.03em}
.sub,.lede{margin-block:0 36px;font-size:17.5px;line-height:1.55;color:var(--muted)}

/* ---------- prose ---------- */
.prose{font-size:16px;line-height:1.78;color:var(--body)}
.prose>*{max-width:none}
.prose p{margin:0 0 1.2em}
.prose h2{margin:68px 0 16px;font-size:1.6rem;letter-spacing:-.022em;scroll-margin-top:calc(var(--bar) + var(--gap) + 24px)}
.prose h3{margin:40px 0 10px;font-size:1.17rem;letter-spacing:-.012em}
.prose h2+h3{margin-top:22px}
.prose ul,.prose ol{margin:0 0 1.3em;padding-left:1.3em}
.prose li{margin:.45em 0;padding-left:.2em}
.prose li::marker{color:#9aa3b6}
.prose ol>li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.prose strong{color:var(--ink);font-weight:600}
.prose em{color:var(--ink)}
.prose hr{border:0;height:1px;background:var(--line);margin:56px 0}
.prose blockquote{margin:28px 0;padding:2px 0 2px 20px;border-left:3px solid #b8d6ef;color:var(--ink);font-size:17px}
.anchor{margin-left:8px;opacity:0;text-decoration:none;font-weight:400;color:#a0a8ba;transition:opacity .2s}
h2:hover .anchor,h3:hover .anchor,.anchor:focus{opacity:1}
.cite a{text-decoration:none;font:600 .68em var(--font);color:var(--accent);vertical-align:super;line-height:0;padding:0 1px}

/* inline + block code */
code{font:500 .86em/1 var(--mono);background:#f0f2f7;color:#26304a;padding:.18em .42em;border-radius:6px}
pre.code{margin:28px 0;padding:18px 22px;background:#0f1626;color:#dce4fb;border-radius:16px;overflow:auto;font:400 12.75px/1.7 var(--mono);scrollbar-width:thin;scrollbar-color:#2c3756 transparent}
pre.code code{background:none;color:inherit;padding:0;font:inherit}

/* tables */
.table-wrap{margin:30px 0;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
table{width:100%;min-width:30rem;border-collapse:collapse;font-size:13.5px;line-height:1.5}
th,td{padding:12px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--wash-2);font:600 11px/1.4 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
td strong{font-weight:600}
tbody tr{transition:background .15s}
tbody tr:hover{background:#fafbfd}

/* ---------- callouts ---------- */
.box{--c:#5d6679;margin:32px 0;padding:20px 22px 18px;background:color-mix(in srgb,var(--c) 4%,var(--paper));border:1px solid var(--line);border-radius:18px;font-size:14.5px;line-height:1.7;color:var(--body)}
.box>*:last-child{margin-bottom:0}
.box p,.box li{font-size:14.5px;line-height:1.7}
.box p{margin:0 0 .8em}
.box ul,.box ol{margin:0 0 .8em;padding-left:1.2em}
.box li{margin:.35em 0}
.box li::marker{color:var(--c)}
.box strong{color:var(--ink)}
.box a{color:var(--c)}
.box-label{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-height:28px;margin:0 0 12px!important;padding-left:38px;font:600 11.5px/1.3 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.box-label::before{content:"";position:absolute;left:0;top:0;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--c) 12%,#fff)}
.box-label::after{content:"";position:absolute;left:7px;top:7px;width:14px;height:14px;background:var(--c);-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.box-label span{font:500 13.5px/1.3 var(--font);letter-spacing:0;text-transform:none;color:var(--ink)}
.box-label span::before{content:"·";margin-right:8px;color:#a3abbd}
.box details{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.box summary{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);font:600 12.5px var(--font);cursor:pointer;list-style:none;transition:background .2s}
.box summary::-webkit-details-marker{display:none}
.box summary::after{content:"↓";font-size:12px;transition:transform .2s}
.box details[open] summary::after{transform:rotate(180deg)}
.box summary:hover{background:color-mix(in srgb,var(--c) 16%,#fff)}
.box details[open]>*:not(summary){animation:fade .35s var(--ease)}
.box details>p:first-of-type{margin-top:14px}
.box .q p:last-child{margin-bottom:0}
.box ul:has(input){list-style:none;padding-left:0}
.box input[type=checkbox],.prose input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0 8px 0 0;vertical-align:-2px}
.prose ul:has(input){list-style:none;padding-left:0}
.box-pull{background:none;border:0;border-radius:0;padding:4px 0 4px 22px;margin:40px 0;border-left:3px solid var(--accent)}
.box-pull .box-label{display:none}
.box-pull p{font-size:21px;line-height:1.45;font-weight:500;letter-spacing:-.015em;color:var(--ink)}

/* ---------- end of chapter ---------- */
.after{margin-top:72px}
.after textarea,.after .hint,.after .actions,.after .plain-h:not(:first-child),.after label{display:none}
.after .plain-h{margin:0 0 14px;font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.after .plain{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.after .plain li{margin:0;font-size:13.5px;color:var(--muted)}
.after .plain a{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
.after .plain a:hover{border-color:var(--line-2);background:var(--wash-2)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:40px auto 0;max-width:var(--measure)}
.pn{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;line-height:1.35;transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.pn small{display:block;margin-bottom:6px;font:600 10.5px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pn:first-child small::before{content:"← "}
.pn:last-child{text-align:right}
.pn:last-child small::after{content:" →"}
.pn:hover{border-color:var(--line-2);background:var(--wash-2);color:var(--ink);transform:translateY(-1px)}

/* ---------- home ---------- */
main>.hero,main>.part,main>.notice{max-width:var(--home)}
.hero{position:relative;max-width:none!important;margin:-56px calc(var(--pad)*-1) 0;padding:84px max(var(--pad),calc((100% - var(--home))/2)) 52px;
  background:radial-gradient(70% 120% at 0% 0%,#e2effb 0%,transparent 60%),radial-gradient(55% 110% at 100% 0%,#e8f3fb 0%,transparent 62%),linear-gradient(180deg,#f5f8fc,var(--paper));border-bottom:1px solid var(--line)}
.hero>*{max-width:40rem}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.hero .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{margin:0 0 16px;font-size:clamp(2.4rem,1.6rem + 3vw,3.6rem);line-height:1.04;letter-spacing:-.035em}
.hero .lede{margin:0 0 30px;font-size:18px;max-width:34rem}
.progress-row{max-width:22rem!important;margin-bottom:26px}
.bar{height:5px;margin:0 0 10px;background:#e2eaf3;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38a6e8,var(--accent));border-radius:999px;transition:width .6s var(--ease)}
.progress-row p{margin:0;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:500 14.5px var(--font);text-decoration:none;cursor:pointer;transition:background .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);box-shadow:0 8px 22px -12px rgba(3,105,161,.7)}
.btn::after{content:"→";transition:transform .25s var(--ease)}
.btn:hover{background:var(--accent-2);color:#fff;transform:translateY(-1px)}
.btn:hover::after{transform:translateX(3px)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line-2);box-shadow:none}
.btn.ghost::after{content:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.notice{margin:36px auto 0;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--wash-2);font-size:13.5px;line-height:1.65;color:var(--muted)}
.notice strong{color:var(--ink);font-weight:600}
.part{margin-top:52px}
.part h2{margin:0 0 16px;font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;padding:20px 22px 18px;border:1px solid var(--line);border-radius:20px;background:var(--paper);transition:border-color .3s var(--ease),background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{border-color:var(--line-2);background:#fff;transform:translateY(-2px);box-shadow:0 18px 40px -28px rgba(22,29,43,.35)}
.card .meta{order:-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.card .meta span{display:inline}
.card .meta .num{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 8px;border-radius:8px;background:var(--tint);color:var(--accent);font:600 12px var(--font);font-variant-numeric:tabular-nums}
.card .meta span:not(.num):not(.pill)+span:not(.pill)::before{content:"·";margin-right:10px;color:#b3bacb}
.card h3{margin:0 0 8px;font-size:17px;line-height:1.3;letter-spacing:-.012em}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:20px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.card details{position:relative;z-index:1;margin-top:14px;font-size:13px}
.card summary{width:max-content;cursor:pointer;color:var(--muted);list-style:none;transition:color .2s}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"+ ";color:var(--accent)}
.card details[open] summary::before{content:"– "}
.card summary:hover{color:var(--ink)}
.card details ul{margin:10px 0 0;padding-left:1.1em;color:var(--muted);line-height:1.6}
.card details li{margin:.3em 0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--wash);color:var(--muted);font:500 11.5px/1.6 var(--font)}
.pill.ok{background:#e8f5ee;color:#1d7046}
.plain{list-style:none;padding:0}
.part .plain li{margin:8px 0}

/* ---------- glossary, references, search, other pages ---------- */
main>h1{margin:8px auto 12px;font-size:clamp(2rem,1.5rem + 1.6vw,2.5rem);letter-spacing:-.03em}
main>h2{margin-top:48px;font-size:1.35rem}
main>p{font-size:15px;line-height:1.7}
.gloss{margin:28px auto 0}
.gloss div{padding:22px 0;border-top:1px solid var(--line)}
.gloss dt{font:600 17px/1.3 var(--font);color:var(--ink);letter-spacing:-.01em}
.gloss dd{margin:8px 0 0;font-size:15px;line-height:1.7}
.gloss p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.contrast{padding:10px 14px;border-radius:12px;background:var(--wash-2)}
.links{font-size:13px;color:var(--muted);word-break:break-word}
.refs{padding-left:1.4em;margin-top:28px}
.refs li{margin:0;padding:18px 0;border-top:1px solid var(--line)}
.refs li::marker{color:var(--muted);font-size:13px}
.refs p{margin:4px 0;font-size:14.5px;line-height:1.65}
.refs strong{color:var(--ink);font-weight:600}
.index{columns:2;column-gap:32px;list-style:none;padding:0}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:12px;max-width:var(--measure)}
.filters label{flex:1 1 10rem;font-size:12.5px;color:var(--muted)}
textarea,select,input[type=search],input[type=text]{width:100%;margin-top:6px;padding:11px 14px;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:12px;transition:border-color .2s,box-shadow .2s}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(3,105,161,.14)}
.results{padding-left:1.3em}
.results li{margin:16px 0}
.results p{margin:4px 0;font-size:14px;color:var(--muted)}
mark{background:#fff1bf;color:inherit;padding:0 .15em;border-radius:3px}
.rm{display:grid;grid-template-columns:9rem 1fr;gap:6px 16px;margin:0;font-size:14px}
.rm dt{color:var(--muted)}.rm dd{margin:0}
.comp{border-top:1px solid var(--line)}
.assess{display:grid;gap:10px;margin-top:12px}
.note{white-space:pre-wrap}
.plain-h{font-size:1.1rem}
.hint{font-size:13px;color:var(--muted)}

/* ---------- callout palette + icons ---------- */
.box-objectives{--c:#0369a1}.box-concept{--c:#0369a1}.box-framework{--c:#3348b8}
.box-definition{--c:#5146c9}.box-decision{--c:#4a40b8}
.box-evidence{--c:#0e7490}.box-check{--c:#0b6aa0}
.box-example,.box-case,.box-scenario,.box-reading{--c:#4f5b72}
.box-warning{--c:#a8540a}
.box-exercise,.box-checklist{--c:#0f7a55}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .layout{grid-template-columns:var(--side) minmax(0,1fr)}
  .right{display:none}
  main,.layout:not(:has(.right)) main{border-radius:var(--r)}
}
@media (max-width:860px){
  :root{--gap:8px;--r:18px;--bar:56px;--pad:20px}
  .layout{grid-template-columns:minmax(0,1fr);padding:var(--gap)}
  .layout::before{left:var(--gap)}
  main,.layout:not(:has(.right)) main{margin:0;border-radius:var(--r);padding:72px var(--pad) 72px}
  body.reading main{padding-top:calc(var(--bar) + 36px)}
  .top{display:block;position:fixed;top:calc(var(--gap) + 9px);right:calc(var(--gap) + 10px);z-index:40;padding:0;background:none;border:0;height:auto}
  .side{display:none;position:fixed;inset:0;z-index:30;height:auto;padding:72px 22px 40px;background:var(--night);background-image:var(--aur)}
  body.nav-open .side{display:block}
  .side .chapters a{padding:11px 12px;font-size:15.5px}
  #readbar{left:var(--gap);right:var(--gap)}
  #readbar .in{padding:0 120px 0 var(--pad)}
  .hero{margin:-72px calc(var(--pad)*-1) 0;padding:96px var(--pad) 40px}
  .hero h1{font-size:2.3rem}
  .cards{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .index{columns:1}
  .rm{grid-template-columns:1fr}
}

/* ---------- motion + print ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff!important;color:#000}
  body::before,body::after,.layout::before,.layout::after,#readbar,.top,.side,.right,.pager,.anchor,.after{display:none!important}
  .layout{display:block;padding:0}
  main{border-radius:0;padding:0;min-height:0}
  .box{break-inside:avoid;background:none}
  .box details:not([open])>*:not(summary){display:block}
  .prose a[href^=http]::after{content:" (" attr(href) ")";font-size:.8em}
}

/*FEATURES_CSS*/
/* ===== features: edition switcher + bookmarks ===== */

/* edition switch */
.ver{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#eef0f5;box-shadow:inset 0 0 0 1px #e3e6ee}
.ver button{position:relative;padding:6px 14px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 12.5px/1.2 var(--font);cursor:pointer;white-space:nowrap;transition:background .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
.ver button:hover{color:var(--ink)}
.ver button[aria-checked=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,29,43,.08),0 2px 8px -2px rgba(22,29,43,.10)}
.ver button[aria-checked=true][data-ver=modules]{color:var(--accent)}
.ver--bar{flex:none}
.ver-block{margin:-6px 0 30px}
.ver-label{margin:0 0 10px!important;font:600 10.5px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ver--hero{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--line)}
.ver--hero button{padding:8px 18px;font-size:13.5px}
.ver-help{max-width:32rem;margin:12px 0 0!important;font-size:13px;line-height:1.6;color:var(--muted)}
.ver-help b{color:var(--ink);font-weight:500}
.ed-tag{display:inline-block;margin-right:10px;padding:2px 9px;border-radius:999px;background:var(--tint);color:var(--accent);font:600 11px/1.6 var(--font);letter-spacing:.02em;vertical-align:1px}
html[data-edition=fundamentals] .ed-tag{background:#eef3e8;color:#3f6b22}

/* saved + flashed passages */
::highlight(bm-saved){background-color:rgba(3,105,161,.09);text-decoration-line:underline;text-decoration-color:rgba(3,105,161,.45);text-decoration-thickness:2px}
::highlight(bm-flash){background-color:rgba(255,204,77,.5);color:var(--ink)}
.prose ::selection{background:#cfe5f6}

/* selection toolbar */
.bm-tip{position:fixed;z-index:60;top:0;left:0;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:#0a1b2e;box-shadow:0 14px 34px -12px rgba(7,11,22,.6),inset 0 0 0 1px rgba(255,255,255,.06);opacity:0;transform:translateY(4px) scale(.97);transform-origin:var(--ax,50%) 100%;pointer-events:none;transition:opacity .16s var(--ease),transform .2s var(--ease)}
.bm-tip.below{transform-origin:var(--ax,50%) 0}
.bm-tip.show{opacity:1;transform:none;pointer-events:auto}
.bm-tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-4px;width:9px;height:9px;background:#0a1b2e;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bm-tip.below::after{bottom:auto;top:-4px}
.bm-tip button{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:0;border-radius:9px;background:none;color:#e6eaf5;font:500 13px var(--font);cursor:pointer;transition:background .15s}
.bm-tip button:hover,.bm-tip button:focus-visible{background:rgba(255,255,255,.09);outline:none}
.bm-tip button[data-state=saved]{color:#7cc4f0}
.bm-sep{width:1px;height:18px;background:rgba(255,255,255,.12)}

/* nav section */
.bm-nav{margin:-14px 0 6px}
.bm-head>svg:last-child{color:var(--nav-muted);transition:transform .25s var(--ease),color .2s}
.bm-head:hover>svg:last-child{transform:translateX(3px);color:var(--nav-strong)}
.bm-head{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:rgba(255,255,255,.035);color:var(--nav-strong);font:500 13.5px var(--font);cursor:pointer;transition:background .2s}
.bm-head:hover{background:rgba(255,255,255,.06)}
.bm-head-l{display:flex;flex:1;align-items:center;gap:10px;text-align:left}
.bm-head-l svg{color:var(--nav-accent)}
.bm-count{min-width:22px;padding:1px 7px;border-radius:999px;background:rgba(124,196,240,.14);color:var(--nav-accent);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:center}
.bm-chev{color:var(--nav-muted);transition:transform .25s var(--ease)}
.bm-head[aria-expanded=true] .bm-chev{transform:rotate(180deg)}
.bm-list{display:grid;gap:2px;margin-top:6px;animation:fade .3s var(--ease)}
.bm-item{position:relative;display:block;width:100%;padding:9px 12px 9px 18px;border:0;border-radius:10px;background:none;color:var(--nav-text);text-align:left;cursor:pointer;transition:background .2s}
.bm-item::before{content:"";position:absolute;left:8px;top:11px;bottom:11px;width:2px;border-radius:2px;background:rgba(124,196,240,.35)}
.bm-item:hover{background:rgba(255,255,255,.045)}
.bm-q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:400 13px/1.45 var(--font);color:#d3daec}
.bm-m{display:block;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11.5px;color:var(--nav-muted)}
.bm-all{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--nav-accent);font:500 12.5px var(--font);cursor:pointer;transition:background .2s,gap .2s}
.bm-all:hover{background:rgba(255,255,255,.04);gap:9px}
.bm-empty{margin:8px 12px 0;font-size:12.5px;line-height:1.55;color:var(--nav-muted)}
.bm-empty b{color:var(--nav-text);font-weight:500}

/* drawer */
.bm-drawer[hidden]{display:none}
.bm-drawer{position:fixed;inset:0;z-index:70}
.bm-scrim{position:absolute;inset:0;background:rgba(5,8,18,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.bm-panel{position:absolute;top:var(--gap);right:var(--gap);bottom:var(--gap);display:flex;flex-direction:column;width:min(460px,calc(100vw - var(--gap)*2));background:var(--paper);border-radius:var(--r);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);opacity:0;transform:translateX(28px);transition:transform .32s var(--ease),opacity .32s var(--ease)}
.bm-drawer.open .bm-scrim{opacity:1}
.bm-drawer.open .bm-panel{opacity:1;transform:none}
.bm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:26px 24px 14px}
.bm-top h2{margin:0;font-size:22px;letter-spacing:-.02em}
.bm-sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bm-x{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--wash);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.bm-x:hover{background:#e9ecf3;color:var(--ink)}
.bm-search{padding:0 24px 8px}
.bm-search input{margin:0;padding-left:14px;background:var(--wash-2)}
.bm-body{flex:1;overflow:auto;padding:4px 24px 28px;scrollbar-width:thin}
.bm-group{margin-top:20px}
.bm-group h3{margin:0 0 10px;font:600 10.5px/1.4 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bm-card{position:relative;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.bm-card:hover{border-color:var(--line-2);background:var(--wash-2)}
.bm-go{display:block;width:100%;padding:14px 16px 12px;border:0;border-radius:16px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.bm-go blockquote{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;margin:0;padding:0 56px 0 0;font-size:14px;line-height:1.6;color:var(--ink)}
.bm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.bm-ed{padding:1px 8px;border-radius:999px;background:var(--wash);font-size:11px;font-weight:500;color:var(--muted)}
.bm-acts{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.bm-card:hover .bm-acts,.bm-card:focus-within .bm-acts{opacity:1}
.bm-acts button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:var(--paper);color:var(--muted);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.bm-acts button:hover{color:var(--ink)}
.bm-acts [data-del]:hover{color:#b42318}
.bm-none{padding:56px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.bm-none p{margin:6px 0}
.bm-none b{color:var(--ink);font-weight:500}
.bm-none-i{display:inline-grid;place-items:center;width:48px;height:48px;margin-bottom:8px;border-radius:14px;background:var(--tint);color:var(--accent)}
kbd{padding:1px 6px;border-radius:5px;background:var(--wash);box-shadow:inset 0 -1px 0 var(--line-2);font:500 12px var(--mono);color:var(--ink)}

/* toast */
.bm-toast{position:fixed;left:50%;bottom:calc(var(--gap) + 22px);z-index:80;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:12px;background:#0a1b2e;color:#e6eaf5;font:500 13.5px var(--font);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.bm-toast:not(:has(button)){padding-right:16px}
.bm-toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bm-toast button{padding:6px 11px;border:0;border-radius:8px;background:rgba(124,196,240,.16);color:#cfe6fb;font:600 12.5px var(--font);cursor:pointer}
.bm-toast button:hover{background:rgba(124,196,240,.26)}

@media (max-width:1100px){#readbar .eta>span.txt{display:none}}
@media (max-width:860px){
  .ver--bar button{padding:6px 10px;font-size:12px}
  #readbar .now{display:none}
  #readbar .in{padding:0 112px 0 14px;justify-content:space-between}
  .bm-panel{top:var(--gap);left:var(--gap);width:auto}
}
@media print{.bm-tip,.bm-drawer,.bm-toast,.ver,.ver-block,.bm-nav{display:none!important}}

/* reading bar: title | centred edition switch | progress */
#readbar .in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px}
#readbar .now{min-width:0}
#readbar .ver--bar{justify-self:center}
#readbar .eta{justify-self:end}
@media (max-width:860px){#readbar .in{grid-template-columns:auto 1fr;}#readbar .ver--bar{justify-self:start}}

/* link back to the hub */
.hub-back{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px 12px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--nav-muted);font:500 12px var(--font);text-decoration:none;transition:color .2s,background .2s,gap .2s}
.hub-back:hover{color:var(--nav-strong);background:rgba(255,255,255,.09);gap:9px}

/*END_FEATURES_CSS*/

}
function sched(){if(!raf)raf=requestAnimationFrame(update)}
addEventListener('scroll',sched,{passive:true});addEventListener('resize',sched);
addEventListener('hashchange',function(){setTimeout(function(){prose=undefined;setup()},80)});

})()</script>
