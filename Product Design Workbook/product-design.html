## 1. UX strategy

### Strategy is a plan

A strategy isn't a list of goals or a vision statement. Richard Rumelt's *Good Strategy / Bad Strategy* gives it a "kernel" of three parts: a **diagnosis** of the challenge, a **guiding policy** for dealing with it, and **coherent actions** that carry out the policy. For UX: what's actually going wrong or possible (diagnosis), what approach will we take *and what will we refuse to do* (policy), and what specific work follows (actions).

In practice, a UX strategy is a short, argued document that answers: who is this for, what problem are we solving for them, why will our approach win, how will we know, and what are we *not* doing.

:::framework A one-page UX strategy
**Context** (what we know and how). **Diagnosis** (the core problem, in a sentence). **Target users and their job.** **Approach** (guiding policy, including what we won't do). **Bets** (3 to 5 pieces of work, ordered, each tied to an outcome). **Measures** (leading and lagging). **Risks and assumptions** (what must be true, and how we'll test it). A strategy that can't say what it excludes isn't one yet.
:::

### Discovery vs. delivery

**Discovery** decides what to build and why: find problems, frame them, test ideas cheaply. **Delivery** builds and ships. Teams that only deliver ship fast in the wrong direction; teams that only discover never ship. Run them in parallel.

Marty Cagan's four risks give you a lens for any idea: **value** (will people want it?), **usability** (can they use it?), **feasibility** (can we build it?) and **viability** (does it work for the business?). Discovery exists to cut those risks before you commit.[[ref:svpg-risks]] Designers own usability and lean heavily into value, but strong ones help the team face all four.

### Continuous discovery

Teresa Torres's *Continuous Discovery Habits* describes a **product trio** (typically PM, designer, engineer) talking to customers *every week* and keeping an **opportunity solution tree** current: a desired outcome at the top, customer opportunities (needs, pains, desires) beneath it, then solutions, then assumption tests that decide which solution to pursue.[[ref:product-talk]] Its power is making learning a habit instead of a project. The cadence is the hard part; one vendor claim that fewer than one in five teams sustain a weekly rhythm is unverified, but it matches common experience.

:::definition Outcome vs. output
An **output** is something you make (a feature, a screen). An **outcome** is a change in behavior or result that matters (more people finish setup, fewer support contacts). Strategy and discovery organize around outcomes; roadmaps made of outputs ask the team to deliver, not learn.
:::

### Framing and prioritizing

- **Write the problem without the solution.** "Users need a dashboard" is a solution; "New admins can't tell whether setup is complete" is a problem.
- **Ask why until you hit something a user would recognize.**
- **Use "how might we"** to open the space without assuming an answer.
- **Describe the situation:** who, in what circumstance, trying to achieve what.
- **Write down the assumptions** in your framing and test the riskiest first.

Frameworks like RICE or impact-effort give you a shared vocabulary, not an answer. Their weakness is false precision: scores are guesses. Use them to make assumptions visible, and always ask what you're *not* doing.

:::exercise Try it: write a strategy memo (2 hours)
For a product you know, write one page using the framework above, including one thing the team should stop or not start. Share it with a PM or engineer and ask where they disagree. The disagreement is the useful part.
:::

:::exercise Try it: build an opportunity solution tree (2 hours)
Pick an outcome. List five opportunities drawn from *research*, not ideas. Under the top one, add three solutions. For the most promising, list the assumptions that must be true and design the cheapest test for the riskiest.
:::

## 2. Competitive analysis

### It's not a feature checklist

Competitive analysis answers: how do people solve this today, what do they like and dislike, where are the gaps, and where do we want to differ. Competitors include **direct** rivals, **indirect** ones (different approach, same job) and **substitutes**, including spreadsheets, email and doing nothing. For many B2B products, the biggest competitor is the existing workflow.

### A method that works

1. **Define the question.** "How do competitors handle admin onboarding?" is answerable; "analyze competitors" isn't.
2. **Choose the set:** a handful of direct, two or three indirect, and the status quo.
3. **Collect consistently:** walkthroughs, heuristics, pricing and packaging, positioning, reviews, support content.
4. **Capture what they do *and* why you think they do it.**
5. **End with implications:** what's table stakes, where's the gap, what do we copy, adapt or ignore?

:::warning Common trap: copying a feature isn't copying a strategy
A competitor's feature is the visible end of decisions about customers, pricing, data and architecture that you can't see. Ask what problem it solves for *them*, and whether you share it.
:::

AI tools can summarize competitor sites, reviews and release notes in minutes. That makes collection cheap and interpretation valuable. Verify what AI says against the source, because summaries can be wrong, stale or invented, and use the time you save to walk through their product yourself and talk to their customers.

:::exercise Try it: a teardown with implications (half a day)
Pick one competitor and one flow. Walk it end to end, capturing screenshots and decisions. Write a page: what they do, why you think so, where it works and fails, three implications for you. Mark which statements are observed and which are your inference.
:::

## 3. Market awareness

A designer who understands the business makes better decisions and gets taken more seriously. The essentials:

- **Customers and segments.** In B2B the user, buyer and decision-maker are often three different people. A design for "users" in general serves nobody well.
- **Positioning.** What category are we in, what do we do better, for whom? April Dunford's *Obviously Awesome* is a clear treatment.
- **Business model and pricing:** free trials, seats, usage-based pricing and upgrade paths all shape design.
- **Go-to-market.** Product-led (try it yourself) and sales-led (guided) need different onboarding, proof and interfaces.
- **Unit economics, at a basic level:** acquisition cost, retention, lifetime value, and why a small change in activation or churn can beat a new feature.
- **Industry dynamics:** regulation, procurement, integrations, incumbents.

### The 2026 job market

NN/g's State of UX 2026 describes a boom after the pandemic, a sharp contraction around 2023 and 2024 and an uneven stabilization since, with senior and generalist roles recovering faster than entry-level ones and organizations demanding "breadth and judgment, not just artifacts."[[ref:nng-state-ux-2026]] A small sample of job postings I reviewed in October 2026 showed some segments asking for designers who can build working prototypes, often with AI coding tools, and favoring senior hires. Job boards are noisy, so treat that as a signal to investigate, not a statistic.

Also be careful with numbers repeated across blogs about 2026 design careers. Several are attributed inconsistently across articles and come from gated reports, so trace them to the original or discount them.[[ref:figma-sotd-2026]]

## 4. Flows, journeys and IA

You learned these as craft in [[ch:04]] and [[ch:02]]. Their *strategic* uses are different:

- **Journey maps at strategy level** show where the experience breaks across the whole relationship, including parts you don't own (sales, support, billing). The best discoveries often sit *between* teams.
- **Service blueprints** expose operational cost: every manual step behind a screen is a cost, a risk and an opportunity.
- **IA for complex products** is domain modeling. Deciding what the objects are, how they relate and what they're called shapes the whole product. Get the model wrong and no interface fixes it.

## 5. Metrics fluency

### Metrics design can move

- **Activation:** share of new users reaching first meaningful value.
- **Task success and time:** how well the product supports a key job.
- **Retention and engagement:** whether people come back, and how deeply.
- **Support contacts and error rates:** often the most honest signal of design problems.
- **Satisfaction (SUS, SEQ, NPS):** used carefully and in context.

Google's HEART framework (happiness, engagement, adoption, retention, task success) is a common way to connect product goals to user-centered metrics. Pair a **leading** measure (behavior you can move fast) with a **lagging** one (the business result).

### Experiments

A/B tests compare versions with real users and can settle what opinion can't. They need enough traffic, a clear hypothesis, a primary metric chosen in advance and patience. They tell you *what* performed better, never *why*, so pair them with qualitative work.

### Talking in business terms

State the problem in terms the business already tracks, the evidence, the change, the expected effect and how you'll check. "This step loses 30 percent of people and users tell us pricing is unclear; we'll simplify the summary and measure completion and support contacts" beats "the page is confusing." (That 30 percent is illustrative, not real data.)

:::exercise Try it: turn a design change into a measurable bet (1 hour)
Pick an improvement you believe in. Write the hypothesis ("If we..., then..., because..."), the primary metric and its baseline, how long you'd run it, what would make you stop and what you'll do if it fails. If you can't name the baseline, finding it is step one.
:::

## 6. Strategy for AI products

AI features aren't just features with a smarter engine. They change the strategy:

- **Quality is probabilistic.** A feature can be good on average and terrible for one user or case. Define "good enough" and measure it.
- **Cost scales with use.** Each interaction can carry real cost, which affects pricing, limits and defaults.
- **Models are shared infrastructure.** If your edge is model access, competitors can match it. Durable advantage tends to come from data, workflow integration, distribution, trust and design.
- **Trust is the product.** NN/g says it's built through transparency, user control, consistency and support when systems fail.[[ref:nng-state-ux-2026]]
- **Fatigue is real.** NN/g calls 2026 a year of AI fatigue, with users tired of low-value AI features and "AI slop."[[ref:nng-state-ux-2026]]

:::decision An AI feature checklist
**Problem:** is there a real, frequent, painful user problem, or are we adding AI because we can? **Fit:** is a probabilistic answer acceptable, and can people check or undo it? **Quality:** how will we measure good output (rubric, eval set, human review)? **Risk:** what's the worst plausible failure and who bears it? **Cost:** what does each use cost and does pricing support it? **Differentiation:** what makes it hard to copy? **Fallback:** what does the person do when it fails?
:::

Product Talk treats AI evals as part of continuous discovery: moving from informal vibe checks to systematic evaluation so teams can see whether a change helped or hurt quality.[[ref:product-talk]] As a designer, help define the rubric, the representative inputs and the review process, and treat failure cases as discovery material.

### Prototype fast, validate well

AI coding and design tools let you build a convincing prototype in hours. That's a real advantage for discovery. It's also a trap: a polished prototype can draw enthusiastic reactions to an unvalidated idea, because people respond to finish, not value. Test whether people would *use* it, *pay* for it or *change behavior*, not whether it looks good.

:::warning Fast is not the same as validated
Speed of building doesn't shrink what you don't know about users. It lets you ask your questions earlier, but you still have to ask them, and get answers from real people.
:::

## 7. Making your case

Strategy nobody understands changes nothing.

- **Write.** Short decision memos (context, options, recommendation, risks) travel further than decks.
- **Tell it with evidence.** Combine a number, a quote and a clip. Each persuades a different person.
- **Know the decision-maker's problem** and frame your recommendation as a solution to *their* goal.
- **Offer options.** Two or three paths with trade-offs and a recommendation beat a single proposal to accept or reject.
- **Be explicit about uncertainty:** what you know, believe and are guessing. It builds credibility over time.

## Case: from request to bet

Let's walk one idea through the whole chapter. The request from the VP of Sales: *"Customers keep asking for a dashboard. Can design build one?"*

**Step 1: Turn the solution into a problem.** "A dashboard" is a solution. Ask: what are customers trying to do when they ask for it? In five short calls with customers and two with account managers, a pattern emerges: *admins can't quickly tell which teams haven't adopted the product, so they can't justify the renewal to their own boss.*

**Step 2: Write the diagnosis.** *"Admins have no fast way to see adoption by team, which makes renewal conversations hard and hides at-risk accounts."* That's a sentence a team can argue with, which is exactly what makes it useful.

**Step 3: Pick the outcome.** Not "ship a dashboard," but *"increase the share of admins who can show adoption to their stakeholders, measured by exports or shares of the adoption view per account per quarter."* Plus a business tie: renewal rate for accounts that use the view.

**Step 4: Map the opportunity solution tree.**

\`\`\`text
Outcome: more admins can demonstrate adoption to stakeholders
├── Opportunity A: "I can't see which teams are inactive"
│   ├── Solution 1: Adoption-by-team table with last-active dates
│   └── Solution 2: Weekly email summary to admins
├── Opportunity B: "My boss wants a number, not a tool"
│   └── Solution 3: One-click exportable adoption report
└── Opportunity C: "I find out about drop-off too late"
    └── Solution 4: Alert when a team goes inactive for 14 days
\`\`\`

**Step 5: Surface assumptions for the most promising solution (Solution 3).** What must be true? *Desirability:* admins actually share reports. *Usability:* they can find and generate it. *Feasibility:* we have clean adoption data per team. *Viability:* it improves renewals enough to justify the work.

**Step 6: Test the riskiest assumption cheaply.** The riskiest is probably desirability: *would admins really share this?* A quick test: build a static, hand-made version of the report for five customers and email it. Measure whether they forward it or reply with changes. Cost: two days. If three of five share it within a week, move on. If none do, the dashboard would have been a costly miss.

**Step 7: Decide and write it down.** The memo says: problem, evidence, three options with trade-offs, recommendation (ship the exportable report first, defer the live dashboard) and what we'll measure. The VP gets an answer to their *goal*, not just their request.

Notice what design contributed: framing, talking to users, structuring options, designing a minimum test and writing the case. Not a single screen was drawn until step 6.

## A strategy memo template

\`\`\`text
TITLE:           [what this memo decides]
CONTEXT:         [what we know; 3 to 5 bullets, with sources]
DIAGNOSIS:       [the core problem or opportunity, one sentence]
WHO IT'S FOR:    [target users and their job to be done]
APPROACH:        [guiding policy; what we will NOT do]
BETS:            [1. ...  2. ...  3. ...  each with the outcome it moves]
MEASURES:        [leading and lagging, with baselines]
RISKS:           [assumptions and how we'll test them]
OPTIONS:         [A, B, C with trade-offs; recommendation]
DECISION NEEDED: [who decides, by when]
\`\`\`

## Positioning in one table

When you synthesize a teardown, put it in a form people can use:

| Dimension | Us | Competitor A | Competitor B | The status quo (spreadsheets) |
| --- | --- | --- | --- | --- |
| Who it's built for | Admins at mid-size teams | Enterprise IT | Individuals | Anyone |
| Time to first value | ~10 min | Days (needs setup) | Minutes | Hours, manual |
| Where they're strong | Ease, speed | Governance | Price | Familiarity, flexibility |
| Where they're weak | Reporting depth | Complexity | No team features | Errors, no history |
| What it means for us | Lean into speed; close the reporting gap | Don't compete on governance yet | Watch if they add teams | Easiest "competitor" to beat on reliability |

The last row is the whole point: every comparison should end in a decision.

## Discovery questions

- "Tell me about the last time you tried to [do the job]. What happened?"
- "What did you do before you found this?" (the real competitor)
- "What's the worst part of how you do this today?"
- "If this problem went away tomorrow, what would change for you?"
- "Who else is involved, and who has to say yes?"
- "What have you tried that didn't work?" (reveals what *not* to build)
- "What would make you stop using this?" (reveals risk)

## Where to go deeper

- **Product sense:** judging, with reasons, whether an idea is valuable, feasible and viable. Practice by critiquing products out loud.
- **Technical literacy:** knowing what's cheap, expensive or impossible, including what AI models can and can't do (see [[ch:10]]).
- **Financial literacy:** the unit economics of your products (see [[ch:06]]).
- **Writing and facilitation,** the most leveraged soft skills (see [[ch:07]]).
- **Ethics:** dark patterns, bias, privacy and safety are part of strategy now (see [[ch:12]]).

## Quick check

:::check Knowledge check 1
A stakeholder wants an AI chat assistant "because everyone has one." How do you respond?
---
Reframe from solution to problem: which user task is painful, frequent and suited to a probabilistic answer? Ask what would make it valuable and hard to copy, how quality would be measured, how users could check, correct or recover from errors, and what each use costs. If the case is weak, propose a smaller test or a non-AI improvement. NN/g notes users are experiencing fatigue from low-value AI features, which supports being selective.
:::

:::check Knowledge check 2
Your AI-assisted prototype got enthusiastic reactions in five sessions. Is the idea validated?
---
Not necessarily. People may be reacting to polish, and stated enthusiasm is weak evidence of behavior. Check whether participants match the real target group, whether they did something that cost them (switched, paid, committed time, gave real data) and what they did unprompted. Design a test of the riskiest assumption about value and viability, and label the current evidence moderate or weak.
:::

`,"./content/fundamentals/05-product-discovery-strategic-ux.md":`Most failed products weren't badly designed. They were well-designed answers to questions nobody was asking.

**Product discovery** is the work of figuring out *what* to build before you build it. **UX strategy** is the plan that connects what users need with what the business is trying to achieve. Together they decide whether all the design work that follows is pointed in the right direction.

This edition explains the foundations: what strategy and discovery are, the frameworks teams use, how to frame problems, how to analyze competitors and markets, and how journeys and information architecture feed into strategy.

:::pull
Design answers "how should this work?" Strategy and discovery answer the earlier, harder questions: "should this exist, and for whom?"
:::

## Key ideas first

### Problem space vs. solution space

- The **problem space** is everything about the users, their needs and the situation, independent of any solution.
- The **solution space** is all the ways you might address those needs.

Teams often jump straight into the solution space ("let's build a dashboard") without understanding the problem space. Discovery keeps you there long enough to understand what you're solving.

### Outputs, outcomes and impact

| Term | What it is | Example |
| --- | --- | --- |
| Output | Something you make | A new onboarding flow |
| Outcome | A change in user behavior | More new users complete setup |
| Impact | A business result | Higher retention and revenue |

Good strategy is organized around **outcomes**, because outputs only matter if they change something.

### Discovery vs. delivery

**Discovery** is learning what to build: research, framing, ideation and testing ideas cheaply. **Delivery** is building and shipping. Modern teams run them in parallel ("dual-track"), so learning feeds building continuously.

## What UX strategy is

UX strategy is a plan that aligns user needs, business goals and design decisions over time. Jaime Levy's work on UX strategy describes it as combining business strategy, value innovation, validated user research and killer UX design. In practice, a UX strategy answers:

1. **Who** are we designing for?
2. **What** problems or goals do they have?
3. **Why** will our approach work better than alternatives?
4. **How** will we measure success?
5. **What** are we deliberately *not* doing?

### The kernel of good strategy

Richard Rumelt's *Good Strategy / Bad Strategy* describes three parts every good strategy has:

- **Diagnosis:** what's actually going on and why it matters.
- **Guiding policy:** the overall approach to dealing with it.
- **Coherent actions:** specific steps that work together.

"Bad strategy" is often just a list of goals ("increase engagement!") with no diagnosis or plan.

### Vision, strategy, roadmap

| Term | Time frame | Answers |
| --- | --- | --- |
| Vision | Years | Where are we going and why? |
| Strategy | Months to a year | How will we get there? |
| Roadmap | Weeks to months | What will we work on, in what order? |

## The four product risks

Marty Cagan's framework says every product idea carries four risks:[[ref:svpg-risks]]

| Risk | Question | Usually owned by |
| --- | --- | --- |
| Value | Will people want it, buy it or use it? | Product, design |
| Usability | Can people figure out how to use it? | Design |
| Feasibility | Can we build it with our time, skills and tech? | Engineering |
| Viability | Does it work for the business (cost, legal, sales)? | Product, business |

Discovery is the process of reducing these risks *before* committing to build.

## Discovery frameworks

### The Double Diamond

The Design Council's **Double Diamond** shows two rounds of diverging (exploring widely) and converging (narrowing down):

1. **Discover:** research to understand the problem broadly.
2. **Define:** narrow down to a clear problem statement.
3. **Develop:** generate many possible solutions.
4. **Deliver:** test, refine and ship the best one.

### Design thinking

Stanford d.school's design thinking process has five stages: **Empathize, Define, Ideate, Prototype, Test.** It's not strictly linear; teams loop back as they learn.

### Continuous discovery

Teresa Torres's *Continuous Discovery Habits* argues discovery should happen every week, not as a big project.[[ref:product-talk]] Key practices:

- A **product trio** (product manager, designer, engineer) shares discovery work.
- The trio **talks to customers weekly.**
- Work is organized around a clear **desired outcome.**
- Teams map what they learn in an **opportunity solution tree.**
- Ideas are tested through small **assumption tests.**

### The opportunity solution tree

\`\`\`text
Desired outcome (e.g. increase week-2 retention)
├── Opportunity: users don't see value quickly
│   ├── Solution: guided first project
│   └── Solution: templates
└── Opportunity: users forget to come back
    ├── Solution: weekly digest email
    └── Solution: reminders for unfinished work
\`\`\`

**Opportunities** are user needs, pain points or desires (from research). **Solutions** are ideas that address them. Below solutions you list the **assumptions** each depends on and how you'll test them.

### Jobs to be done (JTBD)

JTBD says people "hire" products to make progress in a particular situation. A job statement often looks like: *"When [situation], I want to [motivation], so I can [outcome]."* For example: "When I'm preparing for a client meeting, I want to see the latest project status, so I can answer questions confidently." JTBD helps you see that your real competition may be a spreadsheet, a phone call or doing nothing.

### Lean UX and assumptions

**Lean UX** (Jeff Gothelf and Josh Seiden) treats ideas as hypotheses to test quickly:

> *We believe that [doing this] for [these people] will achieve [this outcome]. We'll know we're right when we see [this signal].*

## Framing problems well

### Problem statements

A good problem statement describes the user, the need and the insight, without proposing a solution:

> *New admins (user) need to know whether their setup is complete (need) because they can't invite their team until it is, and they don't know what's left (insight).*

### "How might we" questions

Turn problems into open questions that invite ideas: *"How might we help new admins see what's left in setup?"* Not too broad ("How might we improve onboarding?") and not too narrow ("How might we add a progress bar?").

### The five whys

Ask "why?" repeatedly to get from a symptom to a root cause. "Users don't finish setup." Why? "They get stuck at integrations." Why? "They don't know which account to connect." That's something you can design for.

## Prioritization basics

Teams always have more ideas than capacity. Common frameworks:

| Framework | How it works |
| --- | --- |
| Impact vs. effort | Plot ideas on a 2×2; start with high impact, low effort |
| RICE | Reach × Impact × Confidence ÷ Effort |
| MoSCoW | Must have, Should have, Could have, Won't have (now) |
| Kano model | Classifies features as basic expectations, performance features or delighters |
| Value vs. complexity | Similar to impact/effort, with business value |

These don't give you the answer. They make your assumptions visible so the team can discuss them.

## Competitive analysis

### Why do it

To understand how people solve the problem today, what competitors do well and badly, where the gaps are, and how to position your product.

### Types of competitors

- **Direct:** same solution for the same users (two project management tools).
- **Indirect:** different solution for the same need (a project tool vs. a shared spreadsheet).
- **Substitutes:** completely different ways of getting the job done, including doing nothing.

### Methods

- **Feature comparison matrix:** what each product offers.
- **UX teardown:** walk through key flows and document the experience step by step.
- **Heuristic review:** evaluate competitors against usability principles.
- **SWOT:** Strengths, Weaknesses, Opportunities, Threats.
- **Review mining:** read app store reviews, forums and social posts to learn what users love and hate.
- **Positioning map:** plot competitors on two dimensions (for example "simple ↔ powerful" and "individuals ↔ teams") to find gaps.

### A simple process

1. Define what you want to learn.
2. Choose 3 to 6 competitors, including at least one indirect.
3. Gather information consistently (same tasks, same criteria).
4. Summarize patterns: what's standard, what's missing, what's done well.
5. End with **implications** for your product. Analysis without implications is just a report.

## Market and customer awareness

### Market basics

- **TAM, SAM, SOM:** Total addressable market (everyone who could use something like this), serviceable addressable market (those you can reach), serviceable obtainable market (those you can realistically win).
- **Segments:** groups of customers with similar needs or traits (by company size, industry, role, behavior).
- **Personas and segments** are related: segments are business groupings; personas are research-based portraits of user types.

### Positioning

**Positioning** is how you want your product to be understood relative to alternatives: for whom, solving what, and why better. April Dunford's *Obviously Awesome* lays out a practical process: identify competitive alternatives, your unique attributes, the value they enable, the customers who care most and the market category that makes your value obvious.

### Business models (briefly)

How a product makes money shapes design: **subscription** (monthly or yearly), **freemium** (free tier plus paid upgrades), **usage-based** (pay per use), **transactional** (fee per purchase), **advertising** (free for users, paid by advertisers). [[ch:06]] goes deeper.

## Journeys and IA in strategy

### Journey maps as strategic tools

A journey map shows a user's experience across phases, touchpoints and emotions. Strategically, maps reveal **where the biggest pain points are across the whole experience**, including parts your team doesn't own (sales, support, billing). They help teams prioritize.

### Service blueprints

A **service blueprint** extends a journey map with layers for what happens behind the scenes: frontstage actions (what employees do that customers see), backstage actions (what they don't see) and support processes (systems). It's essential for products where the experience depends on operations.

### IA as strategy

For complex products, information architecture is a strategic decision: what are the core objects (projects, tasks, invoices), how do they relate, and what do we call them? Getting this model right early makes everything after easier.

## A discovery cycle

1. **Set the outcome:** what change are we trying to create?
2. **Understand:** research users, data and competitors.
3. **Frame:** write problem statements and opportunities.
4. **Ideate:** generate multiple solutions.
5. **Identify assumptions:** what must be true for each idea?
6. **Test cheaply:** prototypes, interviews, fake doors, small experiments.
7. **Decide:** build, change or drop.
8. **Measure:** did the outcome move?

## Key terms

| Term | Plain meaning |
| --- | --- |
| Problem space | Understanding users and needs before solutions |
| Outcome | A change in behavior you want to create |
| Product trio | PM, designer and engineer doing discovery together |
| Opportunity solution tree | A map from outcome to opportunities to solutions to tests |
| Jobs to be done | The progress people want to make in a situation |
| How might we | An open question that invites solutions |
| RICE | A prioritization score: reach, impact, confidence, effort |
| Positioning | How your product is understood relative to alternatives |
| Service blueprint | A journey map plus behind-the-scenes processes |

## Quick check

:::check Knowledge check 1
"Add a dashboard" is a request from sales. Is that a problem or a solution, and what do you do?
---
It's a solution. Find the underlying problem by asking what users are trying to do and why. You might learn that admins can't see team adoption, and a dashboard is only one of several ways to solve that.
:::

:::check Knowledge check 2
Which of Cagan's four risks is about whether people can figure out how to use the product?
---
Usability risk. Value is whether they want it; feasibility is whether we can build it; viability is whether it works for the business.
:::

:::check Knowledge check 3
Why include indirect competitors and substitutes in a competitive analysis?
---
Because users often solve the problem in other ways (spreadsheets, email, doing nothing). Your real competition is whatever they use today, not just products that look like yours.
:::

`,"./content/modules/06-product-business-thinking.md":`In a design review, someone asks: "How will this help the business?" The room goes quiet, and the designer says something like "it'll improve the experience."

That answer is true and useless. Compare it with: "Setup completion is 62 percent today and most drop-offs happen at the integration step. This change targets that step. If it works, activation goes up, which is what we're measured on this quarter."

Same design, completely different conversation. The second designer understands the chain **design → product → business → outcome**, and that fluency is one of the biggest things separating a UI/UX designer from a strong *product* designer. You don't need to become a PM or an accountant. You need to follow the money and the metric from your pixel to the result, and say where you're guessing.

This chapter builds on [[ch:05]] (strategy and discovery) and goes deeper on the numbers: product thinking, business models, metrics, prioritization, proving design's impact and positioning yourself.

:::pull
You don't need to own the business. You need to speak it well enough that your design decisions are part of the conversation, not a footnote to it.
:::

## 1. Product thinking

Product thinking starts from the outcome and the problem, not the feature. A product thinker asks: Who has this problem, and how do we know? What behavior would change if we solved it? What would that do for the business? What's the smallest thing we could do to find out?

It shows up in small moments. You push back on "add a filter" with "what are people trying to find?" You propose a metric before building. You notice the exciting feature solves a problem nobody reported.

### Build product sense out loud

"Product sense" is the knack for judging quickly, with reasons, whether an idea is valuable, usable, feasible and viable (the four risks from [[ch:05]]). Practice with products you use:

1. Who is it for, and what job do they hire it for?
2. How does it make money? What makes customers pay, stay or leave?
3. What's the riskiest assumption behind its latest feature?
4. What would you test first?

:::framework A product-thinking checklist for any feature request
**Who** has the problem, and how do we know? **What** behavior are we trying to change? **Why now,** and why this over the alternatives (including doing nothing)? **How will we know** it worked (metric plus baseline)? **What's the smallest test?** **What does it cost** (build, maintain, complexity), and what are we *not* doing to afford it?
:::

### 2026 shifts

- **Building is cheaper, so deciding is scarcer.** AI tools make working software faster to produce, which raises the cost of building the *wrong* thing, because teams can now build a lot of it.
- **Roles overlap more.** One secondary survey summary reported that 65 percent of designers say they do more work overlapping with product or engineering; I couldn't verify the original report, so treat it as a signal.[[ref:musemind-ai-ux]] NN/g says organizations will ask more of each role, demanding "breadth and judgment, not just artifacts."[[ref:nng-state-ux-2026]]
- **"Design theater" is the failure mode.** NN/g warns against artifacts without results.[[ref:nng-state-ux-2026]] The antidote: tie every artifact to a decision and an outcome.

:::exercise Try it: rewrite three requests as problems (1 hour)
Take three backlog items. For each: write the problem without the solution, the behavior to change, the metric to watch and the cheapest test. Ask a PM which one they would've pushed back on anyway.
:::

## 2. How the money works

You should be able to explain, in a few sentences, for your own product:

- **Who pays** (user, buyer, advertiser) and **how** (subscription, usage, transaction, license, ads).
- **What grows revenue:** more customers, higher price, more usage, more products per customer.
- **What drives cost:** acquisition, delivery, support, infrastructure and, for AI features, the cost of each model call.
- **How customers arrive and stay:** self-serve, sales-led, partners.

### The vocabulary of the room

| Term | Meaning | Why a designer cares |
| --- | --- | --- |
| Activation | Share of new users reaching first value | Onboarding is design's biggest growth lever |
| Retention | Share who keep coming back | A product people leave can't grow |
| Churn | Customers or revenue lost over time | Usability and unmet needs show up here |
| ARR / MRR | Annual / monthly recurring revenue | How subscription businesses are measured |
| Net revenue retention | Revenue from existing customers incl. expansion and loss | In B2B, expansion depends on adoption |
| CAC / LTV | Cost to acquire / lifetime value of a customer | Clear value and onboarding lower CAC; retention raises LTV |
| Gross margin | Revenue minus cost of delivering it | Crucial for AI features with real per-use cost |

### B2B vs. B2C: who decides?

In B2B the **user**, **buyer** and **decision-maker** are often different people. A gorgeous experience for people who don't choose the product, or a feature only the buyer sees in a demo, can both fail. Procurement, security reviews, integrations and admin controls are *product features* that win or lose deals. In consumer products the user usually decides, so attention and habit matter more.

### 2026 shifts

- **AI changes unit economics.** Each use of an AI feature can have real cost, which shapes pricing, limits and defaults. A design that encourages heavy, low-value use of an expensive feature can hurt margin. Ask engineering what a typical interaction costs.
- **Pricing is shifting toward usage and outcomes** in many products, which makes design choices (what's metered, how usage is shown, what happens at a limit) part of the business model.

:::exercise Try it: draw your product's money map (1 hour)
On one page, show how money enters and leaves: who pays for what, how customers arrive, where they leave, and the three costs that matter most. Mark where design decisions influence each arrow, then check it with someone in product or finance.
:::

## 3. Metrics and analytics

### What to be able to read

- **Funnels:** the steps to a goal and where people drop. A drop is a *question*, not an answer.
- **Cohorts and retention curves:** compare people who started at the same time. A curve that flattens means a core finds lasting value; one that falls to zero doesn't.
- **Events:** what the product records. Design the events you'll want to know about when you design the feature, not after.
- **Segments:** averages hide what matters. Split by new vs. returning, small vs. large customers, device, plan.
- **Distributions:** a few heavy users can distort a mean. Medians and percentiles are often more honest.

### Don't get fooled

- **Correlation isn't causation.** People who use feature X retain better, but they may be the more engaged people who'd have stayed anyway.
- **Small samples are noisy.** Small differences in small groups are often chance.
- **Pick the metric before the test.** Hunting for one that moved after the fact finds noise.
- **Significant isn't important.** A tiny effect in a huge sample can be significant and still not matter.

### Experiments and traps

A/B tests are the strongest tool for measuring a change, with classic pitfalls: stopping when the result looks good ("peeking"), running too short, ignoring novelty effects, testing many metrics until one moves. A test tells you *what* happened, not *why*, so pair it with qualitative work.

:::warning Common trap: numbers that look precise
Dashboards present tidy numbers built on definitions, filters and tracking that can be wrong. Before you quote a metric, ask how it's defined, when tracking was last verified, who's excluded and what the sample is.
:::

### 2026 shifts

- **AI can query and summarize your data fast.** That lowers the cost of getting an answer and raises the risk of a confident wrong one. Check the logic behind AI analysis and compare against a number you already trust.
- **AI products need quality metrics, not only usage:** accepted vs. edited vs. rejected outputs, task success, complaints, plus structured evaluations (see [[ch:02]] and [[ch:04]]).

:::exercise Try it: interrogate a metric (1 hour)
Pick a number your team cites constantly. Find out how it's defined, tracked and what it excludes. Write down one thing it can't tell you, then one qualitative question that would explain a movement in it.
:::

## 4. Prioritization frameworks

| Framework | How it works | Best for | Main weakness |
| --- | --- | --- | --- |
| Impact vs. effort | Plot on a 2x2 | Quick team alignment | Subjective axes |
| ICE | Impact, confidence, ease | Ranking experiments fast | Scores are guesses |
| RICE | Reach, impact, confidence, effort | Comparing bigger initiatives | False precision |
| Kano | Basic, performance or delight | Understanding expectations | Needs research input |
| MoSCoW | Must / should / could / won't | Scoping a fixed release | Everything becomes a "must" |
| Cost of delay | What waiting costs per unit time | Time-sensitive calls | Hard to estimate |

The key insight: frameworks don't produce answers, they make assumptions **visible and arguable**. The conversation about *why* reach is high or confidence is low is where the value lives.

- **Anchor on an outcome.** You can't rank work without knowing what you're trying to achieve.
- **Make confidence honest.** Low confidence means the next step is discovery, not building.
- **Count the cost of complexity.** Every feature has a maintenance cost and a cognitive cost for users.
- **Keep a "not now" list.** A priority list without one is a wish list.
- **Record the decision and why.**

:::exercise Try it: rank with the assumptions showing (1 hour)
Take six backlog items and score them with RICE. Then rewrite each score as a sentence stating the assumption behind reach, impact and confidence. Find the two scores you trust least and design a cheap test for each.
:::

## 5. Proving design's impact

### The famous claim, with care

The most-cited evidence is the McKinsey Design Index (2018): an analysis of financial data and design actions across about 300 public companies, in which top-quartile design performers outperformed industry benchmarks on growth, in McKinsey's summary by as much as two to one.[[ref:mckinsey-design]] Use it carefully. It's a correlation, parts of the data were self-reported, and well-run companies may simply invest in design *and* everything else. A 2019 Fortune piece discusses the debate, including that design sits on the balance sheet as a cost, not an investment.[[ref:fortune-design-value]] Exact figures differ between summaries, so check the original before quoting.

You'll persuade more by showing *your own* contribution credibly.

### Measuring your impact

1. **Start with a baseline.** Before changing anything, record the current number (completion, time on task, support contacts, error rate, conversion).
2. **Pick the right kind of measure:** behavioral, efficiency, quality, satisfaction or commercial.
3. **Compare fairly.** Before/after, or better, test vs. control. Note anything else that changed.
4. **Convert to money where credible:** time saved × people × loaded hourly cost; support contacts avoided × cost per contact; conversion lift on a known base. State your assumptions.
5. **Be honest about attribution.** Many things move a metric. Say what you contributed, with what confidence, and what you don't know.

:::example A hypothetical impact statement (numbers are illustrative)
"Task success for integration setup rose from 62 percent to 81 percent in moderated tests with eight participants. Support contacts about setup fell by roughly a third over the next quarter, but a documentation update shipped in the same period, so I attribute part, not all, of that to the redesign. At about 400 setups a month and an estimated cost per support contact of X, the saving is Y a month; assumptions are listed below."
:::

Also know your organization's design maturity. NN/g's UX maturity model describes stages from ignored to integrated. In a low-maturity organization, your first win is often small and measurable, one that builds trust, not a transformation.

NN/g notes that UI is getting cheaper to produce, so surface-level work is easily replaceable and judgment, context and critical thinking are what's harder to automate.[[ref:nng-state-ux-2026]] Showing impact makes that judgment *visible*. Expect more pressure to justify design headcount with evidence tied to outcomes.

:::exercise Try it: write one impact case (1 hour)
Choose a past project. Write half a page: problem and baseline, what you did, how you measured, the change, what else may have contributed, and the money translation with assumptions. No baseline? Write how you'd get one next time.
:::

## 6. Strategic positioning

Positioning is how you frame your work and yourself so that others understand its value and scope. It happens at three levels: the **discipline** (explain design in outcomes the business cares about, not process), the **work** (introduce each project with problem, stakes and result, not artifacts) and **you** (your scope, your point of view, your visibility).

### How scope grows

Levels differ less in craft than in the kind of problem and the amount of ambiguity. A rough pattern, which varies by company:

| Level | Typical scope | What changes |
| --- | --- | --- |
| Early career | A well-defined task or component | Executes with guidance |
| Mid-level | A feature or flow, end to end | Works independently within a feature |
| Senior | A problem area across features | Frames the problem, aligns people, defines success |
| Staff and principal | An area of the product or a cross-team problem | Shapes strategy, raises the bar for others |

Uxcel's skills article, as you summarized it, associates product thinking and business fluency with senior roles and progression. That's plausible and matches common experience, but it's a vendor's own analysis, so treat it as supporting rather than proof.

### Practical moves

- **Volunteer for the ambiguous problem,** not just the well-specified one.
- **Write the decision memo** others will use.
- **Connect every update to an outcome.**
- **Teach and share.** Credibility comes from helping others.
- **Keep an impact log** with numbers and dates. You'll need it for reviews and portfolios.

:::exercise Try it: your positioning statement (30 minutes)
In three sentences: who you help, what problem you solve for them, what you're known for. Then rewrite three recent projects as problem, action and measured result. Ask a colleague whether the statement matches how they'd describe you.
:::

## Case: design to money

Let's follow one change from a design idea to a number a finance person would respect. All figures are illustrative.

**The situation.** A B2B tool has a self-serve trial. 1,000 teams start a trial each month. 40 percent complete setup; of those, 25 percent convert to a paid plan at $100 per month. The design team believes the integration step in setup is confusing.

**Step 1: Build the funnel.** Draw it with numbers:

| Stage | Teams per month | Conversion from previous |
| --- | --- | --- |
| Start trial | 1,000 | — |
| Complete setup | 400 | 40% |
| Become paying | 100 | 25% |

At $100 a month, that's $10,000 of new monthly recurring revenue per month.

**Step 2: Find the leak.** Analytics shows 35 percent of people who start setup stop at the integration step, and user tests show why (they don't know which account to connect). So the leak is specific and the cause has evidence.

**Step 3: Write the hypothesis.** *"If we clarify the integration step with account previews and examples, then setup completion will rise from 40 to 46 percent, because fewer people will stall at integration."*

**Step 4: Estimate the prize.** 6 percentage points more completing setup is 60 more teams. At the same 25 percent paid conversion that's 15 more paying teams, or $1,500 of new MRR per month. Over a year, a cohort that keeps paying could bring roughly $18,000 in annual run-rate per month of cohort (before churn). The exact model isn't the point; stating assumptions is.

**Step 5: Count the cost.** Two weeks of design and engineering. Compare cost to benefit. Is a payback of a few months reasonable? Is there a cheaper test?

**Step 6: Run a test.** An experiment with half the traffic on the new step, setup completion as the primary metric and trial-to-paid conversion as a guardrail. Decide in advance: *"We ship if completion rises by at least 3 points with no drop in conversion; otherwise we iterate."*

**Step 7: Report honestly.** "Completion rose from 40 to 45 percent (95 percent confidence interval 43 to 47); conversion was flat within noise; shipping to everyone. Estimated added MRR: about $1,250 per month, with the assumptions listed." If the result is flat, say so, and what you learned.

You didn't need to be a finance expert. You needed a funnel, one hypothesis, a plain estimate and honesty.

## Interrogating a metric

For any number someone shows you, ask:

1. **What exactly is counted?** (users, sessions, accounts, events)
2. **Over what time window, and compared to what?**
3. **Who's excluded?** (internal users, free tier, certain regions)
4. **How is it tracked, and when was that last checked?**
5. **What's the sample size?**
6. **What else changed during that time?** (releases, campaigns, seasonality)
7. **What decision would this number change?** If none, why are we looking at it?

## Prioritizing in practice

Imagine six candidates and you're asked to rank them. A good conversation goes:

1. **State the outcome** you're optimizing this quarter (say, activation).
2. **List candidates** with the assumption behind each ("Reach: all new users. Impact: moderate. Confidence: low, based on one interview.").
3. **Score together,** and note disagreements, which are the most valuable output.
4. **Mark low-confidence items for discovery,** not building.
5. **Ask what's missing:** something small and high-leverage that wasn't on the list?
6. **Agree on a "not now" list** and say why.
7. **Write it down** and revisit when evidence changes.

## Showing your impact

A simple structure that works:

| Part | What to write |
| --- | --- |
| Problem | What was wrong, for whom, with evidence |
| Baseline | The number before (and where it came from) |
| What I did | Your specific contribution, not "we" for everything |
| Result | The change, with how it was measured |
| Attribution | What else contributed; your honest share |
| What I'd do next | Shows judgment and humility |

Use numbers where you can, and say "estimated" where you're estimating.

## Where to go deeper

- **Finance basics:** how a budget, a forecast and a P&L work, enough to read them.
- **Pricing and packaging:** how plans, limits and trials shape experience.
- **Data fluency:** reading simple queries and dashboards, and asking sharper questions of data teams.
- **Writing for decisions:** one-page memos with options and a recommendation (see [[ch:07]]).

## Your next four weeks

| Week | Focus | You'll have |
| --- | --- | --- |
| 1 | Rewrite requests as problems; draw the money map | Three rewrites reviewed by a PM; a one-page map |
| 2 | Interrogate a metric; read a funnel and a cohort | A note on what the metric can't tell you |
| 3 | Rank with assumptions visible | A ranked list with a not-now list and two tests |
| 4 | An impact case and a positioning statement | A one-page case and a statement agreed with your manager |

## Quick check

:::check Knowledge check 1
A teammate says "users who use feature X retain better, so push everyone to use it." What's the problem?
---
It's correlation, not causation: more engaged people may both use X and retain. Test causation with an experiment (promote X to a random subset and compare retention), check whether the relationship holds in comparable segments, and use qualitative research to learn why X helps those who use it. Don't make a big product change based on correlation alone.
:::

:::check Knowledge check 2
You're asked to prove a redesign "worked," but you have no baseline. What now?
---
Be honest about what you can and can't show. Reconstruct a baseline if possible (old analytics, support tickets, archived test results), run a comparison with the old version if it still exists, and set up measurement now for the future. Present what you know with its limits and don't claim credit for changes you can't attribute.
:::

`,"./content/fundamentals/06-product-business-thinking.md":`A great interface that doesn't help the business survive won't be around long, and neither will the team that built it. Product designers who understand how the business works make better decisions, get invited into earlier conversations and can explain why their work matters.

This edition explains the basics from the ground up: what product thinking is, how companies make money, the metrics that matter, how teams prioritize, how to measure design's impact and how to position your work.

:::pull
Design → product → business → outcome. A strong product designer can trace a line through all four.
:::

## Product thinking

### What it is

**Product thinking** is approaching design as a way to solve real problems that create value for users *and* the business. It means asking:

- **Who** is this for, and what problem do they have?
- **Why** does it matter to them, and to us?
- **What** outcome are we trying to change?
- **How** will we know if it worked?
- **What** should we *not* build?

A UI designer focused only on the screen asks, "How should this look?" A product thinker first asks, "Should this exist, and what should it achieve?"

### The product triangle

Good products sit where three things overlap:

- **Desirable:** users want it.
- **Viable:** the business can sustain it.
- **Feasible:** the team can build it.

Designers are often strongest on desirability. Product thinking means caring about the other two as well.

### Features vs. outcomes

A **feature** is something the product does. An **outcome** is a change in what users do (or in business results). Teams that celebrate shipping features ("we launched 12 things!") without checking outcomes often build a lot that nobody uses.

### The product lifecycle

Products go through stages, and good design decisions differ by stage:

| Stage | Focus | Design priority |
| --- | --- | --- |
| Introduction | Finding product–market fit | Learning fast, core value |
| Growth | Acquiring and activating users | Onboarding, scalability |
| Maturity | Retaining and expanding | Efficiency, depth, polish |
| Decline | Managing or reinventing | Simplification, migration |

## How businesses make money

### Business models

| Model | How it works | Design implications |
| --- | --- | --- |
| Subscription (SaaS) | Recurring monthly or yearly fee | Retention is everything; onboarding and ongoing value matter |
| Freemium | Free tier plus paid upgrades | Clear upgrade moments without annoying free users |
| Usage-based | Pay for what you use | Usage visibility, limits, cost predictability |
| Transactional | Fee or margin per sale | Conversion and trust at checkout |
| Marketplace | Commission between buyers and sellers | Trust and value for both sides |
| Advertising | Free to users, paid by advertisers | Engagement, balanced against user trust |
| License / one-time | Pay once | Strong first impression, upgrade paths |

### B2B vs. B2C

- **B2C (business to consumer):** individuals choose, pay and use. Emotional appeal and simplicity matter a lot.
- **B2B (business to business):** companies buy for their employees. The **buyer** (who pays), the **decision-maker** (who approves) and the **user** (who uses it daily) are often different people. Admin tools, permissions, security and integrations matter as much as the core experience.

### Go-to-market

- **Product-led growth (PLG):** users discover, try and adopt the product themselves (free trials, freemium). Design drives growth.
- **Sales-led growth:** sales teams find and close customers, often with demos. Design supports trust, evaluation and onboarding after purchase.

### Unit economics basics

- **CAC (customer acquisition cost):** how much it costs to win a customer.
- **LTV (lifetime value):** how much revenue a customer brings over time.
- A healthy business usually needs LTV comfortably higher than CAC.
- **Gross margin:** revenue minus the direct cost of delivering the product.

Design affects all of these: clear value lowers CAC (more conversions), and good experiences raise LTV (customers stay longer).

## Metrics and analytics literacy

### Why metrics matter for designers

Metrics turn "I think this is better" into "this improved completion by 8 percent." They help you find problems, prioritize and prove impact.

### Common product metrics

| Metric | What it measures |
| --- | --- |
| Acquisition | How many new users or signups arrive |
| Activation | How many reach a first meaningful moment of value |
| Retention | How many keep coming back over time |
| Churn | How many leave (the opposite of retention) |
| Engagement | How often and how deeply people use the product |
| Conversion rate | Percentage who complete a goal (sign up, buy) |
| ARPU | Average revenue per user |
| MRR / ARR | Monthly or annual recurring revenue |
| NPS | Net Promoter Score: how likely users are to recommend |
| CSAT | Customer satisfaction score |
| Task success / time on task | Usability measures |

### Frameworks for choosing metrics

**AARRR ("pirate metrics")** by Dave McClure tracks the customer lifecycle: **Acquisition, Activation, Retention, Referral, Revenue.**

**HEART** from Google is designed for user experience:

| Dimension | Example signal |
| --- | --- |
| Happiness | Satisfaction surveys |
| Engagement | Sessions per week |
| Adoption | New users of a feature |
| Retention | Users still active after 30 days |
| Task success | Completion rate, errors |

HEART is paired with **Goals → Signals → Metrics**: define the goal, the behavior that would show it, then the number you'll track.

**North Star metric:** one key metric that best captures the value users get (for example "weekly active teams creating projects"). It aligns teams around one direction.

### Reading data

- **Funnels** show the steps to a goal and where people drop off.
- **Cohorts** group users by when they started, to compare behavior over time.
- **Retention curves** show what percentage of a cohort is still active over time. A curve that flattens means some users found lasting value.
- **Segments** split data by user type, plan, device or region.

### Leading vs. lagging indicators

- **Lagging** metrics show results after the fact (revenue, churn).
- **Leading** metrics predict them earlier (activation, weekly engagement).

Design work usually moves leading metrics first.

### Avoiding common mistakes

- **Correlation isn't causation.** Two things moving together doesn't mean one caused the other.
- **Vanity metrics** (total signups, page views) look good but don't show real value.
- **Averages hide differences.** Look at segments and distributions.
- **Small samples are noisy.**

### A/B testing basics

An **A/B test** shows version A to one random group and version B to another, then compares a metric. Key ideas: define a hypothesis and primary metric first, run until you have enough data, and don't stop the test the moment it looks good. A test tells you *which* version performed better, not *why*.

## Prioritization frameworks

| Framework | How it works | Good for |
| --- | --- | --- |
| Impact / effort matrix | Plot on a 2×2: quick wins, big bets, fill-ins, money pits | Fast team alignment |
| RICE | (Reach × Impact × Confidence) ÷ Effort | Comparing many ideas |
| ICE | Impact × Confidence × Ease | Fast scoring of experiments |
| MoSCoW | Must, Should, Could, Won't | Scoping a release |
| Kano | Basic, performance and delight features | Understanding user expectations |
| Cost of delay | What waiting costs | Time-sensitive decisions |
| Opportunity scoring | Importance vs. current satisfaction | Finding underserved needs |

### How RICE works

- **Reach:** how many people it affects in a time period (for example 500 users per month).
- **Impact:** how much it affects each person (often scored 0.25, 0.5, 1, 2, 3).
- **Confidence:** how sure you are (100%, 80%, 50%).
- **Effort:** person-months of work.

Score = (Reach × Impact × Confidence) ÷ Effort. Higher means a better bet. The value is less in the number and more in discussing the assumptions behind it.

### The Kano model

| Category | If present | If absent |
| --- | --- | --- |
| Basic (must-be) | Expected, little delight | Strong dissatisfaction |
| Performance | More is better | Less is worse |
| Delighters | Pleasant surprise | Not missed |

Over time, delighters become expected basics (think of how mobile check-in moved from novelty to standard).

## Design ROI and impact

### Why measure design's impact

Design is often seen as a cost. Showing its impact helps secure investment, prioritize work and earn a seat in decisions.

### What design can improve

- **Revenue:** higher conversion, upgrades, retention.
- **Cost:** fewer support tickets, less rework, faster development with a design system.
- **Efficiency:** time saved for users (especially in internal and B2B tools).
- **Risk:** fewer errors, better accessibility compliance.
- **Satisfaction:** higher NPS, CSAT and usability scores.

### A simple way to calculate impact

1. **Baseline:** measure before the change (for example, 40% complete setup).
2. **Change:** measure after (for example, 46%).
3. **Translate to value:** 6 extra points × 1,000 trials a month = 60 more activated users; if 25% of activated users pay $100 a month, that's 15 new customers, or $1,500 a month in new recurring revenue (illustrative numbers).
4. **Compare with cost:** design and build time.
5. **Be honest about attribution:** what else changed at the same time?

### Evidence from industry

McKinsey's 2018 "Business Value of Design" research analyzed about 300 public companies and reported that those with strong design practices outperformed industry benchmarks on growth.[[ref:mckinsey-design]] It's widely cited, but it shows correlation, not proof that design caused the growth, so use it as supporting context rather than your main argument.

### UX maturity

Organizations differ in how much they value and use design. NN/g describes stages from "absent" (UX is ignored) to "user-driven" (UX is part of every decision). Knowing where your organization is helps you choose realistic goals.

## Strategic positioning

### Positioning your work

Present your work in terms of problems and outcomes, not just deliverables:

- Weak: "I redesigned the settings page."
- Strong: "Support tickets about permissions were our top category; I redesigned the permissions page, and tickets dropped by about a third."

### Positioning yourself

As you grow, your scope expands:

| Level | Typical scope |
| --- | --- |
| Junior | Tasks and screens, with guidance |
| Mid-level | Features and flows, independently |
| Senior | Problem areas across features; shapes direction |
| Staff / principal | Product areas or cross-team problems; influences strategy |

Positioning yourself means being clear about the problems you solve, the impact you've had and the kind of work you want to grow into.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Product thinking | Designing for user and business outcomes, not just screens |
| Business model | How a company makes money |
| B2B / B2C | Selling to businesses / to consumers |
| PLG | Growth driven by the product itself |
| CAC / LTV | Cost to win a customer / value of a customer over time |
| Activation | Reaching a first meaningful moment of value |
| Retention / churn | Staying / leaving |
| HEART | Google's UX metrics framework |
| North Star metric | The single key metric for user value |
| RICE | A prioritization score |
| Kano model | Basic, performance and delight features |
| ROI | Return on investment |

## Quick check

:::check Knowledge check 1
Total signups went up 50%, but revenue didn't change. What might be happening?
---
Signups may be a vanity metric here. New users might not be activating or converting to paid. Look at activation, retention and conversion for the new signups, and check where the extra traffic came from.
:::

:::check Knowledge check 2
In B2B, why might a beautiful experience for daily users still fail to win a deal?
---
Because the buyer and decision-maker are often different people with different needs (security, admin controls, integrations, price). The product has to satisfy them too.
:::

:::check Knowledge check 3
A feature scores high on reach and impact but has 30% confidence. What should you do?
---
Low confidence means you're mostly guessing. Before building, run discovery or a cheap test to raise confidence. Then re-score.
:::

- McKinsey, *The Business Value of Design* (read with care: correlational).[[ref:mckinsey-design]]
- SVPG on product risks.[[ref:svpg-risks]]
- Product Talk on outcomes and discovery.[[ref:product-talk]]
