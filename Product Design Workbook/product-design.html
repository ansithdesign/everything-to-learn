`,"./content/modules/07-communication-storytelling.md":`Two designers pitch the same idea in the same meeting. Designer A walks through a ten-slide double diamond: research, ideation, wireframes, iterations. Designer B opens with "I need a decision today: A or B? Here's the evidence, here's what I recommend, here's what could go wrong."

Same idea. B gets the green light in fifteen minutes. A gets "let's circle back."

Communication isn't a soft add-on to design. It's how your thinking becomes other people's action, and a good designer who explains decisions clearly will often have more influence than a great one who can't. Decisions get made in meetings, documents and chat threads you may not even be in. Your words have to work without you.

We'll cover presenting, writing, critique and facilitation. And we'll deal with something new: how to communicate well when AI can draft anything, and your audience may wonder who made what.

:::pull
In any presentation, document or critique, your job is to make the next decision easier for the other person. If it doesn't, it isn't finished.
:::

## 1. Presenting

### Know what it's for

Every presentation does one of a few jobs: **inform**, **align**, **get a decision**, **get feedback** or **inspire**. Decide which before you open the slides, and say it in the first thirty seconds: "I need a decision today on A vs. B" changes how everyone listens.

### A structure for decisions

1. **Context and goal:** what we're trying to achieve and why now.
2. **The problem, with evidence:** a number, a quote or a short clip.
3. **Options considered:** two or three, with trade-offs.
4. **Recommendation and why,** in terms the audience cares about.
5. **Risks and unknowns,** and how we'd learn.
6. **The ask and next steps:** the decision you need, who does what, by when.

This follows the "answer first" habit, often called the pyramid principle: lead with the conclusion, then support it, instead of making people wait through your journey.

:::framework Present decisions, not process
Portfolio habit says show the whole process. Stakeholders mostly want the **decision and its reasoning**. Show process only where it makes the recommendation credible (the evidence that changed your mind). Keep the full story for people who ask.
:::

### Storytelling with evidence

A story is a person with a goal, an obstacle and a result. Use it to *carry* evidence, not replace it.

- **Combine a number, a quote and a visual.** Number for scale, quote for a person, visual for the problem. Each persuades a different listener.
- **Show a person, not a persona.** Ninety seconds of one participant struggling beats a slide of statistics.
- **Name the stakes.** What happens if we do nothing?
- **Be honest about uncertainty.** Say the strength of the evidence (see [[ch:04]]) and what would change your mind.

### Delivery

Lead with the point. Fewer slides, fewer words (if the slide could be read, put it in a document). Rehearse the first minute and answers to the three hardest questions. Invite disagreement early: "What would make this a bad idea?" Remote: share one link in advance and check in every few minutes.

### 2026 shifts

- **Anyone can make a polished deck.** Polish no longer signals thinking. Clarity of the problem and quality of the recommendation do.
- **Meeting notes and summaries are automatic,** so your words get compressed. Say your key point plainly and repeat it.
- **Say what's generated.** If you include AI-generated imagery, summaries or prototypes, flag it where it matters, especially where the audience could mistake generated content for observed fact.

:::exercise Try it: the two-minute decision brief (30 minutes)
Pick a design decision. Record yourself giving it in two minutes using the six parts above. Play it back and write the one sentence the audience should remember. Can't find it? Rewrite. Then deliver it to a colleague and ask what they'd have asked next.
:::

## 2. Written communication

Teams are more distributed, work is more asynchronous and written records outlast conversations. Good writing scales: one clear memo informs ten people and is still there next quarter.

### Principles

- **Start with what you need.** First line: purpose and ask.
- **One point per paragraph, short sentences, plain words.**
- **Write for someone who wasn't there.**
- **Make it skimmable:** headings, short lists, bold for the decision (not decoration).
- **Link, don't paste,** and say what to look at.

### The documents you'll write

| Document | Purpose | Key contents |
| --- | --- | --- |
| Decision memo | Get or record a decision | Context, options, recommendation, risks, decider |
| Spec or handoff note | Let others build | Behavior, states, edge cases, content, acceptance criteria |
| Project brief | Align before work starts | Problem, users, goals, constraints, success measures, timeline |
| Research summary | Share findings | Question, method, findings with strength, recommendations |
| Status update | Keep people informed | What changed, what's next, what's blocked, what you need |
| Chat message | Ask or answer quickly | A complete, self-contained ask |

:::example A good chat ask
"Can you confirm by Thursday whether the export limit is 10,000 or 50,000 rows? It decides whether we need pagination in the design (draft: link). If you don't know, who would?" It names the question, deadline, reason and fallback, and saves a round trip.
:::

**Async etiquette:** state urgency, use threads, don't send a lone "hi" and wait. When a conversation reaches a decision, write it up and tag the people it affects.

### 2026 shifts

- **First drafts are instant and sameness is common.** Generated text is fluent and generic, and readers notice. Use AI to structure, shorten and check, but write the core argument yourself so it carries your reasoning and voice.
- **Verify facts and numbers.** Models state wrong things confidently, including details of a competitor's product or a statistic.
- **Mind confidentiality.** Don't paste sensitive material into tools you aren't authorized to use.
- **Machines read your docs too.** Specific, well-structured documents are what tools use when they act on your behalf (see [[ch:03]]).

:::exercise Try it: cut a document in half (1 hour)
Take a spec or update you wrote. Rewrite it at half the length without losing a decision, with the ask in the first line. Ask a reader who wasn't involved what they think it's asking for.
:::

## 3. Critique

A design critique is a structured conversation to improve work against its goals. It's not a vote, an approval meeting or a place to share taste. Good critique has four ingredients: **goals**, **specific observations**, **reasoning** and **actionable direction**.

### Structures that help

- **"I like, I wish, what if."** Attributed to Stanford's d.school: say what works, what falls short, and offer an alternative as a question. It makes criticism collaborative and easier to hear.[[ref:i-like-i-wish]]
- **Observation, impact, suggestion.** "Primary and secondary buttons have the same weight (observation), so it's unclear which action moves forward (impact); could the secondary be an outline style (suggestion)?"
- **Actionable vs. preference.** "I don't like green" is preference. "The green on white fails contrast at 3:1" is actionable.
- **Talk about the work, not the person.** Go easy on "you."

### Giving critique

1. Restate the goal first and critique against *it*.
2. Be specific: point to the element.
3. Say the effect on the user or goal.
4. Offer a direction, not a mandate.
5. Ask when unsure ("What led you to this layout?").
6. Say what's working, so people know what to keep.

### Receiving critique

- Listen first, defend later, and write it down.
- Ask clarifying questions. The concern behind a suggestion is often more useful than the suggestion.
- You decide what to act on. Be ready to explain what you didn't take, and why.
- Look for patterns: three people stumbling in the same place matters even if each suggests a different fix.

### Running a good session

State the goal and the *kind* of feedback you want ("only the flow, not the visual style yet"). Share materials beforehand. Give the designer a few minutes to frame it, then let people write silently before discussing so louder voices don't dominate. Capture feedback in one place and end with what the designer will take away.

### 2026 shifts

- **AI critique tools exist.** They can catch inconsistencies, contrast failures and missing states, so they make a fast first pass. They don't know your users or strategy, and they tend to be agreeable. Use them for mechanical checks, never as validation.
- **Critiquing generated work is a core skill.** When a tool makes ten options in a minute, value moves to judging them well. The vocabulary in [[ch:01]] applies directly.
- **Remote critique needs structure.** Written, asynchronous critique with time to think often beats a rushed call.

:::exercise Try it: run a structured critique (30 minutes)
Ask for ten minutes of critique on work in progress. State the goal and the type of feedback you want, use "I like, I wish, what if," then sort feedback into actionable vs. preference and write what you'll change and what you won't, with reasons.
:::

## 4. Facilitation

Facilitation is guiding a group to a result it couldn't easily reach alone, without imposing your own answer. The facilitator owns the **process**, not the content.

### Design the session first

1. **Purpose:** why are we meeting, what will be different after?
2. **Outcome:** a concrete result (ranked list, decision, shared map).
3. **Participants:** who must be there?
4. **Agenda with timing,** alternating **diverging** (many options) and **converging** (choosing).
5. **Methods** that fit the outcome.
6. **Decision rule:** consensus, vote, named decider?
7. **Follow-up:** who does what, by when, where results live.

| Goal | Activities |
| --- | --- |
| Align on a problem | Problem framing, "how might we," assumption mapping |
| Generate ideas | Silent brainstorming, crazy eights, "worst idea" |
| Choose | Dot voting, impact/effort mapping, criteria scoring |
| Understand an experience | Journey mapping, service blueprinting |
| Plan | Story mapping, roadmapping |

The **design sprint**, developed by Jake Knapp and colleagues at Google Ventures, compresses problem definition, sketching, decision, prototyping and testing into one week.[[ref:gv-sprint]] It's great for high-stakes ideas when you can gather the right people, and overused when a smaller exercise would do.

### Techniques that work

- **Silent writing before discussion** equalizes participation and stops anchoring on the first voice.
- **Timebox visibly.**
- **Make quiet people count:** ask directly, use rounds and written input.
- **Park off-topic items** in a visible list.
- **Name the decision rule before the debate,** not after.
- **Redirect dominant voices** kindly: "Thanks, let me hear from others first."

:::warning Common trap: workshops aren't research
A room of colleagues generating ideas builds alignment and energy. It can't produce knowledge about users who aren't in the room. Use workshops to align and generate; use research to verify.
:::

### 2026 shifts

- **Remote and hybrid are normal.** Fewer activities, pre-reads and shorter sessions work better.
- **AI notes reduce the load on a note-taker,** freeing you to facilitate. Review the summary before it circulates, because it can flatten disagreement or misattribute decisions.
- **AI as a participant:** models can widen the option set or play devil's advocate. Use them to broaden, then bring the group's judgment to choose.

:::exercise Try it: plan and run a 60-minute session (half a day)
Pick a real question ("What should we fix first in onboarding?"). Write purpose, outcome, agenda with times, activities and decision rule on one page. Run it with four to six colleagues, then note what you'd change.
:::

## Case: one update, three ways

The same project update can land very differently. Here's a status message about a delayed redesign.

**Version A: the diary.**
> "Hey! Quick update. This week we continued exploring layouts, had a few good sessions with engineering, looked at a bunch of options, and we're still iterating. Should have more soon!"

Nothing to act on, nothing to decide, no sense of risk. The reader learns only that work is happening.

**Version B: the apology.**
> "Sorry, we're running late. There were some unexpected issues and it's taking longer than we thought. We'll try to catch up."

Honest, but it hands the reader a worry without a plan.

**Version C: the useful update.**
> **Status: yellow. Release moves from 12 Nov to 19 Nov unless we cut scope.**
> **Why:** engineering found that the new table can't support inline editing with our current data layer (est. +4 days).
> **Options:** (1) ship with read-only table on 12 Nov, add inline editing in the next release; (2) keep inline editing and ship 19 Nov.
> **Recommendation:** option 1, because 80% of usage in research was read-only.
> **I need from you:** a decision by Thursday so we can plan QA.

Same facts, but C names the status, the cause, the options, a recommendation and the exact ask. A reader can respond in ten seconds.

## A decision memo template

\`\`\`text
DECISION NEEDED:  [one sentence, with a date]
CONTEXT:          [3 to 5 lines: what's happening and why now]
OPTIONS:
  A. [what it is]  → pros / cons / cost
  B. [what it is]  → pros / cons / cost
RECOMMENDATION:   [A or B, and the reason in one or two lines]
EVIDENCE:         [numbers, quotes, links; label strength]
RISKS / UNKNOWNS: [what could go wrong, how we'd find out]
NEXT STEPS:       [who does what by when once decided]
\`\`\`

Keep it to one page. If it doesn't fit, you probably haven't decided what you're recommending.

## A deck, slide by slide

For a 15-minute readout of a research study, a tight structure looks like this:

| Slide | Content | Time |
| --- | --- | --- |
| 1 | The decision we need today and what we recommend | 1 min |
| 2 | What we did and how confident we are (method, who, strength of evidence) | 1 min |
| 3 to 5 | Top three findings, each as: claim, evidence (number plus quote or clip), implication | 6 min |
| 6 | What we're *not* sure about | 1 min |
| 7 | Options and recommendation | 2 min |
| 8 | Next steps and owners | 1 min |
| Rest | Discussion | 3 min |

Notice the answer is on slide 1. The rest justifies it.

## Critique phrases

| Instead of... | Say... |
| --- | --- |
| "I don't like it." | "The goal is X; I think this weakens it because Y." |
| "Make it pop." | "Which action should stand out most? Right now two compete." |
| "It's too busy." | "I count five competing focal points; which two matter most?" |
| "This is wrong." | "What led you to this choice? I'd have expected X." |
| "You should..." | "What if we tried...?" |
| "Looks good!" (and nothing else) | "The grouping works well because... one thing I'd test is..." |

## A 90-minute workshop

| Time | Activity | Output |
| --- | --- | --- |
| 0:00 | Frame: goal, constraints, decision rule (5 min) | Shared understanding |
| 0:05 | Review evidence in silence (10 min) | Everyone has read the same facts |
| 0:15 | Silent writing: "problems I see" (10 min) | A pile of individual notes |
| 0:25 | Cluster notes together (15 min) | Named themes |
| 0:40 | Dot vote on themes (5 min) | Ranked list |
| 0:45 | Break (5 min) | |
| 0:50 | For the top three themes: "how might we..." (15 min) | Open-ended questions |
| 1:05 | Impact and effort plotting (15 min) | A shortlist |
| 1:20 | Decide: who owns what, by when (10 min) | Decisions and owners |

Send the outcome to everyone within 24 hours. A workshop that ends without next steps was a very nice meeting.

## Where to go deeper

- **Visual communication:** simple diagrams, annotated screenshots and short walkthrough videos often beat prose.
- **Difficult conversations and negotiation** (see [[ch:08]]).
- **Writing for executives:** short, outcome-oriented, one clear ask.
- **Cross-timezone communication:** plain language and written decisions, without assuming shared context.
- **Communicating AI-assisted work honestly:** disclose when it matters, verify, keep a record.

## Quick check

:::check Knowledge check 1
A stakeholder says "I don't like the layout, make it pop." How do you respond?
---
Ask what they're trying to achieve and what they notice, to turn preference into a goal ("Is the concern that the main action isn't prominent enough?"). Restate the project goal and offer one or two concrete options tied to it. This moves from taste to purpose and gives you something to act on and test.
:::

:::check Knowledge check 2
An AI note-taker's summary says your workshop *decided* something that was only discussed. What do you do?
---
Correct it before it circulates. Check against what actually happened, mark items as decided, open or proposed, name an owner and date, and send the corrected version. Treat AI summaries as drafts: they can flatten disagreement and misattribute decisions.
:::

`,"./content/fundamentals/07-communication-storytelling.md":`Designers often say "the work should speak for itself." It rarely does. A design gets built, changed or killed based on how well people understand the thinking behind it, and that understanding comes from how you present, write, give feedback and run sessions.

This edition explains the foundations of design communication: storytelling, presenting, writing, critique and facilitation.

:::pull
Your design is only as strong as people's understanding of it.
:::

## Why communication matters

Designers communicate with many audiences, each needing something different:

| Audience | What they care about | What to emphasize |
| --- | --- | --- |
| Product managers | Outcomes, scope, timelines | Problem, trade-offs, impact |
| Engineers | Feasibility, details, edge cases | Behavior, states, constraints |
| Executives | Business results, risk | The decision, the evidence, the ask |
| Other designers | Craft, consistency, rationale | Reasoning, system fit |
| Users and stakeholders | Their own needs | Clarity, benefits |

Good communication means adapting the same idea for different people.

## Storytelling

### Why stories work

People remember stories far better than lists of facts. A story gives information a shape: someone wants something, something gets in the way, something changes. That structure helps listeners follow, care and remember.

### Basic story structure

The classic three-act structure fits design presentations well:

1. **Setup:** the context and the person. "Priya manages a team of 12 and needs to know who's overloaded."
2. **Conflict:** the problem. "Today she checks five tools and still guesses."
3. **Resolution:** the change your design creates. "With the workload view, she sees it at a glance and rebalances in minutes."

### Other useful structures

- **Situation, Complication, Resolution (SCR):** from consulting; quick and logical.
- **Before, After, Bridge:** what life is like now, what it could be, how your design gets there.
- **The hero's journey (simplified):** the user is the hero; your product is the guide, not the hero.

### Making data persuasive

Combine three kinds of evidence:

- **A number** shows scale ("40% abandon at this step").
- **A quote** shows a person ("I just gave up and called support").
- **A visual or clip** shows the problem happening.

Each convinces a different kind of listener.

## Presenting design work

### Know your goal

Before any presentation, decide what you need:

- **Inform:** share progress or results.
- **Get feedback:** on specific parts.
- **Align:** get everyone on the same page.
- **Get a decision:** choose between options.

Say it at the start: "Today I need a decision between these two directions."

### A reliable structure

1. **Goal and context:** what we're solving and why.
2. **Users and problem:** who is affected, with evidence.
3. **Approach:** what you explored, briefly.
4. **The design:** walk through it as a user would experience it.
5. **Rationale:** why this solution, linked to goals and evidence.
6. **Trade-offs and open questions.**
7. **Next steps and the ask.**

### The pyramid principle

Barbara Minto's **pyramid principle** says: lead with the main point, then the supporting arguments, then the details. Busy audiences get the answer immediately and can dig deeper if they want.

### Presenting tips

- Walk through flows from the user's point of view, not screen by screen.
- Use real content, not "lorem ipsum."
- Show the important states (empty, error), not just the perfect one.
- Explain *why*, not just *what*.
- Prepare for the hardest three questions.
- Pause and invite questions; silence is fine.
- Remote: share links in advance, keep slides simple and check in often.

### Handling tough feedback

- **Listen fully** before responding.
- **Ask clarifying questions:** "What concerns you about it?"
- **Connect back to goals:** "We chose this because it reduces errors, which was our main goal."
- **It's okay to say** "Good point, let me look into it."

## Written communication

### Why writing matters

Teams increasingly work across time zones and asynchronously. Clear writing lets decisions happen without meetings and leaves a record.

### Principles of clear writing

1. **Lead with the point.** State the main message or ask first.
2. **Know your reader.** What do they already know? What do they need?
3. **Use plain language.** Short sentences, common words, no jargon.
4. **Structure for scanning.** Headings, bullets, bold key phrases.
5. **Be specific.** "Increase setup completion from 40% to 50%" beats "improve onboarding."
6. **Edit ruthlessly.** Most first drafts can lose a third of their words.

### Common design documents

| Document | Purpose | Typical contents |
| --- | --- | --- |
| Design brief | Align before starting | Problem, goals, users, constraints, success metrics |
| Design spec / handoff | Explain how something works | Flows, states, behavior, edge cases |
| Research report | Share findings | Questions, method, findings, recommendations |
| Decision record | Record why a choice was made | Context, options, decision, reasoning |
| Release notes | Tell users what changed | What's new, why it helps |
| Status update | Keep people informed | Progress, risks, next steps, needs |

### Chat and email

- Make messages **self-contained**: include context, the question and any deadline.
- Don't just say "hi" and wait; ask your question directly.
- Use threads to keep conversations organized.
- Summarize decisions in writing so everyone knows what was agreed.

### UX writing vs. design writing

**UX writing** (or content design) is the text inside the product: buttons, labels, error messages, onboarding. **Design writing** is how you communicate about your work. Both use the same core principle: clarity first.

## Critique

### What critique is (and isn't)

A **design critique** is a structured conversation to improve a design against its goals. It is *not*:

- A vote on what people like.
- An approval meeting.
- A place to redesign someone's work for them.

### Roles in a critique

- **Presenter:** shares the work, the goals and what feedback is needed.
- **Critics:** give focused, constructive feedback.
- **Facilitator:** keeps time, keeps the discussion on track and makes sure everyone is heard.

### Giving good feedback

Good feedback is:

- **Tied to goals:** "Since the goal is speed, the extra step might slow people down."
- **Specific:** point to the exact element.
- **Explained:** say *why* it matters.
- **Actionable:** suggest a direction, not a mandate.
- **Balanced:** mention what works as well as what doesn't.

Useful formats:

- **I like, I wish, what if:** what works, what could be better, an idea to explore.[[ref:i-like-i-wish]]
- **Observation, impact, suggestion:** what you see, why it matters, what might help.
- **Question first:** "What led you to this layout?" before suggesting changes.

### Actionable vs. preference

| Preference (less useful) | Actionable (more useful) |
| --- | --- |
| "I don't like the blue." | "The blue link has low contrast against the gray background." |
| "It feels cluttered." | "Five elements compete for attention at the top; the main action gets lost." |
| "Make it pop." | "The primary action doesn't stand out from the secondary ones." |

### Receiving feedback well

- **Listen without defending** at first.
- **Take notes.**
- **Ask questions** to understand the concern behind a suggestion.
- **Separate yourself from the work:** feedback is about the design, not you.
- **You decide what to act on,** but explain your reasoning.

## Facilitation and workshops

### What facilitation is

**Facilitation** is guiding a group to reach a goal together. The facilitator manages the *process* (time, activities, participation), not the *content*.

### Planning a workshop

1. **Purpose:** why are we meeting?
2. **Outcome:** what will we have at the end (a list, a decision, a map)?
3. **Participants:** who needs to be there?
4. **Agenda:** activities with timings.
5. **Materials:** boards, templates, pre-reads.
6. **Follow-up:** how results will be shared and used.

### Diverge, then converge

Good workshops alternate between:

- **Diverging:** generating many ideas without judging.
- **Converging:** evaluating, grouping and choosing.

Mixing the two at the same time ("let's brainstorm, but only good ideas") kills creativity.

### Common workshop activities

| Activity | What it does |
| --- | --- |
| Icebreaker | Warms up the group |
| How might we | Turns problems into opportunities |
| Crazy 8s | Each person sketches 8 ideas in 8 minutes |
| Affinity mapping | Groups ideas or findings into themes |
| Dot voting | Each person gets a few votes to prioritize |
| Impact/effort matrix | Prioritizes ideas visually |
| Journey mapping | Maps a user's experience together |
| Lightning demos | Quick sharing of inspiring examples |
| Rose, thorn, bud | Reflection: what's good, bad, promising |

### Design sprints

The **design sprint**, created at Google Ventures, is a five-day process to answer a critical question through design, prototyping and testing:[[ref:gv-sprint]]

| Day | Focus |
| --- | --- |
| Monday | Map the problem and pick a target |
| Tuesday | Sketch competing solutions |
| Wednesday | Decide on the best ideas |
| Thursday | Build a realistic prototype |
| Friday | Test with real users |

It works best for big, risky questions where a small team can commit fully for a week.

### Facilitation techniques

- **Silent work first:** individuals write ideas before discussing, which prevents the loudest voice from dominating.
- **Timeboxing:** keep activities to fixed times.
- **Parking lot:** capture off-topic ideas for later.
- **Round robin:** go around so everyone speaks.
- **Clear decision rules:** decide in advance how decisions are made (vote, consensus, decider).

### Remote facilitation

- Use a shared online whiteboard.
- Send instructions and links in advance.
- Keep sessions shorter and take breaks.
- Use chat and reactions for quieter participants.
- Summarize outcomes in writing afterwards.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Pyramid principle | Lead with the main point, then support it |
| SCR | Situation, Complication, Resolution |
| Design critique | Structured feedback against goals |
| Actionable feedback | Specific, goal-linked, explained |
| Facilitation | Guiding a group's process toward a goal |
| Diverge / converge | Generate ideas / narrow them down |
| Dot voting | Simple group prioritization |
| Design sprint | A five-day process to test an idea |
| Decision record | A written record of a decision and why |

## Quick check

:::check Knowledge check 1
An executive has five minutes. How should you structure your update?
---
Lead with the answer or decision you need (pyramid principle), then the key evidence and impact, then risks and next steps. Keep details available if they ask.
:::

:::check Knowledge check 2
Turn "I don't like this page" into actionable feedback.
---
Make it specific and goal-linked, for example: "Since the goal is to get users to upgrade, the upgrade button is hard to find because it looks the same as the secondary links. Could it be more prominent?"
:::

:::check Knowledge check 3
Why do workshops separate diverging from converging?
---
Judging ideas while generating them makes people self-censor and reduces creativity. Generating first and evaluating later produces more and better options.
:::

`,"./content/modules/08-collaboration-leadership.md":`Here's a pattern you'll recognize. The designer finishes a gorgeous flow. Engineering says it's three sprints of work. Product says the deadline is in two. A VP who saw an early sketch has opinions. Nobody is wrong, and nothing ships the way it was drawn.

No design file can fix that. Only collaboration, expectations and decisions can.

As you grow, your impact depends less on how well you draw and more on how well you get good decisions made across an organization, including decisions in rooms you're not in. This chapter covers working across functions, managing stakeholders, mentoring others and deciding as a group, plus what's changing as AI reshapes teams.

:::pull
Influence isn't authority. Most of the time you have the first and not the second, and that's a skill you can learn.

## 1. Working across functions

### Who you work with

| Partner | What they care about | What helps them |
| --- | --- | --- |
| Product manager | Outcomes, priorities, timelines, stakeholder demands | Evidence, trade-offs, clear recommendations |
| Engineer | Feasibility, quality, maintainability, estimates | Early involvement, clear specs, realistic scope, respect for constraints |
| Researcher | Rigor, evidence, impact | Time and access to users, shared questions |
| Content designer | Clarity, voice, consistency | Involvement before layout is fixed |
| Data analyst | Valid measurement | Clear questions and defined events |
| Legal, security | Risk | Early notice and plain explanations |
| Support, sales | Customer reality | Being heard, and seeing that feedback matters |

### Principles that make it work

- **Involve people early.** The best time to discover a technical constraint is *before* you design around it.
- **Share the problem, not only the solution.** People who understand why solve it better than people handed a spec.
- **Make decisions visible.** Where is the decision recorded, and who made it?
- **Define decision rights.** Disagreement is more manageable when it's clear whose call it is.
- **Work in the open.** Share work in progress. It builds trust and catches problems early.
- **Ask about constraints.** "What makes this hard?" gets further than "why can't we?"

### The engineer relationship

A strong designer–engineer relationship is often the biggest single lever on the quality of what ships. What helps:

- **Pair early** on feasibility and approach, before the design is locked.
- **Learn the stack** well enough to discuss constraints (see [[ch:10]]).
- **Agree what "done" means,** including states, accessibility and responsive behavior.
- **Review the build together** and treat differences as shared issues, not blame.
- **Make trade-offs explicit.** If something has to be cut, decide together what the user loses.

:::framework A working agreement
Write a short agreement on how you work together: how and when each discipline gets involved; where decisions are recorded; how design and engineering review work in progress; what "ready to build" and "done" mean; how you handle disagreement and escalation; how you use AI tools. Revisit it every quarter.
:::

### 2026 shifts

- **Roles are blurring.** Designers prototype in code, engineers use AI for interface work, PMs generate prototypes. One secondary survey summary says many designers do more work overlapping with product and engineering, and Figma's State of the Designer 2026, as relayed through secondary coverage, reports designers' participation in development doubling in a year. Neither figure is verified here.[[ref:musemind-ai-ux]][[ref:figma-sotd-2026]] The practical implication is clarity about who owns the quality of what: when anyone can build a prototype, who's accountable for the shipped result?
- **Smaller teams do more.** NN/g reports team sizes holding steady or possibly growing, but more asked of each role.[[ref:nng-state-ux-2026]] Breadth helps, but depth in your craft is why you're trusted.
- **Agree how the team uses AI:** who uses which tools, what data may go into them, how generated work is reviewed and who's accountable. Decide it together, not alone.

:::exercise Try it: a working agreement (1 hour)
Draft a one-page agreement covering involvement, decisions, done, disagreement and AI use. Share it and ask each partner what they'd change. Revisit in a month.
:::

## 2. Stakeholder management

Stakeholders are anyone who can affect or is affected by your work: executives, product leaders, sales, support, legal, other teams. They differ in power (can they stop the work?), interest (do they care?) and incentives (what are they measured on?).

### A simple method

1. **Map them.** List who they are, their interest, influence and what they're measured on. Who decides? Who must be consulted? Who needs to be informed?
2. **Understand their problem.** A feature request is usually a solution to a problem you haven't heard yet.
3. **Set expectations early and often.** Surprise is what damages trust.
4. **Bring evidence and options,** not opinion contests.
5. **Give people a role** at the right moment and explain how their input was used.
6. **Close the loop,** especially when you didn't take their suggestion.

### Saying no, well

A pattern that works: **acknowledge the goal** ("You want to cut the time people spend on this report"), **state the trade-off** ("All twelve filters would delay release by three weeks and make the page harder to scan"), **offer an alternative** ("Launch with the three most used and measure the rest"), and **say what you need** ("If you want all twelve, which other item do we drop?").

### Conflict and loud voices

- **Separate the person from the position** and look for the concern behind a demand.
- **Escalate by deciding who decides,** not by going around people. If two stakeholders disagree, bring them together with the evidence and a recommendation, or ask the decision owner.
- **Use shared goals:** "We both want fewer support tickets; here's what the data says."
- **Disagree and commit.** Once decided, support it, and record your concern so the team can learn from the result.

:::warning Common trap: surprising people in public
Introducing a major change for the first time in a big meeting forces defensive reactions. Pre-wire: talk to key people one-to-one first so the meeting is for deciding, not first reactions.
:::

:::exercise Try it: map stakeholders for a project (1 hour)
List every stakeholder, what they're measured on, what they want, their influence and current support. Pick the two most important relationships and plan one conversation for each: what you'll ask and what you'll offer.
:::

## 3. Mentoring

Mentoring is helping someone grow faster than they would alone. It differs from managing (which includes performance and accountability) but uses similar skills, and at senior levels it's part of the expectation.

### Doing it well

- **Start with their goals.** What do they want to be able to do in a year?
- **Coach more than you advise.** Ask questions that help them think ("What are you noticing? What options do you see?"). Offer your view when asked or when it saves real pain.
- **Give specific, timely feedback** in the structures from [[ch:07]].
- **Teach judgment, not just steps.** Explain why you chose something and what you looked at.
- **Stretch with support.** Give a bit more scope than is comfortable, and stay available.
- **Share your mistakes.** It makes learning normal.
- **Make a growth plan** with two or three concrete goals, reviewed monthly.

When you delegate, define the outcome, constraints and check-in points, not the method. Resist taking the work back when it's not done your way.

### 2026 shifts

- **Entry-level roles are scarce.** NN/g's State of UX 2026 says senior and generalist roles are recovering faster than entry-level positions, which stay scarce and competitive.[[ref:nng-state-ux-2026]] That makes every junior designer's development more valuable.
- **AI is a shortcut and a risk for learning.** A junior can produce plausible work without understanding why it works. Ask them to explain decisions, critique generated options against stated criteria (see [[ch:01]] and [[ch:12]]) and do some work the slow way to build the underlying skill.
- **Teach what AI doesn't replace:** problem framing, research, critical thinking, communication and taste. Pair juniors on research and stakeholder conversations, not just production.
- **Mentor both ways.** Juniors are often more fluent with new tools. Learn from them, and say so.

:::exercise Try it: a growth conversation (1 hour)
Meet a colleague who wants to grow. Ask what they want to be doing in a year, what feels hard and what they want from you. Agree two goals and a monthly review. Afterwards note when you were coaching and when you were advising.
:::

## 4. Group decisions

[[ch:07]] covers facilitation as a craft. In leadership, the question is *how decisions actually get made.*

### Decision rights

Most friction comes from not knowing who decides. Frameworks like DACI (driver, approver, contributors, informed) and RAPID give a vocabulary, and their value is forcing the team to name roles, not the acronym. Before any significant decision: name the decider, state the rule, set a deadline, record the outcome and reasoning.

:::decision Choosing a decision rule
Use **consensus** rarely, for decisions that need everyone's full support. Use **consent** (anyone can object with a reason; otherwise we proceed) for most team decisions. Use **a named decider after input** when speed matters or responsibility is clear. Use a **vote** to prioritize many options, not to settle contested principles.
:::

### Decision records

A short written record (context, options, choice, reasons, date) saves repeated debate, helps new people understand why things are the way they are and protects you when a choice is questioned later.

### Leading without authority

You can lead a decision without being the manager: **frame the problem** so others see it the same way, **prepare the options** and trade-offs, **facilitate** so quieter perspectives are heard, **propose a recommendation** and ask for objections, and **follow through** (write it up, assign next steps, check progress).

Growth can mean deeper craft and wider influence (senior, staff, principal) or leading people (manager, director). They're different jobs, so try the early parts of each (mentoring, leading a project, running a team ritual) before choosing.

### 2026 shifts

- **Decisions move faster with less context.** With generated options and summaries it's tempting to decide quickly on plausible material. Slow down for high-impact or hard-to-reverse choices and check the evidence.
- **Accountability for AI-assisted decisions stays with people.** If a tool proposed it and a person approved it, the person owns it. Record what the tool was asked and what you verified.

:::exercise Try it: write a decision record (30 minutes)
Take a recent product decision. Write half a page: context, options, choice, reasons, who decided and the date. Ask someone who wasn't involved whether they could explain the decision from it alone.
:::

## Case: a disagreement, resolved

Here's a situation you'll live through several times a year. You've designed an inline-editing table. The engineering lead says it's too expensive for this release and proposes a modal editor instead. You think the modal will hurt the core workflow. The conversation gets tense.

**What not to do.** Defend the design harder, escalate to the PM, or quietly redesign around the engineer's back.

**A better path.**

1. **Get curious about the constraint.** "Help me understand what makes inline editing expensive here." You learn the data layer can't validate per cell, so each edit would need custom plumbing, about nine days.
2. **Restate the shared goal.** "We both want people to update many records quickly without errors."
3. **Separate the need from the solution.** The need: fast, low-error bulk edits. Inline editing is one way. A modal is another. Are there others?
4. **Generate options together.** (A) Modal editor, 2 days, slower for bulk edits. (B) Inline editing, 9 days. (C) Inline editing for the two most-edited columns only, 4 days, modal for the rest. (D) Bulk edit panel with multi-select, 5 days.
5. **Use evidence.** From research: 70 percent of edits touch two columns. That makes C attractive.
6. **Decide with a clear rule.** The PM, as decider, picks C after hearing both sides. You commit.
7. **Record it.** A short decision note: context, options, choice, reasons, plus "revisit after we see usage data in six weeks."
8. **Close the loop.** Share the result with the engineer. Credit the idea that came from the conversation.

The outcome is better than either starting position, and the relationship is stronger. That's the pattern: curiosity, shared goal, options, evidence, a clear decider and a record.

## Stakeholder map, filled in

Here's what a real map looks like for a hypothetical "redesign billing" project:

| Stakeholder | Measured on | What they want | Influence | Current stance | Plan |
| --- | --- | --- | --- | --- | --- |
| VP Product | Revenue growth | Fewer plan-change drop-offs | High | Supportive | Weekly 10-min update with metrics |
| Head of Finance | Billing accuracy, audits | No errors in invoices | High | Cautious | Walk through edge cases early; get sign-off on invoice layout |
| Support lead | Ticket volume | Fewer "why was I charged" tickets | Medium | Eager | Co-review copy; share ticket themes |
| Engineering lead | Delivery, stability | Small, safe scope | High | Neutral | Pair on feasibility in week one |
| Legal | Compliance | Correct tax and terms wording | Medium | Unknown | Ask for requirements before the design is final |

The "Plan" column is the useful part. The map isn't for filing; it's for deciding who you talk to this week.

## A script for saying no

> "Thanks for flagging this. I want to make sure I understand the goal: [restate their goal]. Here's what I see: adding all twelve filters would push the release by about three weeks and make the page harder to scan for most people. What I'd suggest is launching with the three filters that cover most use, measuring the rest and adding them if the data shows demand. If twelve is a hard requirement, tell me which other item we should defer, and I'll update the plan."

Why it works: it opens with the goal, states a concrete trade-off, offers a path, and puts the choice back with the person who owns it.

## A growth conversation

Use this for a 45-minute one-to-one with a designer you mentor:

| Segment | Prompts |
| --- | --- |
| Where you are (10 min) | "What's going well? What's frustrating? What are you proud of lately?" |
| Where you want to go (10 min) | "In a year, what do you want to be doing? What would make you feel you've grown?" |
| Gaps and options (15 min) | "What skills would get you there? What opportunities exist on current projects?" |
| Commitments (10 min) | "Two goals for the next quarter. What support do you need from me? When do we check in?" |

Afterward, write a short summary and send it. The act of writing makes it real.

## Team AI norms

If your team hasn't talked about AI use, start with a one-pager:

- **Allowed tools:** which are approved, and for what kinds of work.
- **Data rules:** what may never be pasted (customer data, unreleased plans, personal information).
- **Review rules:** generated work is reviewed like anyone's work, and the person who ships it owns it.
- **Disclosure:** when we say AI was used (client work, research, imagery).
- **Learning:** we share what worked and what failed, monthly.
- **Review date:** we revisit this in three months, because tools change.

## Where to go deeper

- **Difficult conversations:** state the facts, the impact, your intent and an invitation.
- **Feedback to people more senior than you:** frame around shared goals, be specific.
- **Managing up:** make your manager's job easier with clear priorities, risks and asks.
- **Design operations:** the rituals, tools and processes that help a team run smoothly, including how AI tools are chosen and governed.
- **Inclusion in teams:** whose voice isn't being heard, and what could change that.

## Your next four weeks

| Week | Focus | You'll have |
| --- | --- | --- |
| 1 | A working agreement and a stakeholder map | A shared one-pager and two planned conversations |
| 2 | Saying no with the four-part pattern, for a real request | A written response |
| 3 | Two mentoring or growth conversations | Goals and a review cadence agreed |
| 4 | A decision record plus a team AI-use agreement | Two records and a short policy trialled |

## Quick check

:::check Knowledge check 1
A senior executive asks for a feature you think is wrong. What do you do?
---
Find the goal behind the request, share your evidence, and show options and trade-offs including what the feature costs in time and in the experience. Offer an alternative that serves their goal and a small test to learn more. If the decision goes against your advice, disagree and commit, record your concern and agree how you'll measure the result so the team learns either way.
:::

:::check Knowledge check 2
A junior designer brings a polished AI-generated concept but can't explain why it works. How do you coach them?
---
Ask them to evaluate it against stated criteria (hierarchy, grouping, accessibility, consistency, task fit), name the decisions and the alternatives they rejected and test it with a user or colleague. Then have them do part of the next piece without the tool to build the underlying skill. The aim is to build judgment, which tools don't supply.
:::

## Further reading

:::reading Sources to open next
- NN/g, *State of UX 2026* on the market, expectations and scarce entry-level roles.[[ref:nng-state-ux-2026]]
- SVPG on how product teams work with designers and engineers.[[ref:svpg-risks]]
- Kim Scott, *Radical Candor*, and Patrick Lencioni, *The Five Dysfunctions of a Team* (books).
- Product Talk on how trios share discovery.[[ref:product-talk]]

`,"./content/fundamentals/08-collaboration-leadership.md":`You can be the most talented designer on the team and still see your work watered down, delayed or ignored. Product design is a team sport. Designs get built through engineers, prioritized by product managers, approved by stakeholders and improved by everyone's input.

This edition explains the foundations of collaboration and leadership for designers: how cross-functional teams work, how to manage stakeholders, how to mentor and grow others, and how groups make good decisions.

:::pull
Your influence comes less from your title than from how well you help other people make good decisions.
:::

## Cross-functional collaboration

### What a product team looks like

Most product teams include:

| Role | Main responsibility | How designers work with them |
| --- | --- | --- |
| Product manager (PM) | What to build and why; priorities | Shape problems, define success together |
| Engineer | How to build it; technical quality | Feasibility, details, edge cases |
| Designer | How it works and looks for users | Research, flows, interaction, visuals |
| Researcher | Understanding users | Plan studies, share insights |
| Content designer | Words in the product | Labels, messages, tone |
| Data analyst | Measuring behavior | Define metrics, read results |
| QA / test engineer | Quality before release | Test cases, edge cases |

### The product trio

Many teams center on a **trio**: product manager, designer and tech lead. They share ownership of discovery and decisions, which leads to better ideas and fewer surprises.

### How teams work: agile basics

Most software teams use **agile** methods: work happens in short cycles with frequent feedback.

- **Scrum:** work is planned in **sprints** (usually 1 to 4 weeks), with rituals like sprint planning, daily stand-ups, reviews and retrospectives.
- **Kanban:** work flows continuously across a board (To do → In progress → Done), with limits on work in progress.
- **User stories:** short descriptions of needs: "As a [user], I want [goal], so that [benefit]."
- **Backlog:** a prioritized list of work.
- **Definition of done:** what must be true for work to count as finished.

Designers usually work slightly **ahead** of engineering (designing next sprint's work) while supporting the current sprint.

### Principles of good collaboration

1. **Involve others early.** Show engineers rough ideas before polishing.
2. **Share problems, not just solutions.** People who understand *why* contribute better ideas.
3. **Be clear about roles and decisions.** Who decides what?
4. **Over-communicate.** Share work in progress openly.
5. **Respect constraints.** Ask why something is hard instead of assuming people are being difficult.
6. **Give credit generously.**

### Working well with engineers

- Learn the basics of how your product is built.
- Walk engineers through designs before handoff, not just after.
- Design all states and edge cases.
- Be available during the build; questions will come up.
- Review the built product together and fix differences collaboratively.

### Working with PMs

- Align on the problem and success metrics before designing.
- Bring research and evidence, not just opinions.
- Discuss trade-offs openly (scope, time, quality).
- Help PMs communicate the user's perspective to stakeholders.

## Stakeholder management

### Who stakeholders are

**Stakeholders** are anyone who affects or is affected by your work: executives, other teams, sales, support, legal, marketing and sometimes customers.

### Stakeholder mapping

A common tool is the **power/interest grid**:

| | Low interest | High interest |
| --- | --- | --- |
| **High power** | Keep satisfied | Manage closely |
| **Low power** | Monitor | Keep informed |

Plot your stakeholders, then decide how often and how deeply to involve each.

### RACI: who does what

**RACI** clarifies roles for a task or decision:

- **R**esponsible: does the work.
- **A**ccountable: owns the outcome (one person).
- **C**onsulted: gives input before decisions.
- **I**nformed: kept updated.

### Managing expectations

- **Align early:** agree on goals, scope and timeline at the start.
- **Share progress regularly:** no surprises.
- **Explain trade-offs:** "If we add this, the release moves two weeks."
- **Flag risks early.**
- **Document decisions.**

### Handling disagreement

1. **Listen** to understand their concern.
2. **Find the underlying goal:** what are they really trying to achieve?
3. **Bring evidence:** research, data, examples.
4. **Offer options** with trade-offs.
5. **Agree on how to decide:** test it, ask the decider or prototype both.
6. **Disagree and commit:** once decided, support the decision.

### Saying no constructively

Instead of "no," try: "Yes, if..." or "Not now, because..." For example: "We can add that, but it would delay launch by two weeks. Should we prioritize it over X, or plan it for the next release?"

## Mentoring and developing others

### Why it matters

Helping others grow multiplies your impact, strengthens the team and is expected as you become more senior. It also deepens your own understanding: teaching forces clarity.

### Mentor, coach or manage?

| Approach | What it means |
| --- | --- |
| Mentoring | Sharing experience and advice |
| Coaching | Asking questions to help someone find their own answers |
| Sponsoring | Using your influence to create opportunities for someone |
| Managing | Responsibility for someone's work, performance and growth |

### Good mentoring practices

- **Start with their goals**, not yours for them.
- **Ask more than you tell.** "What options do you see?"
- **Give specific feedback:** what they did, its effect, what to try next.
- **Share your reasoning,** not just your answers.
- **Give stretch opportunities** with support.
- **Celebrate progress.**
- **Be consistent:** regular check-ins beat occasional long sessions.

### The feedback model: SBI

A simple way to give feedback:

- **Situation:** "In yesterday's review..."
- **Behavior:** "...you explained the trade-offs clearly with data..."
- **Impact:** "...which helped the PM decide quickly."

It works for both positive and constructive feedback.

### Growth plans

A simple growth plan includes: current strengths, two or three areas to develop, specific actions, support needed, and a time to review.

### Career frameworks

Many companies use **career ladders** that describe expectations at each level (junior, mid, senior, staff) across skills like craft, collaboration, impact and leadership. Understanding your company's ladder helps you and your mentees know what growth looks like.

## Leadership without authority

You don't need a manager title to lead. Leadership means helping a group move forward. Designers lead by:

- **Framing problems** so everyone understands them.
- **Bringing evidence** that changes minds.
- **Making things visible:** prototypes, maps and diagrams align people quickly.
- **Facilitating** discussions and decisions.
- **Setting standards** through the quality of their own work.
- **Following through** on commitments.

### The IC and manager paths

| Individual contributor (IC) | Manager |
| --- | --- |
| Deep craft and expertise | People development and team health |
| Leads through work and influence | Leads through people and process |
| Senior, staff, principal designer | Design manager, head of design, director |

Both are valid leadership paths.

## Group decision-making

### Common decision methods

| Method | How it works | Best when |
| --- | --- | --- |
| Consensus | Everyone agrees | Small groups, high-stakes alignment |
| Consent | Proceed unless someone has a serious objection | Teams that need speed and inclusion |
| Majority vote | Most votes win | Many options, low risk |
| Decider after input | One person decides after hearing everyone | Clear ownership, speed |
| Delegation | Hand the decision to a person or team | Expertise sits elsewhere |

### DACI

Another role framework for decisions:

- **D**river: drives the process.
- **A**pprover: makes the final call.
- **C**ontributors: give input.
- **I**nformed: told the outcome.

### Avoiding common traps

- **HiPPO** (highest paid person's opinion) dominating: bring evidence and structured methods.
- **Groupthink:** invite dissent; ask "what would make this fail?"
- **Endless debate:** set a deadline and a decision rule.
- **Unclear outcomes:** write down what was decided and who owns next steps.

### Team health

Google's Project Aristotle research found **psychological safety** (feeling safe to take risks and speak up) was the most important factor in effective teams. Leaders build it by admitting mistakes, inviting input and responding to ideas with curiosity rather than judgment.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Product trio | PM, designer and tech lead sharing ownership |
| Agile | Working in short cycles with frequent feedback |
| Sprint | A fixed time period of work in Scrum |
| User story | "As a…, I want…, so that…" |
| Stakeholder | Anyone who affects or is affected by the work |
| Power/interest grid | A map for prioritizing stakeholders |
| RACI / DACI | Frameworks for roles in tasks or decisions |
| SBI | Situation–Behavior–Impact feedback |
| Psychological safety | Feeling safe to speak up and take risks |
| Disagree and commit | Supporting a decision after voicing concerns |

## Quick check

:::check Knowledge check 1
A stakeholder has high power but low interest in your project. How should you involve them?
---
Keep them satisfied: brief, occasional updates focused on what matters to them, and involve them more closely if decisions start to affect their area.
:::

:::check Knowledge check 2
Rewrite this feedback using SBI: "Good job on the presentation."
---
"In today's stakeholder review (situation), you opened with the decision and backed it with the usability data (behavior), which got us a yes in ten minutes (impact)."
:::

:::check Knowledge check 3
What's the difference between consensus and consent?
---
Consensus requires everyone to agree. Consent means the group proceeds unless someone has a serious, reasoned objection, which is faster while still respecting concerns.
:::

:::reading Sources to open next
- SVPG on how strong product teams work.[[ref:svpg-risks]]
- Product Talk on product trios.[[ref:product-talk]]
- Kim Scott, *Radical Candor*; Patrick Lencioni, *The Five Dysfunctions of a Team*; Julie Zhuo, *The Making of a Manager* (books).

`,"./content/modules/09-design-tools-prototyping.md":`A few years ago, "I'm fast in Figma" was a real career edge. Today, an AI agent can generate a screen in the time it takes you to find the right frame. And a decent prototype can be built in real code from a text description.

So what's left of tool skill? Quite a lot, but it's changed shape. The durable skill isn't mastering any one canvas. It's knowing **which tool and which fidelity answer which question**, building files that people and agents can both use, and getting your intent to the people who build it without losing anything on the way.

This chapter covers tool proficiency, prototyping and developer handoff, reframed for now. Tool features change monthly, so treat specifics as a snapshot (checked October 2026) and go to the vendor's pages for current details.

:::pull
Tools change every year. The questions they answer don't: what do we need to learn, how real does this need to be to learn it, and how does it reach the people who'll build it?
:::

## 1. Tool proficiency

### What proficient means

Not knowing every feature. It means producing files that are **fast to work in, easy for others to understand, and consistent with the product's system**. Marks of a well-built file:

- **Components and variants** for everything reused, with properly defined properties.
- **Auto layout** (or its equivalent) so content, language and viewport changes don't break designs.
- **Variables and modes** for color, spacing, type and theme, mirroring the code's tokens (see [[ch:03]]).
- **Sensible structure and naming:** layers, pages and frames another person can navigate.
- **States designed, not implied:** hover, focus, disabled, error, loading, empty.
- **Notes in the file:** annotations for behavior, edge cases and links to specs.

### Habits that save hours

- Learn the shortcuts for your ten most frequent actions.
- Use libraries and templates before rebuilding.
- Keep a clear file structure: cover, working pages, ready for development, archive.
- Name versions and keep a changelog for shared work.
- Test components with long text, narrow widths, right-to-left and zoom.

### What changed at Config 2026

Figma's Config keynote was on 24 June 2026. According to Figma's own recap, these are in **open beta** for paid plans: a Figma agent that can generate and remix designs, automate repetitive tasks and give design feedback (chats are visible to collaborators); generative plugins the agent builds from a description; custom WebGPU shader effects; and Figma Motion for animation. **Coming soon** (waitlist): code layers, which let you work with code on the canvas including by cloning a repository, plus the agent in FigJam and Slides and 3D transforms.[[ref:figma-config-2026]] That recap didn't cover Figma Make, Dev Mode or design systems, so details on those come from other coverage I haven't verified.

Two points matter more than any feature list:

1. **Agents work better on well-structured files.** One that reads a file with consistent components, variables and names produces far better output than one that reads a heap of detached shapes. The structure habits above are now also the *input* to your tools.
2. **Tools are converging on code.** Design tools add code; code tools add design views. Understanding both sides (see [[ch:10]]) is becoming worth more than mastering one canvas.

:::warning Common trap: letting the tool define "finished"
Generated screens *look* finished. Check them against your system, accessibility needs and the state list from [[ch:02]]. A convincing frame can hide an inaccessible, off-system or incomplete design.
:::

:::exercise Try it: rebuild a file the right way (2 hours)
Take a messy file. Restructure it: turn repeats into components with variants, replace hardcoded values with variables, add auto layout, name layers, add states. Time a small change (new theme, longer labels, new state) before and after.
:::

## 2. Prototyping

### Match fidelity to the question

A prototype exists to answer a question. The usual mistake is making it more realistic than the question needs, or less.

| Fidelity | Looks like | Good for | Misleads when |
| --- | --- | --- | --- |
| Paper or sketch | Hand-drawn screens | Exploring ideas, early flow checks | You need visual or interaction detail |
| Low-fi wireframe | Gray boxes and labels | Structure, content, flow | People react to missing polish |
| Click-through | Linked static screens | Navigation and flow comprehension | Behavior depends on data or states |
| High-fi interactive | Realistic visuals and transitions | Usability, stakeholder alignment | People critique the look, not the concept |
| Coded prototype | Real code with sample data | Realistic behavior, performance, data states | It hides unresolved engineering problems |
| Wizard of Oz | A person simulates the system | Testing AI or complex behavior before building | You can't scale or repeat it |

Some questions can't be answered with static screens: how a table behaves with 5,000 rows, how long a streaming response *feels*, how validation works, how an agent asks for approval. For those, use a coded or AI-assisted prototype.

### 2026 shifts

- **Designers can prototype in code now.** AI coding tools turn a description or a design into a working prototype in hours. Job postings I reviewed in October 2026 for design engineer, rapid prototyping and AI prototyping roles asked for exactly this, though job boards are noisy and some listings are enriched by aggregators, so this is a signal, not a statistic.
- **The risk went up, not down.** A prototype that behaves like a product invites feedback on polish and convinces stakeholders the work is nearly done. Be explicit about what's real and what's simulated, and test the riskiest assumption (value, trust, comprehension), not the visual finish.
- **Prototype debt is real.** A generated prototype can become the thing engineers are told to "just ship." Decide up front whether it's disposable or the start of production, and say so out loud.
- **Test AI with varied inputs.** A single scripted demo path hides the failures that matter. Include messy inputs, wrong outputs and recovery (see [[ch:02]] and [[ch:04]]).

:::decision Which prototype should I build?
Ask what you need to learn, and who needs to learn it. Is the *idea* wanted? Use the cheapest thing people can honestly react to. Does the *interaction* work? Build clickable or coded with realistic states. Does the *system* behave well (AI quality, performance, data)? Build coded or Wizard-of-Oz with varied inputs. Build the least that answers the question.
:::

:::exercise Try it: answer one question three ways (half a day)
Pick a design question. Build the cheapest prototype that can answer it, then a higher-fidelity version. Test both with the same five people. Compare what each taught you and what each hid, and note which fidelity you'll choose next time for this kind of question.
:::

## 3. Developer handoff

"Handoff" implies a single moment. In reality it's a continuous conversation, and the file is only part of it. The goal: engineers can build what you intend without guessing, and you can see where you disagree *early*.

### A complete handoff

- **Every state:** default, hover, focus, active, disabled, loading, error, empty, success, partial or offline where relevant (see [[ch:02]]).
- **Behavior:** what happens on click, how things animate, when validation runs, keyboard behavior, focus order.
- **Responsive rules:** how layout changes with width, container, text length and input type.
- **Real content,** including long and short extremes and truncation rules.
- **Accessibility annotations:** headings, landmarks, accessible names, focus order, contrast, motion preferences (see [[ch:11]]).
- **Data and constraints:** what data the screen needs, how it loads, limits and error cases.
- **Tokens and components by name,** not raw values.
- **Acceptance criteria:** a short list of conditions that mean "built correctly."
- **Open questions,** with owners.

Dev Mode and similar tools help with measurements and tokens, but they can't show behavior, edge cases or intent, so annotate what the inspector can't.

### Design QA

After the build, review it in a real browser and on a real device against the design and acceptance criteria. Log differences with screenshots, rank them by severity and agree a fix schedule. Keep it collaborative: bring the differences that *matter*, not every pixel.

:::framework A short handoff checklist
**States** all designed. **Behavior** written down. **Responsive** rules stated. **Content** realistic. **Accessibility** annotated. **Tokens and components** named. **Data** and error cases covered. **Acceptance criteria** written. **Open questions** listed with owners. **A walkthrough** held with the engineer *before* they start.
:::

### 2026 shifts

- **Shared context between design and code is improving.** Tools now connect design files to coding agents so the agent can see components, variables and layout. Figma's recap mentions exporting generated shaders via MCP, and secondary coverage describes broader MCP support for external agents (not verified here).[[ref:figma-config-2026]] The practical effect: your file's structure and naming flow into generated code, so file quality matters more.
- **Acceptance criteria become the contract.** When more of the implementation is generated, a clear list of conditions the result must meet is what you review against.
- **Handoff happens earlier and more often,** because designers and engineers can collaborate on the same coded artifact. Agree on conventions (naming, tokens, branches) to avoid conflicting changes.

:::exercise Try it: acceptance criteria and a build review (half a day)
For something you're about to hand off, write ten acceptance criteria (states, behavior, responsive, accessibility). After it's built, review it in a real browser and on a phone, log differences, agree on priorities with the engineer and track them to done.
:::

## Case: a prototype in an afternoon

You want to test whether admins will trust an AI-generated weekly summary of team activity. Here's one way to go from idea to test in an afternoon, choosing fidelity deliberately.

**Hour 1: Decide what you need to learn.** The riskiest question isn't "does the summary look good?" It's "do admins read it, trust it and act on it?" That points to a realistic, content-driven prototype, not a pixel-perfect one.

**Hour 2: Create realistic content, not lorem ipsum.** Use real anonymized data from last month to write three summaries by hand (or generate drafts and then edit them heavily, checking every number). Include one summary that's wrong on purpose, to see if people notice. Trust can only be tested with content that can fail.

**Hour 3: Build the minimum.** A simple page in your design tool or a quick coded page with three states: the summary email, the in-app view with "Show sources" and a "Report a problem" control. Make the prototype *honest*: label what's simulated.

**Hour 4: Prepare the test.** Tasks: "You open this on Monday morning. What do you do?" Observation targets: Do they check sources? Do they catch the error? Do they forward it? Success criteria written before the sessions.

**What you deliberately skipped:** visual polish, settings, empty states, responsive layouts. They matter later, but not for this question. Saying so up front stops stakeholders from judging the prototype on things it was never meant to answer.

**After the test:** if three of five admins missed the wrong number, that's a design insight (add visible sources and confidence cues) *and* a product insight (maybe summaries need review before sending). Either is worth far more than a polished mockup.

## File-health checklist

Open a file and check:

- [ ] Frames use auto layout (or the equivalent) rather than manually spaced layers.
- [ ] Spacing, color and type come from variables or styles, not raw values.
- [ ] Components have properties (text, icon, variant) instead of copies of the same shape.
- [ ] Layer and page names describe things ("Invoice row / hover"), not "Rectangle 24."
- [ ] Every component has its states; none is "just in my head."
- [ ] Text layers use real content (long, short, empty and international examples tested).
- [ ] Constraints and resizing behavior are set, and you've tested by resizing.
- [ ] A "Ready for dev" page contains only final, annotated frames.
- [ ] Old explorations are archived, not mixed with final work.
- [ ] Notes explain behavior the picture can't (what's clickable, what loads, what happens on error).

A fast self-test: ask someone else to change the primary color, add a theme and lengthen a label. If it takes more than a few minutes, the file is fighting you.

## Useful annotations

| Annotation | Why it helps |
| --- | --- |
| "Table scrolls inside its container; header and first column are sticky" | Prevents a whole-page scroll bug |
| "Row action buttons appear on hover **and** focus; always visible on touch" | Avoids hover-only controls |
| "Validation runs on blur; error message appears below the field and is linked via \`aria-describedby\`" | Removes guesswork on timing and accessibility |
| "Empty state shows if the list has no items after loading; skeleton while loading" | Defines the two empty-looking states |
| "Truncate at 2 lines with ellipsis; full text in tooltip on hover **and** focus" | Defines overflow behavior |
| "Animation: 200ms ease-out; replaced by a fade when reduced motion is on" | Covers motion and accessibility together |
| "Max 50 items per page; server-side sorting" | Sets data expectations early |

## Prototype pitfalls

| Pitfall | What goes wrong | Fix |
| --- | --- | --- |
| Testing the happy path only | You find nothing | Include errors, empties, slow responses |
| Perfect data | Hides layout and content problems | Use real, messy, long content |
| Over-polish | Feedback is about color, not value | Match fidelity to the question |
| Under-polish | People can't take it seriously | Add enough realism to make the task believable |
| No stated limits | Stakeholders assume it's nearly done | Label what's real and what's simulated |
| Generated prototype becomes production | Hidden quality and accessibility debt | Decide up front: throwaway or foundation |
| One-off tool | Nobody can reuse or maintain it | Use your system's tokens and components where possible |

## Where to go deeper

- **Version control basics:** branches, commits and pull requests, enough to follow and contribute.
- **Prototyping with AI coding tools:** clear instructions, constrain to your design system, review the output, know what you can't judge.
- **Motion and interaction specs:** duration, easing, triggers and reduced-motion alternatives.
- **File governance:** libraries, publishing, permissions and update processes.
- **Documentation:** short guides and annotated recordings that make your work understandable without you.

## Your next four weeks

| Week | Focus | You'll have |
| --- | --- | --- |
| 1 | Restructure a file: components, variables, auto layout | Before/after timings |
| 2 | Answer one question at two fidelities | A comparison write-up |
| 3 | A coded prototype with real states | A working prototype with sample data and a test |
| 4 | A full handoff plus design QA | A package reviewed by an engineer, and a prioritized difference list |

## Quick check

:::check Knowledge check 1
Your AI-built prototype impresses stakeholders, who say "ship it." What do you do?
---
Clarify what it is and isn't: what's real, what's simulated, which states, accessibility and edge cases are missing. Review it with engineering for quality and feasibility, and decide explicitly whether to rebuild properly or harden it. Agree a plan and acceptance criteria. Polish isn't production readiness.
:::

:::check Knowledge check 2
You need to know whether people understand a new approval flow. Which prototype?
---
A clickable or coded prototype with realistic states and content, because the question is about comprehension of an interaction and static screens may miss behavior. A paper sketch is too coarse for the detail, and a fully coded system is more than the question needs. Test with representative users on tasks.
:::
