`,"./content/modules/03-design-systems-scalable-design.md":`Picture a product with 400 screens and a designer who needs a button. If there's no system, they open the last file and copy one. That one was copied from another one, which was tweaked by someone in a hurry. Six months later you have 14 almost-identical buttons, three grays that are *nearly* the same, and nobody dares touch any of it.

A design system is how you stop that from happening, and it's the main thing that separates "designs great screens" from "makes a product that stays great as it grows." It's also where mid-level designers become senior ones, because the work shifts from drawing the thing to designing the *decisions behind* the thing.

2026 adds a twist. NN/g's outlook says UI is getting cheaper to produce thanks to design systems and standard components, which pushes differentiation elsewhere.[[ref:nng-state-ux-2026]] And your system now has a new kind of user: AI tools that read your docs and generate UI from them. We'll get to that. First, the fundamentals.

:::pull
A design system is a product. Its customers are the people who build your product, and it needs users, a roadmap, quality and support like any other.
:::

## 1. Thinking in systems

### What's in a design system

People use the term loosely. Here's a useful breakdown:

- **Foundations and tokens:** the smallest decisions (color, type, spacing, radius, elevation, motion) stored as named values.
- **Components:** reusable building blocks (button, input, table, dialog) with defined states, behavior and accessibility.
- **Patterns:** component combinations that solve a recurring problem (filter bar, settings page, empty state).
- **Guidelines:** when to use what, voice, accessibility rules, do and don't.
- **Code and tooling:** libraries, design files and pipelines.
- **Governance and people:** who decides, who contributes, how change happens.

A system without that last one is a style guide that's quietly going out of date.

:::definition Atomic thinking
Brad Frost's *Atomic Design* describes UI as atoms (a label, an input), molecules (a labeled input), organisms (a form section), templates and pages.[[ref:atomic-design]] Use it as a mental model for composition, not a rigid folder structure. Arguing over whether something is a molecule or an organism is a time sink.
:::

### Habits of system thinkers

- **Hunt for accidental variation.** Audit a real product: how many button styles, grays and spacing values exist? The audit *is* your business case.
- **Name things by purpose.** \`color-text-danger\` survives a rebrand; \`red-500\` doesn't.
- **Prefer a few strong components to many weak ones.** Every component is something you must maintain, document, test and support.
- **Design for composition.** Components with slots and variants outlast components that try to anticipate every case.
- **Optimize for adoption.** The system wins when teams choose it because it's the fastest *good* option.

:::exercise Try it: audit before you design (2 hours)
Screenshot ten screens from one product. Catalogue every distinct button, text style, gray and spacing value. Group the duplicates. Write one page: what the variation costs, and what to standardize first.
:::

## 2. Building and maintaining

### Tokens in three layers

Design tokens are named, platform-neutral decisions. They work best layered:

- **Primitive** tokens: raw values, like \`blue-600\` or \`space-4\`.
- **Semantic** tokens: meaning, referencing primitives, like \`color-action-primary\`.
- **Component** tokens: specific to one component, like \`button-primary-background\`.

Components should use semantic or component tokens, never primitives. That's what lets you retheme, add dark mode and support multiple brands without touching a component.

\`\`\`json
{
  "color": {
    "action": { "primary": { "$type": "color", "$value": "{color.blue.600}" } }
  }
}
\`\`\`

**There's now a standard format.** The Design Tokens Community Group (a W3C Community Group) published the first stable Design Tokens Specification, 2025.10, on 28 October 2025: a vendor-neutral format with theming and multi-brand support, color support including Display P3 and Oklch, and relationships like aliases and inheritance. Reference implementations include Style Dictionary, Tokens Studio and Terrazzo, and the announcement names support or work in Figma, Sketch, Penpot, Framer, Supernova, zeroheight and others.[[ref:dtcg-2025]] One nuance: its own report says it's a community group spec, not a W3C Standard on the Standards Track. Read "standard" as "stable shared format."

:::decision Where to start with tokens
Start with semantic color roles, a spacing scale, a type scale and radii. Add motion and elevation later. Don't tokenize every number: a token earns its place by being reused and needing to change in one place.
:::

### Reusable components

- **A clear API.** Props and variants that map to real decisions, with few boolean flags. If a component needs a long list of options, it's probably two components.
- **Every state designed *and* built:** default, hover, focus, active, disabled, loading, error, empty.
- **Accessibility inside.** Keyboard behavior, focus management, roles and names, contrast, reduced motion. If the component ships without these, every team using it pays.
- **Docs people actually read:** purpose, anatomy, variants, usage rules, live examples.
- **Tests:** visual regression and accessibility checks so a change doesn't silently break forty screens.

Many teams build on headless primitives (libraries that supply behavior and accessibility without styling) or on a copy-in model where components live in your repo. Both trade control against upgrade effort, so choose based on your engineering capacity.

### Governance

Three operating models, popularized in writing by Nathan Curtis and others: **solitary** (one person builds for themselves), **centralized** (a dedicated team owns it) and **federated** (a core team plus contributors across product teams). Most mature systems end up hybrid. Whatever you choose, you need a clear way to **request and contribute**, **versioning and deprecation** (so teams can plan), and a **decision record** so debates don't repeat.

:::framework How to measure a system
Track adoption and outcomes, not component count. Useful signals: share of product UI built from system components; detached or overridden instances; time to build a new screen; accessibility defects; contribution requests and time to resolve; team satisfaction. Pair numbers with stories, like "this release removed a month of duplicate work."
:::

### Build, adopt or extend?

Mature systems like Material, Carbon, Polaris, Primer, Spectrum and Fluent show good patterns. Adopting is fast but constraining; building is slow but fits. A common middle path: adopt a solid foundation, then layer your tokens and a few product-specific components on top.

### 2026 shifts

- **Tokens are becoming portable.** With a stable shared format and growing tool support, a token file moves between design tools and code with less custom glue. Learn how a pipeline works end to end (source of truth, transformation, output per platform).[[ref:dtcg-2025]]
- **Design files and code are converging.** Variables with modes in design tools mirror tokens with themes in code. The closer your file mirrors your code, the less gets lost.
- **Documentation is now a product feature.** Docs need to be accurate and structured, because tools read them too.

:::exercise Try it: a mini system in a week
Define semantic tokens (at least eight color roles, plus spacing, type and radius). Build three components (button, text input, alert) with all states in your design tool *and* in code or a prototype. Document each in a page. Rebrand by changing only the primitive layer and log what broke.
:::

## 3. Strategic craft decisions

This is the judgment part, and the part NN/g's outlook expects to matter more: discernment and strategy over artifact production.[[ref:nng-state-ux-2026]]

| Decision | Case for consistency | Case for flexibility |
| --- | --- | --- |
| Add a variant or component | Fewer things to learn and maintain | A real, recurring need is unmet |
| Allow overrides | Everything stays aligned | Teams ship without waiting |
| Strict accessibility rules | Fewer defects and less legal risk | Some bespoke interactions need judgment |
| Opinionated defaults | Fast adoption | Harder to fit unusual products |

### Breaking the system well

1. **State the need.** What user problem does the standard component not solve?
2. **Look for an existing answer.** Is there a variant or pattern that nearly fits?
3. **Estimate the full cost.** Design, build, test, document, maintain, plus the confusion of a second way to do the same thing.
4. **Decide scope.** One-off, product-specific, or promoted to the system?
5. **Record it.** A short decision note ends repeat debates and shows which exceptions deserve to become features.

:::example A hypothetical decision
A team needs a date range picker with comparison periods; the system only has a single-date picker. Option one: a one-off. Option two: contribute a range picker. Three other products will need it within a year, so they contribute it, with accessibility and keyboard behavior done once. The decision note records why, so the next "similar but not quite" request starts from the same logic.
:::

### Thinking at scale

- **A decision multiplied across a thousand screens is a big decision.** Default spacing or corner radius is a product-wide change; review it like one.
- **Constraints are features.** A system that allows anything protects nothing.
- **Maintenance is the cost people forget.** When generating variants becomes cheap, the *maintenance* cost of those variants doesn't shrink.

:::exercise Try it: write a decision record (1 hour)
Pick a component request. Write one page: need, alternatives, cost estimate, decision, scope and review date. Show it to someone and see if they'd have decided the same.
:::

## 4. Systems in the age of AI

AI tools generate UI quickly, and teams increasingly point them at their design system. That creates a new type of consumer, and a new failure mode.

### What goes wrong

A PayPal engineering post describes AI-generated components with invented prop names and hardcoded hex values where a token belonged.[[ref:paypal-ai-docs]] That's what you should expect from a model that doesn't *know* your system: output that looks plausible and quietly breaks consistency, accessibility and theming.

### What makes a system AI-ready

- **Semantic, consistent naming.** A model follows \`color-text-danger\` far more reliably than \`red-3\`.
- **Constraints you can check:** lint rules, type definitions and tests that fail on hardcoded values or invented props.
- **Machine-readable docs.** Structured descriptions of components, props, rules and anti-patterns in formats tools can fetch. Emerging approaches include Model Context Protocol (MCP) servers that let an agent query tokens and components before writing code, \`llms.txt\`-style files and agent instruction files. A July 2026 study, which I only saw through a German-language secondary source, reportedly found MCP servers in 19 of 20 design systems examined, instruction files in 18 and an \`llms.txt\` in 14. Treat those figures as indicative.[[ref:drweb-ds-agents]]
- **Great examples.** Complete, correct usage examples are among the most effective context you can provide.
- **Accessible by default.** If the component is accessible, generated usage inherits it; if not, generation multiplies the defect.

:::warning Common trap: letting speed erase the system
When a screen takes seconds to produce, it's tempting to skip the system and generate bespoke UI. The bill arrives later as inconsistency, accessibility debt and maintenance. The system is the guardrail that lets teams move fast without drifting.
:::

Your new responsibilities: write docs as if a tool will read them; define rules as *checks*, not just guidelines; review generated output against the system and log repeat mistakes as doc or constraint fixes; and understand the toolchain well enough to talk to engineers about how the system is exposed to tools.

:::exercise Try it: test your system with an AI tool (half a day)
Give an AI coding or design tool your mini system's docs and ask for five screens. Record every deviation: invented props, hardcoded values, missing states, accessibility failures. For each, decide whether the fix is better docs, a stricter constraint or a missing component. Update the system and run it again.
:::

## Case: building a button

A button looks trivial, which is exactly why it's the best way to see what a system really involves.

**1. Decide the API before the look.** What decisions does a button actually vary on? Usually: *emphasis* (primary, secondary, tertiary), *size* (small, medium, large), *tone* (default, danger), and *state*. Notice what's *not* a prop: color, because color comes from tone and emphasis through tokens. A clean API might be:

\`\`\`tsx
<Button emphasis="primary" size="md" tone="default" loading={false} disabled={false}>
  Save changes
</Button>
\`\`\`

**2. Count the states.** Default, hover, focus, active, disabled, loading. Each needs a visual treatment *and* a behavior. Loading, for example, should keep the button's width (no layout jump), announce the change to assistive tech and prevent double submission.

**3. Wire it to tokens.**

| Part | Token it uses |
| --- | --- |
| Background (primary) | \`button-primary-background\` → \`color-action-primary\` → \`blue-600\` |
| Text on primary | \`button-primary-text\` → \`color-text-on-action\` |
| Focus ring | \`focus-ring-color\`, \`focus-ring-offset\` (checked on every surface) |
| Padding (md) | \`space-inset-control-md\` |
| Radius | \`radius-control\` |
| Disabled | Reduced contrast *plus* \`cursor: not-allowed\` and an explanation elsewhere |

If you rebrand by editing only \`blue-600\`, every primary button changes and nothing else is touched. That's the payoff of three token layers.

**4. Bake in accessibility.** It's a real \`button\`; Enter and Space work; the focus ring has at least 3:1 contrast against its surroundings; the minimum target is 24 by 24 CSS px (usually much more); an icon-only variant requires an \`aria-label\`; and the loading state announces itself.

**5. Document it for humans and machines.** One page covering: purpose ("Use for the main action on a screen"), anatomy, variants with live examples, **when not to use it** ("Don't place two primary buttons in one view"), content guidance ("Start with a verb: *Save changes*, not *OK*"), accessibility notes and the changelog. Add a machine-readable description of props and allowed values so tools can't invent new ones.

**6. Test it.** Visual regression across states and themes, an automated accessibility check, a keyboard test and a quick test in a screen reader. These checks run on every change, so a "small tweak" to padding can't silently break forty screens.

**7. Decide how it will change.** Add a variant? Open a request with the problem, not the pixels. Deprecate one? Publish a migration note and a date. A button has a lifecycle, like any product.

That's one component. Now multiply by thirty and you see why a system is a product with a team, not a Figma page.

## System smells

| Smell | What it usually means | What to do |
| --- | --- | --- |
| Teams detach components constantly | The component doesn't fit real needs | Interview the teams; add the missing variant or slot |
| Nobody knows which button to use | Docs say *what*, not *when* | Add usage rules and a decision guide |
| 30 colors named \`gray-something\` | No semantic layer | Introduce roles and migrate gradually |
| A "temporary" override is three years old | No process for exceptions | Add a review date and an owner to every override |
| Design file and code disagree | No single source of truth | Pick one source (often tokens in code) and sync from it |
| Contributions pile up unreviewed | No clear bar or owner | Publish a contribution guide and a review SLA |
| System releases break products | Weak versioning and tests | Semantic versioning, visual tests, migration notes |
| AI tools invent props | Docs aren't machine-readable | Provide structured specs and lint rules |

## Selling the system

Systems often fail politically, not technically. A short case that lands with leadership:

1. **The cost today:** the audit result (e.g. "we have 14 button styles and 3 date pickers"), plus the time teams spend rebuilding.
2. **The risk:** inconsistency, accessibility defects and slow onboarding for new designers and engineers.
3. **The proposal:** a small first version covering the 10 most-used components and the tokens behind them.
4. **The measure:** time to build a new screen, accessibility defects, share of UI built from the system.
5. **The ask:** a named owner, a small team and a quarter to prove it.

Start small, ship something useful quickly and let adoption make your case. Systems built in isolation for a year before anyone uses them rarely survive.

## Where to go deeper

- **Front-end fluency.** HTML, CSS custom properties and enough of a component framework to read a component's API (see [[ch:10]]).
- **Accessibility engineering:** keyboard patterns, focus management, roles and names (see [[ch:11]]).
- **Documentation and writing.** Usage guidance is most of the daily work of a system.
- **Product thinking for internal products:** roadmaps, adoption metrics and a business case (see [[ch:06]]).
- **Automation:** token pipelines, visual regression, release pipelines.

## Your next four weeks

| Week | Focus | You'll have |
| --- | --- | --- |
| 1 | Audit a product and make the case | A one-page audit with counts and a plan |
| 2 | Token architecture in the DTCG format | A token file and a rebrand test |
| 3 | Three accessible components with docs | Components in design and code, keyboard-tested |
| 4 | Governance plus an AI test | A contribution guide, two decision records, and before/after deviation counts |

## Quick check

:::check Knowledge check 1
Why should components use semantic tokens rather than primitives?
---
Semantic tokens carry meaning and point to primitives, so you can change a theme, add dark mode or rebrand by changing the mapping, without editing components. A component using \`blue-600\` directly is tied to one appearance and must be edited everywhere if the brand changes.
:::

:::check Knowledge check 2
A team asks for a bespoke component the system doesn't have. What do you do before saying yes or no?
---
Clarify the user need, check whether an existing variant nearly fits, estimate the full cost (design, build, test, document, maintain, plus the confusion of a second way), decide whether it's a one-off, product-specific or system-level, and record the decision. If other teams will need it, contribute it once, properly designed and tested.
:::

`,"./content/fundamentals/03-design-systems-scalable-design.md":`Imagine ten designers and forty engineers building one product without any shared rules. Within a year you'd have a dozen button styles, five ways to show an error and three slightly different blues. Users would feel it as "this product is a bit messy," and every new screen would take longer than the last.

A **design system** is the fix: a shared set of decisions, components and guidelines that lets many people build one coherent product. This edition explains what a design system is, what it contains, how tokens and components work, how systems are run, and what the famous examples teach.

:::pull
A design system turns a thousand small decisions into a few shared ones, so teams can spend their energy on problems that are actually new.
:::

## What a design system is

A design system is a **single source of truth** for how a product looks and behaves, made of reusable parts and the rules for using them. It serves two audiences: designers (in a design tool) and engineers (in code), and it works best when those two stay in sync.

### Guide, library or system?

| Term | What it is |
| --- | --- |
| Brand guidelines | Logo, brand colors, tone for marketing |
| Style guide | Visual rules: colors, type, spacing |
| Component / pattern library | A collection of reusable UI pieces (in design and/or code) |
| Design system | All of the above plus principles, documentation, code, governance and the team that maintains it |

A design system is more than a component library because it includes *how and why* to use things, and *who* keeps it alive.

### Why teams build one

- **Consistency:** the product feels like one product.
- **Speed:** teams assemble screens from tested parts instead of starting from scratch.
- **Quality:** accessibility and edge cases are solved once, in the component.
- **Shared language:** designers and engineers say "secondary button" and mean the same thing.
- **Easier change:** update a color once and it changes everywhere.

## The layers of a design system

### 1. Principles

Short statements that guide decisions when rules run out. For example: "Clarity over cleverness," "Accessible by default." Good principles help people choose between two valid options.

### 2. Foundations

The basic visual building blocks: color, typography, spacing, grid, elevation (shadows), radius (corner roundness), iconography, motion. These are usually stored as **design tokens**.

### 3. Components

Reusable UI elements: buttons, inputs, checkboxes, cards, modals, tables, navigation. Each component has variants, states, behavior and accessibility built in.

### 4. Patterns

Combinations of components that solve common problems: a login form, a search with filters, an empty state, a settings page.

### 5. Documentation and guidelines

When and how to use each piece, with examples and "do and don't."

### 6. Tools and code

The design library (for example in Figma) and the code library (for example in React), plus the pipelines that keep them in sync.

### 7. Governance

The processes and people: who owns the system, how changes are proposed and approved, how releases work.

## Atomic design

Brad Frost's **Atomic Design** is a popular way to think about building interfaces from small to large, borrowing terms from chemistry:[[ref:atomic-design]]

| Level | Description | Example |
| --- | --- | --- |
| Atoms | The smallest elements | A label, an input, a button |
| Molecules | Simple groups of atoms | A search field (label + input + button) |
| Organisms | Complex sections | A header (logo + navigation + search) |
| Templates | Page-level layouts with placeholders | A product page layout |
| Pages | Templates with real content | The actual product page |

It's a mental model, not a strict rule. Its main lesson: build small, reusable pieces and compose them into bigger ones.

## Design tokens

### What tokens are

**Design tokens** are named values that store design decisions: a color, a font size, a spacing amount, a shadow. Instead of writing \`#3451d1\` everywhere, you use a name like \`color-primary\`.

\`\`\`css
:root {
  --color-primary: #3451d1;
  --space-4: 16px;
  --radius-md: 8px;
}
.button { background: var(--color-primary); padding: var(--space-4); border-radius: var(--radius-md); }
\`\`\`

Tokens let design and code share the same values, and they let you change a decision in one place.

### Token layers

Most mature systems use three layers:

| Layer | Also called | Example | Purpose |
| --- | --- | --- | --- |
| Primitive | Global, core, base | \`blue-600: #3451d1\` | The raw palette of available values |
| Semantic | Alias, purpose | \`color-action-primary: {blue-600}\` | What a value is *for* |
| Component | Specific | \`button-primary-bg: {color-action-primary}\` | What a specific component uses |

Why bother with layers? Imagine a rebrand from blue to green. If buttons use \`blue-600\` directly, you must find and change every usage. If they use \`color-action-primary\`, you change one mapping and everything updates. The same mechanism powers **themes** like dark mode: the semantic names stay, the values they point to change.

### Naming tokens

Good token names describe purpose, not appearance. \`text-danger\` is better than \`red-text\`, because the color might change but the purpose won't. A common naming structure is *category–property–variant–state*, for example \`color-background-surface-hover\`.

### Tokens across platforms

Tools such as Style Dictionary transform a single token file into outputs for different platforms (CSS for web, Swift for iOS, Kotlin for Android).[[ref:style-dictionary]] The Design Tokens Community Group publishes a shared format so tokens can move between tools.[[ref:dtcg-2025]]

## Components in depth

### Anatomy

Every component has parts. A button might have a container, label, optional icon and focus ring. Documenting the anatomy helps everyone talk about the same parts.

### Variants

Variants are different versions for different purposes:

- **Emphasis / hierarchy:** primary, secondary, tertiary (text).
- **Size:** small, medium, large.
- **Tone / intent:** default, danger, success.

### States

Interactive components need designed states: default, hover, focus, pressed (active), disabled, loading, and where relevant selected, error and read-only.

### Properties (props)

In code and in modern design tools, components have **properties** you set: \`variant="primary"\`, \`size="md"\`, \`disabled\`. Well-designed components have properties that map to real decisions, and not too many of them.

### Accessibility built in

Components should handle keyboard use, focus visibility, screen reader labels and color contrast, so every team that uses them gets accessibility for free.

### Composition and slots

Flexible components allow content to be placed inside them (**slots**), so one card component can hold text, an image or a list, instead of needing a separate component for every combination.

## Documentation

Documentation is where many systems succeed or fail. A typical component page includes:

1. **Overview:** what it is and when to use it.
2. **When not to use it** (and what to use instead).
3. **Anatomy.**
4. **Variants and states,** with live examples.
5. **Behavior:** interactions, responsiveness.
6. **Content guidelines:** how to write labels and messages.
7. **Accessibility notes.**
8. **Do and don't examples.**
9. **Code usage and properties.**
10. **Changelog.**

## Running a design system

### Team models

Nathan Curtis and others describe common ways teams organize:

| Model | How it works | Pros | Cons |
| --- | --- | --- | --- |
| Solitary | One team builds a system for itself | Fast, simple | Others may not adopt it |
| Centralized | A dedicated team owns and builds it | High quality, clear ownership | Can become a bottleneck |
| Federated | Designers from many teams contribute | Broad input, shared ownership | Slower decisions, needs coordination |
| Hybrid | A core team plus contributors | Balance of quality and reach | Needs clear processes |

### Contribution

Teams should be able to propose new components or changes. A good process: describe the problem, check whether something existing fits, review with the system team, design and build to the system's standards, document, release.

### Versioning and releases

Systems in code usually use **semantic versioning**: \`MAJOR.MINOR.PATCH\`. A *patch* fixes bugs, a *minor* release adds features without breaking things, a *major* release includes breaking changes and needs a migration guide.

### Measuring success

- **Adoption:** how much of the product uses system components.
- **Consistency:** fewer one-off styles and detached components.
- **Efficiency:** time to design and build new features.
- **Quality:** fewer accessibility and UI bugs.
- **Satisfaction:** do designers and engineers like using it?

## Famous design systems to study

| System | Company | Known for |
| --- | --- | --- |
| Material Design | Google | Comprehensive guidance, motion, theming |
| Human Interface Guidelines | Apple | Platform conventions for iOS, macOS and more |
| Carbon | IBM | Enterprise, data-heavy interfaces |
| Polaris | Shopify | Merchant-focused admin, strong content guidance |
| Fluent | Microsoft | Cross-platform consistency |
| Primer | GitHub | Developer-focused UI |
| Spectrum | Adobe | Creative tools, accessibility |
| Lightning | Salesforce | Enterprise CRM, early token pioneer |

Studying how these document components and explain decisions is one of the best ways to learn.[[ref:material3]]

## When (and when not) to build one

**Build or formalize a system when:** several teams build the same product, inconsistency is slowing you down, or you're rebuilding the product anyway.

**Start small when:** you're a small team or early product. A few tokens and five well-built components beat a giant system nobody uses.

**Adopt an existing one when:** speed matters more than uniqueness, or you lack people to maintain your own. Many teams start with an existing system and customize the tokens.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Design system | Shared decisions, components, guidelines and the team that maintains them |
| Design token | A named value for a design decision |
| Primitive token | A raw value like \`blue-600\` |
| Semantic token | A value named by purpose, like \`color-action-primary\` |
| Component | A reusable UI element |
| Variant | A version of a component for a purpose |
| Slot | A place inside a component where other content goes |
| Atomic design | Building UI from atoms to pages |
| Governance | How a system is owned and changed |
| Semantic versioning | MAJOR.MINOR.PATCH release numbering |

## Quick check

:::check Knowledge check 1
Why do components use semantic tokens instead of primitive ones?
---
So you can change the underlying value (for a rebrand or dark mode) by changing one mapping, without editing every component. Semantic names describe purpose, which stays stable while appearance changes.
:::

:::check Knowledge check 2
What's the difference between a component library and a design system?
---
A component library is a collection of reusable UI pieces. A design system also includes principles, foundations, documentation, code, governance and the people who maintain it.
:::

:::check Knowledge check 3
In atomic design, is a search bar (label, input and button) an atom, molecule or organism?
---
A molecule: a simple group of atoms working together. A whole header containing the search bar, logo and navigation would be an organism.
:::

`,"./content/modules/04-user-research-validation.md":`Here's a research story that happens every week somewhere. A team runs five interviews. Every participant says "yes, I'd definitely use that." The team ships. Almost nobody uses it.

What went wrong? The participants weren't lying. People are just bad at predicting their own behavior, and the team asked questions that invited polite agreement. The research *felt* like evidence and wasn't.

Good research is mostly about *not fooling yourself*. And in 2026 there's a new way to fool yourself: AI tools that transcribe, tag and summarize in minutes, and even "synthetic users" who answer questions for you without existing. NN/g's January 2026 outlook argues research becomes *more* important in an AI-heavy world, partly because user insight shapes how AI systems are trained and customized.[[ref:nng-state-ux-2026]]

This chapter takes you through methods, usability testing, synthesis and journey mapping, then adds two skills your list doesn't have: using AI in research responsibly, and researching AI products.

:::pull
Research isn't a phase you finish. It's the habit of finding out you're wrong as cheaply and early as possible.
:::

## 1. Choosing the right method

The most common research mistake is picking the method first. Start with the question and the decision it will inform. NN/g's classic framing puts methods on two axes: **attitudinal vs. behavioral** (what people say vs. what they do) and **qualitative vs. quantitative** (why and how vs. how many).[[ref:nng-methods]]

| Your question | Reach for |
| --- | --- |
| What problems and needs exist, and why? | Interviews, field studies, diary studies |
| How many people, how big is it? | Surveys, analytics |
| Can people use this? | Usability testing |
| Does the structure make sense? | Card sorting, tree testing |
| Which version performs better? | A/B tests |
| What do people actually do at scale? | Product analytics, session data |

### Interviews

The principles popularized by Rob Fitzpatrick's *The Mom Test* are worth tattooing somewhere: ask about their life, not your idea; ask about specific past events, not opinions about the future; and talk less.[[ref:mom-test]]

- Prefer "Tell me about the last time you..." to "Would you ever...?"
- Follow up on concrete examples.
- Treat compliments and "I'd definitely use that" as noise.
- Record with consent and note what you *saw* as well as what was said.
- If nothing surprised you, you probably asked about what you already believed.

### Surveys and their limits

Common failures: leading questions, double-barreled questions ("fast and reliable?"), unbalanced scales and unrepresentative samples. Pilot everything, keep it short, and decide beforehand which decision each question informs.

### Sampling and bias

Who you talk to caps what you can claim. Name your target group, recruit for the *behaviors* that define it, and be honest about who's missing. The usual suspects: confirmation bias (seeing what fits your belief), leading questions and social desirability (answers people think you want), sampling and survivorship bias (only hearing from people who stayed or are easy to reach) and researcher effects (your tone and reactions).

:::warning Common trap: "five users is enough"
NN/g's argument is about iterative qualitative testing with a small group of one user type, but it often gets stretched into a license for one small study about everything.[[ref:nng-five-users]] Use small samples to find problems iteratively, bigger ones to *measure*, and more groups when you have more kinds of users.
:::

### Ethics and privacy

Get informed consent that says what you record, how it's stored and who sees it. Minimize personal data and pay people fairly. If you use AI tools for transcription or analysis, you're sending participant data to a third party: check your policy, your consent wording and local law first.

:::exercise Try it: a one-page research plan (1 hour)
For a real question, write: the decision this informs, research questions, method and why, participants (who, how many, how recruited), interview guide or tasks, analysis approach, risks and report date. Then ask yourself: if the result came back the opposite, would we do anything differently? If not, rewrite the question.
:::

## 2. Usability testing

Usability testing watches real people try realistic tasks to find where the design fails. A solid test has:

- **Tasks written as goals**, not instructions: "You want to know what you owe this month," not "Click Billing."
- **Think-aloud** with minimal prompting in moderated sessions.
- **Success criteria defined beforehand.**
- **Observation first, interpretation later.**

Moderated sessions give depth and let you probe; unmoderated ones give scale and speed with less context.

### What to measure

- **Task success** (with or without help).
- **Time and errors**, when you need comparison.
- **Severity** of problems, usually by frequency, impact and persistence.
- **Standardized questionnaires** like the System Usability Scale (SUS) and Single Ease Question (SEQ), read against benchmarks and your own baseline, not as pass/fail.

### Turning findings into action

A list of observations isn't a result. Keep three layers separate: **observation** ("three of five missed the filter"), **interpretation** ("it doesn't look like a button") and **recommendation** ("make it a labeled control").

### 2026 shifts

- **Unmoderated and AI-moderated testing is cheaper.** Great for narrow, well-specified tasks. Check what the moderation actually did; a script that can't follow up misses the "why."
- **Prototypes are more realistic.** A working prototype is quick to build now, which improves validity, but a polished one invites feedback on polish and hides weak ideas.
- **You're testing behavior, not screens.** For AI features a test needs varied inputs and bad outcomes, not one demo path.

:::exercise Try it: five sessions (a week)
Write four tasks, run moderated sessions with five people from your target group, record with consent and write observations only after each. Afterwards group by task, rate severity and present the top three problems with evidence and a recommendation each.
:::

## 3. Synthesis

Synthesis is turning raw material into something decision-ready. A useful chain:

**Observation** → **Pattern** (across people) → **Insight** (why it matters) → **Recommendation.**

Skip steps and you get the classic failure: a deck of quotes and a list of opinions. A good insight is specific, backed by multiple pieces of evidence, explains behavior and implies a decision.

### Methods worth knowing

- **Affinity mapping:** group observations bottom-up. Resist sorting into categories you already had.
- **Thematic analysis:** a more rigorous way to code data and develop themes. Braun and Clarke's *reflexive* approach treats the researcher's interpretation as part of the method.
- **Jobs to be done:** frame needs as progress someone wants to make in a circumstance, not demographics or features.
- **Personas, carefully:** useful when built from real patterns, fiction when invented from assumptions.

:::framework Label the strength of every insight
**Strong:** observed across multiple participants *and* corroborated by a second source (analytics, another method). **Moderate:** across several participants in one method. **Weak:** one or two participants, or stated opinion. Say it in the deck. It's the single best habit for keeping stakeholders honest about what you know.
:::

:::exercise Try it: an evidence trail (2 hours)
Take your five sessions and produce five insights. Link each to the exact quotes or clips behind it and label its strength. Give them to a colleague and ask them to challenge one. Revise.
:::

## 4. Journey mapping

A journey map shows a person's experience over time as they pursue a goal: stages, actions, thoughts, emotions, touchpoints, and where the problems and opportunities lie. NN/g describes it as organizing user actions into a timeline with a lane of thoughts and emotions.[[ref:nng-journey-mapping]] Cousins include empathy maps, experience maps and **service blueprints**, which add the back-stage actions and systems behind each step.

What makes a map *useful*:

- **It's grounded in research.** If the emotions line is invented, the map is decoration.
- **It has one actor and a defined scope.** "The customer's journey" is too broad to act on.
- **It ends in decisions:** prioritized opportunities with owners.
- **It stays alive.** A map printed once and hung on a wall has already expired.

### 2026 shifts

Journeys now include chats, assistants and tools where your product is one step. Map those, and map where control moves between person and system. Also calibrate emotional low points with quantitative data (drop-off, support volume) rather than guessing.

:::exercise Try it: map one real journey (a day)
Pick one goal and one actor. Use at least five real sources (interviews, support tickets, analytics). Build the map and mark the evidence for each emotion. Choose the top three opportunities and say what you'd test first.
:::

## 5. Using AI in research

### Where AI helps

Transcription, first-pass coding and tagging, summarizing long transcripts, drafting interview guides, finding examples across large sets of notes. For well-defined, deductive tasks (apply this codebook to these transcripts), evidence points to moderate-to-good agreement with human coders. A 2026 systematic review of 30 studies, which I saw only in a secondary summary, reported agreement ranging from moderate to substantial (Cohen's kappa roughly 0.40 to 0.91, median about 0.72) and big time savings, with trouble on cultural nuance and context-dependent coding.[[ref:llm-coding-evidence]] Treat those numbers as indicative: the evidence base is small. The same summary found agreement lower for open-ended, inductive coding than for coding against a fixed codebook, and that humans still produced richer codes and theme synthesis. (Human coders also often agree with each other only moderately, so the benchmark isn't perfect either.)

### Where it fails

Some vendors sell "synthetic users": AI-generated participants who answer your questions. NN/g tested this directly by re-running three earlier studies, using ChatGPT and a dedicated synthetic-user product. What they found:

- Synthetic users were **overly agreeable** (they said they'd finished courses real learners hadn't).
- They produced **long lists of needs with no priority** ("synthetic users seem to care about everything").
- Their concept feedback was **favorable but vague**.
- Value was mostly limited to desk-research-style questions like describing a typical workday.

NN/g's recommendations: use them only to *supplement* real research (desk research, preparing studies, piloting an interview guide, drafting proto-personas), treat the output as hypotheses, disclose when findings are synthetic, avoid them for niche populations and low-maturity organizations that might mistake them for the real thing.[[ref:nng-synthetic-users]]

:::warning The risk is organizational, not technical
The danger isn't that a synthetic user is wrong. It's that a cheap, instant, confident answer replaces the slower, more uncomfortable work of talking to real people, especially in teams that already struggle to fund research.
:::

### A responsible protocol

1. **Decide what AI may do.** Transcription and first-pass tagging: usually fine. Final insights and decisions: no.
2. **Protect participants.** Check consent language, data handling and vendor terms; strip identifiers where possible.
3. **Keep the evidence trail.** Every AI theme must link back to underlying quotes, or it's unverified.
4. **Verify.** Spot-check quotes against recordings; models can paraphrase, merge or invent.
5. **Pilot and compare.** Code a sample both ways and note where they differ.
6. **Watch for sycophancy and sameness.** Models drift toward agreeable, average answers. Hunt for the outlier and the contradiction.
7. **Disclose** what AI did and what humans did.

:::exercise Try it: the comparison experiment (half a day)
Take five transcripts. Code them yourself first, no AI. Then have an AI tool code the same ones with the same codebook. Compare: what did it miss, add or get wrong, and where were its quotes inaccurate? Write a one-page protocol for how your team will and won't use AI in analysis.
:::

## 6. Researching AI products

AI features change what research needs to look at:

- **Trust and calibration.** Do people over-trust or under-trust it? Do they check its work? Study the behavior, not the stated attitude.
- **Failure modes.** Collect and categorize real failures: wrong, refused, unsafe, right for a different question, slow. Decide which matter most to users.
- **Wizard-of-Oz tests.** Simulate the feature with a person or scripted prototype before building it, to learn whether the interaction is worthwhile.
- **Longitudinal behavior.** Novelty fades. Does use persist past week one, and where does it quietly stop?
- **Evals as research.** Systematic evaluation against a rubric is becoming a core product habit; Product Talk frames AI evals as a new discovery habit.[[ref:product-talk]] Researchers are well placed to write the rubric, collect representative inputs and review results with real users.

## Case: five onboarding sessions

Let's follow a small study from question to insight so you can see how the pieces connect.

**The decision.** A product team is deciding whether to ship a new in-app onboarding checklist or keep the old product tour. Time to decide: two weeks.

**The questions.** (1) Can new admins complete setup without help? (2) Where do they hesitate? (3) Does the checklist change what they do first?

**The plan.** Moderated usability sessions with five new admins from the target segment (recruited from a waitlist, not colleagues), 40 minutes each, with a prototype that has real data. Tasks are goals: *"You've just signed up for your team. Get your first project ready for two colleagues."* Success is defined beforehand: invites sent and one project created without hints.

**What happens.** Sessions are recorded with consent. The note-taker logs observations in a shared sheet: time, what happened, and a direct quote if there is one. No interpretations yet.

| Observation | Participants | Strength so far |
| --- | --- | --- |
| Skipped "Connect calendar" without reading it | 4 of 5 | Moderate |
| Said "I'll do that later" about integrations, then forgot | 3 of 5 | Moderate |
| Completed "Invite team" in under 30 seconds | 5 of 5 | Strong for this task |
| Looked for progress indicator, found none | 3 of 5 | Moderate |
| Asked "what happens if I skip this?" | 4 of 5 | Moderate |

**From observation to insight.** The team groups observations and writes insights, each with a recommendation and a strength:

1. *Admins treat optional-looking steps as skippable and rarely return to them.* (Moderate; supported by skipping, "later" quotes and no revisits within the session.) → Mark the two steps that affect core value as required, and say *why*.
2. *People can't tell how much is left.* (Moderate.) → Add a visible progress indicator and a "~3 min left" estimate.
3. *Inviting teammates is easy and satisfying.* (Strong for this task.) → Keep it early, it creates momentum.

**What they don't claim.** Five people can't tell you what percentage of all admins will skip calendar connection. The report says so: *"These are qualitative findings. To measure the effect, we recommend an A/B test with activation as the primary metric."* That sentence is what makes the research trustworthy.

**The outcome.** The team ships the checklist with required steps and progress, plus an experiment. One decision, informed by evidence, with honest limits.

## A research plan template

\`\`\`text
Decision this informs:   [what will we do differently depending on the answer?]
Research questions:      [2 to 4, specific and answerable]
Method and why:          [method; why it fits these questions]
Participants:            [who, how many, how recruited, who is excluded]
Materials:               [prototype, guide, tasks, consent form]
Success measures:        [what counts as success, defined in advance]
Analysis plan:           [how you will code and synthesize; who reviews]
Risks and limits:        [bias, sample, prototype fidelity, AI tools used]
Timeline and owner:      [dates; who reports to whom]
What would change my mind: [the result that would make us choose differently]
\`\`\`

That last line is the underrated one. If nothing could change your mind, you're not researching, you're confirming.

## Better interview questions

| Instead of... | Ask... | Why |
| --- | --- | --- |
| "Would you use a feature that does X?" | "Tell me about the last time you needed to do X." | Past behavior beats predictions |
| "Do you like this design?" | "What would you do next? What did you expect to happen?" | Opinions are cheap; expectations are informative |
| "Is the navigation clear?" | "Where would you look to find your invoices?" | Tasks reveal problems; ratings hide them |
| "Don't you think it's too complicated?" | "How did that feel?" | Leading questions get agreement |
| "How much would you pay?" | "What are you paying for this today, and what else did you consider?" | Hypothetical pricing is unreliable |
| (silence is awkward, so you fill it) | (wait three more seconds) | People often say the real thing after a pause |

## Common research mistakes

- **Recruiting friends and colleagues.** They're polite and they know too much. Recruit the real segment.
- **Testing with a prototype that only has one path.** People stay on the rails; real use doesn't. Add realistic data and dead ends.
- **Helping too soon.** If they're stuck, wait. Where they struggle is the finding.
- **Reporting opinions as findings.** "People hated it" isn't a finding. "Four of five abandoned at step 3 and said X" is.
- **Skipping the evidence trail.** Every insight should link to quotes and clips.
- **Presenting too many findings.** Five clear, prioritized insights beat thirty. Rank by severity and decision impact.
- **Treating research as a one-off.** Even one hour a week of customer contact beats a big study once a year.

## Where to go deeper

- **Quant literacy:** sampling, confidence intervals, effect size, and why a small difference in a big sample might not matter.
- **Product analytics:** funnels, retention and event data (see [[ch:06]]).
- **Research operations:** recruitment, consent, repositories, tooling, so research can happen weekly, not just in crisis.
- **Facilitation and storytelling:** evidence only changes decisions when stakeholders feel it (see [[ch:07]]).
- **Accessibility research:** include people who use assistive technology as participants (see [[ch:11]]).

This edition explains user research from the ground up: what it is, the different kinds, the main methods and when to use each, how to run a usability test, how to turn notes into insights, and what journey maps are for. If you want what's changing in 2026 (AI in research, synthetic users and so on), flip to the *2026 edition* at the top.

## What user research is

User research is the systematic study of the people who use (or might use) a product: their goals, behaviors, contexts, needs and frustrations. "Systematic" is the key word. Chatting with a friend about your app is not research. Deciding what you need to learn, choosing a method that can answer it, talking to the right people and analyzing what you find honestly: that's research.

It answers three big kinds of question:

- **What's the problem?** Who are our users, what are they trying to do, and where does it hurt? (*generative* or *exploratory* research)
- **Does our solution work?** Can people use this design, and where do they get stuck? (*evaluative* research)
- **How much, how many, how often?** How common is this behavior, and did our change make a difference? (*quantitative* or *measurement* research)

:::definition User research vs. market research
**Market research** asks who will buy and how many (segments, demand, pricing). **User research** asks how people behave and why (tasks, mental models, pain points). They overlap, but a market survey saying "70 percent want faster checkout" won't tell you *why* checkout feels slow.
:::

## Four ways to classify methods

There are dozens of research methods. You don't need to memorize them all. You need to understand the dimensions they vary on, so you can pick the right one. NN/g's well-known landscape uses two axes, and a couple more are worth adding.[[ref:nng-methods]]

### 1. Attitudinal vs. behavioral

- **Attitudinal** methods capture what people *say*: their opinions, beliefs and stated preferences. Surveys and interviews are mostly attitudinal.
- **Behavioral** methods capture what people *do*. Usability tests, analytics and field observation are behavioral.

This distinction matters because people's words and actions often differ. Someone may say they always read the terms before signing up, then click "accept" in half a second. When the two disagree, behavior usually wins.

### 2. Qualitative vs. quantitative

- **Qualitative** research gathers rich, non-numerical data from a small number of people to understand *why* and *how*. Output: observations, quotes, themes.
- **Quantitative** research gathers numerical data from many people to understand *how many* and *how much*. Output: percentages, averages, comparisons.

Qualitative tells you the story; quantitative tells you how big the story is. Good teams use both.

### 3. Generative vs. evaluative

- **Generative** research happens early. You don't have a solution yet; you're exploring the problem space.
- **Evaluative** research tests something that exists: a sketch, prototype or live product.

### 4. Context of use

- **Natural** context: watching people in their real environment (field studies, analytics).
- **Scripted** context: you give people specific tasks (usability tests).
- **Decontextualized:** questions without the product in front of them (interviews, surveys).

:::framework Choosing a method in one sentence
Ask: *Do I need to know what people do or what they think? Do I need depth or numbers? Am I exploring a problem or testing a solution?* The answers point to the method.
:::

## The core methods, explained

### User interviews

**What:** a one-on-one conversation (usually 30 to 60 minutes) to understand someone's experiences, goals and pain points.

**When:** early, to understand a problem space, and any time you need to know *why*.

**How it works:** you prepare a discussion guide with open questions, then follow the conversation where it's interesting. The best questions ask about real past events: "Tell me about the last time you planned a trip." Avoid hypothetical futures ("Would you use...?") because people are poor at predicting their own behavior. Rob Fitzpatrick's *The Mom Test* is a short, practical guide to this.[[ref:mom-test]]

**Watch out for:** leading questions, talking too much, and treating compliments as evidence.

### Field studies

**What:** observing and interviewing people *where they actually do the work*: at their desk, in a warehouse, in a clinic.

**When:** you need to understand workflows, workarounds and environment, especially in complex or professional settings.

**Why it's powerful:** you see the sticky note on the monitor with a password, the spreadsheet that really runs the process, the interruption every four minutes. People rarely mention these in interviews because they've stopped noticing them.

### Diary studies

**What:** participants record experiences over days or weeks, through short entries, photos or prompts.

**When:** the behavior happens over time or at unpredictable moments (a habit, a recurring task, a long purchase decision).

**Trade-off:** rich longitudinal data, but participants drop off and need nudging.

### Surveys

**What:** a structured set of questions sent to many people.

**When:** you need to measure how common something is, or compare groups. Not great for discovering problems you haven't thought of.

**How to do it well:** keep it short; ask one thing per question; use balanced scales; pilot it with a few people first; and decide in advance what decision each question informs. A badly worded survey produces precise-looking nonsense.

### Card sorting

**What:** participants group topics or features into categories that make sense to them.

**Types:** *open* (participants create and name the groups) and *closed* (you provide the categories).

**When:** designing or restructuring navigation and information architecture.

### Tree testing

**What:** participants try to find items in a text-only version of your navigation (the "tree"), without any visual design.

**When:** after card sorting or before building navigation, to check whether a structure works.

**Why it's useful:** it isolates the structure and labels from visual design, so you know whether problems come from the words and hierarchy.

### Usability testing

**What:** watching people attempt realistic tasks with a design to find where it fails. It's the most common evaluative method, so it gets its own section below.

### A/B testing

**What:** showing two versions to different random groups of real users and comparing a metric (like completion rate).

**When:** you have enough traffic and want to measure which version performs better.

**Limitation:** it tells you *which* version won, not *why*. Pair it with qualitative research.

### Analytics

**What:** data on how people actually use a live product: page views, funnels, retention, events.

**When:** to find *where* problems are (where people drop off) and to measure change over time.

**Limitation:** it shows what happened, never why. A drop-off is a question, not an answer.

### Heuristic evaluation

**What:** experts review an interface against established usability principles, such as NN/g's ten heuristics.[[ref:nng-heuristics]]

**When:** a quick, cheap check before user testing. It finds obvious problems but isn't a substitute for watching real users.

| Method | Says/Does | Qual/Quant | Best moment |
| --- | --- | --- | --- |
| Interviews | Says | Qual | Early, understanding the problem |
| Field studies | Does + says | Qual | Early, complex workflows |
| Diary studies | Does + says | Qual | Behavior over time |
| Surveys | Says | Quant | Measuring prevalence |
| Card sorting | Says | Both | Designing navigation |
| Tree testing | Does | Quant | Validating navigation |
| Usability testing | Does | Mostly qual | Testing a design |
| A/B testing | Does | Quant | Comparing versions live |
| Analytics | Does | Quant | Finding and measuring problems |

## Planning a study

Most research goes wrong before the first session, at the planning stage. A good plan answers:

1. **What decision will this inform?** If no decision depends on it, don't run it.
2. **What are the research questions?** Specific and answerable: "Why do new admins abandon setup at the integration step?" not "What do users think?"
3. **Which method, and why?** Match it to the questions using the dimensions above.
4. **Who are the participants?** Recruit people who match the behaviors you care about, not just whoever's available. Colleagues and friends are almost always the wrong participants: they're polite and know too much.
5. **How many?** For qualitative problem-finding, small numbers (often five to eight per distinct user group) reveal most major issues. NN/g's well-known argument for testing with five users is about *iterative* qualitative testing of one group, not a rule for every study.[[ref:nng-five-users]] For measurement, you need far more.
6. **What will you do with the results,** and by when?

### Bias: the enemy of good research

Research can mislead you in predictable ways:

- **Confirmation bias:** noticing evidence that supports what you already believe.
- **Leading questions:** "Don't you find this confusing?" invites a yes.
- **Social desirability:** people give the answers they think are "good."
- **Sampling bias:** you only hear from people who are easy to reach or already love the product.
- **The observer effect:** people behave differently when watched.

You can't remove bias entirely, but naming it and designing around it (neutral questions, the right participants, more than one method) reduces it a lot.

### Ethics and consent

Participants are doing you a favor. Tell them what you're recording and why, how the data will be stored, and that they can stop at any time. Get written consent, pay them fairly, and protect personal information.

## Usability testing in depth

Usability testing is the workhorse of design research, so it's worth understanding properly.

### The basic setup

A participant tries to complete realistic tasks with your design while you observe. In a **moderated** test you're present (in person or remote) and can ask follow-up questions. In an **unmoderated** test, software gives the tasks and records the session, which is faster and cheaper but loses the chance to ask "why."

### Writing good tasks

Tasks should be **goals**, not instructions:

- Bad: "Click on Settings, then Billing, then Download invoice."
- Good: "Your accountant needs last month's invoice. Get it for them."

The bad version tests whether people can follow directions. The good one tests whether your design makes sense.

### Think-aloud

Ask participants to say what they're thinking as they work. "I'm looking for... I expected this to... hmm, that's not what I wanted." It's the closest you get to seeing inside someone's head. Your job is mostly to stay quiet. When they get stuck, resist helping; where they struggle *is* the finding.

### What to measure

- **Task success:** did they complete it, with or without help?
- **Time on task and errors:** useful when comparing versions.
- **Severity:** how bad is each problem? A common way to rate it combines frequency (how many hit it), impact (how badly it blocks them) and persistence (does it keep happening).
- **Questionnaires:** standard ones like the System Usability Scale (SUS, a 10-question score) and the Single Ease Question (SEQ, "How easy was this task?" on a 1 to 7 scale) let you compare over time.

### Reporting findings

Keep three things separate:

- **Observation:** "Four of five participants didn't notice the filter button."
- **Interpretation:** "It doesn't look clickable."
- **Recommendation:** "Make it a labeled button."

Mixing them up ("users hate the filter") makes findings easy to argue with and hard to act on.

:::example A tiny usability test, start to finish
**Goal:** check if new users can create their first project. **Tasks:** two goal-based tasks. **Participants:** five people who recently signed up for similar tools. **Sessions:** 30 minutes, moderated, recorded with consent. **Finding:** four of five looked for "New project" in the sidebar, but it's only in the top-right corner. **Recommendation:** add the action to the sidebar where people expect it. Total cost: one day. Value: fixed a problem every new user would have hit.
:::

## Synthesis: notes to insights

After sessions you have pages of notes, quotes and recordings. **Synthesis** turns that pile into something you can act on.

### The chain

**Observation** (what happened) → **Pattern** (it happened across several people) → **Insight** (why it matters) → **Recommendation** (what to do).

An *insight* isn't just a summary. "Users found onboarding confusing" is a summary. "New users skip optional-looking steps and rarely return, so the two steps that unlock core value get missed" is an insight: specific, explains behavior, implies a decision.

### Common synthesis methods

- **Affinity mapping:** write each observation on a note, then group similar notes and name the groups. Bottom-up: let the groups emerge instead of forcing your existing categories.
- **Thematic analysis:** a more rigorous version where you "code" the data (label each relevant bit) and develop themes from the codes.
- **Personas:** fictional-but-research-based profiles representing key user types. Useful when they're built from real patterns; misleading when invented from assumptions.
- **Jobs to be done (JTBD):** frames needs as the progress someone is trying to make in a situation. "When I'm closing the month, I want to see what's unpaid so I can chase it before the deadline."

:::framework How confident are we?
Label each insight: **strong** (seen across many participants and backed by another source like analytics), **moderate** (several participants, one method) or **weak** (one or two people, or stated opinion). Being honest about confidence makes people trust your research more, not less.
:::

## Journey mapping

A **customer journey map** shows the end-to-end experience of someone trying to achieve a goal, over time.[[ref:nng-journey-mapping]]

### What's in one

- **Actor:** whose journey (one persona or user type).
- **Scenario and goal:** what they're trying to do.
- **Phases:** the big stages (for example: discover, sign up, set up, use, renew).
- **Actions:** what they do in each phase.
- **Thoughts and emotions:** what they're thinking and feeling, often drawn as a line going up and down.
- **Touchpoints:** where they interact with you (website, email, support, app).
- **Opportunities:** where you could make things better.

### Related maps

| Map | What it shows | Use it for |
| --- | --- | --- |
| Empathy map | What a user says, thinks, does and feels | Building shared understanding quickly |
| Journey map | One person's experience over time | Finding pain points across a journey |
| Experience map | A general human experience, not tied to a product | Seeing the bigger context |
| Service blueprint | The journey plus everything behind the scenes (staff, systems) | Fixing operational and handoff problems |

### Making maps useful

A journey map based on guesses is a nice poster and nothing more. Build it from research (interviews, support tickets, analytics), keep the scope narrow (one actor, one goal), and end with prioritized opportunities and owners.

## A research cycle

1. **Frame:** what decision, what questions?
2. **Choose:** method, participants, sample size.
3. **Prepare:** guide or tasks, consent, prototype.
4. **Collect:** run sessions; take notes on what you see, not what you conclude.
5. **Synthesize:** observations → patterns → insights → recommendations.
6. **Share:** short, prioritized, with evidence and confidence labels.
7. **Act and measure:** change the design, then check whether it helped.

Then repeat. The most effective teams don't do one big study a year; they talk to users a little, often.

| Generative research | Exploring a problem before you have a solution |
| Evaluative research | Testing a solution that exists |
| Attitudinal | What people say |
| Behavioral | What people do |
| Moderated test | A researcher is present during the session |

| Affinity mapping | Grouping observations to find patterns |

:::
