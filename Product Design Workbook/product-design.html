In 2026 the honest answer is often yes. Anyone with an AI tool can now produce a clean, tidy, perfectly aligned interface. NN/g's 2026 outlook puts it bluntly: decent-looking UI is getting cheap, so surface polish is easy to replace, and what's harder to automate is taste, context, critical thinking and judgment.[[ref:nng-state-ux-2026]]

That doesn't make visual design less important. It changes what you're being paid for. Nobody needs you to nudge pixels. They need you to look at five good-looking options and know *which one is right for this product and why*, then direct the work until it is.

So this chapter isn't a tour of visual design basics (you know those). It's about turning what you already do by feel into something you can explain, repeat and teach. We'll go through the five skills in your list: composition, typography, color, layout and icons. For each: how the pros think, what's shifting in 2026, and one thing to try.

:::pull
Production is getting cheap. Judgment is not. Learn the craft well enough to direct it, critique it and defend it.
:::

:::definition Craft vs. taste
**Craft** is executing: aligning, spacing, building a palette that holds up. **Taste** is judging: knowing which of five acceptable options is right here, and being able to say why. AI is catching up on craft fast. Taste is the part you train on purpose.
:::

## 1. Composition: hierarchy

Most "this looks off" feedback is really "I don't know where to look." Fixing that isn't about styling. It's about deciding what matters most, then making the screen agree with you.

### The five-pass method

Try this on any screen, yours or inherited.

1. **Write the job.** One sentence: what is the person here to do? For a billing page: *"See what I owe and pay it."* If you can't write it, the problem isn't visual yet.
2. **Rank everything.** Sort every element into three tiers. Tier 1 is what they came for (one or two things, max). Tier 2 supports the decision. Tier 3 is everything else: metadata, help, rarely used controls.
3. **Give weight to match the rank.** Use the levers in order of strength: size and position, then weight and contrast, then space, then color, then containers. Color comes late because it works best when everything else is quiet.
4. **Squint and subtract.** Blur the screen. What stands out? Now remove one thing (a border, a divider, a shadow) and look again. Keep going until it gets worse, then put the last thing back.
5. **Stress it.** Long names, empty values, errors, another language. A hierarchy that only survives perfect sample data isn't one.

:::example Before and after: an invoices table (hypothetical)
**Before.** A 14px title. Six equally loud filter dropdowns. Two filled buttons ("Export" and "New invoice") fighting each other. Bold column headers, borders on every row, and five saturated status colors. Everything is Tier 1, so nothing is.

**After, in order.** (1) Title up to 28px. (2) One filled button, "New invoice"; "Export" becomes a text button. (3) Six dropdowns collapse into search plus one "Filters" control. (4) Row borders go; 12px of padding and one hairline under the header do the work. (5) Headers become small, regular and muted. (6) Status becomes a dot plus a label, with color only for *overdue*. (7) Amounts right-aligned with tabular numerals.

Nothing was added. About twenty lines of decoration were removed, and the overdue rows now pop because they're the only colored thing on the page.
:::

### Grouping rules to work by

- **2:1 spacing.** Space *between* groups should be roughly double the space *inside* a group. A label 4px above its input means the gap between fields should be 16 to 24px. This one rule fixes a huge share of "messy" forms.
- **Labels belong to the nearest control.** A label equidistant from two fields is ambiguous.
- **Look-alikes promise the same behavior.** If two items look identical and one navigates while the other opens a menu, you've made a false promise.
- **Containers are noise.** Every card or border is something the eye has to process. Add one only when spacing and alignment can't do the job.

:::warning Common trap: more emphasis, not less
When something feels unclear, the instinct is to make it bolder, bigger or more colorful. Nine times out of ten the fix is to *demote everything else*. If you want one thing to stand out, make the others quieter.
:::

### Density is a decision

| Context | What people need | So you design for |
| --- | --- | --- |
| Checkout, onboarding | Confidence, few mistakes | Low density, one decision per view, big targets |
| Daily pro tools (inbox, console) | Speed, scanning | Compact rows, keyboard shortcuts, persistent context |
| Data analysis | Comparing many values | Dense tables, aligned numbers, minimal decoration |
| Reading | Comprehension | Narrow column, generous line height |

If your users vary a lot, offer a density setting and define it in tokens (say 40px rows vs 32px) so the whole system shifts together.

### 2026 shift: sameness

Shared component libraries and generative tools pull everyone toward the same safe look. NN/g notes UI is getting cheaper to produce partly *because* of design systems and standard components, so differentiation moves elsewhere.[[ref:nng-state-ux-2026]] Your edge is specificity: a point of view about density, tone and behavior that fits one product.

Meanwhile, platform styles are moving. Apple introduced Liquid Glass in 2025 (a translucent material across iOS 26 and sibling platforms) and Google introduced Material 3 Expressive.[[ref:apple-hig-materials]][[ref:material3]] Early reaction to Liquid Glass focused on legibility over busy backgrounds. As I understand Apple's guidance (confirm it in the HIG), glass belongs to the floating control layer, not to content, and you should test legibility over real backgrounds in light and dark.

:::exercise Try it: rebuild five, critique five (a weekend)
Pick five interfaces you admire. Recreate each from scratch, measuring spacing and type as you go. Then write three sentences per screen: the first, second and third read; one decision you wouldn't have made; one you'd steal. Recreating forces you to see decisions you'd otherwise skim past.
:::

## 2. Typography: a system

Type is most of your interface, so a small typographic system does more than any amount of tweaking.

### Build the scale first

Choose a handful of sizes related by a ratio (1.2 or 1.25 are friendly) and name them by role, not by pixel.

| Step | Ratio 1.2 | Ratio 1.25 | Typical role |
| --- | --- | --- | --- |
| -1 | 13.3px | 12.8px | Caption, helper text |
| 0 | 16px | 16px | Body |
| 1 | 19.2px | 20px | Lead, small heading |
| 2 | 23px | 25px | Section heading |
| 3 | 27.6px | 31.3px | Page heading |
| 4 | 33.2px | 39.1px | Display |

Dense tools usually compress this (12, 13, 14, 16, 20, 24, 32). The right scale is the smallest one that gives you the roles you need. Ship it as tokens so nobody types a raw size.

\`\`\`css
:root {
  --text-caption: 0.8125rem;  /* 13px */
  --text-body:    1rem;       /* 16px */
  --text-h3:      1.5rem;     /* 24px */
  --text-h1:      2.5rem;     /* 40px */
  --leading-tight: 1.15;
  --leading-body:  1.6;
}
\`\`\`

### The numbers worth memorizing

- **Line length:** about 45 to 75 characters for reading. Longer and the eye gets lost on the return.
- **Line height:** around 1.5 to 1.7 for body, 1.1 to 1.3 for headings. Big text needs tighter leading because the gaps look bigger.
- **Heading spacing:** roughly twice as much space above a heading as below, so it clearly belongs to what follows.
- **Weights:** separate levels with weight (regular, medium, semibold) before adding more sizes. Avoid thin weights for small text.
- **Numbers in data:** use tabular figures (\`font-variant-numeric: tabular-nums\`) and right-align numeric columns, or comparisons turn into guesswork.

### Fluid type, with the math

Fluid type scales smoothly between a minimum and maximum. To go from 16px at a 320px viewport to 18px at 1,280px:

- Slope = (18 − 16) ÷ (1280 − 320) = 0.2083vw
- Intercept = 16 − (0.002083 × 320) = 15.333px ≈ 0.958rem
- Result: \`font-size: clamp(1rem, 0.958rem + 0.208vw, 1.125rem);\`

Quick check: at 320px you get 15.333 + 0.667 = 16px; at 1,280px, 15.333 + 2.667 = 18px. Keep the bounds and intercept in \`rem\` so users' text-size settings still work, which WCAG expects (text resizable to 200 percent, SC 1.4.4).[[ref:wcag22]]

:::warning Common trap: fixed-height text boxes
WCAG 2.2 also needs content to reflow at 320 CSS px (SC 1.4.10) and survive user text-spacing overrides (SC 1.4.12: line height 1.5, paragraph spacing 2×, letter spacing 0.12em, word spacing 0.16em).[[ref:wcag22]] Fixed heights on text containers are what break first. Let things grow, and test at 200% zoom.
:::

### Choosing a typeface

Skip "I like it." Score candidates on: legibility at 12 to 14px (can you tell I, l and 1 apart?), weights available, tabular figures, language coverage, personality, file size, and licensing. For product UI a single neutral sans with a good range is usually enough. If you're unsure, use the system font and put brand expression into color, spacing and voice. Custom fonts also cost bytes and layout shift: load only what you use, prefer a variable font, use \`font-display: swap\`, and pick a fallback with similar metrics.

### 2026 shift: type tech

- One **variable font** file gives you many weights and widths, which fits fluid type neatly.
- CSS keeps getting better at wrapping (\`text-wrap: balance\` for headings, \`text-wrap: pretty\` for paragraphs). Support moves quickly, so check Baseline before relying on anything.[[ref:webdev-baseline]]
- **Localization is typography.** Translations often run 20 to 40 percent longer; CJK scripts need more line height; Arabic and Hebrew mirror the layout. Use logical properties (start/end, not left/right) and test with pseudo-localized strings.

:::exercise Try it: stress-test your type (half a day)
Write your type tokens, then break them four ways: 200% zoom, WCAG text-spacing overrides, strings 40% longer, and a right-to-left layout. Fix the rule behind each failure, not just the screen.
:::

## 3. Color: roles and contrast

If you pick colors as swatches, you'll fight them forever. Pick them as **roles** and the rest gets easier.

### Think in roles

Name colors by what they do (\`text-muted\`, \`surface-raised\`, \`accent\`, \`danger\`), not what they look like (\`gray-200\`, \`blue-600\`). Roles let you theme, add dark mode and rebrand without redesigning every screen. A solid product palette is mostly neutrals, one accent for actions and location, and status colors that are always paired with an icon or label. In the Design Tokens format a role looks like this (shape only; tools vary):[[ref:dtcg-2025]]

\`\`\`json
{ "color": { "text": {
    "primary": { "$type": "color", "$value": "{color.neutral.900}" },
    "muted":   { "$type": "color", "$value": "{color.neutral.600}" } } } }
\`\`\`

### Contrast with real numbers

WCAG 2 wants 4.5:1 for normal text, 3:1 for large text and for UI components (SC 1.4.3 and 1.4.11), and never color alone to carry meaning (SC 1.4.1).[[ref:wcag22]] Intuition fails here, so check. I computed these against white:

| Color | Ratio | Text (4.5:1)? | UI or large (3:1)? |
| --- | --- | --- | --- |
| #1e2533 (near-black) | 15.3:1 | Yes | Yes |
| #5b6478 (muted gray) | 5.9:1 | Yes | Yes |
| #767676 (lightest neutral gray that passes) | 4.5:1 | Barely | Yes |
| #9ca3af | 2.5:1 | **No** | **No** |
| #e4e4e7 (common divider) | 1.3:1 | No | No |
| #16a34a (typical "success" green) | 3.3:1 | **No** | Yes |
| #15803d (darker green) | 5.0:1 | Yes | Yes |
| #d97706 (amber) | 3.2:1 | **No** | Yes |
| #b45309 (darker amber) | 5.0:1 | Yes | Yes |

Three takeaways. Popular mid-tones (bright green, amber) often fail as text on white, so you need darker variants for text. A decorative divider can sit below 3:1, but a border that *defines* an input is a component and needs 3:1. And ratios depend on the pair: a color that passes on white can fail on a tinted surface, so always check the real background.

:::warning Common trap: "APCA is replacing WCAG 2 contrast"
It isn't, as of this writing. The W3C's WCAG 3.0 draft (dated 10 September 2026) says WCAG 3 does not replace WCAG 2 and still marks the contrast method as to be determined.[[ref:wcag3-draft]] Adrian Roselli's April 2026 summary says APCA was removed from the July 2023 draft and nothing is decided; his advice is to keep meeting WCAG 2 and document any exception with legal advice.[[ref:roselli-wcag3]] Build to WCAG 2.2; treat APCA as an extra check.
:::

### Build scales in OKLCH

HSL lies about brightness: two colors with the same HSL lightness can look wildly different. **OKLCH** (lightness, chroma, hue) keeps lightness perceptually even, so step 600 of every hue has similar contrast. That makes systematic scales practical, and the Design Tokens spec supports OKLCH and Display P3 directly.[[ref:dtcg-2025]]

A workable recipe: pick a hue and chroma; set 10 lightness steps (say 97% down to 25%); reduce chroma at the extremes; check contrast against *your actual surfaces*; then map steps to roles.

\`\`\`css
:root {
  --accent-100: oklch(0.95 0.04 260);
  --accent-600: oklch(0.55 0.20 260);
  --accent-700: oklch(0.48 0.20 260);
  --color-accent-solid: var(--accent-600);
  --color-accent-text:  var(--accent-700);
  --color-accent-subtle: var(--accent-100);
}
\`\`\`

Those values show the structure; always verify real ratios with a checker.

### Dark mode, status, data

- **Dark mode is its own palette.** Use dark grays (not pure black), build elevation with *lighter* surfaces, reduce accent saturation a bit, and recheck contrast. Inverting a light palette looks bad.
- **Status colors** need an icon and label, and not too many of them. Keep the normal state neutral so exceptions stand out.
- **Color blindness:** roughly 8 percent of men of Northern European descent have some form, mostly red-green. Differences in *lightness* survive best. If the design still works in grayscale, it works for most people.
- **Text over images or glass** is the classic failure. Put text on a solid or scrimmed panel and test against the worst-case background.
- **Charts:** use 5 to 8 distinct categorical colors, a steady lightness ramp for sequential data, and gray out everything except what you want people to notice. Label directly when you can.

:::exercise Try it: audit a palette (1 to 2 hours)
List every text and component color in a product and every surface it sits on. Compute a ratio for each pair in a spreadsheet. Count failures by role. Fix the roles, not the screens, then re-run and compare.
:::

## 4. Layout and grids

### One spacing scale

Pick a base unit (4 or 8px) and allow only a few steps.

| Token | Value | Use |
| --- | --- | --- |
| space-1 | 4px | Icon to label |
| space-2 | 8px | Inside compact controls |
| space-3 | 12px | Control padding |
| space-4 | 16px | Default gap, card padding |
| space-5 | 24px | Between groups |
| space-6 | 32px | Between sections |
| space-7 | 48px | Page padding |

Two habits make it stick: use the same token for the same relationship every time, and separate *inset* (padding inside a container) from *stack* (gaps between siblings) in your naming. That stops the bug where changing one padding silently shifts a gap somewhere else.

### Grids, intrinsically

On a 1,200px area with a 12-column grid and 24px gutters, each column is (1200 − 11×24) ÷ 12 = 78px. Nine columns is 894px; three is 282px. You rarely compute this by hand since CSS Grid does it, but the numbers expose designs that only work at one width.

\`\`\`css
/* responsive cards, no breakpoints */
.cards { display: grid; gap: var(--space-4);
         grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); }

/* app shell: nav | main | optional panel */
.shell { display: grid; min-height: 100vh;
         grid-template-columns: 17rem minmax(0, 1fr); }
.shell:has(.panel) { grid-template-columns: 17rem minmax(0, 1fr) 20rem; }
\`\`\`

\`minmax(0, 1fr)\` is the quiet hero: it stops wide content (a table, a long word) from blowing out the column.

### Container-aware components

Instead of asking "how wide is the screen?", ask "how much room does *this component* have?"

\`\`\`css
.card-wrap { container-type: inline-size; }
.card { display: grid; gap: var(--space-3); }
@container (min-width: 28rem) { .card { grid-template-columns: 8rem 1fr; } }
\`\`\`

The same card goes two-column in a wide area and stacks in a sidebar. When you spec a component now, list its *container* width ranges the way you used to list breakpoints. (Container style queries reached Baseline Newly available in May 2026 per web.dev's digest.[[ref:webdev-baseline]])

### Tables that work

- **Align** text left, numbers right, and only fixed-width things (checkboxes, icons) centered.
- **Row height:** about 32px compact, 40 default, 48 to 56 comfortable; offer a density toggle for heavy users.
- **Separate** with whitespace and a single hairline under the header before you reach for a full grid of borders.
- **Sticky header and first column** for large data.
- **Never** hide the only way to do something behind hover; it fails on touch and keyboard.
- **States:** empty, loading (skeleton rows that match the layout), error, "no results" (offer to clear filters).
- **Small screens:** scroll horizontally with a sticky identifier column if people compare; use stacked cards if they look things up.

### Forms and small screens

One column beats two for almost every form. Labels go above fields, errors next to or under them (and linked in code). On phones, remember thumb reach (primary actions low), keyboards that cover half the screen, safe-area insets, and WCAG 2.2's 24 by 24 CSS px minimum target (platform guidance for touch is bigger, often 44 to 48).[[ref:wcag22]]

:::exercise Try it: spec a layout in words and code (2 hours)
Take a dense screen. Write its grid, spacing tokens, container width ranges and what changes at each. Build it with Grid and one container query. Test at 320, 768, 1,280 and 1,920px, with longer text and at 200% zoom. Note what your spec missed.
:::

## 5. Icons and illustration

### Icons as a family

If you maintain a set, specify these so they behave like one:

| Property | Typical spec |
| --- | --- |
| Grid | 24px canvas, 2px safe margin |
| Stroke | One weight (1.5 or 2px), one cap and join style |
| Corners | One or two radii, used consistently |
| States | Outline by default, filled for active |
| Sizes | 16, 20, 24, 32; redraw detail rather than scaling |

Prefer familiar metaphors (magnifier, house, gear), test unfamiliar ones with five people ("what does this mean?"), and add a label when they fail. Icon-only buttons need an accessible name, and a visible tooltip on hover *and* keyboard focus. Even a 20px icon should have a target of at least 24 by 24 CSS px.

\`\`\`html
<button type="button" aria-label="Delete invoice 1042">
  <svg aria-hidden="true" focusable="false" width="20" height="20">…</svg>
</button>
\`\`\`

**Icon, label or both?** Universal actions (close, search) can be icon-only. Most other actions want both. Navigation wants labels first. Status always wants icon plus text.

### Art direction

For product work, spot illustrations (empty states, onboarding, confirmations) earn their keep. A one-page art direction brief should answer: what job the image does, exact palette, line weight and shape language, perspective, how people are depicted, tone (three words and three anti-words), and five dos and don'ts. For empty states let the drawing clarify, but put the value in the words: what will appear here, why it matters, what to do first.

### 2026 shift: generated art

Generating one image is trivial; generating a hundred that feel like one brand is hard. The skill becomes **art direction**: define the style tightly, then reject what drifts. Set rules early: where generated assets are allowed, log the tool, prompt, date and license for each, decide when you disclose, review for stereotypes, and always write alt text that conveys function. Also avoid defaulting to sparkles for anything AI; NN/g notes users are tired of low-value AI features, and generic AI iconography signals exactly that.[[ref:nng-state-ux-2026]]

:::exercise Try it: write a style guide a model could follow (2 hours)
Write a one-page art direction guide, use it to generate ten images, and count how many you'd ship. Revise the guide until at least seven of ten work. The guide is the deliverable.
:::

## Putting it together

Here's how the five skills combine on a B2B "Access and permissions" page. It starts with an 18px title, bordered cells, six role badges in six colors, two filled buttons, light-gray icon-only row actions (#9ca3af, 2.5:1) and 56px rows showing 9 users.

1. **Composition.** Job: find a person and change their access. One filled button ("Invite"); export goes in a menu; add search.
2. **Type.** Title to 28px; table text 14px at 1.4; headers 13px, muted; numbers right-aligned and tabular.
3. **Color.** Six badge colors become one neutral style, with a tint for "Admin" only (the risky role). Row icons move from 2.5:1 to a muted text color at 5.9:1, with visible focus.
4. **Layout.** 44px rows (32px compact option), no cell borders, sticky header; now 13 rows fit instead of 9.
5. **Icons.** "Edit" and "Remove" get labels; the rest hide in a menu, with names like "Remove Dana Whitfield".
6. **States.** Empty, loading, no results, error, each designed.
7. **Check.** Contrast audit, keyboard-only pass, 200% zoom, 320px width (cards below 640px).

No new library, no new style. The gains came from hierarchy, density and contrast. That's the pattern you'll see in most good redesigns.

## Where to go deeper

- **Accessibility as craft.** Contrast, target size, focus visibility, reflow and motion are visual decisions. WCAG 2.2 added minimum target size (SC 2.5.8) and focus-not-obscured (SC 2.4.11). Chapter [[ch:11]] goes deep.
- **Front-end literacy.** If you can write \`clamp()\` and a grid template, you can spec precisely. Figma's State of the Designer 2026 reports designers' participation in development rising, though I only saw that through secondary coverage of a gated report.[[ref:figma-sotd-2026]] See [[ch:10]].
- **A weekly critique habit.** Write one short critique a week. It's the fastest way to turn taste into something explainable.

## Quick check

:::check Knowledge check 1
A stakeholder wants a translucent glass panel behind body text because a competitor has one. What do you check first?
---
Legibility and contrast over the *range* of backgrounds that can appear behind the text, in light and dark, against WCAG ratios (4.5:1 for normal text), not just one screenshot. Also whether the content sits in the functional layer or the content layer (platform guidance, as I understand it, reserves glass for floating controls and navigation; confirm in the HIG). If it can't be reliably legible, propose a solid or lightly tinted surface and explain the cost.
:::

:::check Knowledge check 2
A teammate says "WCAG 3 uses APCA now, so we can drop 4.5:1." What's wrong?
---
As of the 10 September 2026 Working Draft, WCAG 3 does not replace WCAG 2 and its contrast method is still undecided; APCA was removed from the July 2023 draft. WCAG 2.2 is what you can be held to, so keep meeting it and treat APCA as an additional check, with documented decisions.
:::

This edition explains those principles from the ground up: composition and hierarchy, typography, color, layout and grids, and icons and illustration. You've used most of these for years; the goal here is to give you the *vocabulary and reasons* behind them, so you can apply them on purpose and explain them to others.

:::pull
Visual design isn't decoration. It's how a screen tells people what matters, what belongs together and what to do next.
:::

## What visual design does

Visual design in a product has four jobs:

1. **Guide attention:** make the most important thing noticeable first.
2. **Show structure:** make it obvious which things belong together.
3. **Communicate meaning:** use color, shape and type consistently so they carry information (this is a button, that's an error).
4. **Set the tone:** calm or energetic, serious or playful, premium or friendly.

When a design "looks good" but people can't find what they need, it has done job 4 and failed jobs 1 to 3.

## Composition: the core principles

### Hierarchy

**Hierarchy** is the order in which people notice things. Every screen has one, whether you designed it or not. The tools for creating it:

| Lever | How it creates emphasis |
| --- | --- |
| Size | Bigger things are seen first |
| Weight | Bold text stands out from regular |
| Color and contrast | High-contrast or colorful elements pop against muted ones |
| Position | Top and left (in left-to-right languages) are seen early |
| Space | An element with lots of space around it draws the eye |
| Shape and style | A filled button stands out from outlined ones |

A useful exercise: for any screen, write down the **first, second and third read**. If you can't, or if five things compete for first place, the hierarchy needs work.

### Contrast

**Contrast** is difference. Differences in size, weight, color, shape or space are what make hierarchy visible. Without contrast, everything looks equally important, which means nothing is. The trick is to use *strong* contrast for the few things that matter and *little* contrast everywhere else.

### Alignment

**Alignment** means placing elements along shared edges or centers. Aligned elements feel organized and intentional; misaligned ones feel careless, even if people can't say why. Most interfaces use left alignment for text and controls, because it gives the eye a consistent starting point for each line.

### Proximity

**Proximity** means items placed close together look related. It's the cheapest way to group things: no boxes, no lines, just space. A rule of thumb: the space between groups should be clearly bigger than the space within a group.

### Repetition and consistency

**Repetition** means using the same styles for the same kinds of things. If every primary button looks the same, people learn the pattern once and recognize it everywhere. Inconsistency forces people to re-learn.

:::definition The CRAP principles
A popular memory aid from Robin Williams's *The Non-Designer's Design Book*: **C**ontrast, **R**epetition, **A**lignment, **P**roximity. Four principles that fix most layout problems.
:::

### Balance and whitespace

**Balance** is how visual weight is distributed. *Symmetrical* balance (mirrored) feels formal and stable; *asymmetrical* balance (different elements with equal visual weight) feels more dynamic and is common in interfaces.

**Whitespace** (or negative space) is the empty space between and around elements. It's not wasted space. It improves readability, creates grouping and makes important things stand out. *Micro* whitespace is between lines and letters; *macro* whitespace is between sections.

### Gestalt principles

Gestalt psychology describes how people perceive groups and patterns. The most useful in UI:

| Principle | What it means | UI example |
| --- | --- | --- |
| Proximity | Close items look related | A label right above its input |
| Similarity | Similar-looking items look related | All links share one color |
| Common region | Items in a shared container look related | A card groups its content |
| Continuity | The eye follows lines and curves | A row of aligned icons reads as a set |
| Closure | We complete incomplete shapes | Icons that suggest a shape with few lines |
| Figure–ground | We separate objects from background | A modal over a dimmed page |
| Common fate | Things moving together look related | Items that animate together |

:::exercise Try it: name the reads (15 minutes)
Pick three apps you use daily. For one screen in each, write the first, second and third thing your eye lands on, and which lever (size, weight, color, position, space) causes each. You'll start seeing hierarchy everywhere.
:::

## Typography

Most interfaces are mostly text, so typography is a big part of visual design.

### Anatomy and vocabulary

- **Typeface vs. font:** a typeface is the design (for example Helvetica); a font is a specific style and weight of it (Helvetica Bold 16).
- **Baseline:** the invisible line letters sit on.
- **x-height:** the height of lowercase letters like "x." A taller x-height makes text look bigger and read better at small sizes.
- **Ascenders and descenders:** the parts that rise above (b, d, h) or drop below (g, p, y).
- **Leading (line height):** the vertical space between lines.
- **Tracking:** uniform spacing between all letters; **kerning:** spacing between specific pairs.
- **Measure:** line length.

### Kinds of typefaces

| Classification | Features | Typical use |
| --- | --- | --- |
| Serif | Small strokes at the ends of letters | Editorial, long reading, traditional brands |
| Sans-serif | No serifs, cleaner forms | Interfaces, modern brands |
| Monospace | Every character the same width | Code, data |
| Display | Decorative, expressive | Headlines, branding only |

Most product interfaces use a sans-serif for clarity at small sizes on screens.

### Legibility vs. readability

- **Legibility** is how easily individual letters can be told apart (is that an "l" or an "I"?).
- **Readability** is how easily blocks of text can be read, which depends on size, line length, line height, contrast and layout.

You can have a legible typeface set in an unreadable way: tiny, light gray, with lines 150 characters long.

### The settings that matter

- **Size:** body text on screens is commonly around 16px; smaller for captions, larger for headings.
- **Line height:** about 1.4 to 1.7 times the font size for body text; tighter for headings.
- **Line length:** roughly 45 to 75 characters per line for comfortable reading.
- **Weight:** use a few weights (regular, medium, bold) to create levels. Very thin weights are hard to read at small sizes.
- **Alignment:** left-aligned text is easiest to read in most languages. Centered text works for short headlines, not paragraphs. Justified text can create uneven gaps on screens.

### Type scales

A **type scale** is a set of predefined sizes, often based on a ratio (each step is, for example, 1.25 times the previous). It keeps sizes consistent and creates clear levels:

| Role | Example size |
| --- | --- |
| Caption | 13px |
| Body | 16px |
| Subheading | 20px |
| Heading | 25px |
| Page title | 31px |
| Display | 39px |

### Pairing typefaces

If you use two typefaces, they should be clearly different (for example a serif heading with a sans-serif body) but share some quality (similar proportions or mood). Most products are best with one family in a few weights. More than two families usually looks messy.

## Color

### The basics of color

Every color can be described by three properties:

- **Hue:** the color itself (red, blue, green).
- **Saturation (chroma):** how intense or muted it is.
- **Value (lightness):** how light or dark it is.

Lightness differences matter most for readability and hierarchy. Two colors with different hues but similar lightness can be hard to tell apart, especially for people with color vision deficiencies.

### Color models you'll meet

| Model | What it is | Where you see it |
| --- | --- | --- |
| RGB / HEX | Mixes red, green and blue light | Screens, CSS (\`#3451d1\`) |
| HSL | Hue, saturation, lightness | Easier to reason about in CSS |
| OKLCH | Perceptual lightness, chroma, hue | Modern CSS; lightness steps look even |
| CMYK | Cyan, magenta, yellow, black ink | Print |

### Color harmonies

The **color wheel** arranges hues in a circle. Harmonies are combinations that tend to look pleasing:

- **Monochromatic:** shades of one hue. Calm and cohesive.
- **Analogous:** neighbors on the wheel (blue, blue-green, green). Harmonious, low contrast.
- **Complementary:** opposites (blue and orange). High contrast, energetic; use one as the accent.
- **Split-complementary:** one hue plus the two neighbors of its complement. Contrast with less tension.
- **Triadic:** three evenly spaced hues. Vibrant; hard to balance in UI.

In product design you usually build from **neutrals** (grays) plus **one primary/accent color**, plus **status colors** for success, warning, error and info.

### The 60-30-10 rule

A classic guideline from interior design: about 60 percent dominant color (often a neutral background), 30 percent secondary (surfaces, text), 10 percent accent (buttons, highlights). It's a rule of thumb, not a law, but it stops interfaces from becoming rainbows.

### Meaning and culture

Colors carry associations (red for danger or error, green for success), but meanings vary by culture and context. Never rely on color alone to communicate something: pair it with text, an icon or a pattern.

### Contrast and accessibility

Text needs enough contrast against its background. The Web Content Accessibility Guidelines (WCAG) require a contrast ratio of at least **4.5:1** for normal text and **3:1** for large text and for important interface elements like input borders and icons.[[ref:wcag22]] Black on white is 21:1; a light gray like #9ca3af on white is only about 2.5:1, which fails.

:::warning Common trap: light gray text
Light gray text looks elegant in a mockup and becomes unreadable on a real screen in sunlight. Keep body text dark and secondary text at least 4.5:1.
:::

### Building a UI palette

1. Start with a **neutral scale** (8 to 10 grays from near-white to near-black).
2. Choose a **primary color** for actions and the current location.
3. Add **status colors**: success, warning, error, info, each with a strong and a subtle version.
4. Define colors by **role** (background, surface, text, muted text, border, primary, danger) rather than by appearance, so you can change a theme later.
5. **Test contrast** for every text–background pair.

## Layout and grids

### What a grid is

A **grid** is an invisible structure of columns and spaces that helps you align elements consistently. Its parts:

- **Columns:** vertical sections where content sits.
- **Gutters:** the spaces between columns.
- **Margins:** the space between the outer columns and the edge of the screen.
- **Rows and modules:** horizontal divisions and the cells they create (in modular grids).

### Types of grids

| Grid | Description | Good for |
| --- | --- | --- |
| Manuscript | One large column | Articles, long reading |
| Column | Several equal columns (12 is common because it divides into 2, 3, 4 and 6) | Most websites and apps |
| Modular | Columns plus rows, creating cells | Galleries, dashboards, card layouts |
| Hierarchical | Irregular, based on content importance | Editorial and marketing pages |
| Baseline | Horizontal lines that text sits on | Consistent vertical rhythm |

### Spacing systems

Most design systems use a **base unit**, commonly 4 or 8 pixels, and only use multiples of it (4, 8, 12, 16, 24, 32...). This "8-point grid" makes spacing consistent and easy to hand off. Instead of debating whether something should be 13 or 15 pixels apart, you choose between 12 and 16.

### Responsive layout

Screens vary from narrow phones to wide monitors. **Responsive design** adapts the layout to the available space:

- **Breakpoints:** widths at which the layout changes (for example from one column to two).
- **Fluid layouts:** elements stretch and shrink between breakpoints.
- **Mobile-first:** design the smallest screen first, then add complexity for larger ones. It forces you to prioritize.

### Reading patterns

Eye-tracking research has described common scanning patterns, such as the **F-pattern** (people scan the top and left of text-heavy pages) and the **Z-pattern** (on sparse pages, the eye zigzags from top left to bottom right). Treat these as tendencies, not rules: good hierarchy shapes how people scan.

## Icons and illustration

### Kinds of icons

- **Outlined (line) icons:** light, modern; common in interfaces.
- **Filled (solid) icons:** heavier, easier to see small; often used for the "selected" state.
- **Two-tone and duotone:** two colors or shades for depth.
- **Glyphs:** simple symbols, often in a font or system set.

### Principles for good icons

1. **Recognizable:** use familiar metaphors (magnifier for search, trash can for delete).
2. **Consistent:** same size, stroke width, corner style and level of detail across the set.
3. **Simple:** remove details that disappear at small sizes.
4. **Labeled when unclear:** many icons are ambiguous. Pair them with text unless the meaning is universal.
5. **Accessible:** icon-only buttons need a text label for screen readers.

Icons usually sit on a pixel grid (24 by 24 is common) with "keylines" (guide shapes) so circles, squares and rectangles look equally heavy.

### Illustration

Illustration in products is used for **empty states** (nothing here yet), **onboarding**, **errors** and **marketing**. Good illustration clarifies or sets tone; it doesn't just fill space. Common styles include flat, line, isometric (3D-looking on a diagonal grid), hand-drawn and abstract. Whatever the style, consistency matters more than which style you pick.

## A quick visual critique

When reviewing a screen, walk through:

1. **Hierarchy:** is the most important thing seen first?
2. **Grouping:** do related things sit together, separated from unrelated things?
3. **Alignment:** are edges lined up?
4. **Consistency:** do similar things look the same?
5. **Contrast:** is text readable, and do important actions stand out?
6. **Color:** is color used with purpose, and never as the only signal?
7. **Typography:** sensible sizes, line lengths and line heights?
8. **Whitespace:** is there room to breathe?

## Key terms

| Term | Plain meaning |
| --- | --- |
| Hierarchy | The order in which things are noticed |
| Whitespace | Empty space that separates and emphasizes |
| Gestalt | How people perceive groups and patterns |
| x-height | Height of lowercase letters; affects apparent size |
| Leading | Line height |
| Measure | Line length |
| Type scale | A set of consistent font sizes |
| Hue, saturation, value | The three properties of a color |
| Contrast ratio | A measure of text readability against its background |
| Gutter | Space between grid columns |
| 8-point grid | Spacing in multiples of 8 (or 4) |

## Quick check

:::check Knowledge check 1
A form looks messy, but nothing is misaligned. What's the most likely culprit?
---
Proximity. If labels sit the same distance from the field above as from their own field, and gaps between fields equal gaps within a field, grouping is unclear. Make the space between groups clearly larger than within groups.
:::

:::check Knowledge check 2
Why is the 12-column grid so common?
---
Twelve divides evenly into 2, 3, 4 and 6, so you can create halves, thirds, quarters and sixths, which gives lots of layout flexibility.
:::

:::check Knowledge check 3
Your error messages use red text only. What's wrong?
---
Color alone carries the meaning, so people with color vision deficiencies (and anyone in poor lighting) may miss it. Add an icon and clear text, and check the red meets contrast requirements.
:::

`,"./content/modules/02-interaction-experience-design.md":`Think about the last feature you shipped. How many screens did you design? Now count the *states*: empty, loading, partial, error, offline, no permission, first use, returning use.

If you're like most of us, the screens are in the portfolio and the states are in the backlog as "edge cases." But real users meet your product in the edges far more often than in the happy path.

That's the secret of interaction design: **the quality of a product lives in the parts nobody screenshots.** And in 2026 there's a second reason this matters. More products now include AI that acts on someone's behalf, so the "interface" increasingly includes delegating, waiting, approving and undoing. NN/g's outlook says experience now spans content, system behavior and logic, not just the screen.[[ref:nng-state-ux-2026]]

This chapter covers patterns and states, motion, flows, information architecture and responsive design. Then it adds the skill that's missing from most skill lists: designing AI interactions.

:::pull
A screen is a snapshot. A product is everything that happens between snapshots.
:::

## 1. Patterns and states

### The ideas that never expire

A few concepts from decades of HCI research still explain most usability problems:

- **Mental models.** People guess how something works from how it looks and behaves. When the product's model and theirs differ, the "user error" is your design's fault.
- **Signifiers.** An affordance is what something *allows*; a signifier is the cue that says so. A flat, borderless element can be clickable, but is anything telling people? Most "unclear UI" is missing signifiers.
- **Feedback.** Every action needs a visible, timely response. No response means people repeat the action or assume it failed.
- **Recoverability.** Prefer undo to confirmation dialogs. A confirm dialog interrupts everyone to protect against rare mistakes; undo protects without costing the careful majority anything.

NN/g's ten heuristics are a handy checklist for all this, with their own caveat: rules of thumb from expert evaluation, not laws.[[ref:nng-heuristics]] The same goes for the "Laws of UX" collection. Fitts's law is a well-supported model of pointing time; Miller's "7 plus or minus 2" is routinely misused to justify menu sizes it was never about.[[ref:laws-of-ux]]

### The state checklist

Every component and screen has more states than the happy path. Keep this list near your canvas:

:::framework The state checklist
**Empty** (nothing yet) · **loading** (including slow and partial) · **populated** · **stale or partial** (some data failed) · **error** (with a way forward) · **success** (with a next step) · **disabled** (with a reason) · **no permission** · **offline** · **first use vs. returning use**. For forms add **pristine, focused, valid, invalid, submitting**.
:::

:::example A purchase-order table, six states
*Empty:* explains what an order is and offers "Create order." *Loading:* a skeleton shaped like the final rows. *Partial:* rows that loaded plus a banner for the part that didn't. *Error:* says what failed and offers retry. *No permission:* names the role that can see this and how to request access. *Offline:* cached rows with a "last updated" time. Six decisions, none of them in the typical mockup.
:::

### Choosing patterns well

Know the standard patterns well enough to **adopt** them (usually), **adapt** them (when context changes the trade-offs) and **reject** them (rarely, with evidence). Familiar patterns carry learning your users already paid for.

- **Navigation.** Side nav scales to many destinations; tabs suit a few peer views; a command palette serves expert keyboard users and complements (never replaces) visible navigation.
- **Forms.** Visible labels, validation *after* a field is finished, errors that say what to do, smart defaults. Fewer fields beat prettier fields.
- **Progressive disclosure.** Show what most people need first. Great when done well; terrible when it hides what people need.
- **Selection controls.** Radios for few exclusive options, checkboxes for independent ones, dropdowns for long lists, toggles for *immediate* effects only.
- **Feedback surfaces.** Inline for local issues, toasts for brief confirmation (with undo), banners for page-level states, modals only when you truly must block.

:::decision Adopt, adapt or reject?
Adopt the standard unless you can name the specific reason it fails here. Adapt when volume, expertise, device or regulation changes the trade-offs, and write down *which* trade-off changed. Reject only with evidence from your own users.
:::

:::warning Common trap: dark patterns
Defaults, wording and visual weight can steer people against their interests (forced continuity, hidden cancel buttons, confirmshaming). Beyond being unethical, it's increasingly regulated and it burns trust. A quick test: could you comfortably explain this choice to the person it affects?
:::

:::exercise Try it: complete the matrix (1 hour)
Take one feature you know. List every state from the checklist and describe what the person sees and can do. Circle the three that have no design at all, and design them.
:::

## 2. Motion

Motion earns its place by doing one of four jobs:

- **Orientation:** shows where something came from or went.
- **Feedback:** confirms an action registered.
- **Continuity:** keeps the mental model intact across a change (a card expanding into its detail view).
- **Attention:** points at an important change, sparingly.

Decoration is a fifth job, and the one to be suspicious of.

A micro-interaction has four parts: a trigger, a rule, feedback and a loop or end state (tap a heart; the count changes, the icon fills, you can undo). Useful starting points: most UI transitions feel right between roughly 100 and 300ms; ease-out for things entering, ease-in for things leaving; shorter for small elements, longer for big ones. Tune by eye on real devices, not by law.

### Motion and accessibility

Motion can genuinely harm. WCAG 2.2 says auto-moving content lasting over five seconds needs pause/stop/hide (SC 2.2.2), nothing should flash more than three times a second (SC 2.3.1), and at AAA, interaction-triggered motion should be disableable (SC 2.3.3).[[ref:wcag22]] In practice: respect the OS reduced-motion setting (swap big movement for a fade or nothing), and never use animation as the *only* way to convey something.

### 2026 shifts

- **The browser can do more natively.** Same-document view transitions, scroll-driven animations and richer CSS animation are shipping, with uneven support. web.dev's January 2026 digest notes \`:active-view-transition\` reaching Baseline Newly available.[[ref:webdev-baseline]] Page-to-page continuity is getting cheap, so the question becomes *should we*, not *can we*.
- **Waiting is a design problem.** Streaming text, long-running agent tasks and "thinking" states need honest feedback. Fake typing delays and spinning sparkles feel modern but hide whether the system is working. Show real progress and what the system is doing.

:::exercise Try it: motion with a reason (1 hour)
List five animations in a product you use. For each, name which of the four jobs it does and whether it still works with reduced motion. Cut any that do no job. Then spec one micro-interaction (trigger, rule, feedback, end state, duration, easing, reduced-motion version) in a sentence a developer can build from.
:::

## 3. User flows

A **task flow** is the steps to finish a task (system view). A **user flow** adds the person's decisions and entry points. A **wireflow** places screens along the path. A **service blueprint** adds everything behind the screen. Pick the lightest one that answers your question.

A flow is only useful if it goes beyond the happy path:

- **Entry points:** link, notification, search, empty state?
- **Decision points:** where do they choose, and what do they need to know?
- **Failure and recovery:** what if a step fails, times out or is declined?
- **Exits and re-entry:** can they leave and come back without losing work?
- **Roles:** does someone else have to act?

:::framework Flow review questions
Is there one clear goal? Is the shortest path the one most people take? What's the first thing that can go wrong, and then what? Where does the person need info they don't have yet? What happens to work in progress if they stop? What do they see when they return? Which step could disappear entirely?
:::

### 2026 shifts

- **Flows now contain AI steps,** which fail in new ways: confident wrong answers, refusals, timeouts, answers to the wrong question. Draw those branches and decide what people can do (edit, retry, escalate, ignore).
- **Flows are less linear.** People start in a chat or search box and land deep in the product, so key destinations need to work as entry points with enough context.
- **Handoffs between agent and person are the design:** what's pre-filled, what needs checking, what the person sees on arrival.

:::exercise Try it: the unhappy flow (1 hour)
Take a flow with an approval step. Draw the happy path in one color and every failure, rejection and timeout in another. Count them. Design the screen for the most likely failure and write the one sentence the person sees.
:::

## 4. Information architecture

IA is how things are organized, grouped and labeled so people can find and understand them. Four ingredients get confused constantly: **organization** (how things group), **labeling** (the words), **navigation** (how you move) and **search** (how you retrieve without browsing).

Start from people's mental models, not the org chart. Three methods cover most needs: **card sorting** (how do people group these?), **tree testing** (can they find things in this proposed structure with the visuals stripped away?) and **first-click testing**. Tree testing is the most direct way to check a structure before you build it. Most findability problems turn out to be labeling problems.

### 2026 shifts

- **Content is read by people *and* models.** Clear headings, consistent labels and structured content help both. IA blends into content strategy: what are the entities, and how do they relate?
- **Asking joins browsing.** A search or command box that understands intent doesn't remove the need for structure; it exposes structural problems faster, because people ask for the things your navigation hides.
- **Complex products need IA the most.** In enterprise software, deciding what the objects are, how they relate and what they're called shapes the entire product. Get the model wrong and no UI fixes it.

:::exercise Try it: test a structure (half a day)
Write 12 realistic tasks ("Where would you find last month's invoices?"). Run a tree test with at least 15 people. Record success, directness and where people went wrong. Fix the three worst labels and test again.
:::

## 5. Responsive design

Responsive makes one layout flex across sizes; adaptive changes the experience for the context (device, input, connection, preferences). The ideas that carry most of the weight:

- **Content-driven breakpoints** over device presets.
- **Input modes are not screen sizes.** Touch has no hover, pointer is precise, keyboard needs visible focus.
- **Target size.** WCAG 2.2 sets a 24 by 24 CSS px minimum (SC 2.5.8); touch guidance is larger, often 44 to 48px.[[ref:wcag22]]
- **Progressive enhancement:** the core works everywhere; extras layer on.

WCAG 2.2 also added requirements that touch interaction design directly: dragging needs a non-drag alternative (SC 2.5.7), focus must not be completely hidden by sticky content (SC 2.4.11), don't make people re-enter information (SC 3.3.7), and don't require a cognitive test to log in (SC 3.3.8).[[ref:wcag22]]

### 2026 shifts

- **Components adapt to their container.** Container queries let one component work in a sidebar, a modal and a full page, so design component behavior at several container widths, not only page widths.[[ref:webdev-baseline]]
- **Preferences are context.** Reduced motion, contrast, color scheme, text size and forced-colors modes are all signals to respect.
- **Adaptive can mean generated.** If parts of an interface get assembled on the fly, the components and rules underneath matter more than any single layout (see [[ch:03]]).

:::exercise Try it: three inputs (1 hour)
Take a screen with a hover interaction. Redesign it so it works for touch (no hover), keyboard (clear focus, logical order) and pointer. Document each in a small table, then test with keyboard only and with a phone.
:::

## 6. Designing AI interactions

If your skills list was written a few years ago, this is the missing row. NN/g calls 2026 a year of AI fatigue: users are tired of low-value AI features, companies using AI thoughtfully are expected to beat those adding it everywhere, and trust is named as a major design problem, built through transparency, user control, consistency and support when the system fails.[[ref:nng-state-ux-2026]] That reads like a brief.

| User's question | What they need | Design levers |
| --- | --- | --- |
| Is it right? | Calibrated trust | Citations, uncertainty cues, easy verification |
| What's it doing? | Visibility | Progress, plans shown before acting, activity logs |
| Can I stop or change it? | Control | Stop, pause, edit, undo, approval before risky actions |
| What if it fails? | Recovery | Clear errors, manual fallback, escalation to a person |
| Who's responsible? | Clarity | Show what was generated and what was changed |

### Patterns worth knowing

- **Suggest by default; act with permission,** and make the scope of any action obvious.
- **Approval checkpoints.** Practitioner writing frames agent work as a loop of delegate, monitor, approve, interrupt, refine, with approval at the *risky* moments (not every step) and a stop control always within reach.[[ref:agent-ux-practitioner]] Treat that as one useful framing, not a standard.
- **Show the plan, then the result,** with a way to roll back.
- **Citations and provenance** wherever answers come from sources.
- **Honest limits:** say what it can't do and offer the next best thing.

### Generative interfaces

Some products let an AI choose or assemble UI at runtime. One practitioner taxonomy sorts this into three degrees: picking from a pre-built component set (predictable, testable), emitting a declarative description the product renders (flexible but inspectable), and generating arbitrary UI code (powerful, needs sandboxing and a clear security model).[[ref:agent-ux-practitioner]] Protocols for connecting agents to tools and interfaces are young and vendor-driven, so learn the concepts and watch which ones settle. The design consequence is the same either way: a constrained, accessible component library is the guardrail.

### Evals: designing behavior

You can't judge an AI feature from a mockup. You judge it across many inputs. That's why "evals" (structured tests of output quality against a rubric) became part of product work. Product Talk frames AI evals as a new discovery habit, moving teams from vibe checks to systematic quality control.[[ref:product-talk]] You can contribute by writing the rubric: what does a good answer look like for this user and task, what failures are unacceptable, what tone fits. A rubric is a design artifact.

:::decision Should this feature use AI at all?
Can occasional errors be tolerated or recovered from? Is there enough variety that fixed rules would fail? Would a person actually choose this over a simple control? Can we show, check or undo the result? If most answers are no, a deterministic design is the better product.
:::

:::warning Common trap: bolt-on AI
A chat box added because competitors have one rarely solves a problem. Start from the user's task, find where it's slow, error-prone or tedious, and apply AI *there*, with the control and recovery patterns above.
:::

:::exercise Try it: design an agent approval flow (half a day)
A user says "clean up my overdue invoices." Design (1) the plan shown first, (2) which actions need explicit approval and why, (3) progress while it runs, (4) the summary afterward, (5) how they reverse a mistake. Then write a five-line rubric for judging the assistant's work.
:::

## Case: a delete action

Let's put the chapter together on one deceptively small feature. A SaaS app lets admins delete a project. The first design is a red button and a confirmation dialog that says "Are you sure?" Here's how a more careful pass goes.

**Step 1: What's actually at stake?** Deleting a project removes tasks, files and comments for 14 people. It's high-impact. But is it irreversible? That's a product decision, and it changes everything. If the team can keep deleted projects for 30 days, you can design for *recovery* instead of *fear*.

**Step 2: Choose the pattern.** With a 30-day recovery window you can drop the scary dialog entirely. Delete moves the project to a "Recently deleted" area and shows a toast: *"Project 'Q4 Launch' deleted. Undo."* The toast stays long enough to read and act (several seconds, and it's keyboard reachable). Fewer interruptions, same safety.

**Step 3: If it truly is irreversible**, the dialog earns its place, but make it informative: *"Delete 'Q4 Launch'? This permanently removes 312 tasks, 48 files and 14 members' access. This can't be undone."* The button says **Delete project**, not "Yes" or "OK". For very high stakes, ask the person to type the project name, which is friction on purpose, only here.

**Step 4: Draw the states.**

| State | What the person sees |
| --- | --- |
| Default | Delete in an overflow menu, not next to Save |
| No permission | Delete hidden or disabled with "Only owners can delete projects" |
| Loading | Button shows progress and is disabled so a double-click can't fire twice |
| Partial failure | "Deleted 310 of 312 tasks. 2 couldn't be removed. Retry?" |
| Error | Says what failed and what to do next |
| Offline | Delete is disabled with an explanation, or queued with a clear label |
| Success | Toast with Undo; focus moves somewhere sensible (not lost) |

**Step 5: Motion and keyboard.** The deleted row collapses over ~200ms (not instantly, so people see what changed), respecting reduced motion by fading instead. After deletion, keyboard focus lands on the next item in the list. If focus vanishes, a keyboard user has to start from the top of the page.

**Step 6: Write the words.** Labels, toast and error text are interaction design. "Couldn't delete 2 tasks because they're locked by an integration. Retry or unlock them in Settings" beats "Something went wrong."

Notice what happened: one "simple" button became a decision about reversibility, a pattern choice, seven states, a focus rule and microcopy. That's the real job.

## Mistakes to memorize

| Mistake | What happens | Fix |
| --- | --- | --- |
| Confirm everything | People click through without reading | Undo for reversible actions; confirm only the irreversible |
| Disabled buttons with no reason | People are stuck and guess | Explain why, or keep it enabled and show the error |
| Validate on every keystroke | Errors appear before people finish typing | Validate on blur or submit |
| Placeholders as labels | The label disappears while typing | Visible labels, placeholders for examples |
| Hover-only controls | Fails on touch and keyboard | Show on focus too; never hide the only path |
| Toasts for critical info | Gone before it's read | Use inline or banner messages for anything important |
| Infinite scroll for goals | People can't reach the footer or return to a spot | Pagination or "load more" when location matters |
| Modals stacked on modals | Focus and context get lost | One layer; use a page or side panel for complex tasks |
| Custom widgets that look native | Keyboard and screen readers break | Use native elements or follow the ARIA patterns |

## A 20-minute flow review

Take any flow and ask these in order:

1. **What's the goal, in one sentence?** If there are two, it's two flows.
2. **How many steps does the *typical* person take?** Count clicks, fields and decisions.
3. **Where do people need information they don't have yet?** Move that information earlier.
4. **What can go wrong at each step?** Write the message for the most likely failure.
5. **What happens if they stop halfway?** Is work saved? Can they resume?
6. **Who else must act, and how do they find out?** Notifications, assignments, permissions.
7. **Which step could be removed or automated?** Defaults and smart prefill beat extra fields.
8. **What does the person see after success?** A next step, not a dead end.

## Where to go deeper

- **Content design / UX writing.** Labels, errors, empty states and AI responses are all words.
- **Accessible interaction patterns:** keyboard operation, focus management and the ARIA Authoring Practices patterns for tabs, comboboxes and dialogs (see [[ch:11]]).[[ref:aria-apg]]
- **Prototyping real behavior,** including with AI coding tools (see [[ch:09]]).
- **Evaluating AI behavior:** rubrics, failure cases, small evals (see [[ch:04]]).

## Your next four weeks

| Week | Focus | You'll have |
| --- | --- | --- |
| 1 | States and patterns: matrix plus a form audit | A matrix for one real feature |
| 2 | Flows with failure paths, plus an IA tree test | Annotated flows and a test report |
| 3 | Motion and responsive behavior with keyboard and reduced-motion support | A small prototype that passes a keyboard-only test |
| 4 | One AI feature with approvals and an eval rubric | A prototype, a rubric and a one-page rationale |

## Quick check

:::check Knowledge check 1
A teammate wants a confirmation dialog on every delete. What do you suggest?
---
Undo for reversible deletes (a short-lived "Deleted. Undo" message), and a confirmation dialog only for irreversible or high-impact actions with clear wording about what will be lost. Confirming everything trains people to click through without reading and adds friction for the careful majority.
:::

:::check Knowledge check 2
An AI assistant can send emails for the user. Where do you put approval, and why not everywhere?
---
Before any externally visible, hard-to-reverse action (sending, deleting, paying), with the full content and recipients shown first, and a stop control always available. Not at every low-risk step, because constant approvals train people to click through and defeat the point of delegating. Scale oversight to risk and reversibility.
:::

`,"./content/fundamentals/02-interaction-experience-design.md":`You press a button and nothing happens. You press it again. Now you've ordered two pizzas.

That tiny failure is an interaction design problem. Interaction design (IxD) is about how a product *behaves*: what happens when people act, how the system responds, and how they find their way around. Visual design decides how a button looks; interaction design decides what it does, what it says while it's doing it, and what happens if it fails.

This edition covers the foundations: the principles behind usable interactions, common patterns, motion, user flows, information architecture and responsive design.

:::pull
Good interaction design is invisible. People only notice it when it's missing.
:::

## What interaction design is

Interaction design shapes the dialogue between a person and a product. Every interaction is a little loop: the person **acts**, the system **responds**, the person **interprets** the response and decides what to do next. Interaction design makes each step of that loop clear.

It's closely related to **user experience (UX) design**, which covers the whole experience (including research, content and service), and **UI design**, which focuses on the visual interface. In practice the roles overlap, but the question interaction design asks is always: *how does it work, and does that make sense to people?*

### The five dimensions

A common framework describes interaction design in five dimensions:

1. **Words:** labels, instructions, messages.
2. **Visual representations:** icons, images, typography.
3. **Physical objects or space:** the device and how it's held or used (mouse, touch, voice).
4. **Time:** animation, sound, how long things take.
5. **Behavior:** how the system reacts to actions.

## Principles of usable design

Most of these come from Don Norman's *The Design of Everyday Things* and Jakob Nielsen's usability heuristics.[[ref:nng-heuristics]]

### Affordances and signifiers

An **affordance** is what an object allows you to do: a button affords pressing, a slider affords dragging. A **signifier** is the cue that tells you so: a raised shape, an underline, a cursor change. Many usability problems happen because something *can* be done but nothing *signals* it.

### Feedback

Every action should get a clear, timely response. Clicked a button? It should change state. Submitted a form? Show progress, then confirmation. Without feedback, people repeat actions or assume something broke.

### Mapping

**Mapping** is the relationship between controls and their effects. Good mapping feels natural: a volume slider that goes up to increase volume, a scroll direction that matches the content movement.

### Constraints

**Constraints** limit what people can do to prevent errors. Disabling a "Next" button until required fields are filled, or only allowing dates in the future for a booking, are constraints.

### Consistency

Similar things should look and behave the same, inside your product and with platform conventions. **Jakob's law** puts it simply: people spend most of their time on *other* products, so they expect yours to work the same way.

### Conceptual models

A **conceptual model** is how the product works, as the designer intended. A **mental model** is how users *think* it works. Good design makes these match. When they don't, users make "mistakes" that are really design failures.

### Nielsen's ten heuristics

A widely used checklist for evaluating interfaces:

| Heuristic | In plain language |
| --- | --- |
| Visibility of system status | Always show what's happening |
| Match with the real world | Use familiar words and concepts |
| User control and freedom | Provide undo and easy exits |
| Consistency and standards | Follow conventions |
| Error prevention | Stop mistakes before they happen |
| Recognition over recall | Show options instead of making people remember |
| Flexibility and efficiency | Shortcuts for experts, simplicity for beginners |
| Aesthetic and minimalist design | Remove what doesn't help |
| Help with errors | Clear messages that explain how to fix it |
| Help and documentation | Easy to find when needed |

### Laws worth knowing

| Law | What it says | Design implication |
| --- | --- | --- |
| Fitts's law | Time to hit a target depends on its size and distance | Make important targets large and close |
| Hick's law | More choices take longer to decide | Reduce or group options |
| Jakob's law | Users expect your product to work like others | Follow familiar patterns |
| Miller's law | Working memory is limited | Chunk information (but "7±2" is often misused) |
| Tesler's law | Complexity can't be removed, only moved | Decide who handles it: the system or the user |

The Laws of UX site collects these with sources.[[ref:laws-of-ux]] Treat them as helpful rules of thumb, not physics.

## Designing every state

Every component and screen exists in several **states**. Designers often draw only the "populated, everything works" version, but users spend lots of time in the others.

| State | Example |
| --- | --- |
| Empty | No projects yet |
| Loading | Fetching data |
| Partial | Some data loaded, some failed |
| Error | Something went wrong |
| Success | Action completed |
| Disabled | Not available right now (say why) |
| Hover / focus / active | Interactive feedback |
| No permission | User can't access this |
| Offline | No connection |

Designing all the states is one of the clearest signs of a thorough interaction designer.

## Common interaction patterns

**Design patterns** are reusable solutions to common problems. Using familiar patterns means people already know how to use your product.

### Navigation patterns

- **Top navigation bar:** a few main sections, common on websites.
- **Sidebar navigation:** many sections, common in apps and dashboards.
- **Tabs:** switch between a few related views on the same page.
- **Bottom tab bar:** main destinations on mobile apps.
- **Breadcrumbs:** show where you are in a hierarchy and let you go back up.
- **Hamburger menu:** hides navigation behind an icon; saves space but reduces discoverability.
- **Search:** essential when there's lots of content.

### Input and form patterns

- **Text fields** with visible labels (placeholders disappear when typing, so they shouldn't be labels).
- **Radio buttons** for one choice from a few; **checkboxes** for multiple independent choices.
- **Dropdowns** for long lists; **segmented controls** for a few views.
- **Toggles** for on/off settings that take effect immediately.
- **Steppers and sliders** for numbers within a range.
- **Inline validation:** check input after the user finishes a field, and explain how to fix errors.

### Feedback patterns

- **Inline messages:** next to the thing they're about.
- **Toasts / snackbars:** brief messages that disappear, good for confirming an action (with Undo).
- **Banners:** page-level messages that stay until dismissed.
- **Modals (dialogs):** block the page until the user responds; use sparingly.
- **Progress indicators:** spinners for short waits, progress bars for longer, skeleton screens to show the shape of content while loading.

### Disclosure patterns

- **Progressive disclosure:** show the basics first and reveal advanced options when needed.
- **Accordions:** expandable sections.
- **Tooltips:** short help on hover or focus.

### Error prevention and recovery

- **Undo** is usually better than "Are you sure?" dialogs.
- **Confirmation dialogs** are for irreversible, high-impact actions.
- **Good error messages** say what happened, why and how to fix it, in plain language.

:::example Writing a good error message
Bad: "Error 422." Better: "Something went wrong." Best: "That email is already registered. Log in instead, or use a different email."
:::

## Motion and micro-interactions

### Why motion matters

Animation isn't just decoration. It helps people understand what's happening:

- **Feedback:** a button press animation confirms the tap.
- **Orientation:** a panel sliding in from the right shows where it came from.
- **Continuity:** a thumbnail expanding into a full image keeps context.
- **Attention:** a subtle pulse highlights something new.

### Micro-interactions

A **micro-interaction** is a small, single-purpose interaction, like liking a post or toggling a setting. Dan Saffer's model breaks it into four parts:

1. **Trigger:** what starts it (a tap, or a system event).
2. **Rules:** what happens.
3. **Feedback:** how the user knows what happened.
4. **Loops and modes:** what happens over time or on repeat.

### Timing and easing

- Most interface animations feel right between roughly **100 and 300 milliseconds**. Faster feels instant; slower feels sluggish.
- **Easing** describes acceleration. *Ease-out* (fast start, slow end) feels natural for things appearing; *ease-in* for things leaving. *Linear* movement often feels mechanical.
- Bigger movements can be a little longer than small ones.

### Motion and accessibility

Some people get dizzy or distracted by motion. Respect the operating system's "reduce motion" setting, avoid flashing content, and never rely on animation alone to communicate something.[[ref:wcag22]]

## User flows

### What a user flow is

A **user flow** is the path a user takes to complete a task: the steps, screens and decisions from start to finish.

| Type | Shows | Use it for |
| --- | --- | --- |
| Task flow | A single linear path | Simple tasks |
| User flow | Paths including decisions and branches | Most features |
| Wireflow | Flow plus wireframes of each screen | Communicating with teams |
| Screen flow | Sequence of actual screens | Detailed handoff |

### Flow diagram basics

Common notation: **rectangles** for screens or steps, **diamonds** for decisions, **arrows** for movement, and start/end points. Start with the user's **entry point** (where do they come from?), mark the **decisions**, and include the **failure paths** (what if payment fails?).

### Good flows

- Have one clear goal.
- Use the fewest steps that still feel safe.
- Ask for information when it's needed, not all up front.
- Let users go back without losing work.
- End with clear confirmation and a next step.

## Information architecture

### What IA is

**Information architecture (IA)** is how content and features are organized, structured and labeled so people can find and understand them. If interaction design is how things work, IA is where things live and what they're called.

IA has four main parts:

1. **Organization systems:** how content is grouped.
2. **Labeling systems:** the words used.
3. **Navigation systems:** how people move around.
4. **Search systems:** how people find things directly.

### Ways to organize content

- **Alphabetical, chronological, geographical:** objective, good for known items.
- **By topic or subject:** most common.
- **By task:** organized around what users want to do ("Pay a bill").
- **By audience:** "For students," "For teachers."
- **Hybrid:** combinations, which can get confusing if not handled carefully.

### Hierarchies: broad vs. deep

A **broad** structure has many top-level items and few levels; a **deep** one has few top-level items and many levels. Too broad overwhelms; too deep hides things. Most products aim for a balance.

### Labels

Most findability problems are labeling problems. Use the words your users use, not internal jargon. "Billing" beats "Revenue operations."

### IA research methods

- **Card sorting:** users group content into categories (open: they name groups; closed: you provide them).
- **Tree testing:** users try to find items in a text-only hierarchy.
- **First-click testing:** where do users click first for a task?

### Sitemaps

A **sitemap** is a diagram of the product's structure: pages and how they nest. It's the IA's blueprint, made before designing individual screens.

## Responsive and adaptive design

### Responsive vs. adaptive

- **Responsive design** uses one flexible layout that adjusts fluidly to any screen size.
- **Adaptive design** uses several fixed layouts designed for specific screen sizes or contexts.

Most modern web products are responsive with a few breakpoints.

### Key ideas

- **Breakpoints:** where the layout changes. Choose them based on when *content* stops fitting, not on specific devices.
- **Mobile-first:** design for small screens first; it forces you to prioritize.
- **Fluid grids and flexible images:** sizes in percentages or relative units.
- **Touch vs. mouse:** touch targets need to be larger (at least 24 by 24 CSS pixels per WCAG, and platform guides recommend about 44 to 48 for touch), and hover doesn't exist on touch screens.[[ref:wcag22]]
- **Content priority:** on smaller screens, decide what to show, hide, collapse or move.

### Common responsive patterns

- **Mostly fluid:** columns reflow and stack at narrower widths.
- **Column drop:** columns stack one by one as the screen narrows.
- **Layout shifter:** the layout changes more substantially at breakpoints.
- **Off-canvas:** navigation or panels slide in from the side on small screens.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Affordance | What an object lets you do |
| Signifier | The cue that shows what's possible |
| Feedback | The system's response to an action |
| Mental model | How users think something works |
| Design pattern | A reusable solution to a common problem |
| Progressive disclosure | Showing advanced options only when needed |
| Micro-interaction | A small, single-purpose interaction |
| Easing | How an animation accelerates and decelerates |
| User flow | The path to complete a task |
| Information architecture | How content is organized and labeled |
| Breakpoint | A width where the layout changes |

## Quick check

:::check Knowledge check 1
A "Save" button gives no response when clicked. Which principle is broken, and what's the fix?
---
Feedback (and visibility of system status). Show a pressed state, a progress indicator while saving and a confirmation when done, or an error with a way to retry.
:::

:::check Knowledge check 2
When should you use a confirmation dialog instead of undo?
---
For irreversible, high-impact actions where undo isn't possible (like permanently deleting an account). For reversible actions, undo is better because it doesn't interrupt everyone.
:::

:::check Knowledge check 3
What's the difference between card sorting and tree testing?
---
Card sorting helps *create* a structure by learning how users group content. Tree testing *evaluates* a structure by checking whether users can find items in it.
:::
