`,"./content/fundamentals/09-design-tools-prototyping.md":`Tools don't make you a good designer, but clumsy tool use can make a good designer slow, inconsistent and hard to work with. And prototyping, done well, is one of the most powerful things a designer can do: it turns ideas into something people can react to before anyone writes production code.

This edition explains the foundations: the main kinds of design tools, how to work well in a design tool like Figma, the different kinds and fidelities of prototypes, and how to hand off work to engineers.

:::pull
A prototype is a question you can hold in your hand. The better the question, the more useful the answer.
:::

## The design tool landscape

| Category | What it's for | Examples |
| --- | --- | --- |
| Interface design | Designing screens, components and systems | Figma, Sketch, Penpot |
| Prototyping | Interactive simulations | Figma prototyping, ProtoPie, Framer |
| Whiteboarding | Workshops, mapping, brainstorming | FigJam, Miro, Mural |
| Research | Testing, recording, analysis | Maze, Lookback, Dovetail |
| Motion | Animation design | After Effects, Rive, Lottie |
| Handoff and docs | Specs, design system docs | Figma Dev Mode, Storybook, zeroheight |
| Code-based tools | Building real interfaces | Code editors, Framer, Webflow |

Figma has become the most common interface design tool in product teams, so the examples below use its terms. The principles apply to most tools.

## Working well in a design tool

### Frames and layout

- **Frames** are containers (screens, sections, components). Unlike simple groups, frames can have their own layout rules, clipping and constraints.
- **Constraints** control how elements behave when a frame resizes (pin to left, stretch, center).
- **Auto layout** arranges children automatically in a row or column with consistent spacing and padding, like CSS Flexbox. When content changes (longer text, extra items), the layout adjusts.

Auto layout is the single biggest skill that separates fast, flexible files from fragile ones.

### Components and instances

- A **component** is a reusable master element (for example a button).
- An **instance** is a copy that stays linked to the component; when the component changes, instances update.
- **Variants** group related versions of a component (primary/secondary, small/large, default/hover/disabled) into one component set.
- **Component properties** let you change text, swap icons or toggle parts of an instance without detaching it.

### Styles and variables

- **Styles** store reusable colors, text styles, effects and grids.
- **Variables** store values (colors, numbers, strings, booleans) that can have different **modes**, such as light and dark themes. Variables map closely to design tokens in code.

### Libraries

A **library** shares components, styles and variables across files and teams. Updating the library lets every file adopt changes.

### File organization

A clean file structure helps everyone:

- **Cover page:** name, status, owner, last updated.
- **Working pages:** explorations and drafts.
- **Ready for development:** final, annotated designs.
- **Archive:** old ideas, kept separate.
- **Clear naming:** "Checkout / Payment / Error" instead of "Frame 237."

### Efficiency habits

- Learn keyboard shortcuts for common actions.
- Use plugins for repetitive tasks (renaming, content, accessibility checks).
- Build with real content to find problems early.
- Use the system's components instead of drawing from scratch.

## Prototyping

### What a prototype is

A **prototype** is a simulation of a product or feature, made to explore, communicate or test an idea before building the real thing. Prototypes can be as simple as paper sketches or as realistic as coded apps.

### Why prototype

- **Explore** ideas quickly and compare options.
- **Communicate** how something should work, which is often clearer than a static screen or a document.
- **Test** with users to find problems early, when changes are cheap.
- **Align** stakeholders around a shared picture.
- **Check feasibility** with engineers.

### Fidelity

**Fidelity** describes how closely a prototype resembles the final product. It has dimensions: visual polish, interactivity, content realism and data.

| Fidelity | What it looks like | Strengths | Weaknesses |
| --- | --- | --- | --- |
| Low (paper, sketches) | Rough drawings | Very fast; invites honest feedback on the concept | Can't test detailed interactions or visuals |
| Medium (wireframes, click-throughs) | Simple gray layouts with links | Tests structure and flow | Less realistic; people may miss subtle issues |
| High (polished interactive) | Looks and feels real | Tests usability, visual design, details | Slower; people comment on polish, not concept |
| Coded | Real code, often with sample data | Realistic behavior, data and performance | Most effort; can be mistaken for "nearly done" |

**Rule of thumb:** use the lowest fidelity that can answer your question.

### Types of prototypes

| Type | Description | Good for |
| --- | --- | --- |
| Paper prototype | Hand-drawn screens moved by a person | Very early concepts |
| Clickable wireframe | Linked wireframes | Flows and navigation |
| Interactive mockup | Realistic screens with transitions | Usability testing, stakeholder demos |
| Wizard of Oz | A human secretly performs the "system" responses | Testing complex or AI features before building |
| Concierge | The service is delivered manually to real customers | Testing value before automating |
| Fake door | A button or link for a feature that doesn't exist yet, to measure interest | Testing demand |
| Coded prototype | Built in code | Complex interactions, real data |
| Video prototype | A video showing the experience | Communicating a vision |

### Prototyping interactions

Most design tools let you connect screens with:

- **Triggers:** on click/tap, hover, drag, after a delay, key press.
- **Actions:** navigate to, open overlay, swap, scroll to, go back.
- **Animations:** instant, dissolve, move in, push, smart animate (animates matching layers between screens).

Advanced prototyping uses **variables and conditions** (for example, a cart count that increases), letting prototypes behave more like real products.

### Prototyping tips

- **Decide the question first.** "Can users find the export option?" drives a very different prototype than "Does the brand feel premium?"
- **Prototype the critical path,** not every screen.
- **Use realistic content.** Fake text hides real problems.
- **Include errors and edge cases** when they matter.
- **Tell participants what's real** and what isn't.

## Developer handoff

### What handoff means

**Handoff** is giving engineers what they need to build the design correctly. It's really an ongoing collaboration, not a one-time delivery.

### What engineers need

| Item | Why it matters |
| --- | --- |
| Final designs for all screens | The baseline |
| All states | Empty, loading, error, disabled, success, hover, focus |
| Responsive behavior | How layouts change at different widths |
| Interactions and animations | What happens, with timings |
| Content rules | Real text, maximum lengths, truncation |
| Spacing, type and color | Using tokens and system components |
| Assets | Icons and images in the right formats |
| Accessibility notes | Focus order, labels, roles, contrast |
| Edge cases | Long names, no data, errors, permissions |
| Acceptance criteria | What "done correctly" means |

### Specs and annotations

**Specs** describe measurements and properties; modern tools (like Figma's Dev Mode) let engineers inspect them directly. **Annotations** explain what can't be seen: behavior, logic, accessibility and edge cases. Good annotations answer questions before they're asked.

### Assets

- **SVG** for icons and simple illustrations (scalable, small).
- **PNG** for images that need transparency.
- **JPG / WebP / AVIF** for photos (smaller file sizes).
- Provide images at the right resolution (often 1x, 2x and 3x for different screens).

### The handoff process

1. **Walkthrough:** explain the design and flows to engineers, ideally before final polish.
2. **Questions and adjustments:** refine based on feasibility feedback.
3. **Documentation:** link designs, specs and decisions in one place.
4. **Build support:** stay available during development.
5. **Design QA:** review the built product against the design.
6. **Fix and iterate.**

### Design QA

**Design QA** (quality assurance) is checking the built product against the design before release. Check: layout and spacing, typography, colors, states, interactions, responsive behavior, accessibility and content. Log issues with screenshots and priority, and fix the important ones first.

## Key terms

| Term | Plain meaning |
| --- | --- |
| Frame | A container with its own layout rules |
| Auto layout | Automatic spacing and arrangement, like Flexbox |
| Component / instance | A reusable master and its linked copy |
| Variant | A version of a component |
| Variables / modes | Stored values with alternate sets, like light and dark |
| Library | Shared components and styles across files |
| Fidelity | How realistic a prototype is |
| Wizard of Oz | A human secretly simulates the system |
| Fake door | Measuring interest in a feature that doesn't exist yet |
| Handoff | Giving engineers what they need to build |
| Design QA | Checking the built product against the design |

## Quick check

:::check Knowledge check 1
You want to know whether users understand a new navigation structure. What fidelity of prototype do you build?
---
A low-to-medium fidelity click-through (or even a tree test) is enough. The question is about structure and labels, not visual polish.
:::

:::check Knowledge check 2
What's the difference between a component and an instance?
---
A component is the master definition. An instance is a linked copy used in designs; it updates when the component changes, and you can adjust its properties without breaking the link.
:::

:::check Knowledge check 3
Name four things a good handoff includes beyond the main screens.
---
Any four of: all states (empty, loading, error, disabled), responsive behavior, interaction details and timings, content rules, accessibility notes, edge cases, assets and acceptance criteria.
:::

`,"./content/modules/10-technical-engineering-literacy.md":`You hand off a beautiful design. An engineer replies: "This table needs to load 50,000 rows. We'll have to paginate and drop the live sorting."

If you don't speak the language, you nod, or you push back and lose. If you do, you ask: "What if we sort on the server and load rows in chunks as you scroll? Would that keep the feel?"

That's the point of technical literacy. You're not trying to become an engineer. You're trying to understand the *material* your designs are made of well enough to design things that can be built, to talk to engineers as a peer, and to know what's cheap, expensive or impossible. The designers who get the best results from engineering are almost always the ones who respect its craft and constraints.

This chapter covers HTML and CSS, how the web works, developer workflow, design systems in code and responsive implementation, plus a layer designers didn't need a few years ago: how AI systems behave. (Handoff is in [[ch:09]]; responsive layout from the design side is in [[ch:01]] and [[ch:02]].)

:::pull
The goal isn't writing production code. It's closing the gap between what you intend and what ships.
:::

## 1. HTML and CSS

### HTML says what things *are*

HTML describes the meaning of content, not how it looks. That one idea is the foundation of accessibility, search and maintainability.

- **Semantic elements** (\`header\`, \`nav\`, \`main\`, \`section\`, \`button\`, \`a\`, \`ul\`, \`table\`, \`form\`, \`label\`) tell browsers and assistive tech what things are. A \`button\` is focusable, activates with Enter and Space and is announced as a button. A clickable \`div\` is none of these unless someone adds a lot of code.
- **Headings** form an outline that screen-reader users navigate by. Pick levels by structure, not by size.
- **Forms** need real labels linked to inputs, the right input types and native validation hooks.
- **Links go places; buttons do things.** Mixing them confuses people and breaks expectations.

### How CSS works

- **The box model:** every element is content, padding, border and margin. Most "why is there extra space?" questions are box-model questions.
- **The cascade and specificity:** several rules can hit one element; the browser resolves them by origin, specificity and order. Cascade layers help manage this at scale.
- **Layout:** Flexbox for one dimension, Grid for two. Understanding \`gap\`, alignment and how items grow and shrink explains most behavior.
- **Custom properties** (CSS variables) hold design tokens and enable themes.
- **Units:** \`rem\` and \`em\` scale with text size; \`px\` is fixed; \`%\`, \`vw\` and container units respond to surroundings. Picking units is an accessibility decision.
- **Logical properties** (inline/block, start/end) support right-to-left languages.
- **Modern features:** container queries, \`clamp()\`, \`:has()\`, nesting, view transitions. Support varies and moves fast, so check Baseline before designing around a feature.[[ref:webdev-baseline]]

:::definition The box model in one sentence
Every element is a rectangle made of content, padding, border and margin. Knowing which of the four a gap belongs to is half of CSS debugging.
:::

**How to learn it:** build small things. Recreate a page from a screenshot in plain HTML and CSS, no framework. Open dev tools on sites you admire and watch structure, computed styles and responses to resizing. MDN Web Docs is the standard reference.[[ref:mdn]]

:::exercise Try it: build one page by hand (a day)
Take a screen you designed. Build it with semantic HTML and CSS only: a real button, a labeled form, a heading outline, custom properties for tokens, Grid or Flexbox for layout. Resize from 320px up. Note what was easy and what you'd have specified differently in your design.
:::

## 2. How the web works

- **Client and server.** The browser asks a server for pages and data. Some work happens in the browser, some on the server.
- **APIs.** Apps fetch and send data through APIs. Data takes time, can fail, can be partial and can be huge. Design for loading, error and empty states (see [[ch:02]]).
- **State.** What the interface currently knows (typed form, selected filter, fetched data). Much of front-end engineering is managing state. A design that implies several screens share live state has a cost.
- **Rendering.** Pages can be assembled on the server, in the browser or both, which affects load time, search visibility and feel.
- **Performance.** Google's Core Web Vitals measure loading (Largest Contentful Paint), responsiveness (Interaction to Next Paint) and visual stability (Cumulative Layout Shift).[[ref:web-vitals]] Big images, heavy fonts and layout shift are often design decisions.
- **Components.** Modern front ends are built from components (as in React) that take inputs (props) and manage state. That maps neatly to design components, which is why shared structure and naming help.

### Questions to ask first

- Where does this data come from, and how long can it take?
- What happens when it fails, is empty or is huge?
- Is there an existing component for this?
- What would make this expensive, and is there a cheaper version with 80 percent of the value?
- Does it need to work offline, on slow networks and small devices?

## 3. Developer workflow

Knowing how work moves from idea to users helps you plan and collaborate.

- **Git and pull requests.** Changes are recorded in commits, grouped on branches and proposed through pull requests (PRs) that others review before merging. You don't need to be an expert, but being able to read a PR, comment and open a branch preview is a strong skill.
- **Environments.** Code moves through development, staging and production. Preview links per branch let you review the real build.
- **Code review.** Engineers review each other's changes; treat design review of a build the same way: specific, kind, tied to acceptance criteria.
- **Continuous integration.** Automated checks (tests, linting, accessibility checks, visual regression) run on every change. The more of your standards a machine can check, the less depends on memory.
- **Feature flags and staged rollouts** let teams ship behind a switch and turn features on gradually, which changes how you plan experiments.
- **Sprints and estimates.** Teams plan in short cycles with rough estimates. Estimates are uncertain, so early conversations help.
- **Definition of done:** agree what it means, including accessibility, states and design review.

### 2026: agents in the loop

AI coding agents now write, test and propose changes inside this workflow. Figma's Config 2026 announcements about code on the canvas and cloning a repository into a design tool point the same way.[[ref:figma-config-2026]] For you, more changes arrive as pull requests that were partly or wholly generated. Your review job: check behavior, states, accessibility and system consistency, and don't assume generated code is correct or accessible.

:::warning Common trap: generated code isn't reviewed code
Models produce plausible code with invented props, hardcoded values, missing states and accessibility problems (see [[ch:03]]). The 2026 WebAIM Million analysis found accessibility failures on 95.9 percent of home pages, and pages using ARIA averaged *more* errors than those without.[[ref:webaim-million]] That shows how easy it is to ship code that looks fine and isn't. Review generated output as rigorously as any other.
:::

:::exercise Try it: read a pull request (1 hour)
Ask an engineer for a recent PR that changes the interface. Read the description, files changed and preview. Write three comments: one question, one observation about behavior, one about accessibility or consistency. Ask which were useful and why.
:::

## 4. Design systems in code

[[ch:03]] covers design systems; here's the implementation side.

- **Tokens become CSS custom properties** (and platform variables). A pipeline like Style Dictionary transforms a token source into outputs per platform.[[ref:style-dictionary]]
- **Components have APIs.** A button takes props like variant, size and disabled; its states and accessibility are implemented once and reused.
- **Libraries are versioned and published.** Teams consume them as packages, so changes need release notes and deprecation paths.
- **Docs and tests live beside the code.** Tools like Storybook (a workshop for building and documenting components in isolation) are common, along with visual regression and accessibility tests.
- **Headless primitives and copy-in components** give you behavior and accessibility with your own styling, each with trade-offs in control, upgrades and maintenance.

Being able to open your design system's code, find a component and read how its props, tokens and states work is a high-value skill. It lets you propose changes that fit, spot drift and speak the same language as the team.

## 5. Responsive implementation

From the technical side:

- **Fluid layout** (Grid, Flexbox, \`minmax\`, \`clamp\`) so layouts adapt without a breakpoint per device.
- **Container queries** where components live in different-sized spaces.
- **Relative units** so text and layout respect user settings.
- **Real devices and emulation:** sizes, input types, reduced motion, forced colors, slow networks.
- **Input modes:** touch, keyboard and pointer don't behave alike (focus and hover especially).

## 6. How AI systems behave

To design AI features and use AI tools well, you need a working mental model. No maths required.

- **They generate probable output, not guaranteed facts.** The same prompt can give different answers, and quality varies by case. Design for variability, verification and recovery (see [[ch:02]]).
- **Context is limited.** A model works from what's in its context: the conversation, retrieved documents, instructions. If it isn't there, it can't reliably be used. A lot of AI product design is deciding what context to provide and showing people what the system is using.
- **Retrieval and grounding.** Many products fetch relevant documents and give them to the model to answer from (often called retrieval-augmented generation). It improves relevance and enables citations, and it's only as good as what's retrieved.
- **Latency and cost scale with use.** Longer inputs and outputs take more time and money. Streaming makes waiting feel shorter but changes how people read and act on partial answers.
- **Tools and agents.** Models can be given tools (search, code, internal systems) and chain steps, which introduces actions with side effects and the approval and recovery design from [[ch:02]].
- **Instructions are interface.** The text a product sends the model (system prompts, templates) is part of the design: it sets tone, limits and behavior. Designers should help write and test it (see [[ch:12]]).
- **Evaluation matters.** Behavior is judged across many inputs with a rubric, not by a demo (see [[ch:02]] and [[ch:04]]).

:::example One question for every AI feature review
"What exactly goes into the model for this request, where does it come from, and what does the person see of it?" The answer reveals most privacy, trust and quality issues.
:::

### Working with AI coding tools

- **Be specific:** give design system rules, tokens, components, accessibility needs and expected states.
- **Work in small steps** and review each one. Big generated changes are hard to check.
- **Ask for explanations,** and read the code that handles states and accessibility first.
- **Run the checks:** lint, tests, accessibility tools. Test by keyboard and with a screen reader.
- **Know your limit.** If you can't judge a piece of generated code, ask an engineer to review it before anyone relies on it.

:::exercise Try it: trace one AI feature end to end (1 hour)
Pick an AI feature you use or design. Write down what goes into the model, where each piece comes from, what the person sees of it, how long it takes, what it costs per use and what happens when it's wrong. Mark the three design decisions that depend on those answers.
:::

## Case: a card, design to code

Let's see what's in a small piece of UI so the terms stop being abstract. You designed a "project card": title, status badge, a short description and an action button. Here's the same thing in code.

\`\`\`html
<article class="card">
  <header class="card__header">
    <h3 class="card__title">Q4 launch</h3>
    <span class="badge badge--success">On track</span>
  </header>
  <p class="card__body">Cross-team launch plan for the new billing flow.</p>
  <button type="button" class="btn btn--primary">Open project</button>
</article>
\`\`\`

\`\`\`css
.card {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-inset-card);
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
}
.card__header { display: flex; justify-content: space-between; align-items: start; gap: var(--space-2); }
.card__title  { margin: 0; font-size: var(--text-h3); line-height: var(--leading-tight); }
.card__body   { margin: 0; color: var(--color-text-muted); }
\`\`\`

**What a designer can learn from reading this:**

- It's an \`article\` with a heading, so screen-reader users can navigate by heading and the card has meaning.
- The action is a real \`button\`, so keyboard and focus work for free.
- Every visual value comes from a token (\`--space-3\`, \`--color-surface-raised\`). Change the token and every card changes.
- \`display: grid; gap\` is how spacing between children is handled, so no margin hacks.
- The header is \`flex\` with \`justify-content: space-between\` which is why the badge sits on the right, and \`align-items: start\` is why a two-line title doesn't stretch the badge.
- What's missing tells you things too: there's no hover or focus style here, no loading or empty state, and no rule for a title that's three lines long. Those are exactly the questions to take back to design.

## Debugging layout

When something looks wrong in the browser, ask in this order:

1. **Is it the right element?** Inspect it. Is that the box you think it is?
2. **Which rule won?** Dev tools show every rule that applies, and which were overridden.
3. **What's the box model doing?** Padding vs. margin vs. border, as the "box" diagram shows.
4. **What's the parent doing?** Most layout surprises come from the container's \`display\` (block, flex, grid) and size.
5. **What changes with viewport or content?** Resize, add a long word, set zoom to 200 percent.

Being able to answer these in a conversation ("it looks like the parent is \`flex\` without \`min-width: 0\`, so the text can't shrink") makes you a collaborator, not a spec-thrower.

## What engineers wish you knew

| Topic | The thing worth knowing |
| --- | --- |
| Data takes time | Show loading, handle failure, plan for partial data |
| Edge cases are the work | The happy path is maybe 30 percent of the code |
| "Small" changes can be huge | Moving a field might touch data models, permissions and tests |
| Consistency is cheaper | Reusing a component beats a one-off, for build and for maintenance |
| Performance is a feature | Big images and heavy animations cost real users on real devices |
| Browsers and devices differ | A thing that works in one place may break in another |
| Estimates are guesses | Ask early, and expect ranges, not promises |
| Reviews are a gift | Early feedback on a build is cheaper than late rework |

## A mini-glossary

| Term | In plain language |
| --- | --- |
| Component | A reusable piece of UI with its own inputs and behavior |
| Props | The inputs you pass to a component (variant, size, label) |
| State | What the UI currently remembers (what's typed, which tab is open) |
| API | How the front end asks a server for data or sends data back |
| Endpoint | One specific address on the API (for example, "get invoices") |
| Latency | How long a request takes |
| Pagination | Loading data in chunks instead of all at once |
| Cache | Stored data reused to avoid asking again |
| Branch | A separate line of work in version control |
| Pull request (PR) | A proposal to merge a branch, reviewed by others |
| CI | Automated checks that run on every change |
| Feature flag | A switch to turn a feature on or off without redeploying |
| Regression | Something that used to work and broke |
| Refactor | Changing code structure without changing behavior |
| Tech debt | Shortcuts that make future changes slower |
| Token (design) | A named design decision (spacing, color) |
| Token (AI) | A chunk of text a model processes; cost and limits are measured in tokens |

- **A little JavaScript and TypeScript,** enough to read a component and follow state and events.

- **Security and privacy basics:** authentication, permissions, personal data and what's risky to paste into tools.
- **Automated accessibility and visual testing:** what they catch and miss (see [[ch:11]]).

## Quick check

:::check Knowledge check 1
An engineer proposes a custom clickable \`div\` "for speed." What do you ask?
---
Ask what the \`div\` provides that a real \`button\` or link doesn't, and what it costs. A \`button\` already gives keyboard focus, activation via Enter and Space, a role and an accessible name, and it's announced correctly by assistive tech. A \`div\` needs all of that added. Unless there's a specific reason, use the native element and style it.
:::

:::check Knowledge check 2
A proposed AI summary feature "reads the user's documents." What do you ask before designing it?
---
What exactly goes into the model, from where and with what permissions; what the person sees of it; whether sources can be shown; how long it takes and what it costs per use; what happens when it's wrong or the documents are sensitive; and how quality will be evaluated. Those answers shape the design far more than the layout of the summary.
:::

`,"./content/fundamentals/10-technical-engineering-literacy.md":`You don't need to write production code to be a great product designer. But you do need to understand the material you're designing with. A furniture designer who understands wood designs chairs that can be built and last. A product designer who understands the web designs interfaces that can be built, perform well and work for everyone.

This edition explains the technical foundations in plain language: how the web works, HTML and CSS, JavaScript basics, how engineering teams work, how responsive design is built and how design systems become code.

:::pull
Technical literacy isn't about writing code. It's about having better conversations with the people who do.
:::

## How the web works

### Clients and servers

When you open a website:

1. Your **browser** (the client) sends a **request** to a **server** over the internet.
2. The server sends back a **response**: HTML, CSS, JavaScript, images and data.
3. The browser **renders** (draws) the page.

Apps work similarly, with the app as the client.

### Front end and back end

| Part | What it does | Typical technologies |
| --- | --- | --- |
| Front end | Everything users see and interact with | HTML, CSS, JavaScript, frameworks like React |
| Back end | Logic, data storage, security, integrations | Servers, databases, languages like Python, Java, Node.js |
| API | The bridge between front end and back end | REST, GraphQL |
| Database | Where data is stored | PostgreSQL, MySQL, MongoDB |

### APIs

An **API** (Application Programming Interface) is how different parts of software talk to each other. When a screen shows your recent orders, the front end asks an API, "Give me this user's orders," and the API returns data.

For designers, APIs matter because:

- Data **takes time** to arrive, so you need loading states.
- Requests can **fail**, so you need error states.
- Data may be **missing or empty**, so you need empty states.
- What you can show depends on **what data exists.**

### Performance

How fast a page feels affects users and business. Google's **Core Web Vitals** measure three things:[[ref:web-vitals]]

- **LCP (Largest Contentful Paint):** how fast the main content appears.
- **INP (Interaction to Next Paint):** how quickly the page responds to interactions.
- **CLS (Cumulative Layout Shift):** how much the layout jumps around while loading.

Design choices affect these: huge images, many fonts and elements that load late and push content around all hurt performance.

## HTML: structure and meaning

### What HTML is

**HTML** (HyperText Markup Language) defines the structure and meaning of content using **elements** written as tags:

\`\`\`html
<h1>Your orders</h1>
<p>You have 3 orders in progress.</p>
<button type="button">Track order</button>
\`\`\`

### Semantic HTML

**Semantic** elements describe *what* content is, not how it looks:

| Element | Meaning |
| --- | --- |
| \`<header>\`, \`<footer>\` | Page or section header and footer |
| \`<nav>\` | Navigation |
| \`<main>\` | Main content |
| \`<section>\`, \`<article>\` | Grouped or standalone content |
| \`<h1>\`–\`<h6>\` | Headings in a hierarchy |
| \`<p>\` | Paragraph |
| \`<ul>\`, \`<ol>\`, \`<li>\` | Lists |
| \`<a>\` | Link (goes somewhere) |
| \`<button>\` | Button (does something) |
| \`<form>\`, \`<label>\`, \`<input>\` | Forms |
| \`<table>\` | Tabular data |

Semantics matter because browsers, search engines and assistive technologies (like screen readers) rely on them. A real \`<button>\` works with the keyboard and screen readers automatically; a \`<div>\` styled to look like a button doesn't.

### The DOM

The browser turns HTML into the **DOM** (Document Object Model): a tree of elements that JavaScript can read and change. When a page updates without reloading, JavaScript is changing the DOM.

## CSS: presentation and layout

### What CSS is

**CSS** (Cascading Style Sheets) controls how HTML looks: colors, fonts, spacing, layout and animation.

\`\`\`css
.button {
  background: #3451d1;
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
}
\`\`\`

### Key concepts

- **Selectors** choose which elements to style (\`.button\`, \`h1\`, \`#header\`).
- **The cascade** decides which rule wins when several apply, based on importance, specificity and order.
- **Inheritance:** some properties (like font and color) pass from parent to child elements.

### The box model

Every element is a rectangular box made of:

1. **Content:** the text or image.
2. **Padding:** space inside the border.
3. **Border:** the edge.
4. **Margin:** space outside, separating it from other boxes.

Understanding this explains most spacing questions in implementation.

### Layout systems

- **Normal flow:** elements stack top to bottom (block) or sit in lines (inline).
- **Flexbox:** arranges items in one direction (row or column), with control over alignment, spacing and wrapping. Great for toolbars, nav bars and card rows. Design tools' auto layout works similarly.
- **Grid:** arranges items in rows *and* columns. Great for page layouts and galleries.
- **Positioning:** \`relative\`, \`absolute\`, \`fixed\`, \`sticky\` for special placement (like a sticky header).

### Units

| Unit | What it is | Use for |
| --- | --- | --- |
| \`px\` | Pixels | Borders, small fixed details |
| \`rem\` | Relative to the root font size | Font sizes and spacing that respect user settings |
| \`em\` | Relative to the element's font size | Spacing tied to text |
| \`%\` | Percentage of the parent | Fluid widths |
| \`vw\` / \`vh\` | Percentage of the viewport | Full-screen sections |

### CSS custom properties

**Custom properties** (CSS variables) store values for reuse, which is how design tokens show up in code:

\`\`\`css
:root { --color-primary: #3451d1; }
.link { color: var(--color-primary); }
\`\`\`

## JavaScript basics

### What JavaScript does

**JavaScript** makes pages interactive: responding to clicks, validating forms, fetching data, updating content without reloading and animating elements.

### Key concepts in plain words

- **Events:** things that happen (click, input, scroll) that code can respond to.
- **State:** the current data the interface is showing or remembering (what's in the cart, which tab is open).
- **Rendering:** drawing or updating the interface based on state.
- **Asynchronous code:** work that finishes later (like waiting for an API), which is why loading states exist.

### Frameworks and components

Most modern front ends use **frameworks** like React, Vue, Angular or Svelte. They organize interfaces into **components**: reusable pieces with their own structure, style and behavior. A component receives **props** (inputs) and may hold **state**.

This maps directly to design components: a \`Button\` component in Figma with variants matches a \`Button\` component in React with props.

## How engineering teams work

### The development workflow

1. **Planning:** work is broken into tickets or user stories.
2. **Development:** engineers write code on a **branch** (a separate copy of the code).
3. **Version control:** **Git** tracks changes; platforms like GitHub host code.
4. **Pull request (PR):** a request to merge changes into the main code. Teammates review it.
5. **Code review:** feedback on quality, bugs and consistency.
6. **Testing:** automated tests and manual QA.
7. **CI/CD:** Continuous Integration / Continuous Deployment automatically tests and releases code.
8. **Environments:** code moves from development to staging (testing) to production (live).
9. **Release:** sometimes behind **feature flags** that turn features on for some users first.

### Words you'll hear

| Term | Meaning |
| --- | --- |
| Ticket / story | A unit of work |
| Story points / estimate | Rough measure of effort |
| Sprint | A fixed period of work (often two weeks) |
| Branch / merge | A separate line of work / combining it back |
| Bug | Something not working as intended |
| Regression | Something that used to work and broke |
| Tech debt | Shortcuts that make future work slower |
| Refactor | Improving code without changing behavior |
| Deploy | Releasing code to an environment |
| Feature flag | A switch to turn a feature on or off |
| Edge case | An unusual situation the code must handle |

### What makes things hard

- It needs **new data** that doesn't exist yet.
- It changes **shared components** used in many places.
- It requires **complex state** (many things changing together).
- It has **performance** concerns (lots of data, heavy animations).
- It needs **integration** with other systems.
- It must work across **many browsers and devices.**

Asking "what makes this hard?" is one of the most useful questions a designer can ask.

## Responsive design in code

### Media queries

**Media queries** apply styles at certain screen sizes:

\`\`\`css
.cards { display: grid; grid-template-columns: 1fr; }
@media (min-width: 768px) {
  .cards { grid-template-columns: 1fr 1fr; }
}
\`\`\`

### Container queries

**Container queries** apply styles based on the size of the *container*, not the whole screen, so components adapt wherever they're placed.

### Responsive images

Using \`srcset\` and modern formats lets browsers load the right image size for each screen, saving data and time.

### The viewport

The **viewport** is the visible area of the page. The \`viewport\` meta tag tells mobile browsers to use the device width instead of zooming out a desktop layout.

## Design systems in code

### From design to code

1. **Tokens** become CSS custom properties or platform variables.
2. **Components** become coded components with props matching design variants.
3. **Documentation** often lives in tools like **Storybook**, which shows each component in isolation with its states and code.
4. **Packages:** the system is published as a package that product teams install.
5. **Versioning:** updates are released with version numbers so teams can upgrade safely.

### Keeping design and code in sync

- Use the same names for components, variants and tokens in both.
- Agree on a source of truth for tokens.
- Review changes together.
- Document differences and fix them.

| Term | Plain meaning |
| --- | --- |
| Front end / back end | What users see / the logic and data behind it |
| API | How software parts talk to each other |
| HTML | Structure and meaning of content |
| Semantic HTML | Elements that describe what content is |
| DOM | The browser's tree of elements |
| CSS | Styling and layout |
| Box model | Content, padding, border, margin |
| Flexbox / Grid | One-dimensional / two-dimensional layout |
| rem | A font-size-relative unit |
| JavaScript | The language that makes pages interactive |
| State | Current data the interface remembers |
| Component / props | Reusable UI piece / its inputs |
| Git / PR | Version control / request to merge code |
| CI/CD | Automated testing and deployment |
| Core Web Vitals | Google's performance metrics |

## Quick check

:::check Knowledge check 1
Why does a designer need to design loading and error states for a list of orders?
---
Because the data comes from an API: it takes time to arrive (loading), can fail (error) and may be empty (empty state). The interface needs to handle each.
:::

:::check Knowledge check 2
What's the difference between Flexbox and Grid?
---
Flexbox lays out items in one direction (a row or a column). Grid lays out items in two dimensions (rows and columns at once).
:::

:::check Knowledge check 3
Why should a clickable element be a \`<button>\` rather than a styled \`<div>\`?
---
A real button is keyboard-focusable, works with Enter and Space and is announced as a button by screen readers. A div needs extra code to do any of that.
:::

Most designers who do this for the first time find the same things. Focus disappears. Tab order jumps around. A dropdown can be opened but not closed. A beautiful modal traps you with no way out. Then they turn on a screen reader and find out their "Submit" button is announced as "button" and their icon-only controls are announced as nothing at all.

That experience is how a lot of people use your product every day. The 2026 WebAIM Million analysis of one million home pages found automatically detectable WCAG 2 failures on 95.9 percent of them (up from 94.8 percent the year before), with 56.1 detected errors per page on average.[[ref:webaim-million]] The industry isn't getting better by default.

## 1. Why it matters

### A spectrum, not a niche

Accessibility helps people with **permanent** disabilities (a person who is blind), **temporary** ones (a broken arm) and **situational** ones (bright sunlight, a noisy room, a baby in your arms). Microsoft's inclusive design materials describe this spectrum, and the principle that solving for people with disabilities often produces designs that serve everyone.[[ref:inclusive-microsoft]] Captions, keyboard access, clear language and strong contrast help many people who'd never call themselves disabled.

### The legal picture

Rules vary by country and sector and are changing. Points below mix primary and secondary sources; confirm details for your case.

- **United States, ADA Title II (state and local governments).** The DOJ rule requires web content and mobile apps, including contractor-provided content, to meet **WCAG 2.1 Level AA**. ADA.gov lists compliance dates of **26 April 2027** for entities with a population of 50,000 or more and **26 April 2028** for smaller entities and special districts, following an interim final rule in April 2026 that extended the earlier deadlines.[[ref:ada-title-ii]] Private businesses are generally covered through other provisions and case law, and website lawsuits are common; that area is separate and unsettled.
- **European Union, European Accessibility Act.** Directive (EU) 2019/882 set accessibility requirements for a range of products and services (e-commerce, banking services, e-books and more), applying from **28 June 2025**. Commentary I found says services already on the market have a transition until 2030, which I didn't verify in the legal text. The Directive sets functional requirements; the standard commonly used to show conformity, EN 301 549, draws on WCAG, so check which WCAG version your market's edition references.[[ref:eaa-directive]]
- **Elsewhere:** Section 508 for US federal agencies, Canada's and Ontario's rules, the UK Equality Act and public sector regulations, and more. If you ship internationally, ask legal which apply.
- **WCAG 2.2 remains the practical baseline.** WCAG 3.0 is a working draft that says it doesn't replace WCAG 2.[[ref:wcag3-draft]] Build to WCAG 2.2 AA and follow the legal reference your markets name.

:::warning Common trap: accessibility overlays
Widgets sold as a one-line "accessibility fix" claim to repair a site automatically. Accessibility professionals widely criticize them, and they can't fix underlying structure, labels or interaction problems. I believe US regulators have acted against at least one vendor over such claims, but I haven't verified that. Don't rely on an overlay for compliance.
:::

## 2. WCAG in practice

WCAG is organized under four principles, **POUR**: **Perceivable**, **Operable**, **Understandable**, **Robust**. Success criteria are graded A, AA and AAA, and most laws target AA.[[ref:wcag22]]

### What WCAG 2.2 added

| Criterion | Level | What it asks |
| --- | --- | --- |
| 2.4.11 Focus Not Obscured (Min) | AA | A focused element isn't entirely hidden by sticky headers or overlays |
| 2.5.7 Dragging Movements | AA | Anything done by dragging has a non-drag alternative |
| 2.5.8 Target Size (Minimum) | AA | Targets at least 24 by 24 CSS pixels, with exceptions |
| 3.2.6 Consistent Help | A | Help appears in a consistent place |
| 3.3.7 Redundant Entry | A | Don't make people re-enter information already provided |
| 3.3.8 Accessible Authentication (Min) | AA | No cognitive test (like transcribing characters) to log in |

### Common failures

The 2026 WebAIM Million found these on the share of home pages shown: low-contrast text (83.9 percent), missing image alt text (53.1), missing form labels (51), empty links (46.3), empty buttons (30.6) and missing document language (13.5). It also reported that 82.7 percent of pages used ARIA and that pages with ARIA averaged 59.1 errors against 42 for pages without.[[ref:webaim-million]] That shows association, not that ARIA *causes* errors, but it matches the old guidance: incorrect or unnecessary ARIA makes things worse, and the first rule of ARIA is to use a native HTML element if one exists.[[ref:using-aria]]

Notice how many of these are design and content decisions: contrast, labels, link and button names, alt text. They're cheap to prevent early and expensive to fix late.

## 3. Implementation

### Semantics first

Assistive tech reads the page's **accessibility tree**, built from HTML semantics. A native \`button\`, a real \`label\`, a proper heading outline and landmarks (\`main\`, \`nav\`) give you structure for free, and bad structure can't be repaired with decoration. See [[ch:10]].

### Keyboard and focus

- Everything a mouse can do must work by keyboard, in a logical order.
- **Focus must be visible** with enough contrast, and not hidden by sticky elements (SC 2.4.11).
- Manage focus deliberately in dialogs, menus and when content changes: move it in, trap it while a modal is open, return it when closed.
- Provide a skip link for repeated navigation.
- The ARIA Authoring Practices Guide documents keyboard behavior and roles for complex widgets like tabs, comboboxes and dialogs.[[ref:aria-apg]]

### Names, roles and states

Every interactive control needs an **accessible name** (what it is), a **role** (what kind of thing) and **state** (expanded, selected, invalid). Icon-only buttons need a name. Fields need labels, and errors need to be linked to their fields and announced.

### Content, forms, motion

- **Content:** plain language, descriptive headings, link text that makes sense out of context ("View invoice 1042," not "Click here"), meaningful alt text, captions and transcripts, a declared page language.
- **Forms:** visible labels, clear instructions, errors that say what to do and are linked to the field, no data loss on error, no needless re-entry (SC 3.3.7).
- **Motion and timing:** respect the reduced-motion preference, avoid flashing, give control over moving content (see [[ch:02]]), allow enough time or let people extend limits.

:::exercise Try it: audit one flow by keyboard and screen reader (2 hours)
Unplug the mouse and complete a core task by keyboard, noting every place focus is lost, hidden or illogical. Then turn on a screen reader (VoiceOver on Mac or iOS, NVDA on Windows, TalkBack on Android) and do it again with the screen off. List every problem with its WCAG criterion and a fix.
:::

## 4. Accessible color

[[ch:01]] covers the fundamentals. The accessibility essentials:

- **Text contrast:** 4.5:1 for normal text, 3:1 for large text (SC 1.4.3). **Non-text:** 3:1 for UI components and meaningful graphics (SC 1.4.11).
- **Never color alone** to convey meaning (SC 1.4.1). Add an icon, label, pattern or position.
- **Test the states,** not just the default: hover, focus, disabled, selected, error, and text over images or gradients.
- **Test themes:** dark mode, high contrast and forced-colors modes.
- **Consider color vision deficiency** in charts and status. Use differences in lightness, direct labels and patterns.
- **Bake it into the system:** define text, surface and border roles that are pre-checked in both themes, so teams can't pick failing combinations by accident (see [[ch:03]]).
- **Know the standards situation:** WCAG 2.2 ratios are what you can be held to; WCAG 3's contrast method is still undecided.[[ref:wcag3-draft]][[ref:roselli-wcag3]]

## 5. Accessible interaction

[[ch:02]] covers patterns. The accessibility lens adds:

- **Choose patterns with known accessible behavior** and implement them as documented, rather than inventing new ones.
- **Make targets big enough and spaced** (WCAG 2.2: 24 by 24 CSS pixels minimum; platform guidance for touch is larger).
- **Offer alternatives to gestures** like dragging, multi-finger or path-based actions.
- **Give feedback in more than one way** (visual, text, and sometimes sound or vibration) and announce dynamic changes to assistive tech.
- **Avoid time limits and interruptions** that disadvantage people who need more time.
- **Reduce cognitive load:** consistent patterns, clear language, progressive disclosure, no needless memory demands (SC 3.3.7, 3.3.8).
- **Respect system preferences** for text size, motion, contrast and color scheme.

### Accessible AI interfaces

New interaction types create new barriers:

- **Streaming text** can overwhelm a screen reader if every token is announced. Announce completion or let people read the result when ready.
- **Chat interfaces** need keyboard access, logical focus and clear labels, and shouldn't hide actions in unlabeled icons.
- **Approvals and stop controls** must be reachable and operable without a mouse, with state announced.
- **Generated content** may lack alt text or structure. If you present it, you're responsible for it.
- **Voice and multimodal input** helps many and excludes others, so offer more than one way.

:::exercise Try it: annotate a design for accessibility (2 hours)
Take a screen and add heading levels, landmarks, accessible names for every control, tab order, focus states, error messaging, motion behavior and contrast checks. Give it to an engineer and ask which annotations changed how they'd build it.
:::

## 6. Testing

No single method is enough.

| Method | Catches | Misses |
| --- | --- | --- |
| Automated checks (linters, scanners, CI) | Structural problems: missing labels, contrast failures, invalid ARIA | Most problems of meaning, flow and usability |
| Manual checks (keyboard, zoom, reflow, reduced motion) | Focus, order, resizing, operability | Experience with assistive tech |
| Screen reader testing | Names, structure, announcements, flow | Wider usability |
| Testing with disabled people | The real experience | Needs recruitment, budget and care |

Automated tools are valuable (especially in CI), and the WebAIM data shows the same few errors recur widely. But they're the floor, not the target.

**Make it part of the process:** check contrast and target sizes in design; run automated checks and component tests in build; do manual keyboard and screen reader passes before release; keep a feedback channel and audit regularly after release; include disabled participants in research (see [[ch:04]]), compensate them fairly and plan accessible materials and sessions.

## 7. Inclusive design

Standards are necessary but not sufficient. Inclusive design asks who is excluded by the assumptions in the product.

- **Language and reading level:** plain language helps non-native speakers, people with cognitive differences and everyone in a hurry. Design for translation and longer text.
- **Culture and context:** names, addresses, dates, units, payment methods, imagery and metaphors vary. Avoid one default.
- **Neurodiversity:** reduce needless stimulation, give control over motion and sound, make structure predictable, avoid dense, unstructured content.
- **Age:** larger text, clear targets and forgiving flows serve older users and everyone else.
- **Connectivity and devices:** low bandwidth, older and shared devices. Performance is accessibility (see [[ch:10]]).
- **Safety:** consider how features could be misused or harm vulnerable people (location sharing, notifications, reminders of difficult events).
- **Bias in AI:** models can perform worse for some groups or languages. Test across them and make failures recoverable (see [[ch:12]]).

:::framework Ask before you ship
Who might be unable to perceive this? Operate it? Understand it? Who might be harmed? Who isn't in our research? What happens on a poor connection, small screen, noisy place, second language? Can the person recover, ask for help or choose another way?
:::

## Case: fixing a modal

Here's a very common component, and what "accessible" actually involves. The original: a div overlay with a close icon, opened by a styled div that says "Edit profile."

**What's wrong (found with a keyboard and a screen reader):**

| Problem | Effect |
| --- | --- |
| The trigger is a \`div\`, not a \`button\` | Can't be reached or activated by keyboard; not announced as a control |
| The modal appears but focus stays behind it | Keyboard users keep tabbing through the page *under* the overlay |
| No role or name | A screen reader doesn't announce "dialog" or what it's for |
| Close icon has no accessible name | Announced as "button" or nothing |
| Escape doesn't close it | Keyboard users can get stuck |
| Focus doesn't return after closing | The person loses their place |
| Gray helper text is 2.8:1 | Fails contrast |
| Error text is red only | Color alone conveys the error |

**The fix, in order:**

\`\`\`html
<button type="button" id="edit-btn">Edit profile</button>

<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
  <h2 id="dlg-title">Edit profile</h2>
  <label for="name">Full name</label>
  <input id="name" type="text" aria-describedby="name-err" />
  <p id="name-err" role="alert">Enter your full name.</p>
  <button type="button" aria-label="Close dialog">×</button>
  <button type="submit">Save changes</button>
</div>
\`\`\`

1. Use a real \`button\` to open it.
2. On open, **move focus** into the dialog (to the first field or the heading) and **keep it inside** until it closes.
3. Give it \`role="dialog"\`, \`aria-modal="true"\` and a name via \`aria-labelledby\`.
4. Make **Escape** close it, and **return focus** to the trigger.
5. Give the icon button an **accessible name**.
6. Fix text contrast to 4.5:1 and add an **icon and text** to errors.
7. Link the error to its field (\`aria-describedby\`) and announce it.

Modern browsers also provide a native \`dialog\` element with built-in focus handling, which is often the simplest accurate answer. The lesson: accessible components are built from the right *semantics*, plus a handful of *behaviors* you can write down, test and reuse.

## A 15-minute review

Do this on any screen before it goes to development:

1. **Zoom to 200 percent.** Does anything overlap or get cut off? (WCAG 1.4.4, 1.4.10)
2. **Tab through it.** Is focus always visible and in a logical order? (2.4.3, 2.4.7, 2.4.11)
3. **Check contrast** of text, icons, borders on inputs and focus rings. (1.4.3, 1.4.11)
4. **Turn the color off** (grayscale). Is anything only communicated by color? (1.4.1)
5. **Read it as a list:** headings, links, buttons. Do the names make sense out of context?
6. **Look at forms:** labels visible, errors specific, no re-entering known info. (3.3.x)
7. **Check targets:** at least 24 by 24 CSS px, with space between them. (2.5.8)
8. **Check motion:** does it respect reduced motion? Is anything flashing or auto-playing?
9. **Ask:** what happens with a screen reader, voice control, a switch device?

## Writing alt text

| Image type | What to write |
| --- | --- |
| Informative photo | Describe what matters in context: "A nurse checks a patient's blood pressure." |
| Icon that is the only content of a button | Describe the action: "Delete invoice" (not "trash can") |
| Decorative image | Empty alt (\`alt=""\`) so it's skipped |
| Chart or diagram | Short alt plus a longer description or table nearby |
| Logo linking home | "Company name, home" |
| Image of text | Avoid; if unavoidable, repeat the text |

Good alt text answers "what would I need to know if I couldn't see this, *in this context*?" Don't start with "image of" and don't repeat the surrounding text.

## Common accessibility myths

- **"Our product is B2B so it doesn't matter."** Employees with disabilities use B2B tools, and many contracts require accessibility.
- **"Automated tools cover it."** They catch some structural issues, not meaning or usability.
- **"It makes design ugly."** Constraints often improve clarity and hierarchy.
- **"We'll do it in a later phase."** Retrofitting is far costlier than building it in.
- **"A few users won't notice."** Situational limits affect almost everyone sometimes.
- **"ARIA fixes things."** Native HTML first; ARIA only to fill gaps, and wrong ARIA does harm.

## Where to go deeper

- **Assistive tech fluency:** learn the basics of at least one screen reader, plus magnifiers, voice control and switch devices.
- **Alt text and plain language** as content skills.
- **Specs and annotations** as part of handoff (see [[ch:09]]).
- **Legal and policy literacy:** know which rules apply, what a conformance report is and how to talk to legal and procurement.
- **Advocacy:** accessibility is often won by someone explaining cost and benefit clearly (see [[ch:07]] and [[ch:08]]).

## Quick check

:::check Knowledge check 1
A teammate proposes an accessibility overlay widget to meet the regulation. What do you say?
---
Overlays can't fix underlying structure, labeling, keyboard and interaction problems, and accessibility professionals widely criticize them. The reliable route is building to WCAG 2.2 AA through semantics, tested components and manual and assistive-technology testing, and confirming the applicable legal standard with counsel. An overlay may just give false confidence.
:::

:::check Knowledge check 2
Your automated scanner reports zero errors on a screen. Is it accessible?
---
Not necessarily. Automated tools detect only a portion of issues: they can't judge whether alt text is meaningful, focus order is logical, labels make sense, errors help or the flow is usable. Test by keyboard and screen reader, check reflow and zoom and, where possible, test with people who use assistive tech.
:::

`,"./content/fundamentals/11-accessibility-inclusive-design.md":`Around the world, more than a billion people live with some form of disability, according to the World Health Organization. Add people with temporary injuries, older adults, people on old phones or slow connections, and anyone using a phone in bright sunlight, and "accessibility" stops sounding like a niche. It's simply designing for how people actually are.

This edition explains accessibility and inclusive design from the ground up: what they mean, the types of disability and the assistive technologies people use, the WCAG guidelines, accessible color, interaction and content, and how to test.

:::pull
Accessibility is not a feature for a few users. It's a quality of the product for everyone.
:::

## What accessibility means

- **Accessibility (often written a11y)** means people with disabilities can perceive, understand, navigate and interact with a product. It's often measured against standards like WCAG.
- **Inclusive design** is a broader approach: designing for the full range of human diversity, including ability, age, language, culture, gender, income and context.
- **Universal design** aims to make one design usable by as many people as possible, without special adaptation.

Accessibility sets the minimum bar; inclusive design aims higher.

### Why it matters

- **People:** it's about equal access to information and services.
- **Law:** many countries require digital accessibility (see the 2026 edition for current details).
- **Business:** more customers, better search visibility, better usability for everyone.
- **Quality:** accessible products are usually clearer and more robust.

### The curb-cut effect

Curb cuts (the ramps at sidewalk edges) were made for wheelchair users, but they help people with strollers, suitcases and bikes. Similarly, captions help people in noisy places, good contrast helps everyone in sunlight, and keyboard shortcuts help power users.

### Permanent to situational

Microsoft's inclusive design toolkit describes a helpful spectrum:[[ref:inclusive-microsoft]]

| | Permanent | Temporary | Situational |
| --- | --- | --- | --- |
| Touch | One arm | Arm injury | Holding a baby |
| See | Blind | Cataract | Bright sunlight |
| Hear | Deaf | Ear infection | Noisy place |
| Speak | Non-verbal | Laryngitis | Heavy accent |

Designing for the permanent case often helps many more people in the other columns.

## Disability and assistive tech

### Visual

Includes blindness, low vision, color vision deficiency and age-related vision changes.

**Assistive technologies and strategies:**

- **Screen readers** read on-screen content aloud or to a braille display: VoiceOver (Apple), TalkBack (Android), NVDA and JAWS (Windows).
- **Screen magnifiers** and browser zoom.
- **High contrast modes** and custom colors.

### Hearing

Includes deafness and hard of hearing. Needs: **captions** for video, **transcripts** for audio, and visual alternatives to sound alerts.

### Motor (physical)

Includes limited dexterity, tremors, paralysis and repetitive strain injury.

**Assistive technologies:** keyboard-only navigation, **switch devices** (one or two buttons), **voice control**, eye tracking, mouth sticks. Needs: full keyboard access, large targets, no time pressure and alternatives to complex gestures.

### Cognitive and neurological

Includes learning disabilities, dyslexia, ADHD, autism, memory issues and anxiety. Needs: clear language, consistent layouts, help with errors, fewer distractions and no unnecessary memory demands.

### Speech

Includes people who can't speak or are hard to understand. Needs: alternatives to voice-only interfaces.

## WCAG: the guidelines

### What WCAG is

The **Web Content Accessibility Guidelines (WCAG)** are published by the World Wide Web Consortium (W3C) and are the most widely used accessibility standard. The current version is **WCAG 2.2**.[[ref:wcag22]]

### POUR: the four principles

Everything in WCAG fits under four principles:

| Principle | Meaning | Examples |
| --- | --- | --- |
| **P**erceivable | People can perceive the content | Alt text, captions, contrast |
| **O**perable | People can operate the interface | Keyboard access, enough time, no seizure-causing flashes |
| **U**nderstandable | People can understand content and behavior | Clear language, predictable navigation, help with errors |
| **R**obust | Content works with many technologies, including assistive ones | Valid, semantic code |

### Levels of conformance

- **Level A:** the minimum; failing these blocks some users completely.
- **Level AA:** the standard most organizations and laws aim for.
- **Level AAA:** the highest; not required for whole sites but useful where possible.

### Key success criteria

| Criterion | Level | In plain language |
| --- | --- | --- |
| 1.1.1 Non-text content | A | Images have text alternatives |
| 1.2.2 Captions | A | Videos have captions |
| 1.3.1 Info and relationships | A | Structure (headings, lists, labels) is in the code |
| 1.4.1 Use of color | A | Color isn't the only way to convey meaning |
| 1.4.3 Contrast (minimum) | AA | Text contrast at least 4.5:1 (3:1 for large text) |
| 1.4.4 Resize text | AA | Text can zoom to 200% without breaking |
| 1.4.10 Reflow | AA | Works at narrow widths without horizontal scrolling |
| 1.4.11 Non-text contrast | AA | UI components and graphics at least 3:1 |
| 2.1.1 Keyboard | A | Everything works with a keyboard |
| 2.4.3 Focus order | A | Tab order is logical |
| 2.4.7 Focus visible | AA | You can see where keyboard focus is |
| 2.5.8 Target size (minimum) | AA | Targets at least 24×24 CSS pixels (new in 2.2) |
| 3.3.1 Error identification | A | Errors are clearly described |
| 3.3.2 Labels or instructions | A | Inputs have labels |
| 4.1.2 Name, role, value | A | Components expose what they are to assistive tech |

## Accessible color and contrast

### Contrast ratio

**Contrast ratio** compares the lightness of text and background, from 1:1 (no contrast) to 21:1 (black on white).

- Normal text: at least **4.5:1**.
- Large text (about 18pt, or 14pt bold): at least **3:1**.
- Interface components and meaningful graphics: at least **3:1**.

### Don't rely on color alone

About 1 in 12 men and 1 in 200 women have some form of color vision deficiency. Common types: **protanopia** and **deuteranopia** (red–green), and the rarer **tritanopia** (blue–yellow). Always combine color with something else: text, icons, patterns, underlines.

### Practical tips

- Check every text and background combination with a contrast checker.
- Make links distinguishable by more than color (underline them in body text).
- Use patterns or labels in charts, not just colors.
- Test designs in grayscale.

## Accessible interaction

### Keyboard accessibility

Many people use only a keyboard (or devices that act like one).

- **Tab** moves focus forward; **Shift+Tab** backward.
- **Enter** activates links and buttons; **Space** activates buttons and checkboxes.
- **Arrow keys** move within components like menus, tabs and radio groups.
- **Escape** closes dialogs and menus.

Every interactive element must be reachable and usable by keyboard, in a logical order.

### Focus indicators

The **focus indicator** shows which element is selected. Never remove it without replacing it with something equally visible. A clear outline or ring with good contrast works well.

### Target size

Small targets are hard to hit for people with motor impairments (and anyone on a bumpy bus). WCAG 2.2 sets a minimum of 24×24 CSS pixels; platform guidelines recommend larger, around 44 to 48, for touch.

### Motion and time

- Respect "reduce motion" settings.
- Avoid content that flashes more than three times per second.
- Let users pause, stop or hide moving content.
- Give enough time to read and act, or let users extend time limits.

### Accessible forms

- Every input has a visible **label**.
- Required fields are clearly marked (not only with color).
- **Errors** are described in text, near the field, with how to fix them.
- Group related fields (like address) with clear headings.
- Don't clear the form when there's an error.

### Accessible components

Complex components (tabs, menus, dialogs, accordions, comboboxes) have expected keyboard behavior and roles. The **ARIA Authoring Practices Guide** documents these patterns.[[ref:aria-apg]]

### ARIA basics

**ARIA** (Accessible Rich Internet Applications) is a set of attributes that add accessibility information to HTML, such as \`aria-label\` (a name), \`aria-expanded\` (open or closed) and roles like \`role="dialog"\`. The first rule of ARIA: **if a native HTML element does the job, use it instead**.[[ref:using-aria]] Incorrect ARIA can make things worse.

## Accessible content

### Text alternatives

- Informative images need **alt text** that describes their purpose.
- Decorative images should have **empty alt text** (\`alt=""\`) so screen readers skip them.
- Complex images (charts) need a longer description or data table.
- Icon-only buttons need an accessible name ("Close," "Search").

### Headings and structure

Screen reader users often navigate by headings. Use one \`h1\` per page and nest headings logically (h2, then h3), based on structure, not size.

### Links and buttons

Link text should make sense out of context: "Download the 2026 report" rather than "Click here."

### Plain language

- Short sentences and common words.
- Explain or avoid jargon.
- One idea per paragraph.
- Use lists for steps.
- Front-load important information.

### Media

Provide captions for video, transcripts for audio, and audio descriptions when important visual information isn't spoken.

## Testing accessibility

### Automated testing

Tools like axe, WAVE and Lighthouse scan pages for common issues (missing alt text, low contrast, missing labels). They're fast but catch only part of the problems.

### Manual testing

- **Keyboard test:** unplug the mouse and complete key tasks.
- **Zoom test:** zoom to 200% and check that nothing breaks.
- **Screen reader test:** try VoiceOver or NVDA on key flows.
- **Color test:** check contrast and view in grayscale.
- **Content review:** headings, labels, link text, alt text.

### Testing with disabled users

The most valuable testing involves people with disabilities using their own assistive technology. Recruit through disability organizations, pay fairly and make sessions accessible.

### In the design process

| Stage | What to do |
| --- | --- |
| Research | Include people with disabilities |
| Design | Check contrast, target sizes, focus states, structure |
| Handoff | Annotate headings, labels, focus order, alt text |
| Build | Use semantic HTML and accessible components |
| Test | Automated + manual + user testing |
| Maintain | Fix issues and monitor regularly |

## Beyond disability

- **Age:** larger text options, clear navigation, patient flows.
- **Language and literacy:** plain language, translations, icons with labels.
- **Culture:** names, dates, addresses, images and colors vary across cultures.
- **Gender and identity:** inclusive options and language in forms.
- **Economic situation:** older devices, slow connections, limited data.
- **Context:** one-handed use, noise, glare, distraction.

## Key terms

| Term | Plain meaning |
| --- | --- |
| a11y | Short for accessibility (11 letters between a and y) |
| Assistive technology | Tools like screen readers, magnifiers and switches |
| Screen reader | Software that reads content aloud or to braille |
| WCAG | The main web accessibility standard |
| POUR | Perceivable, Operable, Understandable, Robust |
| AA conformance | The standard most organizations aim for |
| Contrast ratio | Lightness difference between text and background |
| Focus indicator | Visual marker of keyboard focus |
| ARIA | Attributes that add accessibility information |
| Alt text | Text alternative for images |
| Curb-cut effect | Accessibility features that help everyone |

## Quick check

:::check Knowledge check 1
A design uses a red border only to show an input error. What's the accessibility issue, and the fix?
---
Color alone conveys meaning, which fails people with color vision deficiencies and screen reader users. Add a text error message near the field (and an icon), and make sure it's announced to assistive technology.
:::

:::check Knowledge check 2
What should the alt text be for a purely decorative background image?
---
Empty alt text (\`alt=""\`), so screen readers skip it.
:::

:::check Knowledge check 3
Name three quick manual accessibility tests you can do yourself.
---
Navigate key tasks with only the keyboard; zoom to 200% and check the layout; check color contrast (and view in grayscale); try a screen reader on a key flow.
:::

The answer is surprisingly stable. Framing the right problem. Judging output against real users and real constraints. Knowing when *not* to use AI at all. Taking responsibility for what ships. NN/g's State of UX 2026 says it plainly: 2025 was the year of "post-hype AI," 2026 is "the year of AI fatigue," and the harder-to-automate strengths are curated taste, research-informed context, critical thinking and judgment.[[ref:nng-state-ux-2026]]

This chapter is about *your own practice*: AI-assisted workflows, prompting, evaluating and directing outputs, and responsible AI. Other chapters cover designing AI interactions ([[ch:02]]), researching with and about AI ([[ch:04]]), AI product strategy ([[ch:05]]) and how AI systems behave technically ([[ch:10]]). This is the fastest-moving topic in the book, so treat every tool and date as a snapshot (checked October 2026).

Use AI as a multiplier of your judgment, not a substitute for it. The better your judgment, the more it multiplies. The worse, the faster you ship confident mistakes.
