<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solutions Hub</title>
<meta name="description" content="A personal library of knowledge books: product design today, more topics over time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --night:#03101f;
  --aur:radial-gradient(60% 50% at 0% 0%,rgba(14,116,190,.34),transparent 70%),
        radial-gradient(45% 40% at 100% 0%,rgba(56,170,240,.14),transparent 70%),
        radial-gradient(55% 50% at 85% 100%,rgba(10,88,170,.26),transparent 70%),
        radial-gradient(40% 40% at 0% 100%,rgba(40,150,220,.12),transparent 70%);
  --paper:#fcfcfd;--wash:#f3f6fa;--wash-2:#f7f9fc;
  --ink:#161d2b;--body:#353e50;--muted:#5d6679;
  --line:#e7eaf0;--line-2:#dbe1ea;
  --accent:#0369a1;--accent-2:#075985;--tint:#e7f2fb;
  --gap:16px;--r:28px;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;padding:var(--gap);font:400 16px/1.6 var(--font);color:var(--body);background-color:var(--night);background-image:var(--aur);background-attachment:fixed;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;color:var(--ink);font-weight:650;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}

.shell{min-height:calc(100vh - var(--gap)*2);background:var(--paper);border-radius:var(--r);overflow:clip;display:flex;flex-direction:column}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(20px,5vw,56px)}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark-dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,#38a6e8,#0369a1 60%,#073a63);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 16px -8px rgba(3,105,161,.8)}
.mark b{display:block;font-weight:650;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.mark span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.bar-meta{font-size:13px;color:var(--muted)}

/* hero */
.hero{position:relative;padding:clamp(40px,7vw,88px) clamp(20px,5vw,56px) clamp(36px,5vw,56px);background:
  radial-gradient(60% 120% at 0% 0%,#e2effb 0%,transparent 60%),
  radial-gradient(50% 110% at 100% 10%,#e8f3fb 0%,transparent 62%);border-bottom:1px solid var(--line)}
.hero-in{max-width:68rem;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{margin:22px 0 16px;font-size:clamp(2.6rem,1.6rem + 4vw,4.4rem);letter-spacing:-.04em;line-height:1}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;max-width:36rem;font-size:clamp(16.5px,1.1vw + 12px,19px);line-height:1.55;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.stat{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid var(--line)}
.stat b{display:block;font-size:20px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

/* library */
.lib{flex:1;padding:clamp(32px,5vw,56px) clamp(20px,5vw,56px) 64px}
.lib-in{max-width:68rem;margin:0 auto}
.lib-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lib-head h2{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font:500 13px var(--font);cursor:pointer;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{position:relative}
.search input{width:15rem;padding:8px 14px 8px 36px;border:1px solid var(--line);border-radius:999px;background:#fff;font:400 14px var(--font);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(3,105,161,.12)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:18px}

/* topic card */
.topic{position:relative;display:flex;flex-direction:column;grid-column:span 2;min-height:100%;border:1px solid var(--line);border-radius:24px;background:#fff;overflow:hidden;text-decoration:none;color:inherit;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.topic:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 28px 60px -36px rgba(3,30,60,.45)}
.cover{position:relative;height:190px;background:var(--night);background-image:
  radial-gradient(70% 90% at 10% 0%,rgba(56,166,232,.55),transparent 65%),
  radial-gradient(60% 80% at 100% 100%,rgba(14,116,190,.6),transparent 65%),
  radial-gradient(40% 60% at 70% 20%,rgba(120,200,250,.25),transparent 70%);overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px)}
.cover-tag{position:absolute;left:22px;top:20px;z-index:1;display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#e3eef8;font-size:12px;font-weight:500;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cover-tag i{width:6px;height:6px;border-radius:50%;background:#6fe3b0}
.cover-title{position:absolute;left:22px;right:22px;bottom:20px;z-index:1;color:#fff}
.cover-title small{display:block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#a9cbe8;margin-bottom:6px}
.cover-title b{display:block;font-size:clamp(28px,2.4vw + 10px,40px);font-weight:650;letter-spacing:-.03em;line-height:1}
.cover-num{position:absolute;right:18px;top:6px;font-size:120px;font-weight:700;line-height:1;color:rgba(255,255,255,.06);letter-spacing:-.05em;z-index:0}

.body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;padding:24px 24px 22px;flex:1}
.desc{margin:0 0 18px;font-size:15.5px;line-height:1.65;color:var(--body)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--wash);color:var(--muted);font-size:12.5px;font-weight:500}
.pill.blue{background:var(--tint);color:var(--accent-2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.fact{padding:14px 16px 12px;border-radius:14px;background:var(--wash-2);border:1px solid var(--line)}
.fact b{display:block;font-size:19px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fact span{font-size:12px;color:var(--muted)}

.side h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.parts{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:2px}
.parts li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--body)}
.parts li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{margin-top:auto}
.prog-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.prog-row b{color:var(--ink);font-weight:600}
.track{height:6px;border-radius:999px;background:#e5ecf3;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#38a6e8,var(--accent));transition:width .8s var(--ease)}

.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:var(--wash-2)}
.foot-l{font-size:13px;color:var(--muted)}
.foot-l b{color:var(--ink);font-weight:600}
.cta{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:550;font-size:14.5px;box-shadow:0 10px 24px -14px rgba(3,105,161,.9);transition:background .25s,gap .25s}
.topic:hover .cta{background:var(--accent-2);gap:14px}

/* placeholder */
.soon{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;padding:28px;border:1.5px dashed var(--line-2);border-radius:24px;background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(3,105,161,.025) 12px 24px);color:var(--muted)}
.soon .plus{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--accent);font-size:24px;line-height:1}
.soon b{color:var(--ink);font-size:17px;font-weight:600}
.soon p{margin:0;font-size:14px;line-height:1.6;max-width:22rem}
.soon .ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.empty{padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:24px}

.footer{padding:22px clamp(20px,5vw,56px);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (prefers-reduced-motion:no-preference){
  .hero-in>*,.lib-in>*{animation:rise .7s var(--ease) both}
  .hero-in>*:nth-child(2){animation-delay:.06s}.hero-in>*:nth-child(3){animation-delay:.12s}.hero-in>*:nth-child(4){animation-delay:.18s}
  .lib-in>*{animation-delay:.22s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .topic{grid-column:auto}
  .body{grid-template-columns:1fr;gap:20px}
}
@media (max-width:560px){
  :root{--gap:8px;--r:20px}
  .bar-meta{display:none}
  .facts{grid-template-columns:repeat(3,1fr)}
  .search input{width:100%}
  .tools,.search{width:100%}
  .cover{height:160px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <a class="mark" href="./"><span class="mark-dot" aria-hidden="true"></span><span><b>Solutions Hub</b><span>by Ansith</span></span></a>
    <span class="bar-meta" id="updated"></span>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-in">
      <span class="kicker"><i></i>Personal knowledge library</span>
      <h1 id="hero-title">Everything I'm learning, <em>in one place.</em></h1>
      <p id="tagline"></p>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <main class="lib" aria-labelledby="lib-title">
    <div class="lib-in">
      <div class="lib-head">
        <h2 id="lib-title">Library</h2>
        <div class="tools" id="tools"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <footer class="footer">
    <span>Solutions Hub · progress and bookmarks are saved in this browser</span>
    <span id="foot-count"></span>
  </footer>
</div>

<script>
window.HUB = /*HUB_DATA*/{"title": "Solutions Hub", "owner": "Ansith", "tagline": "Knowledge books on the things I want to get better at, written to be read, saved and come back to. Product design today, more topics over time.", "topics": [{"id": "product-design", "title": "Product Design", "kind": "Knowledge Book", "category": "Design", "href": "product-design.html", "description": "Staying skilled in UX and product design through 2026 and beyond: the fundamentals explained from the ground up, plus what is changing now with AI and new standards.", "status": "Active", "updated": "October 2026", "book": "product-design", "storageKey": "pdbook:v1", "bookmarksKey": "pdbook:bookmarks:v1", "stats": {"chapters": 12, "minutes": 298, "sources": 41, "editions": 2, "editionNames": ["Fundamentals", "2026 edition"], "parts": [{"name": "Design Craft", "count": 3}, {"name": "Evidence & Strategy", "count": 2}, {"name": "Product, People & Practice", "count": 3}, {"name": "Building & Inclusion", "count": 3}, {"name": "AI & Emerging Practice", "count": 1}], "first": "Visual & UI Craft", "titles": {"visual-ui-craft": "Visual & UI Craft", "interaction-experience-design": "Interaction & Experience Design", "design-systems-scalable-design": "Design Systems & Scalable Design", "user-research-validation": "User Research & Validation", "product-discovery-strategic-ux": "Product Discovery & Strategic UX", "product-business-thinking": "Product & Business Thinking", "communication-storytelling": "Communication & Storytelling", "collaboration-leadership": "Collaboration & Leadership", "design-tools-prototyping": "Design Tools & Prototyping", "technical-engineering-literacy": "Technical & Engineering Literacy", "accessibility-inclusive-design": "Accessibility & Inclusive Design", "ai-emerging-design-practice": "AI & Emerging Design Practice"}}}]}/*END_HUB_DATA*/;
(function () {
  var H = window.HUB, topics = H.topics || [];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function read(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function n2(n){return n<10?"0"+n:""+n}

  document.getElementById("tagline").textContent = H.tagline || "";
  document.getElementById("updated").textContent = topics.length ? "Last updated " + topics[0].updated : "";

  var chapters=0, hours=0;
  topics.forEach(function(t){ if(t.stats){ chapters+=t.stats.chapters; hours+=(t.stats.minutes||0); } });
  var stats=[[topics.length, topics.length===1?"topic":"topics"],[chapters,"chapters"],[Math.round(hours/60*10)/10+" h","of reading"]];
  document.getElementById("stats").innerHTML = stats.map(function(s){return '<div class="stat"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>'}).join("");
  document.getElementById("foot-count").textContent = topics.length + (topics.length===1?" topic":" topics");

  var cats=["All"]; topics.forEach(function(t){ if(t.category && cats.indexOf(t.category)<0) cats.push(t.category); });
  var state={cat:"All",q:""};
  var tools=document.getElementById("tools");
  if (topics.length > 3) {
    tools.innerHTML = '<div class="chips">'+cats.map(function(c){return '<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c==="All")+'">'+esc(c)+'</button>'}).join("")+'</div>'+
      '<label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Search topics" aria-label="Search topics"></label>';
    tools.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;state.cat=b.dataset.cat;tools.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});render()});
    tools.addEventListener("input",function(e){state.q=e.target.value.toLowerCase();render()});
  }

  function card(t,i){
    var s=t.stats||{}, prog=read(t.storageKey,{}), done=prog&&prog.done?Object.keys(prog.done).filter(function(k){return prog.done[k]}).length:0;
    var bms=read(t.bookmarksKey,[]), bmN=Array.isArray(bms)?bms.length:0;
    var recent=prog&&prog.recent&&prog.recent[0], pct=s.chapters?Math.round(done/s.chapters*100):0;
    var resume=recent&&s.titles&&s.titles[recent.slug];
    var parts=(s.parts||[]).map(function(p){return '<li><span>'+esc(p.name)+'</span><span>'+p.count+(p.count===1?" chapter":" chapters")+'</span></li>'}).join("");
    var href=t.href+(resume?"#/m/"+recent.slug:"");
    return '<a class="topic" href="'+esc(href)+'">'+
      '<div class="cover"><span class="cover-num" aria-hidden="true">'+n2(i+1)+'</span>'+
        '<span class="cover-tag"><i></i>'+esc(t.status||"Active")+' · '+esc(t.category||"")+'</span>'+
        '<div class="cover-title"><small>'+esc(t.kind||"")+'</small><b>'+esc(t.title)+'</b></div></div>'+
      '<div class="body"><div>'+
        '<p class="desc">'+esc(t.description)+'</p>'+
        '<div class="meta">'+(s.editions?'<span class="pill blue">'+s.editions+' editions</span>':'')+
          (s.editionNames||[]).map(function(e){return '<span class="pill">'+esc(e)+'</span>'}).join("")+
          '<span class="pill">Updated '+esc(t.updated)+'</span></div>'+
        '<div class="facts">'+
          '<div class="fact"><b>'+(s.chapters||0)+'</b><span>chapters</span></div>'+
          '<div class="fact"><b>~'+Math.round((s.minutes||0)/60*10)/10+'h</b><span>reading</span></div>'+
          '<div class="fact"><b>'+(s.sources||0)+'</b><span>sources</span></div>'+
        '</div></div>'+
        '<div class="side" style="display:flex;flex-direction:column"><h3>Inside</h3><ul class="parts">'+parts+'</ul>'+
          '<div class="prog"><div class="prog-row"><span><b>'+done+'</b> of '+(s.chapters||0)+' chapters complete</span><span>'+bmN+(bmN===1?" bookmark":" bookmarks")+'</span></div>'+
          '<div class="track"><i style="width:'+pct+'%"></i></div></div></div>'+
      '</div>'+
      '<div class="foot"><span class="foot-l">'+(resume?'Continue with <b>'+esc(resume)+'</b>':'Start with <b>'+esc(s.first||"chapter one")+'</b>')+'</span>'+
        '<span class="cta">'+(resume?"Continue reading":"Open book")+' <span aria-hidden="true">→</span></span></div>'+
    '</a>';
  }
  var soon='<div class="soon"><span class="plus" aria-hidden="true">+</span><b>More topics on the way</b>'+
    '<p>This hub grows over time. Each new topic gets its own book with the same reading experience.</p></div>';

  function render(){
    var list=topics.filter(function(t){
      return (state.cat==="All"||t.category===state.cat) && (!state.q||(t.title+" "+t.description+" "+t.category).toLowerCase().indexOf(state.q)>=0);
    });
    var g=document.getElementById("grid");
    g.innerHTML = list.length ? list.map(card).join("") + (state.cat==="All"&&!state.q?soon:"") : '<div class="empty">No topics match.</div>';
  }
  render();
})();
</script>
</body>
</html>
