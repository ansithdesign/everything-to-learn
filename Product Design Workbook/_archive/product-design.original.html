`,oa=`Most design effort that fails does not fail in execution. It fails because the team solved a problem that was not the real one, or was real but not worth solving, or was real and worth solving but for a different group of people. Problem framing and discovery exist to reduce that risk before the expensive work starts. They are also where designers can show the most senior behavior, because they require judgment under uncertainty, not skill with a tool.

This chapter teaches how to move from a request or an observation to a defensible problem statement, how to surface and rank assumptions, how to choose the cheapest way to test the dangerous ones, and how to do all of this under real deadlines in an organization that wants to ship. Frameworks from the literature are cited where they originate: opportunity solution trees from Teresa Torres [[ref:torres-chd]], the Jobs to Be Done lens as developed by Clayton Christensen and colleagues [[ref:christensen-luck]], the four product risks from Marty Cagan [[ref:svpg-risks]], and the phase structure of public service work from the GOV.UK Service Manual [[ref:govuk-manual]]. These are practitioner frameworks. They are useful, widely adopted and not validated by controlled studies, and the chapter flags where each one is weakest. Worked examples are hypothetical.

## Discovery and delivery are one activity

Discovery is work that reduces uncertainty about **what** to build and **whether** it is worth building. Delivery is work that builds and releases it. A common organizational picture treats them as sequential: research first, then design, then build. In practice they overlap constantly. While engineers build this quarter's work, the designer is exploring next quarter's. The important consequences are:

- Discovery never "finishes." It continues in lighter form, informed by what the shipped product reveals.
- Discovery is not a separate team's job. Designers, product managers and engineers each see different risks, and the best discovery involves all three.
- The aim is not to eliminate uncertainty. It is to reduce it enough to make a good bet, and to make the remaining uncertainty visible.

The GOV.UK Service Manual describes discovery, alpha, beta and live phases, each with its own questions and evidence expectations [[ref:govuk-manual]]. You do not need to adopt those labels, but the underlying idea is valuable: **the kind of evidence you need changes as commitment grows.** Early on, you want to learn cheaply whether a problem exists. Later you want to check that a specific design works. Mixing them up, such as polishing a prototype before knowing the problem matters, wastes effort.

:::definition Discovery
Work that reduces uncertainty about whether a problem is real, who has it, how much it matters, and which kind of solution could address it, before committing to build. It continues in lighter form after release.
:::

## Understanding the context first

Before you ask users anything, learn what the organization already knows. This is cheaper, faster, and prevents asking questions whose answers already exist.

| Source | What it can tell you | Watch for |
|---|---|---|
| Support tickets and escalations | Recurrent pain, vocabulary users use | Biased toward people who contact support; loud, not necessarily common |
| Sales and customer success notes | Why deals are won or lost, what customers ask for | Requests are solutions, not problems; filtered by what salespeople remember |
| Product analytics | What people do, where they stop | Shows what, rarely why; depends on what was instrumented |
| Previous research | Existing findings | Age, sample and whether the product has changed since |
| Roadmap and strategy documents | What the business is trying to achieve | Gaps between stated strategy and actual priorities |
| Engineering knowledge | Constraints, technical debt, what is cheap or costly | Informal and undocumented; must be asked |
| Regulatory or contractual requirements | Non-negotiable constraints | Interpreting them is not a designer's call; ask the owners |

Spend a few days on this before planning primary research. You will usually find that some questions are already answered, some are partially answered with stale evidence, and a few are unanswered. The last group is where new research should focus. This pairing of existing evidence with new research is a recurring theme in [[ch:06]].

## From request to problem

### Requests are evidence

Stakeholders usually arrive with a solution: a feature, a dashboard, a change that a competitor made. Treat the request as **evidence about a problem**, not a specification. Someone cared enough to ask. Your job is to find what they are actually experiencing and why it matters.

A short discovery conversation with the requester can use the five questions from [[ch:01]]: what is the person trying to get done, what happens today, what goes wrong and how often, why does it matter now, and how would we know it improved. If the requester cannot answer the second and third, the request is a hypothesis and you now know where learning is needed.

### Writing a problem statement

A problem statement describes a person, a goal, a barrier and a consequence, without prescribing a solution. A workable structure:

> **[Who]** needs to **[goal]**, but **[barrier]**, which leads to **[consequence]**. We believe this matters because **[evidence]**. We do not yet know **[key unknown]**.

Two things make this useful. The sentence forbids solution words (no "dashboard," "wizard," "button"), and it ends with what you do not yet know. A problem statement that sounds certain is usually premature.

:::example Hypothetical: from request to problem
**Request, as received:** "Add a dashboard so warehouse managers can see delayed shipments."

**Weak problem statement:** "Warehouse managers need a delayed shipments dashboard." This is the request restated. It contains a solution.

**Stronger statement:** "Warehouse managers need to know which inbound shipments will arrive late so they can reschedule dock labor, but today they learn about delays only when a truck fails to show up, which leads to idle staff and overtime. Support tickets and two manager conversations suggest this happens regularly. We do not yet know how managers currently track expected arrivals, how much notice they need to act, or whether supplier data is available early enough to predict delays."

The second version changes what you do next. You might find that managers already track arrivals in a spreadsheet fed by email from suppliers; the real problem could be data flow, not display. Or that notice shorter than a few hours is useless for rescheduling labor, so a dashboard of already-late shipments helps nobody. Both findings would redirect the project.
:::

### Problem space framing questions that expose hidden structure

| Question | What it reveals |
|---|---|
| Who else is affected (approvers, administrators, auditors, downstream teams)? | Secondary users who bear the cost of design choices |
| What is the workaround today? | The real baseline you must beat |
| What happens if we do nothing? | Urgency and cost of inaction |
| What would make this problem disappear without any new feature? | Process, training or policy solutions |
| Who benefits if this is solved, and who loses? | Political and adoption dynamics |
| What constraint makes this hard? | Technical, regulatory or organizational limits |

The fourth question is worth special attention. Product teams default to building. Sometimes the best answer is a policy change, a clearer label, or a one-time data fix. Recommending that is not a failure of design; it is evidence of judgment.

## Behavioral frameworks: Jobs to Be Done

**Jobs to Be Done (JTBD)** is a lens that explains why people adopt products by the progress they are trying to make in a particular circumstance. The version associated with Christensen and colleagues emphasizes that people "hire" a product to do a job, and that the job is about the circumstance and desired progress, not demographic characteristics [[ref:christensen-luck]]. Several distinct JTBD schools exist, with different vocabulary and methods, so when someone says "we use JTBD," ask which approach.

:::framework Jobs to Be Done as a framing tool
**What it is.** A way of describing needs as progress someone wants to make in a situation, often phrased as "When [situation], I want to [motivation], so I can [outcome]."

**Problem it addresses.** Persona and demographic descriptions say who users are but not why they act. JTBD focuses on the situation and the motivation, which often explains behavior better and sets competitors more broadly (the alternative to a product may be a spreadsheet or a phone call).

**When to use it.** Early discovery, when deciding what problem to address, and when understanding switching behavior (why people move from one solution to another).

**When not to use it.** As a substitute for research. A job statement written in a workshop is a hypothesis. It is also less helpful for very specific interface questions, where task analysis and usability testing are better.

**How to apply it.**
1. Collect real situations, usually from interviews about recent events, not general opinions.
2. For each, note the circumstance, what the person was trying to achieve, what else they considered, and what obstacles they met.
3. Cluster by job, not by person. One person may have several jobs; one job may span several roles.
4. Write each job as a situation, a motivation and an outcome.
5. Note the functional, emotional and social dimensions where relevant. In enterprise settings the social dimension (looking competent to a manager, being safe in an audit) is often strong.

**Limitations.** Job definitions depend on the level of abstraction chosen, and different analysts can produce different jobs from the same data. There is little controlled research comparing JTBD with other approaches; its support is mostly case-based and practitioner experience.
:::

:::example Hypothetical: a job in a regulated setting
"When an inspector requests records for a specific batch, I want to produce a complete, correct trail quickly, so I can show we are in control and avoid a finding."

This job is not about "reports." It includes a time pressure, a social stake (appearing in control), and a consequence (a finding). It suggests different design questions than "improve the reporting module": how fast can a person locate everything about one batch, how do they know the trail is complete, and how do they show provenance? It is a hypothesis until interviews with people who have actually faced inspections confirm and refine it.
:::

## Assumptions, hypotheses and risk

Every plan rests on beliefs. Many are reasonable. A few are fatal if wrong. The skill is telling them apart.

### The assumption and risk register

An **assumption** is something the team is acting on without sufficient evidence. A **hypothesis** is an assumption written in a form that can be tested. An **assumption and risk register** is a simple table that ranks them.

:::framework Assumption mapping
**What it is.** A procedure for listing assumptions and ranking them by two criteria: how important the assumption is to the plan, and how much evidence you have.

**Problem it addresses.** Teams test what is convenient to test, not what is dangerous to leave untested.

**When to use it.** At the start of discovery, and again when the plan changes materially.

**When not to use it.** For small, reversible changes. The overhead exceeds the risk.

**How to apply it.**
1. Write the idea in one sentence.
2. Generate assumptions in the four risk areas (value, usability, feasibility, viability) [[ref:svpg-risks]]. Prompt: "What must be true for this to work?"
3. Write each as a testable statement: "Warehouse managers receive supplier delay notices at least four hours before arrival."
4. Rate **importance** (if false, does the idea fail?) and **evidence** (how much do we know?).
5. Plot on a grid. The assumptions that are important with little evidence are the ones to test first.
6. For each, name the cheapest test and what result would change the plan.

**Limitations.** Ratings are judgments, often made by the same people who proposed the idea. Invite someone skeptical, ideally an engineer, to challenge them. The map also cannot find assumptions nobody thought of; research can.
:::

A blank structure you can copy:

\`\`\`diagram
  Assumption (testable statement) | Risk type | Importance (H/M/L) | Evidence (H/M/L) | Cheapest test | Result that would change the plan | Owner | Date
\`\`\`

### Choosing the cheapest sufficient test

Match the test to the risk, and prefer the cheapest test that could change your mind.

| Risk | Example cheap tests |
|---|---|
| Value: do people have this problem? | Interviews about recent events; support ticket review; observing the current workaround |
| Value: will they choose our solution? | A concept description or low-fidelity prototype shown with a realistic alternative; a fake-door link measuring interest (only where ethically appropriate and not deceptive in a way that harms) |
| Usability: can they do it? | Moderated test with a prototype on realistic tasks |
| Feasibility: can we build it? | A technical spike by engineering; review of the data model and integrations |
| Viability: does it work for the business? | Conversation with sales, finance, legal and support owners; pricing or packaging checks |

An important point about **fake-door and similar tests**: they measure expressed interest, not sustained use, and they can mislead people if poorly designed. Use them carefully, keep them honest, and treat results as one signal.

## Opportunity solution trees

An **opportunity solution tree**, described by Teresa Torres, is a visual structure that connects a desired outcome to opportunities (customer needs, pain points or desires), then to solutions, then to assumption tests [[ref:torres-chd]].

\`\`\`diagram
  Desired outcome (one, measurable)
      |
      +-- Opportunity A (a need or pain point)
      |       +-- Solution A1
      |       |      +-- Assumption test
      |       +-- Solution A2
      |
      +-- Opportunity B
              +-- Solution B1
\`\`\`

:::framework Opportunity solution tree
**What it is.** A tree linking an outcome to the opportunities that could drive it and the candidate solutions for each.

**Problem it addresses.** Teams jump from an outcome straight to one solution, or collect many solutions with no connection to what they are meant to achieve.

**When to use it.** When a team has a defined outcome and needs to decide where to look and what to try, especially with continuous discovery.

**When not to use it.** When the outcome is unclear (the tree will be elaborate but pointless) or for a one-off small change.

**How to apply it.**
1. Agree one outcome that is measurable and within the team's influence.
2. Gather evidence about customer needs and organize into opportunities. Phrase opportunities as needs, not solutions.
3. Compare opportunities, using your evidence on size, frequency and strategic fit.
4. Generate several solutions for the chosen opportunity, not one.
5. Identify the assumptions behind each solution and test them (the previous section).
6. Revise the tree as learning arrives.

**Limitations.** The tree can create an impression of rigor, since the structure looks scientific, while the contents are guesses. Its value depends on the evidence behind each branch. It is also a method designed for ongoing discovery with regular customer contact; teams without that access will find it harder to use as intended.
:::

## Prioritizing problems

Not every real problem deserves attention now. [[ch:12]] covers prioritization frameworks and their limits. For discovery, a few questions help rank problems:

- **Frequency and severity.** How often does it occur, and how bad is it when it does? A rare catastrophic issue may outrank a frequent minor one.
- **Reach.** How many users or accounts? In enterprise software, a problem affecting a few high-value accounts may matter more than one affecting many small ones, which is a business judgment you should make with, not against, product leadership.
- **Strategic fit.** Does it advance the outcome the organization cares about?
- **Cost of delay.** Does waiting make it worse (a compliance deadline, a customer renewal)?
- **Confidence.** How sure are we that it is real?

Resist the temptation to produce a precise numeric score from rough inputs. A table with high, medium and low and a short reason is often more honest than a score that implies precision the data cannot support.

## Avoiding solution-first design

Solution-first design is not a character flaw. It is a predictable response to incentives: stakeholders want visible progress, designers are hired to produce designs, and a mock-up feels like progress. Recognize the signs and have a response ready.

| Sign | What is happening | Response |
|---|---|---|
| Meeting opens with screens | The conversation starts at the solution | Ask what changes for the user if this works |
| "Users want X" with no source | An unsourced claim | Ask where it came from; propose a quick check |
| Competitor feature as justification | Imitation, not need | Ask what problem the competitor's customers have and whether ours match |
| A deadline anchors scope | Time drives content | Separate what must be certain from what can be learned during build |
| A favorite idea | Attachment | Ask what result would change the plan |

:::warning Discovery that only confirms
A frequent failure is discovery designed to confirm a decision already made. Signs: questions that can only yield "yes," participants chosen for friendliness, and no pre-stated result that would change the plan. Before a study or test, write what you expect and what outcome would make you change direction. If no result could do that, you are not doing discovery.
:::

## Discovery under deadlines and constraints

Real teams do not have unlimited time. Compressed discovery is possible if you are explicit about what you are trading.

**Time-box and name the decision.** "We will spend one week learning whether managers can act on four hours' notice. The result decides whether we build the notification feature or investigate supplier data first."

**Run lightweight versions.** Three conversations are better than none, and five better than three, for the early exploration of a single group. Understand what that does and does not tell you. Interview-sized samples are strong for finding what problems exist and why, and weak for estimating how common they are; [[ch:06]] expands on this, including why advice such as "test with five users" is often misread [[ref:nng-five-users]].

**Reuse existing evidence.** Combine support data, previous studies and the team's tacit knowledge before collecting more.

**Protect the riskiest decisions.** If time allows rigor in only one place, spend it on decisions that are hard to reverse.

**Say what is not known.** State the residual uncertainty in plain terms when presenting a recommendation, and describe how you will learn during delivery.

**Learn in delivery.** Plan instrumentation and a follow-up check so that what was uncertain at release becomes known soon after. [[ch:13]] covers how.

## Worked case: discovery for a partner integration status page

:::case Hypothetical: "Show integration status"
This is an invented scenario illustrating the method. No real data is implied.

**Context.** A B2B platform lets customers connect to trading partners. Customer success reports that customers repeatedly ask "is my connection working?" The product manager proposes an "Integration health" page.

**Business objective (assumed for the example).** Reduce support load and renewals risk caused by integration confusion.

**User problem, as understood so far.** Customers cannot tell whether a failed or missing data exchange is caused by their system, the partner's, or the platform.

**Known evidence.** A pattern of support tickets with "connection" in the subject; customer success anecdotes; no analytics on integration errors.

**Unknowns and assumptions.**
- Who asks: IT administrators, operations managers, or both? (unknown)
- Whether the issue is lack of information, or lack of ability to act once informed. (unknown)
- Whether the platform logs distinguish failure origins well enough to show a cause. (feasibility unknown)
- Whether customers want proactive alerts rather than a page to visit. (assumed no)

**Assumption ranking.** Two assumptions are both important and weakly evidenced: that platform logs can identify failure origin (feasibility), and that people would visit a status page rather than want alerts (value and usability). Everything else can wait.

**Discovery plan (one week, time-boxed).**
1. Review 30 tickets and tag by cause, who wrote, and what they needed (existing evidence).
2. Two short interviews each with an administrator and an operations manager, focused on the last time a connection failed: what they noticed, whom they asked, how they resolved it (value and usability).
3. A one-hour conversation with an engineer about what logs can distinguish (feasibility).
4. A conversation with customer success about which accounts are at risk, to understand viability.

**Options considered after discovery (illustrative).**
- **A. Status page.** Good if people check proactively; weak if issues are discovered through downstream effects.
- **B. Alerts with context** sent to the right role when a failure begins, with a link to detail. Fits if the main pain is late discovery.
- **C. Improve error messages and logs in place**, so that when users reach the existing screen they can act. Fits if the pain is inability to diagnose.

**Trade-offs.** A is a familiar, visible deliverable. B changes notification design, and depends on log quality. C is least visible but may address the main pain. The choice depends on what the interviews and tickets show; it is not decided in advance.

**Validation plan.** Test the leading option with a prototype using real past failures as scenarios, and check whether administrators identify the cause and next step.

**Success metrics (to be agreed with the team).** Possible: fewer tickets that ask for diagnosis, shorter time to identify cause in tests. State baselines first, and state what else may change over the same period.

**Risks.** The logs may not support cause identification, which would turn a design problem into a platform problem. Alerts could create noise.

**What a senior designer communicates.** "I am not recommending a status page yet. I want one week to find out whether the problem is visibility or diagnosis, and whether our logs can support either. At the end I will recommend one of three directions and say what we still do not know. The cost of the week is small compared with building the wrong thing for a quarter."
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize
**1. Restating the solution as a problem.** *Why:* it is faster and sounds agreeable. *Sign:* the problem statement contains the solution noun. *Consequence:* no alternatives are explored. *Fix:* rewrite without product nouns; add who, goal, barrier, consequence.

**2. Testing the safest assumption.** *Why:* it is easy and likely to pass. *Sign:* a research plan of low-risk questions. *Consequence:* false confidence. *Fix:* rank by importance and evidence; test the top-right.

**3. Treating JTBD statements as findings.** *Why:* a workshop produces tidy statements. *Sign:* jobs with no source interviews. *Consequence:* confident wrong framing. *Fix:* label them hypotheses until grounded in real situations.

**4. Building an elaborate tree with no evidence.** *Why:* the structure feels rigorous. *Sign:* boxes with no source notes. *Consequence:* decisions that look evidence-based but are not. *Fix:* attach a source or label to every opportunity.

**5. Treating discovery as a gate that delays delivery.** *Why:* poor scoping. *Sign:* open-ended research with no decision attached. *Consequence:* the team stops inviting it. *Fix:* time-box, name the decision, deliver a recommendation.

**6. Assuming the loudest customer is the typical one.** *Why:* vivid anecdotes are persuasive. *Sign:* a roadmap shaped by one account. *Consequence:* a niche solution. *Fix:* check frequency and reach before generalizing; note when business strategy legitimately prioritizes a key account.

**7. Ignoring non-product solutions.** *Why:* the team builds software. *Sign:* every problem becomes a feature. *Consequence:* needless complexity. *Fix:* ask what would make the problem disappear without a feature.
:::

## Trade-offs and decision criteria

| Decision | Lean toward more discovery when | Lean toward building and learning when |
|---|---|---|
| Start with research or prototype | The problem itself is unclear | The problem is clear and the solution space is small |
| Interviews or analytics | You need to understand why | You need to see how much or where |
| Broad exploration or focused test | The space is new and options are many | One assumption dominates the risk |
| Wait for more evidence | The decision is hard to reverse | The decision is cheap to undo |
| Challenge a stakeholder's idea | Evidence contradicts it and the cost is high | The idea is cheap to try and the relationship benefits from yielding |

When a regulatory or contractual requirement drives the work, the value question is largely settled. The design question becomes how to meet the requirement with the least burden and the most trustworthy evidence trail.

## Senior-level application

A senior designer in discovery:

- **Frames, then proposes.** They bring a problem statement and a learning plan, not only a design.
- **Knows which uncertainty matters.** They concentrate effort where wrongness would be most costly.
- **Brings engineering and product in early.** Feasibility and viability assumptions are tested in the same cycle as value assumptions.
- **Keeps a visible record.** Assumption registers, decision records and short findings notes let others see what is known.
- **Shapes how the team does discovery.** They help set up regular customer contact, a research repository and shared language, which is the step from doing discovery to enabling it.
- **Is comfortable saying "we do not know yet."** And pairs that with a plan.

## Checklists and heuristics

:::checklist Problem statement quality
- [ ] It names who, a goal, a barrier and a consequence.
- [ ] It contains no solution nouns.
- [ ] It cites the evidence and its source and age.
- [ ] It states what is not yet known.
- [ ] A stakeholder who proposed a different solution would still recognize their concern in it.
:::

:::checklist Discovery plan
- [ ] The decision the work will inform is named.
- [ ] Existing evidence has been reviewed first.
- [ ] Assumptions are written as testable statements and ranked.
- [ ] The cheapest sufficient test is chosen for each top-ranked assumption.
- [ ] A result that would change the plan is stated in advance.
- [ ] A time box and owner are set.
- [ ] Feasibility and viability owners are involved.
:::

## Practice exercises

:::exercise Rewrite three requests
Collect three feature requests from the past month. For each, write a problem statement using the structure in this chapter, with no solution nouns. Mark what you do not yet know.

*Evaluation criteria:* Each statement names a person, goal, barrier and consequence. Each ends with a genuine unknown. A colleague reading it cannot guess which feature was requested.
:::

:::exercise Build an assumption register
Choose one initiative planned for next quarter. Write at least ten assumptions, across all four risk areas. Rate importance and evidence. Choose the top two and define a cheap test for each, with the result that would change the plan.

*Evaluation criteria:* At least two assumptions are about feasibility or viability, not only users. The tests could be completed within two weeks. The "would change the plan" results are specific.
:::

:::exercise Draw an opportunity solution tree
For one outcome your team owns, draw a tree with at least three opportunities and two solutions for the strongest one. Mark the evidence under each opportunity (source, date, sample). Highlight branches with no evidence.

*Evaluation criteria:* Opportunities are needs, not solutions. Evidence gaps are visible. The tree contains at least one solution that is not software.
:::

## Reflection questions

- Which of your current projects began with a solution? What problem was recovered from it, and by whom?
- Which assumption in your current work, if wrong, would waste the most effort? Has it been tested?
- When did discovery last change a plan? What made that possible?
- Which unknowns do you hide when presenting? What would it cost to state them?
- Where could a non-product solution replace a planned feature?

## Chapter summary

- Discovery and delivery overlap. Discovery reduces uncertainty enough to make a good bet.
- Start with existing evidence, then decide what new research is justified.
- Treat requests as evidence about a problem. Write problem statements without solution nouns and end with what you do not know.
- Jobs to Be Done describes progress sought in a situation. It is a lens, not a measurement, and job statements are hypotheses until grounded in real situations.
- Map assumptions by importance and evidence, and test the important, weakly evidenced ones with the cheapest sufficient test.
- Opportunity solution trees connect outcomes, needs, solutions and tests. Their value depends on the evidence behind each branch.
- Under deadlines, time-box, name the decision, reuse evidence and state residual uncertainty.
- Always consider solutions that are not features.

## Knowledge check

:::check Recall: assumptions
Name the four risk areas used to generate assumptions in this chapter, and say which one teams most often leave untested.
---
Value, usability, feasibility and viability. Value risk, whether anyone needs this, is most often left untested, because teams tend to test what they can build and use, which are the more comfortable risks.
:::

:::check Application: a problem statement
Rewrite "We need a bulk upload for suppliers" as a problem statement.
---
A good answer names who (for example, the person who maintains supplier records), a goal (keep supplier data current), a barrier (they must enter many records one at a time), a consequence (delays and errors), the evidence, and an unknown (how many records, how often, from which source format). It must not contain the word "upload" as the solution, though it may refer to the data transfer need. The unknowns often reveal that an integration would serve better than manual upload.
:::

:::check Scenario: time pressure
A director wants a feature in six weeks and you have evidence that its core assumption may be false. What do you do?
---
Propose a time-boxed test of the riskiest assumption within the first week or two, name the decision it informs, and describe what you will do for each result. Continue low-risk preparation in parallel. State residual uncertainty openly. Avoid both silent compliance and demands for open-ended research.
:::

:::check Trade-off: how much discovery
When is extensive discovery a poor use of time?
---
When the decision is cheap and reversible, when strong evidence exists, or when a requirement removes the value question. Then build and learn from use, or concentrate on how to meet the requirement with minimal user burden.
:::

:::check Interpretation: a tree
A teammate shows an opportunity solution tree with detailed branches and no sources. What is the main concern?
---
The structure conveys rigor the content may not have. Without sources, opportunities may be guesses and solutions may be pre-existing ideas placed under convenient headings. Ask for the evidence behind each opportunity, and mark unevidenced branches as hypotheses to test.
:::

`,ra=`Research is the discipline of finding out what is true about users and their context well enough to make a better decision. That sentence contains the two things most often forgotten: *well enough* (research has a cost and a diminishing return) and *a better decision* (research that informs no decision is expensive reading).

This chapter is about choosing methods, running them with integrity, recruiting the right people (harder than it sounds in specialized enterprise domains), and stating your confidence honestly. It deliberately does not teach every method in detail. It teaches how to choose, how to avoid the errors that invalidate results, and how to say what a study can and cannot support. Turning raw data into insight is [[ch:07]].

The chapter draws on practitioner sources: Erika Hall's pragmatic account of research for working teams [[ref:hall-jer]], Steve Portigal's work on interviewing [[ref:portigal]], and guidance from the Nielsen Norman Group on sample sizes in usability testing [[ref:nng-five-users]]. These are credible, widely used and based on professional experience and, in the case of the sample size work, on modeling and observation. They are not equivalent to controlled experiments, and the chapter notes where that matters. Examples are hypothetical.

## What research is for

Research reduces uncertainty about a specific question. Good research starts from a decision and works backwards.

| Question type | Example | Typical decision it informs |
|---|---|---|
| Descriptive: what is happening? | How do receiving clerks reconcile a delivery with a purchase order today? | What to design for; which problems exist |
| Explanatory: why? | Why do clerks keep a paper copy? | Which causes to address |
| Evaluative: does this work? | Can an administrator configure a partner connection with this design? | Whether to ship, iterate or rethink |
| Comparative: which is better? | Does layout A or B lead to fewer errors? | Which option to pursue |
| Quantifying: how much, how often? | What share of accounts use bulk edit weekly? | Priority, resource allocation |

A frequent mistake is picking a method first because it is familiar (a survey, an interview) and then forcing the question into it. Start with the question and the decision.

:::definition Qualitative vs quantitative evidence
**Qualitative evidence** describes how and why: observed behavior, stated reasons, language, context. It comes from small samples studied in depth and generalizes by *explanation*, not by statistics. **Quantitative evidence** describes how much and how often, from larger samples measured consistently, and generalizes by *estimation*. Neither is better. They answer different questions, and the strongest work usually combines them.
:::

## Choosing a method

No method is neutral. Each reveals some things and hides others. A useful lens is two dimensions: **attitudinal vs behavioral** (what people say vs what they do) and **qualitative vs quantitative** (why vs how much). This framing is widely used in practitioner literature; treat it as a thinking aid, not a taxonomy with hard edges.

| Method | What it reveals | Best for | Limits |
|---|---|---|---|
| Interviews | Reasons, experiences, vocabulary, context | Understanding problems and motives early | People report poorly on habits and predict poorly their future behavior |
| Contextual inquiry / observation | Actual behavior in the real environment, workarounds | Complex workflows, specialist work | Time-consuming; observer effect; limited to who and where you can visit |
| Usability testing | Whether people can complete tasks with a design | Finding problems in a design | Tests what you give them; lab tasks differ from real work |
| Surveys | Prevalence of attitudes and self-reported behaviors | Quantifying known issues across many people | Cannot explore the unknown; wording and sampling dominate quality |
| Diary studies | Behavior and experience over time | Infrequent or long-running tasks | Participant burden; reporting fatigue |
| Analytics review | What people do at scale | Where and how often; trends | No reasons; depends on instrumentation |
| Support and sales data review | Pain points in the customers' words | Starting points for questions | Selection bias; loudest issues dominate |
| Card sorting, tree testing | How people group and find information | IA decisions ([[ch:07]]) | Do not prove a structure works in context |
| A/B tests | Effect of a change on a measured behavior | Comparing options with sufficient traffic | Answer "which" not "why"; need volume and good metrics ([[ch:13]]) |

### A decision procedure

:::framework Choosing a method from the question
**What it is.** A sequence for selecting a method. This is the book's own synthesis.

**Problem it addresses.** Method-first research: doing interviews because interviews are what we do.

**When to use it.** At the start of every study.

**When not to use it.** When a method is mandated (for example, a regulatory usability evaluation) and the design question is the method's own execution.

**How to apply it.**
1. Write the decision: "We will decide whether to ___."
2. Write the question: what must we learn to make it?
3. Check if existing evidence answers it (analytics, tickets, past studies).
4. Classify the question: descriptive, explanatory, evaluative, comparative or quantifying.
5. Choose the cheapest method that could answer it and that matches the stage of the work. Early: observation and interviews. Mid: prototype testing. Late: instrumented release.
6. Check the method's blind spot and decide how you will cover it. For instance, if you interview, ask for specific recent events rather than opinions; if you survey, pilot the wording.
7. Pre-register what result would change your plan.

**Limitations.** Real constraints (time, access, budget) often override ideal method choice. When they do, say so in the findings, since the compromise changes what the evidence can support.
:::

### What people say vs what they do

People can describe their experiences, but they are poor at predicting their own future behavior and at remembering routine habits accurately. Asking "Would you use a dashboard like this?" produces polite, uninformative answers. Asking "Tell me about the last time you needed to check on a delayed delivery. What did you do first?" produces information. This is a core interviewing principle in the practitioner literature, including Portigal's work [[ref:portigal]], and it is one of the most reliable improvements a researcher can make.

## Interviews and conversational research

An interview is a structured conversation designed to learn how someone experiences something.

### Principles

1. **Ask about specific, recent events**, not generalities. "Last time" beats "usually."
2. **Ask open, neutral questions.** "How did you handle it?" not "Was it frustrating?"
3. **Follow, do not lead.** Let the person tell the story; probe on what they say. "You mentioned you called the supplier. What happened next?"
4. **Listen for vocabulary.** The words people use should shape your labels and your copy.
5. **Tolerate silence.** People often fill pauses with the most useful detail.
6. **Separate observation from interpretation** in notes. Record what was said or done; keep your reading of it distinct.

### Leading questions: recognizing and repairing them

| Leading | Why it fails | Better |
|---|---|---|
| "Don't you find the approval process slow?" | Presupposes and suggests the answer | "Tell me about the last approval you handled." |
| "Would a dashboard help you?" | Hypothetical, invites agreement | "How do you find out about delays today?" |
| "How much do you like the new layout?" | Presupposes liking | "Walk me through how you would find the order from yesterday." |
| "Is it hard to reconcile deliveries?" | Binary, suggests difficulty | "How do you reconcile a delivery with its order?" |

:::decision A blank interview guide structure
A guide is a set of prompts, not a script. A reusable structure:

1. **Opening (5 minutes).** Purpose, consent, recording, how the data will be used, permission to stop. Warm-up about role and context.
2. **Context (10 minutes).** "Tell me about your job and what a typical day involves." Tools, teammates, systems.
3. **Recent event (20 minutes).** "Think of the last time you [did the relevant task]. Walk me through it from the beginning." Probes: what triggered it, what you did, who you contacted, what went wrong, what you did about it.
4. **Specific probes (10 minutes).** Areas related to your research questions, asked about real experiences.
5. **Close (5 minutes).** "Is there something I should have asked?" Thanks and next steps.

Keep a one-page list of research questions separate from the interview questions. Research questions are what you want to learn; interview questions are how you elicit it, and they are never the same sentences.
:::

## Observation and contextual inquiry

For complex, specialized work, observing people in their environment is often the most informative method available. Contextual inquiry means watching work as it happens and asking questions in context. In enterprise settings it reveals things that interviews miss: the paper printout taped to the monitor, the spreadsheet maintained because the system does not support partial deliveries, the colleague who is asked for help.

Practical points:
- **Get access carefully.** Workplace visits involve permissions, confidentiality and sometimes regulatory restrictions. Coordinate through the customer's contact and agree what you may record.
- **Observe before asking.** Early in a session, let the person work and note what they do.
- **Capture artifacts** (with permission): forms, cheat sheets, workarounds. They are evidence of unmet needs.
- **Be honest about the observer effect.** People behave differently when watched. Longer observation reduces it but does not eliminate it.

## Surveys

Surveys are easy to launch and easy to do badly. They are best for quantifying something you already understand well enough to ask about. They are poor for exploration, because you can only get answers to questions you thought to ask, in the categories you provided.

Common flaws:
- **Leading or double-barreled questions** ("How satisfied are you with the speed and accuracy of reporting?" asks two things).
- **Missing options** or forced choices that do not fit.
- **Self-selection.** Those who respond differ from those who do not; with low response rates this can dominate the results.
- **Treating satisfaction scores as behavior.** Stated satisfaction predicts action imperfectly.

Pilot every survey with a few people from the target group, and read the free-text answers, not only the charts.

## Sampling, recruitment and bias

### Who you talk to matters more than how many

A sample of ten of the wrong people is worse than three of the right ones. Define the target group from the decision: Which roles? Which experience levels? Which organization sizes? Which are the extremes you need (new users, power users, people who churned)?

**Sample size.** The advice most often repeated in this area is that five users are enough for usability testing. The original argument, associated with Jakob Nielsen and Tom Landauer's modeling of problem discovery, is that in a single round of qualitative testing with a relatively homogeneous group, the first few participants reveal a large share of the problems, and each additional one adds progressively less. The Nielsen Norman Group's own summary argues for running several small rounds rather than one large one, and notes that the logic applies to qualitative problem discovery for a group of similar users, not to quantitative measurement, which requires substantially larger samples, nor to products with several distinct user groups, which each need coverage [[ref:nng-five-users]]. The oft-quoted shorthand "five users find 85% of problems" is a model's output under assumptions. Real problem discovery rates vary with the product, the tasks and the participants. Treat five as a starting point for a qualitative round, not as a guarantee.

:::warning Misreadings of "test with five users"
- It does not mean one study of five people is sufficient for a product.
- It does not apply to quantitative questions ("what share of users fail?").
- It does not cover several distinct user groups. Each group needs its own participants.
- It does not mean you can stop after the first round. The argument is for iterating.
:::

### Recruiting specialists

Enterprise and regulated domains make recruiting difficult. The people you need (a quality assurance lead in a pharmaceutical plant, a customs broker, a warehouse supervisor) are busy, hard to find, and often constrained by their employer's policies. Practical approaches:

- **Use customer success and account teams** to introduce you, with a clear explanation of what you ask and what you offer in return.
- **Recruit through existing relationships** such as user groups and advisory boards, while noting that these contacts are often more engaged than typical users.
- **Use internal experts as proxies carefully.** Colleagues who previously did the job can help refine questions, but they are not substitutes for current users, since their knowledge may be dated and their view shaped by the company.
- **Respect time and confidentiality.** Offer short sessions, flexible times and written confirmation of how data will be handled.
- **Keep a panel** of willing participants and refresh it. Panels save effort, but over time they become unrepresentative because the same people are reused.

### Common biases and how to counter them

| Bias | What it is | Counter |
|---|---|---|
| Selection bias | Who you reach differs from who you need | Define the target; recruit deliberately; report who is missing |
| Confirmation bias | Noticing evidence that supports your belief | State the disconfirming result in advance; have a colleague review raw data |
| Acquiescence | Participants agree to please | Neutral wording; ask for specific events; avoid yes or no questions |
| Social desirability | Participants say what looks good | Emphasize no right answers; ask about behavior, not opinions |
| Recency and recall | People remember recent or striking events | Ask about specific episodes; use diaries for longer periods |
| Observer effect | Behavior changes under observation | Longer sessions; minimize intrusion; acknowledge the effect |
| Survivorship | You only hear from those who stayed | Seek churned users and those who never adopted |
| Researcher bias | Your assumptions shape questions and interpretation | Pilot, peer review, record verbatim, separate observation from interpretation |

## Research ethics

Even in internal product research, ethics matter, and in regulated domains the stakes are higher.

- **Informed consent.** Participants should know the purpose, what is recorded, how it is used, who sees it, and that they may stop at any time.
- **Privacy and data minimization.** Collect what you need; store it securely; remove identifying details from shared material. Do not record screens that show real personal or commercially sensitive data without explicit permission and a plan to handle it.
- **Confidentiality in enterprise settings.** Customers may share information governed by contracts. Ask before recording and agree what can be quoted.
- **No deception that harms.** Mild, necessary concealment (for example, not revealing which design is yours) is different from misleading participants about something that matters to them.
- **Vulnerable situations.** People may be reluctant to criticize a system their employer mandated; reassure them that you are evaluating the product, not them, and that their comments will not be attributed.
- **Compensation and fairness.** Compensate participants appropriately when their employer allows it, and do not pressure them.

If your organization has a legal or privacy team, involve them in how recordings and personal data are handled. This chapter is not legal advice.

## Combining existing evidence with new research

Before running new research, assemble what exists: analytics, support tickets, sales notes, past studies, competitor products. Then use new research where gaps remain. This approach has three advantages: it saves effort, it improves the quality of new questions, and it lets you triangulate: when different sources agree, confidence grows; when they disagree, you have found something interesting.

:::framework Triangulation
**What it is.** Using several independent kinds of evidence about the same question so that the weaknesses of one are offset by the strengths of another.

**Problem it addresses.** Every method has blind spots. Single-source conclusions carry the blind spot of the method.

**When to use it.** For consequential decisions, or when a single source gives surprising results.

**When not to use it.** For low-risk decisions where one source suffices.

**How to apply it.**
1. State the question.
2. List what each source can and cannot say about it.
3. Compare. Agreement increases confidence; disagreement is a prompt for further inquiry, not a vote.
4. Report where evidence converges, diverges, and is missing.

**Limitations.** Sources may share a bias, such as all being drawn from the same customer segment, and then agreement is weaker than it looks.
:::

:::example Hypothetical: reconciling a mismatch
Analytics show that many users open the "Export" feature in a table but few complete an export. Interviews suggest the export is important to them. The data disagree.

Possible explanations: the export fails silently for large tables; people open it to see what is included and then do the task another way; instrumentation counts opening the dialog as use. Rather than choosing a story, check each: engineering confirms whether failures occur, a short observation shows what people do after opening it, and analytics definitions are reviewed. The disagreement produced a better question than either source alone.
:::

## Specialized domain research

When users have deep domain knowledge you lack, an extra layer of preparation is needed.

- **Learn the vocabulary first.** Read standards, regulations and process documents relevant to the domain, so that you can follow answers and ask good follow-ups. For regulated industries, understand what the user is accountable for, since that shapes behavior.
- **Ask for explanations, not assumptions.** "I do not know this process. Could you walk me through why you do that step?" is a strength, not a weakness.
- **Distinguish rules from habits.** Participants may describe a step as "required" when it is a local habit. Where it matters, check the rule with the owner of the requirement.
- **Include several roles.** In a process involving buyers, approvers, warehouse staff and auditors, each sees a different part. Single-role research gives a partial picture.
- **Watch for tacit knowledge.** Experts do many things automatically and may not mention them. Observation recovers some of it.

## Stating confidence honestly

Findings should carry a statement of how sure you are and why. A simple, honest scale helps stakeholders weigh the evidence.

| Confidence | Basis | Example wording |
|---|---|---|
| Higher | Several independent sources agree; consistent across participants; behavior observed | "Consistently observed across all eight sessions and supported by ticket data" |
| Moderate | Consistent across participants but one source or a small sample | "Reported by six of eight participants; not yet checked against usage data" |
| Lower | Single or few mentions, or stated opinion rather than behavior | "Mentioned by two participants; treat as a hypothesis" |

Avoid precise-looking percentages from small qualitative samples. "Five of eight said X" is accurate; "62.5% of users" implies a precision the sample cannot support. Always say who the participants were and who was missing.

This links to the senior skill of communicating uncertainty without weakening recommendations: state the confidence, then state what you recommend given it, and what additional information would change the recommendation. [[ch:07]] expands on this.

## Worked case: research for an enterprise configuration workflow

:::case Hypothetical: partner connection setup
This scenario is invented. It illustrates method selection and honesty about limits.

**Context.** A platform requires administrators to configure connections to trading partners, including endpoints, credentials, data mappings and test messages. Onboarding teams report that setup often takes several sessions and calls.

**Business objective (assumed).** Reduce time to first successful exchange, which affects customer activation.

**Decision.** Whether to redesign the setup flow, add guidance, or improve error handling.

**Existing evidence.** Onboarding call notes; support tickets about failed test messages; no analytics on setup steps.

**Unknowns.** Where administrators get stuck; whether the barrier is understanding, access to information from the partner, or the interface.

**Method choice.**
- **Observation of two live setup sessions** (with permission), because the work is complex and the barrier unknown.
- **Interviews about the most recent setup** with four administrators from different customers, including one who abandoned a setup.
- **Review of 40 tickets** tagged by step and cause.
- **Instrumentation request** to capture step completion, to quantify later.

**Sampling.** Administrators at different organization sizes; at least one new to the platform; at least one who failed. Recognize the limit: those willing to participate are likely more engaged.

**Bias risks and counters.** Onboarding staff may steer toward successful customers; ask for a range. Participants may blame themselves; reassure them. Observers may rescue the participant when stuck; agree beforehand to stay silent unless asked.

**Findings (hypothetical).** In six of six setups, the delay came from waiting for the partner to provide credentials and file formats, not from the interface. Error messages on test failure did not say which field was wrong.

**Confidence.** Moderate: consistent across six cases and tickets; small, engaged sample; no usage data yet.

**Recommendation.** Two parts: a checklist the administrator can send to the partner at the start (addressing the waiting), and specific field-level error messages (addressing diagnosis). Defer a full flow redesign until instrumentation shows where time is lost at scale.

**Risks and limitations.** The sample may miss customers with in-house integration teams who behave differently. The checklist depends on partners acting on it.

**What a senior designer communicates.** "The main delay is not in our screens. It is waiting on partner information. I recommend two small changes now and instrumentation to see whether a redesign is warranted. My confidence is moderate: six consistent cases, but a small and probably more engaged sample."
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize
**1. Choosing the method before the question.** *Why:* familiarity. *Sign:* "let's do a survey" with no decision named. *Consequence:* data that answers nothing. *Fix:* write the decision and question first.

**2. Asking people to predict their behavior.** *Why:* it is easy to ask. *Sign:* "would you use...?" questions. *Consequence:* polite yes answers. *Fix:* ask about recent real events; observe behavior.

**3. Reading "five users" as a rule.** *Why:* it is a memorable slogan. *Sign:* one round, multiple user groups, quantitative claims. *Consequence:* missed problems and false generalization. *Fix:* iterate small rounds per group; use larger samples for quantification.

**4. Reporting percentages from tiny samples.** *Why:* numbers feel authoritative. *Sign:* "75% of users" from eight people. *Consequence:* false precision. *Fix:* report counts and describe the sample.

**5. Researching only friendly customers.** *Why:* they are easy to reach. *Sign:* a panel of advocates. *Consequence:* optimistic and unrepresentative findings. *Fix:* seek churned, new and struggling users; report who is missing.

**6. Letting stakeholders watch and rescue.** *Why:* enthusiasm. *Sign:* observers interrupting sessions. *Consequence:* contaminated behavior. *Fix:* brief observers and give them a role (note-taking on a shared sheet).

**7. Treating research as a deliverable instead of an input to a decision.** *Why:* reports feel like output. *Sign:* a long report nobody acts on. *Consequence:* research loses credibility. *Fix:* end every study with a recommendation and a decision owner.
:::

## Trade-offs and decision criteria

| Choice | Lean toward A | Lean toward B |
|---|---|---|
| Moderated vs unmoderated testing | A (moderated): early, complex tasks, need to probe | B (unmoderated): simple tasks, many participants, mature design |
| Lab or remote vs on-site | A (remote): speed, geographic spread | B (on-site): physical or environmental context matters |
| Depth vs breadth | A (few deep sessions): exploring, unknown problems | B (many shorter): quantifying known issues |
| Panel vs fresh recruitment | A (panel): speed, repeated studies | B (fresh): avoiding panel fatigue and representativeness issues |
| Build research capacity vs buy | A (in-house): continuous discovery | B (external): specialized, one-off needs |
| Record vs note only | A (record): rich data, later review | B (note only): sensitive environments, policy limits |

## Senior-level application

An experienced designer approaches research as decision support:

- **Starts from the decision** and chooses the cheapest method that could change it.
- **Plans for the confound.** They know which biases the design of the study invites and counter them.
- **Treats recruitment as a design problem** with constraints, trade-offs and documented compromises.
- **Is explicit about confidence** and about who is missing from the sample.
- **Combines sources**, and treats disagreement as information.
- **Builds research habits** in the team (regular customer contact, shared repository), moving from running studies to creating the conditions in which studies happen.
- **Knows when not to research** because the decision is cheap, the evidence exists, or the requirement is fixed.

## Checklists and heuristics

:::checklist Research plan
- [ ] The decision and the question are written.
- [ ] Existing evidence was reviewed first.
- [ ] The method matches the question type and stage.
- [ ] Target participants are defined, including the extremes.
- [ ] The main biases are listed with a counter for each.
- [ ] Consent, privacy and confidentiality are handled.
- [ ] A result that would change the plan is stated in advance.
- [ ] Analysis, owner and decision date are set.
:::

:::checklist Interview quality review
- [ ] Questions ask about specific recent events.
- [ ] No question presupposes an answer.
- [ ] I asked "what happened next?" more than "why?"
- [ ] I recorded observations separately from interpretations.
- [ ] I asked at least one question whose answer could have disproved my belief.
:::

## Practice exercises

:::exercise Rewrite leading questions
Take an interview guide or survey you have used. Mark every question that is leading, hypothetical, double-barreled or binary. Rewrite each to ask about a specific recent event.

*Evaluation criteria:* Rewrites cannot be answered with yes or no. They do not contain your product's solution. A colleague cannot guess your hypothesis from the questions.
:::

:::exercise Plan a study for a hard-to-reach group
Choose a user group in your product that is hard to reach. Write a research plan: the decision, the question, the method, the sample (including who may be missing), recruitment path, ethics and confidentiality handling, and the confidence you expect to be able to claim.

*Evaluation criteria:* The method follows from the question. Recruitment is realistic. The plan states at least two limitations and how they will be reported.
:::

:::exercise Rate the confidence of past findings
Take three findings from past research in your team. Rate the confidence of each using the scale in this chapter. For each, name what additional evidence would raise it.

*Evaluation criteria:* The rating cites the evidence base. At least one finding is rated lower than its original presentation implied.
:::

## Reflection questions

- Which of your recent decisions rested on what people said, not what they did?
- Who is systematically missing from the people you hear from?
- Where have you reported a number from a small sample? What would you write now?
- How would your research plan change if the finding you expect were wrong?
- Which research habit could your team sustain weekly?

## Chapter summary

- Start from the decision and question, not the method.
- Qualitative evidence explains why; quantitative evidence estimates how much. Use each for what it can do.
- Ask about recent specific events. Do not ask people to predict their behavior.
- "Five users" is a modeled starting point for iterative qualitative testing of one group, not a general rule.
- Recruitment and bias control often matter more than sample size. Document compromises.
- Observe complex work in context where you can.
- Triangulate sources; treat disagreement as a prompt for inquiry.
- State confidence and the sample's limits. Avoid percentages from tiny samples.
- Ethics, consent and confidentiality are part of method quality.

## Knowledge check

:::check Recall: sample size
What is the original argument behind "five users," and what three things does it not cover?
---
It is a modeled argument that in a round of qualitative testing with a fairly homogeneous group, a few participants reveal a large share of usability problems with diminishing returns, so several small rounds are better than one large one. It does not cover quantitative measurement (which needs larger samples), products with several distinct user groups (each needs coverage), or the idea that one round suffices.
:::

:::check Application: fixing a question
Rewrite "Would a bulk edit feature save you time?"
---
Ask about a recent event: "Tell me about the last time you had to change many records. What did you do? How long did it take? What went wrong?" This produces behavior and context, and may reveal whether the bulk edit is the need or whether it is data entry upstream. Hypothetical questions mostly produce agreement.
:::

:::check Scenario: no access to users
You cannot get customers for two weeks. What can you do?
---
Review existing evidence (tickets, analytics, past studies), talk to customer-facing colleagues about patterns, ask colleagues with direct domain history while noting their limits, and prepare a recruitment path and instrumentation. Be explicit in findings that the evidence is indirect and of lower confidence. Do not present colleague opinions as user evidence.
:::

:::check Trade-off: moderated vs unmoderated
Which would you choose for an early prototype of a complex configuration flow, and why?
---
Moderated, because the tasks are complex, the problems unknown, and probing is valuable. Unmoderated suits simple tasks and mature designs where you need many participants and have clear success criteria.
:::

:::check Interpretation: a percentage
A report says "80% of users struggled with the filter." The study had ten participants. What is your concern, and how would you rewrite it?
---
The percentage implies a precision the sample cannot support, and the sample is small and perhaps unrepresentative. Rewrite: "Eight of ten participants struggled with the filter; they were administrators from mid-sized customers, so this should be checked with other groups." Also note the tasks and what struggling meant.
:::
