This chapter builds a precise vocabulary for what product design is, what it is not, and how the job changes as you grow. It is deliberately the shortest route to a shared foundation, because later chapters (problem framing, research, strategy, influence) all lean on the distinctions made here. Where the chapter relies on a published framework it says so. Where it offers its own synthesis, it says that too. The worked examples are hypothetical and labeled as such; none of the numbers in them are real results.

## What product design is

A workable definition: **product design is the discipline of deciding what a product should do and how it should behave so that people achieve something that matters to them, in a way the business can sustain and the team can build.**

Notice what the definition leaves out. It does not mention screens, Figma, or interfaces. Those are the usual *means*. It also contains four distinct constraints inside one sentence: people (value and usability), the business (viability), and the team (feasibility). Every product decision is a negotiation among those constraints, and the designer's distinctive contribution is to keep the first one, the human reality of use, from being quietly traded away.

:::definition Product design
The practice of defining and shaping a product's behavior, structure and interface so that it solves a real problem for its users within business and technical constraints. In this book, the word *design* always includes deciding **what** to build, not only **how it looks**.
:::

### How it relates to neighboring disciplines

The boundaries between roles are porous and differ by company. The table describes the center of gravity of each discipline, not a rigid division.

| Discipline | Center of gravity | Typical question | Where it overlaps with product design |
|---|---|---|---|
| UI design | Visual and interaction detail of an interface | How should this screen look and respond? | Execution craft; the most visible part of product design |
| UX design | The overall quality of a person's experience | Is this easy, clear and satisfying? | Often used interchangeably; UX is broader than screens |
| Product design | The behavior and shape of a product, tied to outcomes | Should we build this, and what should it do? | The subject of this book |
| Product management | The business case, priorities and delivery of the product | What is worth building, and in what order? | Shared ownership of problem definition and priorities |
| Service design | The end-to-end service across channels, people and back-office | What happens behind and around the interface? | Journeys that cross touchpoints; operations design |
| Research | Evidence about users and context | What is true about our users? | Evidence feeds every design decision |

In enterprise products the overlap with service design is large. A purchase order workflow in a pharmaceutical supply chain is not just a set of screens. It spans a buyer, a supplier, a warehouse, a regulatory obligation, and often an integration with another company's system. The interface is one layer of a service. A designer who only sees the screens will miss most of the failure modes.

:::warning A common misconception
"Product design is UI design with a more senior title." It is not. A senior product designer may spend an entire week without opening a design file, because the highest-value work that week is clarifying a problem, resolving a disagreement, or killing a feature that will not work. Craft remains essential, but it is the part of the job that is easiest to see and is therefore overweighted when people describe the role.
:::

## Value, usability, feasibility, viability

A useful lens for any proposed feature is the set of four risks described by Marty Cagan: whether customers will want it (value), whether they can use it (usability), whether engineering can build it (feasibility), and whether it works for the business (viability) [[ref:svpg-risks]]. This is a practitioner framework, not a research result, and Cagan's broader "product model" is one influential view among several [[ref:cagan-inspired]]. It earns its place here because it is simple enough to use in a meeting.

:::framework The four risks
**What it is.** A checklist of the four ways a product idea can fail.

**Problem it addresses.** Teams over-index on whichever risk their discipline sees. Designers focus on usability, engineers on feasibility, executives on viability. Value risk, whether anyone needs this at all, is the one most often left untested.

**When to use it.** At the start of discovery, when reviewing a roadmap item, and when a stakeholder asks for a feature "because customers want it."

**When not to use it.** As a scoring system. It tells you where uncertainty sits; it does not rank ideas.

**How to apply it.**
1. Write the idea in one sentence.
2. For each of the four risks, write what you would have to believe for the idea to work.
3. Mark each belief as *known* (you have evidence), *assumed*, or *unknown*.
4. Pick the riskiest belief and decide the cheapest way to test it.

**Limitations.** The four categories are not independent. A feature that is too complex to use creates a value problem. A compliance requirement can make an unvalued feature mandatory, which turns a value risk into a viability one.
:::

### Applying it: a hypothetical request

:::case Hypothetical: "Add an approval step to purchase orders"
This scenario is invented for teaching. It reflects a pattern common in B2B software, not any specific company.

**The request.** A sales lead tells the team that two large customers want purchase orders (POs) above a threshold to require manager approval before they are sent to a supplier.

**Value.** Known: two named customers asked. Assumed: that their reason is cost control rather than an internal audit finding. Unknown: how many of our users work in organizations that need this, and what they do today. Worth finding out, because an approval step for a customer who already approves by email is very different from one who has no control at all.

**Usability.** Assumed: approvers will respond to a notification within a working day. Unknown: whether approvers even have accounts in the product. If they do not, the design problem is account provisioning, not an approval screen.

**Feasibility.** Unknown: whether the PO data model supports a pending state between "draft" and "sent," and whether downstream integrations assume a PO is final once created.

**Viability.** Assumed: this is sold as part of an existing tier. Unknown: whether it is a differentiator that supports pricing, or a gap that blocks renewal for two accounts.

**What a senior designer does next.** Not a mock-up. They list the unknowns, identify that the feasibility and approver-account questions could change the whole shape of the solution, and propose two cheap steps: a conversation with each requesting customer about their current process, and a technical spike on PO states. Design starts once those answers narrow the problem.
:::

This example shows the most important habit in the chapter: converting a request into a list of beliefs, then testing the most dangerous belief first.

## Problem space and solution space

The **problem space** contains users, their goals, their context, their constraints and the pain they feel. The **solution space** contains the ways a product could address that pain. Moving to solutions before the problem is understood is the most common cause of expensive rework.

The distinction matters in practice because stakeholders almost always arrive with solutions: "add an approval step," "we need a dashboard," "make it like that competitor." A solution request is *evidence about a problem*, not a specification. Your first job is to recover the problem behind it.

A simple recovery technique is to ask, in order:

1. What is the person trying to get done? (the goal)
2. What happens today? (the current workaround)
3. What goes wrong, and how often, and at what cost? (the pain)
4. Why does it matter now? (the trigger)
5. How would we know it improved? (the signal)

If a stakeholder cannot answer questions 2 and 3, the request is still a hypothesis. That is acceptable, and it tells you where to invest effort.

:::warning Problem framing is not a delaying tactic
Pushing back on a solution can look like obstruction. Done well it is not. Bring a proposal for how to learn quickly, a time box, and a statement of what decision the answer will inform. "I want to test one assumption this week so we do not commit three sprints to the wrong shape" is a collaboration, not a blockade. Chapter 05 covers this in depth.
:::

## Outputs, outcomes, impact and evidence

These four words are routinely blurred, and the blur is costly in performance reviews, portfolios and strategy conversations.

| Term | What it is | Example | Who controls it |
|---|---|---|---|
| Output | A thing the team produces | A redesigned PO form, a component, a spec | Mostly the team |
| Outcome | A change in user or system behavior | Fewer POs returned for correction; faster time to submit | Team plus users and context |
| Impact | The business or customer result the outcome contributes to | Reduced supplier disputes; lower support cost; retention | Many factors beyond the team |
| Evidence | The information that connects the others | Task completion data, interview findings, support ticket trends | You collect and interpret it |

Outputs are necessary but they are not proof of value. You can ship a beautiful redesign that changes nothing. The reverse is also true: sometimes the highest-impact contribution is a decision *not* to build something, which produces no output at all.

### The attribution problem

Design rarely causes an impact on its own. A reduction in support tickets might follow a redesign, a training campaign, a pricing change, a seasonal pattern, or all of these. Claiming sole credit is both inaccurate and politically risky. A stronger practice is to claim **contribution** and to be explicit about how you know:

- State the outcome you were targeting before the work shipped.
- Record a baseline.
- After release, report what changed, over what period, and what else changed at the same time.
- Say what you believe the design contributed and how confident you are.

A sentence like "Time to complete a PO fell from a baseline to a lower figure in the four weeks after release, during which we also ran a training session; usability tests suggest the new layout removed the main source of errors" is both honest and persuasive. Chapter 13 treats measurement and causality in detail. For now, the principle is that **evidence beats assertion, and stated limits increase credibility rather than reduce it.**

:::exercise Classify your own work
Take your three most recent projects. For each, write on one line: the output, the outcome you intended, the evidence you have that the outcome occurred, and the evidence you lack. If the outcome line is blank, note it. That blank is the most useful result of this exercise, because it shows where your case study or performance narrative is weakest.

*Evaluation criteria:* Each outcome should be a change in behavior or result, not a deliverable. Each "evidence you lack" entry should name a source you could realistically obtain.
:::

## Design quality versus product success

A product can be well designed and fail commercially. It can also succeed commercially while being poorly designed, because of distribution, price, lock-in, or lack of alternatives. This is especially visible in enterprise software, where buyers and users are often different people. The person who selects the product may never use it daily.

This has three implications for a designer.

1. **Design quality is necessary, not sufficient.** Do not treat a commercial result as a verdict on your craft, or your craft as the reason for a commercial result.
2. **Adoption is a design concern in enterprise contexts.** Training burden, configuration effort, and migration from existing tools often matter more than interface polish, because they determine whether a purchased product is actually used.
3. **Buyers and users have different needs.** A feature that helps a buyer justify a purchase (reporting, audit trails, controls) may add work for a user. A good design handles both by making the control invisible when it is not needed.

> A product that is delightful for no one who pays, or sold to no one who uses it, has a design problem that no amount of visual polish will fix.

## The product lifecycle and the designer's role in it

Products pass through broad phases. The names vary, but the pattern is common.

\`\`\`diagram
  Explore            Define            Build            Release           Operate & Improve
  (what problems     (what to make,    (make it,        (get it into      (measure, learn,
   exist?)            for whom, why)    test it)         use)              adjust)
      |                  |                |                |                  |
  research,          problem framing,  prototyping,      adoption,         analytics,
  opportunity        scoping,          QA, handoff,      training,         support signals,
  discovery          concept tests     iteration         rollout           redesign decisions
      ^__________________________________________________________________________|
                     learning from use feeds new exploration
\`\`\`

Two things are worth noticing.

**Discovery and delivery overlap.** In practice you are almost always doing both at once: shipping something defined last quarter while exploring what to define next. Treating discovery as a phase that ends before delivery begins is a recurring mistake. GOV.UK's service manual, for example, structures work as discovery, alpha, beta and live phases, each with different goals and different kinds of evidence, which is a useful model of how the questions change over time [[ref:govuk-manual]].

**The designer's contribution changes by phase.**

| Phase | Dominant design activity | Typical evidence | Typical risk |
|---|---|---|---|
| Explore | Understanding context, finding problems | Interviews, observation, data review | Confusing what people say with what they do |
| Define | Framing and scoping | Problem statements, assumption lists | Jumping to a solution |
| Build | Designing, prototyping, supporting delivery | Usability tests, design QA | Drift between design and implementation |
| Release | Rollout, change management | Adoption and support data | Assuming launch equals success |
| Operate and improve | Measuring and refining | Analytics, tickets, feedback | Optimizing small things while the structure is wrong |

In an established enterprise product with a large installed base, most of your work happens in Build and Operate. The danger is that the Explore and Define phases are skipped because the product "already exists." Modernizing an existing product without breaking established workflows is a framing problem at least as much as a visual one: which parts of the current behavior are essential, which are accidents of history, and which do users depend on without being aware of it?

## Mental models and mechanisms worth knowing

### Mental model: the designer as decision-maker, not decorator

The most useful shift from execution to senior practice is to treat your output as a set of **decisions**, each with alternatives, reasoning, and consequences. A screen is the visible residue of dozens of decisions: what to show, what to hide, what order, which defaults, what happens on error. If you can articulate those decisions, you can defend them, teach them, and change them when evidence changes. If you can only show the screen, you cannot.

### Mental model: reversibility

Not all decisions need the same rigor. Some are easy to reverse (a label, a spacing rule). Some are hard (a data model, a navigation structure, a permission model). Spend your evidence-gathering effort on the hard-to-reverse ones. Many designers spend disproportionate time on visual details while accepting structural decisions casually, which is backwards.

### Mental model: constraints as information

Technical and business constraints are often treated as obstacles. They are also information. A constraint tells you what the system can sustain, what the organization has previously failed at, or what a customer has contractually agreed to. The senior move is neither to accept every constraint nor to challenge every one, but to ask *why it exists* and *what it would cost to change*. Chapter 11 returns to this.

## What changes as designers grow

Titles vary enormously across companies, and the same title can mean very different things. The progression below describes **learning levels based on scope and judgment**. It is this book's own synthesis, informed by common patterns in career ladders, and is not an industry standard. Chapter 16 develops it, and the [competency framework](#/framework) lets you assess yourself with evidence.

| Dimension | Foundation | Independent | Senior | Strategic leader |
|---|---|---|---|---|
| Scope | A task or screen with guidance | A feature or flow | An ambiguous problem area | Multiple teams or a product area |
| Problem definition | Receives it | Clarifies it | Challenges and reshapes it | Sets which problems the organization works on |
| Decisions | Executes decisions made by others | Makes decisions in familiar territory | Makes defensible trade-offs under uncertainty | Establishes principles and practices others use |
| Evidence | Uses what is provided | Gathers evidence for own work | Chooses the right method, states confidence | Builds the habits and infrastructure of evidence |
| Influence | Within the team | Across the project | Across functions, without authority | Across the organization |
| Output | Screens and flows | Complete features | Outcomes tied to goals | Direction, systems and capability in others |

Two clarifications prevent common misreadings.

First, **seniority is not volume of work or polish of files.** A senior designer often produces fewer artifacts, because they spend more time on framing, alignment and decisions. Second, **levels are not a staircase to climb in a fixed order.** Many designers are Senior in craft and Foundation in business reasoning, or the reverse. The self-assessment later in the book exists to make that unevenness visible.

For a perspective on what widening scope looks like in a neighboring discipline, Tanya Reilly's work on staff-level engineering describes how responsibility shifts from solving problems to shaping the conditions in which many people solve problems [[ref:reilly-staff]]. It is written for engineers, and its examples will not map one-to-one, but the account of scope, influence and technical judgment transfers well to design.

## Worked example: reading the same project at three levels

:::case Hypothetical: a delivery-confirmation form
This scenario is invented. It shows how the same task looks different at different scopes of thinking.

**The brief.** Warehouse staff must confirm receipt of a shipment against a purchase order. The existing form is long, has inconsistent validation, and users often submit the wrong quantity.

**Execution-focused response.** Redesign the form: group fields, add inline validation, align with the design system, improve the visual hierarchy. This is good work and probably improves the screen.

**Senior-level response.** Before designing, ask what the quantity errors cost and where they originate. Possible findings (all hypothetical): staff receive partial shipments and the form has no concept of a partial delivery; the unit of measure on the PO differs from the unit on the delivery note; the form is completed at a desk long after goods are counted. Each finding leads to a different solution: partial-receipt support, unit conversion, or a mobile capture at the dock. A better form would address none of them.

**What the senior designer communicates.** "I recommend we pause the form redesign for one sprint to confirm why quantities are wrong. If the cause is partial deliveries, a cleaner form will not fix it, and we would spend the effort twice. I propose watching three receipts on site and reviewing last quarter's correction tickets."

**What changes in the plan.** The deliverable shifts from "redesigned form" to "decision on the receipt model, then form." The risk of the extra week is stated openly, and the decision it informs is named.

**Trade-offs.** Waiting costs time and may frustrate a stakeholder who wanted visible progress. Proceeding anyway risks a polished but ineffective release. A reasonable compromise is to improve low-risk elements, such as validation messages, in parallel with the investigation.
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize in your own work
**1. Treating the brief as the problem.** *Why it happens:* the brief arrives with authority and a deadline. *Recognize it by:* a design review where no one can state what user behavior should change. *Consequence:* polished output that does not move anything. *Correction:* restate the problem in one sentence with evidence before opening a design tool.

**2. Equating research with validation.** *Why it happens:* research can be used to confirm a decision already made. *Recognize it by:* study questions that can only produce "yes." *Consequence:* false confidence. *Correction:* write down what result would change your mind before the study.

**3. Over-claiming impact.** *Why it happens:* pressure to demonstrate value. *Recognize it by:* a metric attributed solely to design. *Consequence:* lost credibility when a stakeholder notices the other contributing factors. *Correction:* claim contribution, state confounders.

**4. Optimizing the interface when the structure is wrong.** *Why it happens:* interface changes are visible and low risk. *Recognize it by:* repeated redesigns of the same screen with little improvement. *Consequence:* sustained effort with no gain. *Correction:* test whether the underlying model (states, roles, data relationships) matches how people think about the task.

**5. Confusing consistency with correctness.** *Why it happens:* design systems reward uniformity. *Recognize it by:* forcing a standard pattern onto a workflow that differs materially. *Consequence:* a tidy but awkward experience. *Correction:* ask what the standard pattern assumes and whether those assumptions hold here (see chapter 02).

**6. Waiting for permission to think strategically.** *Why it happens:* strategy feels like someone else's job. *Recognize it by:* never asking why a roadmap item exists. *Consequence:* a ceiling on scope. *Correction:* start with small questions, such as "what is this meant to change?", and bring evidence rather than opinion.
:::

## Trade-offs and decision criteria

There is no universal rule for how much problem framing is enough. A rough guide to calibrate:

| Situation | Lean toward | Because |
|---|---|---|
| Decision is easily reversed, low cost | Build and learn | Learning from use is cheaper than predicting |
| Decision affects data model or permissions | Frame carefully, involve engineering early | Mistakes are expensive to unwind |
| Strong existing evidence | Proceed, check for contradictions | Re-researching known facts wastes time |
| Stakeholder is firm and the evidence is thin | Run the smallest possible test, time-boxed | Preserves the relationship and still reduces risk |
| Regulatory or contractual requirement | Treat as a constraint, design the best experience within it | Value risk is replaced by compliance risk |

The last row matters for regulated industries. If a feature is legally required, questioning its value is not useful. The design question becomes how to meet the requirement with the least burden on users, and how to make the evidence trail trustworthy.

## Senior-level application

An experienced designer approaches the same request with different instincts:

- They **ask what decision the work will inform**, not only what to deliver.
- They **separate what is known from what is assumed**, and say so in the room.
- They **look for the structural cause** rather than the nearest symptom.
- They **choose where to spend rigor**, concentrating on hard-to-reverse decisions.
- They **write decisions down**, so reasoning outlives memory and personnel.
- They **share credit and claim contribution accurately**, which makes their claims more believable.
- They **treat disagreement as information**, asking what the other person sees that they do not.

None of this requires a title. All of it can be practiced on your current work.

## Checklists and heuristics

:::checklist Before starting a design task
- [ ] I can state the problem in one sentence, from the user's perspective.
- [ ] I know who the users are and who else is affected (approvers, administrators, auditors).
- [ ] I know what happens today, including workarounds.
- [ ] I have listed my top three assumptions and ranked them by risk.
- [ ] I know what outcome the team is targeting and how it will be observed.
- [ ] I know the main constraints (technical, regulatory, contractual) and why they exist.
- [ ] I know which decisions here are hard to reverse.
- [ ] I know who must agree for this to ship.
:::

:::checklist Before presenting a design
- [ ] I can say what changed and why, in terms of the user's goal.
- [ ] I have shown alternatives I rejected, with reasons.
- [ ] I have separated evidence from opinion in my rationale.
- [ ] I have stated risks and open questions.
- [ ] I have a clear ask: approve, choose, or give input on a specific question.
:::

## Practice exercises

:::exercise Rewrite a request
Pick a feature request you have received. Write: the original request; the underlying goal; what happens today; evidence you have; the two assumptions with highest risk; the cheapest test for the top assumption. Then write the three-sentence message you would send the requester.

*Evaluation criteria:* The goal is user-centered rather than a rephrased solution. The test is cheap enough to run within a week and could actually change the plan. The message is collaborative and does not read as a refusal.
:::

:::exercise Run the four risks on a shipped feature
Choose a feature your team released at least six months ago. Fill in the four-risk analysis as it would have looked before the work began. Compare to what you now know. Which risk was underestimated?

*Evaluation criteria:* You name specific beliefs, not categories. You identify at least one belief that turned out wrong or was never tested.
:::

:::exercise Level evidence audit
Using the table in the "What changes as designers grow" section, write one piece of real evidence for each of the six dimensions, from the last year of your work. Mark the dimensions where you have none.

*Evaluation criteria:* Evidence is a concrete event (a decision you shaped, a meeting you changed) not a trait. Blank rows are a finding, not a failure.
:::

## Reflection questions

- Which of your recent decisions were hard to reverse? Did they get proportionate rigor?
- When did you last change a roadmap item because of evidence you brought? What made it possible?
- If a leader asked "what did design contribute to last quarter's result?", what could you say that is true and specific?
- Where do your buyers and your daily users disagree, and who speaks for each?
- Which part of your current role would you struggle to describe to someone outside the company without mentioning screens?

## Chapter summary

- Product design decides *what* a product should do and how it behaves; screens are the visible part.
- Every proposal sits inside four risks: value, usability, feasibility, viability. Test the riskiest belief first.
- Solutions requested by stakeholders are evidence about problems. Recover the problem before designing.
- Outputs, outcomes, impact and evidence are different things. Claim contribution, not sole credit, and state limits.
- Design quality is necessary but does not guarantee product success, especially where buyers and users differ.
- Discovery and delivery overlap. Established products still need framing, especially when modernizing.
- Spend rigor where decisions are hard to reverse.
- Seniority is scope and judgment, not file polish or terminology. Your profile will be uneven, and that is useful to know.

## Knowledge check

:::check Recall: outputs and outcomes
Which of the following is an **outcome** rather than an output? (a) A redesigned approval screen. (b) A new component in the library. (c) A reduction in POs returned for correction. (d) A usability test report.
---
**(c).** An outcome is a change in behavior or results. The others are deliverables. Note that (c) may also be influenced by factors beyond design, which is why you claim contribution and state confounders.
:::

:::check Application: sorting a risk
A stakeholder says, "Customers want bulk editing." You discover that bulk editing is technically difficult because of how records are linked. Which risk did you just identify, and does it make the value question irrelevant?
---
You identified **feasibility** risk. It does not make value irrelevant. A feasible feature nobody needs is wasteful, and a valuable feature that is hard may deserve investment or a scoped alternative. Both risks must be examined, and the feasibility finding may shape how you test value, for example by prototyping the highest-frequency edit rather than the full capability.
:::

:::check Scenario: the firm stakeholder
A senior leader insists on a feature, evidence is thin, and the deadline is near. Describe a response that reduces risk without a confrontation.
---
A strong answer proposes a **time-boxed, low-cost test** of the riskiest assumption, named in terms of the decision it informs, runs in parallel with low-risk preparation work, and states what you will do for each possible result. It preserves the relationship by treating the leader's judgment as a hypothesis worth testing rather than an error. Weak answers either comply silently or demand extensive research with no deadline.
:::

:::check Trade-off: when not to frame
When is deep problem framing a poor use of time?
---
When the decision is cheap and easily reversed, when strong evidence already exists, or when a mandatory requirement removes the value question. In those cases build, learn from use, or focus on how to meet the requirement with the least user burden. Framing should be proportional to risk and irreversibility.
:::

:::check Interpretation: attribution
A colleague writes in a portfolio: "My redesign reduced support tickets by a large amount." What is the weakness, and how could it be repaired?
---
It asserts sole causation and gives no baseline, period, or confounders. Repair it by stating the target outcome, the baseline and period, other changes that happened concurrently, and the evidence linking the design to the change (for example, usability findings that identified the cause the redesign removed). Do not add figures you cannot source.
:::

`,aa=`Interaction design is where product decisions become behavior. A layout can be admired in a screenshot, but an interaction is only judged while someone is trying to finish something, usually while distracted, under time pressure, and with data that does not look like your mock-up. This chapter is about the decisions that determine whether that moment goes well: how people understand what the product is, how the product tells them what is happening, what it does when things go wrong, and how the pieces are organized so people can find them.

The chapter leans on a small set of durable ideas, mostly from Don Norman's work on conceptual models, affordances and feedback [[ref:norman-doet]], and on practitioner heuristics such as the Nielsen Norman Group's ten usability heuristics [[ref:nng-heuristics]]. Both are useful. Neither is a law of nature. The heuristics come from expert evaluation of interfaces, and Norman's vocabulary is a way of thinking, not a measurement instrument. Where this chapter offers its own synthesis, such as the state matrix and the pattern-adaptation test, it says so. Worked examples are hypothetical.

## Why interaction design is more than screens

A static screen shows one moment. A product is a sequence of moments connected by rules: what happens when you click, what the system remembers, what it prevents, what it allows you to undo. Most serious usability problems in enterprise software live in those rules, not in the appearance of any single screen. A purchase order screen can look clean and still fail because nobody can tell why a button is disabled, or because editing a submitted order silently creates a second version.

Three questions organize the whole chapter:

1. **Understanding.** Can the person form an accurate picture of what the product does and what state things are in?
2. **Control.** Can they do what they came to do, efficiently, and recover when they make a mistake?
3. **Orientation.** Can they find things and know where they are?

Everything else, including patterns, motion and responsive behavior, serves those three.

## Foundational concepts

### Conceptual models and mental models

A **conceptual model** is the way the product is designed to be understood: its objects, their relationships, and the operations available. A **mental model** is what a particular person believes about how the product works. The two are rarely identical. Usability problems tend to appear in the gap between them [[ref:norman-doet]].

In enterprise software the gap is often wide, because the conceptual model reflects the database and the mental model reflects the person's job. A system may store "orders," "order lines," "shipments" and "deliveries" as four tables. A warehouse worker may think in terms of "what arrived today and does it match what we expected." Showing the four tables does not help that person. Showing a receiving task that pulls from all four does.

:::definition Conceptual model vs mental model
**Conceptual model:** the structure and behavior the designers intend, expressed through the interface. **Mental model:** the structure and behavior a given person assumes. Good design narrows the gap, either by making the conceptual model visible and learnable or by shaping the product around the model users already hold.
:::

### Affordances, signifiers, feedback, mapping, constraints

These terms are often used loosely. Using them precisely makes design critique more productive.

| Term | Meaning | Design question | Common failure |
|---|---|---|---|
| Affordance | A possible action offered by the relationship between a thing and a person | What can be done here? | Assuming an affordance exists because it is technically possible |
| Signifier | A perceivable cue that shows where or how an action can happen | Can the person tell? | Hidden actions (hover-only controls, unlabeled icons) |
| Feedback | Information returned after an action | Did it work, and what changed? | Silent success or silent failure |
| Mapping | The relationship between controls and their effects | Does the control sit where the effect is? | A filter control far from the list it filters |
| Constraint | A limit on possible actions | What is prevented or made unlikely? | Constraints that block valid work without explanation |

A frequent confusion in design critique is to say "this button has no affordance" when the actual issue is that nothing signals it is a button. The affordance (clicking) exists; the signifier is missing [[ref:norman-doet]]. The distinction matters because the fix is different. You do not need a new capability, you need a cue.

### System status and feedback timing

People need to know what the system is doing. The first of the Nielsen Norman Group's heuristics is visibility of system status [[ref:nng-heuristics]]. In practice this means different things at different time scales. The thresholds below are common rules of thumb and not precise laws; treat them as starting points to check against your own context.

| Duration of wait (rough guide) | Reasonable response |
|---|---|
| Effectively immediate | Show the result; avoid decoration |
| A second or two | Show a change of state on the control (pressed, busy) |
| Several seconds | Show a progress or busy indicator and keep the page usable |
| Longer, or unpredictable | Show progress with meaningful steps, allow leaving, and notify on completion |

Long-running operations are common in enterprise work: importing thousands of serial numbers, generating a report, validating a batch. The design questions become: Can the person leave and come back? Where do they find the result? What if it fails halfway? [[ch:10]] covers this in the context of multi-step operations.

## States: the part of interaction design most often skipped

An interface is not a picture. It is a set of **states** and the transitions between them. Designers who draw only the success state hand engineering a guess for everything else, and engineers fill the gaps with whatever is easiest.

For any component or screen, ask which of these apply.

| State | Question to answer |
|---|---|
| Initial / empty | What does the person see before there is any data? What should they do first? |
| Loading | What is shown while data arrives? Does the layout jump when it arrives? |
| Populated | The normal case, including very long and very short content |
| Partial | Some data loaded, some failed or is still pending |
| Error | What failed, why (in terms the person understands), and what can they do? |
| Disabled / unavailable | Why is this not available, and how could it become available? |
| Success / confirmation | How do they know it worked and where the result went? |
| Permission-limited | What does a person without access see, and can they request it? |
| Stale / conflicting | What if the data changed while they were looking at it? |

:::framework The state matrix
**What it is.** A table listing the states a piece of UI can be in against the elements or actions affected. This is a practitioner tool and this book's own synthesis, not an industry standard.

**Problem it addresses.** Hidden states cause late rework and inconsistent behavior across a product.

**When to use it.** For any workflow involving records with a lifecycle, any form with validation, and any list with filtering or bulk operations.

**When not to use it.** For trivial static content. Over-documenting low-risk components wastes effort.

**How to apply it.**
1. List the entity or component and its meaningful states (for a purchase order: draft, submitted, approved, partially received, closed, cancelled).
2. For each state, list which actions are available, which are disabled, which are hidden.
3. For each disabled action, write the reason shown to the person.
4. Mark transitions that are irreversible and transitions that need confirmation.
5. Review with engineering to catch states the data model produces that you did not list.

**Limitations.** The matrix grows quickly. Keep it to the states that change behavior, and use it alongside, not instead of, a flow diagram.
:::

### A hypothetical state matrix

:::example Purchase order actions by state (hypothetical)
This is an invented simplification for teaching. A real product will have more states and rules.

| Action | Draft | Submitted | Approved | Partially received | Closed |
|---|---|---|---|---|---|
| Edit lines | Yes | Request change | No | No | No |
| Cancel | Yes | Yes, with reason | Yes, supplier notified | Only unreceived lines | No |
| Duplicate | Yes | Yes | Yes | Yes | Yes |
| Record receipt | No | No | Yes | Yes | No |
| Export | Yes | Yes | Yes | Yes | Yes |

The cell that does the most design work is "Edit lines" in the Submitted column: "Request change." That cell encodes a product decision (after submission, edits go through a controlled change request rather than direct editing), and it implies an interface element (a request-change flow), a notification, and an audit record. Without the matrix, that decision is made implicitly by whoever builds the edit button.
:::

## Errors, recovery and undo

Error design is usually treated as copywriting. It is mostly structural.

### Prevent, detect, explain, recover

A useful way to think about errors is as four layers, from cheapest to most expensive for the user.

1. **Prevent.** Constrain input so invalid values are hard to enter (date pickers that disable impossible dates, quantity fields that accept only numbers). Use defaults wisely.
2. **Detect early.** Validate as soon as the information is sufficient, not before the person has finished typing, and not only at submit.
3. **Explain.** Say what is wrong, where, and how to fix it, in the person's terms.
4. **Recover.** Make it possible to reverse the action or repair its consequences.

The first heuristic from this list that designers underuse is recovery. For many actions, **undo is better than confirmation**. Confirmation dialogs interrupt every user to guard against rare mistakes, and people quickly learn to click through them. An undo option costs nothing in the normal case and fully repairs the mistaken case. Where an action cannot be undone (sending an order to an external supplier, deleting records that other records depend on), confirmation or a delay is justified, and the confirmation should state the specific consequence, not a generic "Are you sure?"

:::decision Confirmation, undo, or neither?
| Situation | Prefer | Reason |
|---|---|---|
| Reversible and low impact (archive, rename) | Act immediately, offer undo | Interruptions cost more than the rare mistake |
| Reversible but affects others (reassign, change status) | Act, notify, offer undo within a window | Others need to know; the actor can still recover |
| Irreversible but low impact | Brief confirmation naming the effect | Cheap protection |
| Irreversible and high impact (delete shared records, send externally) | Confirmation with specifics, possibly typing a name or a delay | Mistakes are costly and cannot be repaired |
| Bulk version of any of the above | Preview the scope (count and sample) before acting | Scale multiplies the cost of a mistake |
:::

### Error messages as repair instructions

A good error message answers three questions: what happened, why, and what to do. Compare two messages for a failed import.

Weak: "Error 422. Validation failed."

Better: "12 of 480 rows were not imported. Rows 14, 38 and 201 have a quantity that is not a whole number. Fix those rows in your file and upload again, or download the list of failed rows."

The better message states scale (12 of 480), location, cause and next step, and offers a recovery path. It is also testable: you can check whether people who see it successfully fix their file.

:::warning Common error-handling mistakes
- Showing a single error at the top of a long form with no link to the field.
- Clearing the form on failure.
- Using color alone to mark invalid fields (this also fails accessibility; see [[ch:04]]).
- Validating on every keystroke, which flags a half-typed email as invalid.
- Giving system codes instead of explanations.
- Blocking submission for warnings that are not actually errors.
:::

## Patterns: using them, adapting them, rejecting them

A **pattern** is a reusable solution to a recurring interaction problem: a data table, a modal dialog, a wizard, a search field with filters. Established patterns are valuable because users arrive with expectations learned from other products, and because they save design and engineering time. Design systems such as Material Design and Microsoft's Fluent publish pattern guidance that is worth consulting, especially for accessibility behavior and responsive adaptation [[ref:material3]] [[ref:fluent2]]. Platform guidelines such as Apple's Human Interface Guidelines capture conventions for specific platforms [[ref:apple-hig]].

But patterns embed assumptions about the task, the user and the context. A pattern designed for consumer apps may not suit an expert who processes hundreds of records a day.

:::framework The pattern-adaptation test
**What it is.** A short procedure for deciding whether to use, modify or replace an established pattern. This is this book's own synthesis.

**Problem it addresses.** Teams either apply patterns blindly or reject them because "our users are different," often without checking.

**When to use it.** When a standard pattern feels slightly wrong for a workflow, or when someone proposes a custom control.

**When not to use it.** For low-stakes, rarely used interactions where consistency is cheap and variation is expensive.

**How to apply it.**
1. **State the pattern's assumptions.** For a modal dialog: the task is short, interrupting is acceptable, the user needs no information from the page behind it.
2. **Check each assumption against your context.** A modal for editing a long order line with reference data on the page behind it breaks the third assumption.
3. **Decide:** use as is (assumptions hold), adapt (one or two fail, and a variant fixes it), or replace (core assumptions fail).
4. **Record the reason.** A brief note in your design decision record prevents the same debate recurring.
5. **Test the riskiest deviation** with real users or at least with colleagues who do the task.

**Limitations.** Assumption lists come from your own reasoning and may miss things. For consequential deviations, validate with users rather than relying on logic.
:::

### Core patterns in enterprise products

**Forms.** Forms are where most data enters an enterprise product. Priorities: group related fields, put the label close to its field, mark optional rather than required when most fields are required (or the reverse, but consistently), show constraints before the person violates them, preserve entered data on error, and allow saving a draft for long forms. For forms with dependencies (a field that appears only if another has a certain value), reveal progressively but keep the layout stable enough that people do not lose their place.

**Tables.** Tables are the workhorse of operational software. A table pattern needs decisions on: default sort, which columns are visible by default and which can be added, row selection, in-row actions, pagination or virtualization, filtering, saved views, and what happens with very long values. Alignment matters: numbers align right so digits compare, text aligns left. Resist the temptation to put every available column on screen; density is a tool, not a goal, and [[ch:03]] covers how to manage it.

**Navigation.** Navigation expresses the product's structure. A top-level structure should follow the way users organize their work, not the way the engineering teams are organized. If the navigation lists modules named after internal products, new users cannot tell where a task lives.

**Dialogs and panels.** Modals interrupt and block; side panels allow keeping context; inline editing is fastest but offers less room. Choose based on how much the person needs to see on the page while doing the task, how long the task takes, and whether the action is reversible.

**Selection and bulk actions.** The moment a list supports selection, several questions appear: Does "select all" mean the visible page or every matching record? Which actions apply to mixed selections? What happens to items that cannot be processed? The answers decide whether bulk work is safe. [[ch:10]] treats this in depth.

## Flows and maps: different tools for different questions

These four artifacts are frequently confused. Each answers a different question.

| Artifact | Shows | Scope | Best for | Weakness |
|---|---|---|---|---|
| User flow | Screens and decisions in a product | A single product path | Specifying behavior and edge cases | Says little about motivation or context |
| Task flow | Steps to accomplish a goal, tool-neutral | One task | Analyzing and simplifying a task | Can be detached from real interfaces |
| Journey map | A person's experience over time, including thoughts and emotions | An end-to-end goal across touchpoints | Finding cross-channel gaps and aligning teams | Often built from assumptions rather than evidence |
| Service blueprint | Frontstage actions, backstage actions and supporting systems | The whole service | Operational and cross-team problems | Takes time; needs input from many teams |

A well-known risk with journey maps is that they become wall decor: attractive, assumption-based, and never used. A useful map is tied to a decision, built from observed evidence, and revisited. [[ch:07]] covers how to build maps from research.

For a multi-party enterprise process such as purchase orders between a buyer and a supplier, a service blueprint is often the most useful artifact because the failures happen in the handoffs, not in any single screen.

\`\`\`diagram
  Buyer          Create PO ---> Submit ---------------------> Receive goods ---> Close
                     |             |                               ^                ^
  ---- line of visibility ----------------------------------------------------------------
  System          Validate     Notify supplier             Update PO status      Final audit
                  prices       Create audit record         Match receipt         record
                     |             |                               ^
  ---- line of interaction (external) -------------------------------------------------------
  Supplier                     Confirm / reject  ---> Ship ------------
\`\`\`

This sketch is a simplified, hypothetical blueprint. It shows how a design question such as "what does the buyer see when the supplier rejects?" is really a question about a backstage transition.

## Information architecture

**Information architecture (IA)** is the structure, grouping, labeling and navigation of information, and the way people find it. It has four components commonly discussed: organization schemes (how things are grouped), labeling (what they are called), navigation (how people move) and search (how they look for something directly).

### Organization and labeling

Common ways to organize content are by **task** (what people do), by **object** (the things they work with), by **audience** (who they are) and by **topic** (what it is about). Enterprise products often mix them. A navigation that lists "Orders," "Inventory," "Partners" is object-based; one that lists "Receive," "Ship," "Reconcile" is task-based. Neither is universally better. Object-based navigation tends to suit people who work across tasks on the same objects. Task-based navigation tends to suit role-specific workflows.

Labels should use the language users use. Internal jargon, product codenames and acronyms that only the team knows are the usual culprits. The test is simple: ask people where they would look for something and what they would call it, then compare.

### Validating IA

Two methods are standard for checking structure before building.

- **Card sorting** asks people to group items and name the groups. It reveals how people categorize. It informs structure; it does not prove a given structure works.
- **Tree testing** asks people to find items in a text-only hierarchy. It measures whether a proposed structure supports findability.

Used together, card sorting suggests structures and tree testing evaluates them. [[ch:07]] describes both. A point worth remembering: sample size, recruitment and task wording strongly affect the result, so treat outcomes as evidence to weigh rather than a verdict.

:::example Hypothetical: the "Settings" problem
Teams often accumulate a settings area where unrelated features collect. Suppose a platform has settings for user permissions, partner connections, notification rules, data mappings and label templates. All live under "Settings" because that is where engineering put them. A first-time administrator looking for "where do I connect a new trading partner" must guess. A card sort with administrators might reveal that they group partner connections with data mappings under "Integrations" and permissions with notification rules under "Administration." The IA change is small (rename and regroup), but its effect on findability could be large. Whether it actually is must be checked by tree testing, not assumed.
:::

## Responsive and adaptive behavior

Enterprise products are often used on large screens, but not exclusively. Warehouse and field workflows may run on tablets or handheld devices. Responsive design means the same layout adapts; adaptive design means different layouts are served for different contexts. The more useful question is *what task happens on which device.* Receiving goods at a dock is a different task from reconciling orders at a desk, and designing both as one responsive page may serve neither. Decide per task, and let the content, not specific device widths, determine where layout changes. [[ch:11]] covers implementation.

## Motion and micro-interactions

Motion is justified when it explains something that would otherwise be confusing: where an element came from, what changed, or that an action registered. It is not justified as decoration, and in dense enterprise interfaces it often costs time. Keep transitions brief, never block interaction on an animation, and honor the user's reduced-motion preference. A rule that works in practice: if the interface would be equally clear without the motion, consider removing it.

## Designing for complex enterprise workflows: a first view

Complex workflows add pressures that consumer products rarely face: multiple roles with different permissions, objects that move through lifecycles, long-running operations, large volumes, external parties and audit requirements. The foundations in this chapter, especially states, recovery and IA, are necessary but not sufficient. [[ch:10]] extends them. A few early habits help:

- **Design the lifecycle before the screens.** Know the states and who can move things between them.
- **Show why, not just what.** If an action is unavailable, say why and who can make it available.
- **Support the expert without hiding the novice's path.** Provide shortcuts, saved views and bulk operations, but keep the default path discoverable.
- **Make the system's decisions inspectable.** People trust systems that can explain what happened.

## Worked example: submitting a purchase order

:::case Hypothetical: "Submit PO" and what happens after
This scenario is invented. The business rules are illustrative.

**Context.** Buyers create purchase orders and submit them to suppliers. Complaints from support: buyers often submit an order and then realize a line is wrong; some edit the order after submission and suppliers are confused by changes.

**Objective.** Reduce supplier confusion caused by post-submission edits, without making submission feel risky.

**Known.** Support tickets mention changed orders; a few buyers describe copying orders and re-submitting as a workaround. **Assumed.** Buyers lack confidence at the moment of submission. **Unknown.** How often changes happen, what kinds, and whether suppliers can see change history.

**Options considered.**
- **A. Confirmation dialog on submit** stating the supplier will be notified. Cheap, but likely to be clicked through, and does nothing about the later edit problem.
- **B. Review step before submission** showing a summary of lines, totals and supplier. Catches errors earlier but adds a step for every order, including simple ones.
- **C. Allow edits after submission as a tracked change request** with supplier notification. Addresses the actual cause but needs backend support for versions.
- **D. Short hold after submission with undo.** The order is submitted but can be recalled for a defined period before the supplier is notified. Reduces anxiety, but delays supplier visibility and depends on business agreement.

**Trade-offs.** A and B act on prevention, C on recovery, D on both for a small window. B adds friction for everyone; C is the largest engineering effort; D requires a business decision about notification timing.

**Recommended direction.** Start with a lightweight review summary shown inline (not a separate page) that highlights unusual values, such as quantities far above the buyer's previous orders for that item, and pursue C as the structural fix, with D as a candidate if C is infeasible in the near term. The state matrix for the PO becomes the shared artifact for the conversation with engineering.

**Validation plan.** Test the review summary with buyers using real previous orders, looking for whether they catch seeded errors and how long submission takes. Measure support tickets about changed orders and the rate of post-submission edits before and after, stating other changes happening in the same period.

**Risks.** The review step could become noise if it flags too much. Change requests could frustrate buyers who want a quick fix. Suppliers may not read change notifications unless they are designed for.

**What a senior designer communicates.** "The error source is post-submission edits, not the submission screen. I recommend a small prevention step now and a tracked-change model next. The second needs a backend change, so I have a technical spike scheduled to see if it is feasible this quarter. If it is not, I would consider a short recall window instead. Here is the state model that shows what each option changes."
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize
**1. Designing only the happy path.** *Why:* it is the visible one. *Sign:* no empty, error or permission states in the design file. *Consequence:* inconsistent behavior and late rework. *Fix:* build the state matrix early.

**2. Using confirmation dialogs as a safety blanket.** *Why:* they feel responsible. *Sign:* users click through without reading. *Consequence:* no protection, constant interruption. *Fix:* prefer undo where possible; make confirmations specific where not.

**3. Copying a pattern without checking its assumptions.** *Why:* it looks familiar and saves time. *Sign:* workarounds in how people use it. *Consequence:* a tidy but awkward experience. *Fix:* use the pattern-adaptation test.

**4. Organizing navigation by internal structure.** *Why:* it mirrors how the product was built. *Sign:* new users cannot find tasks; labels use internal names. *Consequence:* slow onboarding and support load. *Fix:* test labels and groupings with users.

**5. Treating disabled controls as self-explanatory.** *Why:* the rule is obvious to the builder. *Sign:* "why can't I click this?" questions. *Consequence:* frustration and support tickets. *Fix:* state the reason and the path to enable it.

**6. Hiding actions behind hover.** *Why:* it declutters. *Sign:* actions go unused; touch and keyboard users cannot reach them. *Consequence:* discoverability and accessibility failures. *Fix:* keep primary actions visible and keyboard-reachable.

**7. Equating a journey map with research.** *Why:* maps look rigorous. *Sign:* a map with no source observations. *Consequence:* a confident picture of the wrong thing. *Fix:* label which parts are evidence and which are hypotheses.
:::

## Trade-offs and decision criteria

| Decision | Option A | Option B | Lean toward A when | Lean toward B when |
|---|---|---|---|---|
| Validation timing | On submit | Inline, as the person goes | Rules depend on the whole form | Rules are about a single field and the person has finished it |
| Editing | Inline | Dedicated edit page | Few fields, frequent small edits | Many fields, dependencies, or high stakes |
| Detail view | Side panel | Full page | Users compare against the list | The record is large and worked on at length |
| Bulk action safety | Preview scope first | Act and offer undo | The action is irreversible or affects others | The action is reversible and local |
| Navigation | Task-based | Object-based | Roles have distinct jobs | People work across tasks on the same objects |
| Pattern | Standard | Custom | Task fits the pattern's assumptions | Core assumptions fail and testing shows it matters |

## Senior-level application

Senior interaction design is distinguished less by finer control of animation than by what gets decided early and written down. A senior designer:

- Models states and permissions *before* detailed screens.
- Identifies the irreversible transitions and designs recovery for them.
- Notices when a request for a new screen is really a structural problem.
- Keeps a record of pattern deviations and their reasons so that the system stays coherent.
- Uses the service blueprint to bring backstage teams into a design conversation.
- Chooses where testing is worth the effort, usually the high-risk structural choices, not the label color.

## Checklists and heuristics

:::checklist State and recovery review
- [ ] Empty, loading, error, partial, disabled and permission-limited states are defined.
- [ ] Every disabled control explains why.
- [ ] Every irreversible action is identified, and its confirmation names the consequence.
- [ ] Reversible actions offer undo instead of confirmation.
- [ ] Long-running operations can be left and resumed, and results are findable.
- [ ] Errors say what happened, why and what to do, and preserve the person's input.
- [ ] Bulk actions preview scope and report partial failures.
:::

:::checklist Pattern and IA review
- [ ] I stated the assumptions of each non-trivial pattern I used.
- [ ] Deviations from the standard pattern are recorded with reasons.
- [ ] Navigation labels use words users use, checked with at least a few users.
- [ ] I know where each major task lives and how a new user would find it.
- [ ] Primary actions are visible, labeled and reachable by keyboard.
:::

## Practice exercises

:::exercise Build a state matrix
Choose an entity from your product with at least four lifecycle states. Build the state matrix of actions against states. Mark each cell: allowed, disabled with reason, hidden, or requires approval. Review it with an engineer and record every state or rule they add that you missed.

*Evaluation criteria:* Every disabled cell has a user-facing reason. At least one cell encodes a decision you had not made explicitly before. The engineer review produced at least one correction.
:::

:::exercise Pattern-adaptation test
Pick a pattern in your product that people work around (a modal, a wizard, a table). List its assumptions, check them against how the task really happens, and decide use, adapt or replace. Write the decision as a short record.

*Evaluation criteria:* Assumptions are specific to the pattern, not generic. The decision follows from the checks. The record states what evidence would change your mind.
:::

:::exercise Label check
Choose ten navigation labels or section names in your product. Without showing the product, ask five colleagues who are not on your team where they would look for three given tasks and what they would call each area. Compare with your labels.

*Evaluation criteria:* You report mismatches, not just matches. You note the limits of the sample and whether the participants resemble real users.
:::

## Reflection questions

- Which interactions in your product rely on users already knowing the system's internal model?
- Where does your product ask for confirmation where undo would serve better, or the reverse?
- Which pattern deviations in your product were deliberate, and which happened by accident?
- If you removed every label that uses internal jargon, how many would change?
- What in your product happens in the handoff between teams or systems that no screen shows?

## Chapter summary

- Usability problems tend to live in the gap between the product's conceptual model and the user's mental model.
- Use precise terms: an affordance is a possible action; a signifier is the cue that shows it.
- Design states, not pictures. The state matrix makes hidden decisions visible.
- Prefer undo to confirmation for reversible actions; reserve specific confirmations for irreversible ones.
- Errors need prevention, early detection, explanation and recovery.
- Patterns carry assumptions. Test them against your context before using, adapting or replacing them.
- User flows, task flows, journey maps and service blueprints answer different questions. Pick by question.
- IA determines findability. Card sorting suggests structure; tree testing evaluates it.
- In enterprise workflows, model lifecycles and permissions first, and make system decisions inspectable.

## Knowledge check

:::check Recall: terms
A designer says "this link has no affordance." What is probably the real issue, and why does the distinction change the fix?
---
The affordance (clicking) likely exists; what is missing is a **signifier** that shows the link can be acted on. The fix is a cue (styling, label, placement), not a new capability.
:::

:::check Application: undo or confirm
A user can archive a shipment record. Archived records can be restored for 30 days. Should the product show a confirmation?
---
Probably not. The action is reversible and low impact, so act immediately and offer undo with a clear way to find archived items. Confirmation interrupts every user to guard against a rare mistake. If archiving notifies external partners, reconsider: reversibility for the user may not be reversibility for others.
:::

:::check Scenario: choosing a structure
Two roles use the same product: planners (work across all orders daily) and receivers (do one task all day). Would you choose task-based or object-based navigation?
---
There is no single right answer. A reasonable approach is object-based primary navigation for planners, with a task-focused entry (a receiving workspace or default landing) for receivers, validated by tree testing with both groups. Forcing one structure on both usually serves one role poorly. The answer should state the assumption (distinct jobs) and how to test it.
:::

:::check Trade-off: validation timing
When is validating a field as the person types a poor choice?
---
When the input is incomplete by nature, for example an email address or a long identifier being typed. Early errors flag valid work in progress. Validate when the person leaves the field or when enough has been entered, and validate cross-field rules on submit or when dependent fields are complete.
:::

:::check Interpretation: pattern adaptation
A team replaces a standard modal with a full-page editor for order lines "because our users are different." What would you ask before agreeing?
---
Ask what assumption of the modal fails (for example, users need reference data on the page behind it, the task is long), what evidence shows it, what the full-page variant costs in context and speed, and how consistency with the rest of the product is preserved. If the reasons hold, agree and record the decision; if they are opinions, propose a quick test.
:::
