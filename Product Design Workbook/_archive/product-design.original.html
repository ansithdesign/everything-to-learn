`,ca=`Enterprise products are not consumer products with more fields. They differ in structure. Several roles with different responsibilities touch the same records. Objects move through lifecycles governed by rules the user did not invent. Operations run on thousands of items, not one. Mistakes can have legal, financial or safety consequences, and someone may later ask, months afterward, exactly what happened and who did it. The people using the product are often experts doing the same work for hours a day, and they have little patience for patterns designed for first-time visitors.

This chapter builds on interaction foundations from [[ch:02]], in particular the state matrix, recovery and information architecture. It addresses the specific design problems that complexity creates: modeling roles and permissions, designing around entity lifecycles and relationships, handling dense data, doing bulk work safely, designing for exceptions, supporting audit and trust, handling configuration-heavy workflows and long-running operations, and balancing expert efficiency with learnability.

Unlike earlier chapters, this one is largely synthesis. The enterprise design literature is thinner in peer-reviewed research than consumer UX, and much guidance comes from practitioners and design system documentation [[ref:fluent2]] [[ref:material3]]. Accessibility requirements for complex components come from the standard itself [[ref:wcag22]]. Where this chapter offers a framework, it is the book's own synthesis built from common practice, and it says so. All examples are hypothetical. The domain context is supply-chain and serialization-style operations, used illustratively, not as regulatory or legal guidance.

## What makes enterprise complexity different

It helps to name the sources of complexity separately, because each calls for a different response.

| Source | What it looks like | Design consequence |
|---|---|---|
| Multiple roles | Buyers, approvers, administrators, auditors, warehouse staff | Different views, permissions and vocabulary on the same data |
| Lifecycles | Records move through states: draft, submitted, approved, closed | Actions depend on state; transitions need rules and recovery |
| Relationships | Orders have lines; lines have shipments; shipments have packs; packs contain items | Changes cascade; navigation across related records matters |
| Volume | Thousands of rows, bulk operations, long jobs | Performance, scoping, batch semantics, progress |
| Configuration | Behavior depends on settings made earlier by someone else | Explaining why the system behaves as it does |
| Integration | Data arrives from and goes to other systems | Partial failure, reconciliation, ownership of truth |
| Accountability | Regulation, contracts, internal controls | Traceability, evidence, restricted actions |
| Expertise | Daily use by specialists | Efficiency, shortcuts, density, customization |

A recurring mistake is treating these as visual problems. "The screen is too busy" can be a symptom of a structural issue: the screen shows everything because the system has no model of what each role needs at each stage.

## Roles, permissions and responsibilities

### Why permissions are a design problem

Permission models are often treated as backend rules. But permissions determine what each person sees, what they can do, what explanations they need when they cannot act, and what they can delegate. A product with a technically sound permission model and no design for its consequences produces confusing, silent failures: a disabled button with no reason, a missing menu item, an empty list that is actually "you may not see these."

**Roles and permissions are related but different.** A **role** is a named bundle of responsibilities. A **permission** is the ability to perform an action on a type of record, possibly within a scope (a site, a business unit, a partner). Many products allow custom roles, which raises design questions about how administrators understand the effect of a permission without reading documentation.

### Designing for roles

:::framework The role and permission matrix
**What it is.** A table that lists roles against actions (or objects and actions) with scope, plus the behavior when access is missing. This is a practitioner tool and this book's own synthesis.

**Problem it addresses.** Role behavior is decided piecemeal by whoever builds each screen, causing inconsistency and gaps.

**When to use it.** Before detailed design of any workflow involving more than one role.

**When not to use it.** In a single-role tool where permissions do not vary.

**How to apply it.**
1. List the roles and what each is responsible for, in the customer's words.
2. List the objects and actions (view, create, edit, approve, delete, export).
3. For each combination, mark allowed, allowed within scope, requires approval, or not allowed.
4. For each "not allowed," decide the behavior: hidden, visible but disabled with a reason, or visible with a request-access path.
5. Identify separation-of-duties rules (the person who creates an order may not approve it).
6. Review with engineering and with the customer-facing teams who hear about role confusion.

**Limitations.** Real products have many roles and scopes, and the matrix grows. Keep it at the level where decisions are made, and use views for each role.
:::

### Showing and hiding

A central decision is whether unavailable features are hidden or disabled.

| Approach | Use when | Risk |
|---|---|---|
| Hide | The feature is irrelevant to the role and its presence would clutter | The person cannot learn it exists or why they cannot do something their colleague can |
| Show disabled with reason | The role could plausibly expect to do it, or the rule is state-dependent | Visual noise if many items are disabled |
| Show with request-access path | Access can be granted by someone identifiable | Needs an owner and a workflow behind it |

A useful rule: **hide what is irrelevant, explain what is blocked.** A button disabled because an order is already approved needs a reason ("Approved orders cannot be edited. Request a change."). A menu for administrative settings the user could never use can simply be absent.

:::example Hypothetical: a permission-limited list
A planner opens the order list and sees fewer orders than a colleague at another site. Without explanation, the planner suspects data is missing. A restrained design shows a scope indicator ("Showing orders for Site A and Site C"), and a link to learn how scope is set. The change costs little and prevents a class of support questions that engineers would otherwise investigate as bugs.
:::

## Entities, relationships and lifecycles

### Model before screens

An enterprise product is a collection of **entities** (orders, shipments, products, locations, partners), their **relationships**, and their **lifecycles**. Screens are views onto that model. Designers who learn the model can predict where problems arise: which changes cascade, which records block deletion, which statuses cannot be reversed.

### Entity relationship thinking for designers

You do not need to be a database designer. You do need to know, for each major entity:

- What it is in the customer's vocabulary, and what the system calls it. Mismatches cause confusion.
- What it relates to, and whether the relationship is one-to-many, many-to-many or hierarchical.
- Which relationships are mandatory (a line must belong to an order) and which are optional.
- What happens to related records when this one changes, is canceled or deleted.
- Which entity is the source of truth, especially where data comes from another system.

:::example Hypothetical: a pack hierarchy
Consider a simplified serialized hierarchy: individual items are grouped into cartons, cartons into cases, cases onto pallets. This invented example captures a pattern common in traceability work: a parent-child structure in which every unit has an identity and a place.

\`\`\`diagram
  Pallet P1
    |-- Case C1
    |     |-- Carton K1 --- Item 1, Item 2, Item 3
    |     +-- Carton K2 --- Item 4, Item 5, Item 6
    +-- Case C2
          +-- Carton K3 --- Item 7, Item 8, Item 9
\`\`\`

Design questions arise immediately:
- **Unpacking.** If a user unpacks Case C1, what happens to K1 and K2? Do they become standalone, stay linked, or move to a holding state?
- **Partial changes.** Can one item be removed from K1? What does that do to the count shown on C1 and P1?
- **Integrity.** What if an item is scanned into a second carton? The system must refuse, show where the item already is, and help resolve.
- **Display.** A flat table of items hides structure; a tree hides scale. Users often need both: a tree for context and a table for bulk work.
- **Traceability.** Every parent-child change is an event that may need to be recorded: who, when, why.

None of these is solved by a clean layout. Each needs a decision about the model, followed by interface behavior that makes the model legible.
:::

### Lifecycle states and transitions

A **lifecycle** is the set of states an entity can be in and the allowed transitions. [[ch:02]] introduced the state matrix. For complex entities, add:

- **Who** can trigger each transition.
- **What** must be true first (required fields, upstream states, approvals).
- **What happens** as a result (notifications, locks, downstream updates).
- **Whether it can be reversed**, and by whom, and at what cost.

\`\`\`diagram
  Draft --submit--> Submitted --approve--> Approved --receive--> Partially received --complete--> Closed
    |                  |                        |                        |
    +--delete          +--reject--> Draft       +--cancel--> Cancelled   +--cancel remainder--> Closed
\`\`\`

Draw the **illegal** transitions too, by saying them aloud: "Can a closed order be reopened?" If the answer is "it depends," you have found a requirement to resolve, not a screen to draw.

## Data-dense interfaces

Experts working all day need density: many records, many attributes, little wasted space. Density is not the same as clutter. Clutter is unorganized information. Density is a lot of information organized so that the person can find and act on what they need.

### Principles for dense views

1. **Decide the unit of work.** Is the user processing rows (receiving lines), monitoring exceptions (what is wrong?), or investigating a record? Each suggests a different primary view.
2. **Put the exceptions first.** For operational dashboards, "what needs me?" matters more than "what is the total?" Counts without a path to the items are ornamental.
3. **Set sensible defaults and allow customization.** Default columns, sort and filters should serve the most common case; saved views let experts adapt.
4. **Make state scannable.** Status should be legible at a glance using more than color (text, shape, position; see [[ch:04]]).
5. **Keep identity stable.** The record identifier should be easy to find and copy; people communicate about records by ID.
6. **Preserve context.** When drilling into a record from a list, return the person to the same place with the same filters.
7. **Design the empty and overflow cases.** What does a table show with no rows, with ten thousand, with a 200-character value?

### Operational dashboards

Dashboards fail when they display what is easy to count rather than what drives decisions. A practical test for each element: **what would the user do differently depending on what this shows?** If the answer is nothing, the element is decoration. For each metric, define the action it supports and the threshold at which it should attract attention.

:::decision Dashboard or work queue?
| Situation | Prefer | Reason |
|---|---|---|
| Users monitor and decide where to look | Dashboard with exception surfacing | Overview supports prioritization |
| Users process a stream of items | Work queue (list with actions) | The task is acting on items, not viewing totals |
| Users must investigate a specific case | Record view with history | Depth beats breadth |
| Leaders review trends | Report or analytics view | Aggregates over time; different cadence and audience |
Many "dashboard requests" are actually work queue needs. Ask what the person does after looking.
:::

## Bulk actions and operations at scale

Bulk work multiplies both efficiency and risk. The questions below determine whether it is safe.

### Scope: what exactly is selected?

- **Visible page vs all matching.** A common trap: the user selects "all" and means everything matching the filter, but the system acts on the visible fifty rows (or the reverse). Make the scope explicit ("50 selected. Select all 3,412 matching items?") and show it again before acting.
- **Selection persistence.** Does selection survive paging, sorting and filtering? State the rule and show a count.
- **Mixed selections.** If some selected items are in states where the action is not allowed, either prevent selection, filter silently with a clear count, or process the allowed ones and report the rest. Choose one and apply it consistently.

### Preview, execution and recovery

| Phase | Design requirement |
|---|---|
| Before | State the scope and the effect in plain terms: "Cancel 214 orders. 12 are partially received and will be skipped." A sample of affected items helps |
| During | Show progress for long operations; allow leaving and returning |
| After | Report results: succeeded, skipped, failed, with reasons and a downloadable list of failures |
| Recovery | Offer undo where possible; where not, provide an audit record of what changed |

:::framework Bulk action safety review
**What it is.** A checklist of questions to answer before designing a bulk operation. This is the book's own synthesis.

**Problem it addresses.** Bulk operations are often designed as "the single-item action with a checkbox," and failures at scale go unhandled.

**When to use it.** For any action applicable to many records.

**When not to use it.** For trivial, instantly reversible changes with a handful of records.

**How to apply it.**
1. What is the maximum realistic size? Design for that, not the demo.
2. What does "selected" mean, and how is it displayed?
3. Which items may be excluded, and how does the user learn this before and after?
4. Is the operation atomic (all or nothing) or partial? Which is safer for this domain?
5. How long does it take? Does it run in the background?
6. What can be undone, by whom, and for how long?
7. What is recorded for audit?
8. What happens if two users act on overlapping sets?

**Limitations.** Some answers depend on engineering decisions that are expensive to change. Raise them early.
:::

### Atomic or partial

Whether a bulk operation applies fully or partially is a domain decision, not an interface one. In financial or regulatory contexts, atomicity may be required to avoid inconsistent states. In others, partial processing with a clear report is more useful, because one bad row should not block hundreds of good ones. When partial, the report of exceptions becomes a first-class screen: the list of items that failed, why, and what the user can do about each one.

## Validation, exceptions and recovery in workflows

[[ch:02]] covered error handling. In enterprise workflows, exceptions are often not mistakes by the user but **legitimate conditions** the process must handle: a delivery that does not match its order, a partner message that fails validation, a serial number that appears twice, an item with a missing attribute.

### Exceptions as part of the design

An **exception** here means a case that deviates from the expected flow and needs human judgment. Design for it explicitly:

1. **Detect and name it.** Give each exception type a clear name in the user's vocabulary.
2. **Route it.** Who handles it? How do they learn about it? In the product, by email, in a work queue?
3. **Provide context.** Show the record, what was expected, what was received, and the history.
4. **Offer resolutions.** Accept as is, correct, reject, escalate. Each should record the decision and reason.
5. **Track it.** Open exceptions should be visible and aging should be measurable.

:::example Hypothetical: delivery quantity mismatch
A warehouse records receipt of 90 units against an order line for 100. The design question is not "how to show an error." It is: what is the right outcome? Options: accept as a short shipment and keep the line open for the balance; accept and close the line; reject and request the supplier to resend; or hold pending investigation. Each has a different downstream effect (financial, inventory, supplier communication). The interface should present these as named, explained choices with consequences, require a reason where policy demands it, and record the decision. Presenting "Error: quantity mismatch" with a text field would push the policy question onto the user, unaided.
:::

### Reducing exceptions at the source

Exception handling is costly. Where possible, prevent exceptions: validate at entry, use constraints, show expected values, and surface mismatches while the person can still fix them (at the dock) rather than later (at the desk). The best exception design includes asking whether the exception should exist at all, and routing that question to the owner of the process.

## Auditability, traceability and trust

In regulated and contractual environments, being able to show what happened, who did it, when, and why is part of the product's value. This is domain context, not legal advice, and requirements vary. Consult the owners of regulatory and compliance requirements for what must be recorded.

### Designing audit trails

An **audit trail** is a record of events affecting data or decisions. Useful design questions:

- **What is recorded?** Creation, change (with before and after values), deletion, approval, access to sensitive data, configuration changes.
- **Who is shown?** Users, system processes, integrations. Showing a system user's name as the actor can confuse; label it clearly.
- **How is it displayed?** An audit log with thousands of rows is a table problem: filter by record, actor, time and type; show diffs compactly; make the record ID linkable.
- **Where do users meet it?** On the record itself (history tab), in a central log, in exports. People investigating a record want history in context.
- **Can it be altered?** If the trail must be tamper-evident, the interface must not suggest editing it. Corrections are new events, not rewrites.
- **Reasons.** Where policy requires a reason for a change, capture it at the moment of the action with a short, structured prompt, not later.

### Trust cues

Trust in enterprise software comes from predictability and transparency: the system does what it says, tells you what it did, and lets you check. Practical cues:

- **Confirm what changed.** "Order 4821 changed from Approved to Cancelled. Supplier notified." beats "Saved."
- **Show provenance.** Where data came from (manual entry, integration, import) and when.
- **Show freshness.** If data is not live, say how old it is.
- **Avoid silent changes.** Automatic edits by the system should be visible and attributable.
- **Make sensitive actions deliberate.** Electronic approvals or signatures in regulated settings often have specific requirements; confirm them with the compliance owner.

### Security and privacy as design concerns

Security is mostly engineering and policy, but design shapes whether people follow it. Examples: password and session policies that cause lockouts during critical work; hidden sharing settings that expose data; error messages that reveal whether an account exists; exports that carry sensitive data without a warning. Raise these with security owners early, and design for the realistic behavior of tired people, not the idealized one. Privacy obligations (what personal data is collected, retained, displayed) come from the law and the organization's policy. Do not invent requirements; ask the owners.

## Configuration-heavy workflows

Enterprise products are often configurable: statuses, fields, rules, mappings, templates, notifications. Configuration shifts design from "what does the user do" to "what did someone set up, and why does the system behave this way?"

### Common problems

- **Action at a distance.** A setting changed in one place alters behavior elsewhere, and users cannot find why.
- **Invisible defaults.** The system behaves according to a configuration nobody remembers.
- **No preview.** Administrators cannot see the effect of a rule until it affects real data.
- **No versioning.** A change breaks something and nobody can tell what changed or revert it.
- **Terminology drift.** Configuration terms differ from the vocabulary of daily users.

### Design responses

| Problem | Response |
|---|---|
| Action at a distance | Show configuration-derived behavior in context ("This field is required because of rule X"), linking to the setting |
| Invisible defaults | Make defaults visible; show what is inherited vs overridden |
| No preview | Provide a test mode or impact summary ("This rule would affect 320 existing records") |
| No versioning | Keep history of changes with actor and time; allow comparison and, where safe, rollback |
| Terminology drift | Use the daily users' language in configuration labels; test with administrators |

### Progressive disclosure for configuration

Administrators vary: some set up once and rarely return; others tune daily. Provide guided setup for the first time, an overview that reveals status ("3 of 5 steps complete"), and direct access for experts. Defaults should be safe and sensible; advanced options should be reachable but not in the way.

## Multi-step and long-running operations

Imports, migrations, large exports, validations and report generation can take minutes or hours.

**Principles:**
- **Do not trap the user.** Let them leave and return. Provide a place to find running and completed jobs.
- **Show meaningful progress.** Steps ("Validating, 3 of 5") are more informative than a bare spinner. If a percentage is unreliable, do not fake one.
- **Handle partial failure.** Report what succeeded and what did not, with a way to retry only the failures.
- **Notify appropriately.** Tell the person when it finishes or needs input, in the channel they will see.
- **Be resumable.** For multi-step wizards, save state so that interruptions do not lose work.
- **Make the effect clear.** What changed, where to see it, how to undo it.

## Designing for expert users without losing learnability

Experts want speed. New users want guidance. Enterprise products usually need both, and there is no single balance. Some tensions to manage explicitly:

| Tension | Expert need | Novice need | Common resolution |
|---|---|---|---|
| Density vs clarity | More on screen | Less to parse | Defaults for common cases; user-adjustable density |
| Shortcuts vs discoverability | Keyboard and bulk operations | Visible, labeled actions | Visible primary paths with shortcuts shown alongside |
| Flexibility vs safety | Free editing | Guardrails | Safe defaults; confirmation only for irreversible actions; undo |
| Customization vs consistency | Personal views | Predictable product | Saved views with sensible shared defaults |
| Speed vs explanation | Terse | Contextual help | Help available on demand, not in the way |

:::warning Designing for the demo
A common failure is optimizing for the walkthrough of a new user while the daily expert pays the cost every day. Conversely, optimizing only for experts produces a product that cannot be adopted by new hires. Identify who bears the cost most often, and who determines adoption. In enterprise sales, those can be different people ([[ch:14]]).
:::

Do not equate experts with comfort with complexity. Experts want *efficiency*: fewer steps, fewer decisions, stable locations. They do not want mystery.

## Worked case: redesigning a delivery receiving workflow

:::case Hypothetical: receiving against a purchase order
This scenario is invented for teaching and does not describe a real product or company.

**Context.** Warehouse staff receive deliveries against purchase orders. They scan or enter quantities, note damage, and confirm. Supervisors review exceptions. Complaints: exceptions are found late, the form is slow for large deliveries, and nobody can tell afterward why a quantity was accepted.

**Business objective (assumed).** Reduce time to receive and reduce downstream reconciliation work.

**User problem.** Receiving staff need to record what arrived quickly and flag problems at the dock; supervisors need to resolve exceptions with context.

**Known evidence.** A few observation notes and tickets about reconciliation (hypothetical). No timing data.

**Unknowns and assumptions.** Typical delivery size; share of deliveries with exceptions; whether devices at the dock can scan; what policy requires for accepting short shipments.

**Research plan.** Observe receiving at two sites, collect examples of exception types, ask supervisors how they resolve them, and ask compliance what must be recorded. Review a sample of past exceptions.

**Options considered.**
- **A. Faster form.** A line-by-line table with keyboard entry and inline validation.
- **B. Scan-driven flow.** Each scan increments the received quantity; mismatches surface immediately; exceptions are created on the spot.
- **C. Hybrid.** Table for desk entry and scan input for dock use, sharing one model.

**Trade-offs.** A is least costly but leaves late discovery. B addresses timing but depends on devices and barcode data quality. C serves both but doubles surfaces to maintain.

**Recommended direction.** C, built on one receiving model with named exception types (short, over, damaged, unordered item) and structured resolutions with required reasons where policy needs them. Start with the table and exception model, since they benefit all sites, and add scan input where devices exist.

**Key design decisions.**
- Exceptions are created at the time of receipt, not found later.
- Each resolution is a named option with a visible consequence for inventory and the order line.
- The record shows a history: who received, what was entered, what was changed, and why.
- Bulk confirm is allowed for lines with no exceptions, previewing the count and excluding flagged lines.
- Supervisors have a queue sorted by age, with order context.

**Validation plan.** Prototype-based tests with receiving staff on realistic delivery data (including a long one with several exceptions), and with supervisors resolving seeded exceptions. Measure time to complete and errors in the test. After release, instrument time per delivery, exception counts and resolution age, with baselines recorded first.

**Success metrics (to agree).** Time to receive; share of exceptions caught at receipt; age of open exceptions; reconciliation effort. State confounders (volume, staffing changes).

**Implementation considerations.** Exception types and resolutions need backend support; permission rules decide who may accept short shipments; audit events must be defined with compliance; long deliveries need performance care.

**Risks and limitations.** Policy ambiguity over acceptable tolerances may block the resolutions design. Scan quality may undermine option B. The sample from two sites may not represent others.

**What a senior designer communicates.** "The speed problem is real but is the smaller one. The larger cost is discovering exceptions late, with no record of why they were accepted. I recommend a single receiving model with explicit exceptions, a table now and scanning where devices exist. The open question is policy on tolerances, which I need compliance to confirm before we finalize the resolutions."
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize
**1. Treating complexity as a layout problem.** *Why:* layout is visible. *Sign:* repeated redesigns of a busy screen. *Consequence:* no improvement. *Fix:* check the underlying model, roles and states.

**2. Hiding the reason.** *Why:* the rule is obvious to the builder. *Sign:* "why can't I do this?" tickets. *Consequence:* support load and distrust. *Fix:* explain blocked states and give a path.

**3. Bulk actions as single actions with checkboxes.** *Why:* reuse. *Sign:* no scope, preview or failure report. *Consequence:* silent partial failures. *Fix:* apply the bulk safety review.

**4. Designing exceptions as errors.** *Why:* the error pattern exists. *Sign:* a generic message plus a text box. *Consequence:* users improvise policy. *Fix:* design named resolutions with consequences.

**5. Dashboards of counts.** *Why:* counts are easy. *Sign:* metrics with no action. *Consequence:* ornamental screens. *Fix:* for each element, ask what the user would do differently.

**6. Ignoring configuration as a user experience.** *Why:* administrators are few. *Sign:* behavior no one can explain. *Consequence:* costly support and distrust. *Fix:* show derived behavior in context; version and preview.

**7. Treating audit as a log table.** *Why:* it is a backend feature. *Sign:* a raw event list. *Consequence:* the trail exists but cannot answer questions. *Fix:* design history in context and filtering for investigation.

**8. Assuming experts want complexity.** *Why:* they tolerate it. *Sign:* options everywhere. *Consequence:* daily cost. *Fix:* optimize their frequent paths; hide the rare.
:::

## Trade-offs and decision criteria

| Decision | Lean toward A | Lean toward B |
|---|---|---|
| Hide vs disable | Hide: irrelevant to role | Disable with reason: plausible expectation or state-based |
| Atomic vs partial bulk | Atomic: consistency is critical | Partial: independence of items; clear exception report |
| Tree vs table | Tree: understanding structure | Table: bulk operations and comparison |
| Guided vs direct configuration | Guided: infrequent, high-risk setup | Direct: frequent expert tuning |
| Central audit log vs in-context history | Central: investigation across records | In-context: understanding one record |
| Prevent exceptions vs handle them | Prevent: cause is upstream and fixable | Handle: legitimate deviations the process must accommodate |
| Standardize across modules vs tailor | Standardize: shared mental model | Tailor: materially different tasks ([[ch:09]]) |

## Senior-level application

A senior designer working on complex enterprise products:

- **Starts with the model.** They map entities, relationships, lifecycles and roles before designing screens, and validate the map with engineering and domain experts.
- **Identifies hard-to-reverse structure** and spends rigor there ([[ch:01]]).
- **Writes down rules** in matrices and decision records so that the product behaves consistently across modules and teams.
- **Designs exceptions and recovery as first-class parts of the flow.**
- **Brings compliance, security and support owners into design early**, treating their requirements as constraints to design well within.
- **Looks for the system-level fix** instead of the screen-level polish, and says when a request is really a model problem.
- **Protects both experts and newcomers**, naming trade-offs openly when a choice favors one group.

## Checklists and heuristics

:::checklist Complex workflow review
- [ ] Entities, relationships and lifecycles are mapped and reviewed with engineering.
- [ ] A role and permission matrix exists, with behavior for each blocked case.
- [ ] Illegal and irreversible transitions are identified.
- [ ] Exceptions are named, routed, contextualized and tracked.
- [ ] Bulk actions state scope, preview effects, report outcomes and allow recovery.
- [ ] Long-running operations can be left and resumed.
- [ ] Audit events and reasons are defined with the relevant owners.
- [ ] Configuration-derived behavior is explained in context.
- [ ] The default path serves the frequent case; shortcuts exist for experts.
:::

:::checklist Dashboard review
- [ ] Each element has an associated action and threshold.
- [ ] Exceptions and "needs attention" come before totals.
- [ ] Counts link to the underlying items.
- [ ] Status is not conveyed by color alone.
- [ ] Empty, loading, stale and error states are designed.
:::

## Practice exercises

:::exercise Map an entity lifecycle
Choose a core entity in your product. Draw its states and transitions, with who can trigger each and what must be true first. Mark irreversible transitions and the ones that need approval. Ask an engineer and a support person to find what you missed.

*Evaluation criteria:* Each transition has an actor and precondition. At least one illegal transition is explicitly stated. At least two corrections come from the review.
:::

:::exercise Bulk action safety review
Pick a bulk action in your product. Answer the eight questions in the safety review. Identify one scenario that would currently go wrong (for example, mixed states, a very large selection, concurrent edits) and sketch the design change.

*Evaluation criteria:* Answers are specific, not "it depends." The identified failure is realistic, and the fix is concrete.
:::

:::exercise Exception design
List the five most common exceptions in a workflow you own. For each, write the name in the user's vocabulary, who handles it, what context they need, the available resolutions with consequences, and what is recorded.

*Evaluation criteria:* Resolutions are named options with consequences, not "edit." Each has an owner. At least one exception is flagged as potentially preventable upstream.
:::

## Reflection questions

- Which behaviors in your product exist only because of configuration nobody can see?
- Where does your product ask users to make policy decisions that the organization should make?
- Which of your screens would be unnecessary if the model were different?
- Who bears the daily cost of your defaults, and who decides adoption?
- If an auditor asked about a specific record, could a user answer quickly?

## Chapter summary

- Complexity has distinct sources (roles, lifecycles, relationships, volume, configuration, integration, accountability, expertise). Each needs a different response.
- Model first. Entities, relationships, lifecycles and roles explain most screen-level problems.
- Hide what is irrelevant, explain what is blocked.
- Dense does not mean cluttered. Surface exceptions first and make every dashboard element support an action.
- Bulk actions need explicit scope, previews, outcome reports and recovery.
- Exceptions are legitimate conditions. Design named resolutions with consequences and record decisions.
- Audit and trust come from transparency: show what changed, who, when, why and from where.
- Configuration needs visibility, preview and versioning.
- Experts want efficiency, not complexity. Decide openly whom a trade-off favors.

## Knowledge check

:::check Recall: hide or disable
When is it better to hide a feature than to show it disabled?
---
When it is irrelevant to the person's role and would clutter, and when seeing it would not help them understand anything. Show it disabled with a reason when the person could plausibly expect to use it or the block depends on state (for example, an approved order cannot be edited). A useful rule: hide what is irrelevant, explain what is blocked.
:::

:::check Application: select all
A table shows 50 rows per page, with 3,412 matching the filter. A user ticks the header checkbox and clicks "Cancel." What should the design do?
---
State the scope explicitly. After the header checkbox, show "50 selected. Select all 3,412 matching?" and give the user a clear choice. Before acting, restate the exact count and effect, preview exclusions (for example, items in states where cancellation is not allowed), and report results afterward with reasons for skipped items. Offer undo or record an audit event.
:::

:::check Scenario: policy ambiguity
Receiving staff need to accept a short delivery, but the policy on tolerances is unclear. What do you do?
---
Do not invent the policy. Identify the owner (operations or compliance), bring concrete options and consequences, and propose a design that handles the decision as named resolutions with a required reason, so that whichever policy is set can be expressed through configuration. Meanwhile, design the parts that do not depend on the policy and flag the decision as a blocker with a date.
:::

:::check Trade-off: atomic or partial
A bulk import contains 5,000 rows and 40 are invalid. Should the whole import fail?
---
It depends on the domain. If rows are interdependent or partial data would create inconsistent states, atomic failure is safer and the report should list the invalid rows. If rows are independent, partial processing with a clear report and an easy way to correct and re-import failed rows is usually more useful. State the decision as a domain rule agreed with the business and engineering.
:::

:::check Interpretation: a dashboard
A dashboard shows total orders, average processing time and a trend line. Users ignore it. What would you check?
---
Whether any element supports an action. Ask what users do after looking, and what they are really trying to find (for example, orders needing attention). Replace or add exception surfacing with links to the items, and define thresholds that trigger attention. Check whether the use case is actually a work queue.
:::

`,la=`Senior product design is often described as a bigger version of mid-level design: more experience, better taste, faster delivery. That description is wrong in a way that matters. The senior role differs in *kind*. Mid-level designers deliver well-defined work in familiar territory. Senior designers decide what the work should be, take responsibility for outcomes in unclear situations, and change what other people do. Some of this shows up in the artifacts. Most of it does not.

This chapter describes senior practice in behavioral terms: how a senior designer handles ambiguity, decides under uncertainty, sets quality standards, prioritizes across initiatives, mentors, influences without authority, thinks across teams, balances speed and quality, escalates risk, and expands scope. It also separates senior practice from what is usually meant by staff-level and principal-level influence. [[ch:01]], [[ch:05]], [[ch:10]] and [[ch:15]] supply supporting detail; this chapter ties them into a practice.

A caution about evidence. There is little rigorous research on what distinguishes senior designers; most sources are career ladders, practitioner essays and books. Tanya Reilly's work on staff-level engineering is one of the clearest accounts of widening scope and influence, though written for engineers [[ref:reilly-staff]]. Marty Cagan's writing on empowered product teams offers a perspective on the designer's role in product decisions [[ref:cagan-inspired]]. Both are influential views, not consensus. The level descriptions in this chapter are the book's own synthesis and are **learning levels, not industry titles**. Companies define seniority differently, and the same title can mean very different expectations.

## What "senior" means in this book

The competency framework (see the [competency framework](#/framework)) defines four learning levels: Foundation, Independent practitioner, Senior practitioner and Strategic leader. A senior practitioner can lead ambiguous problems, make defensible trade-offs, influence cross-functional decisions and connect design work to product outcomes. The strategic leader level shapes direction across teams or product areas and establishes practices that others use.

The table summarizes how behavior changes.

| Dimension | Independent practitioner | Senior practitioner | Strategic leader |
|---|---|---|---|
| Problem | Clarifies a given problem | Defines and reshapes the problem, including saying no | Chooses which problems the area addresses |
| Uncertainty | Asks for direction | Makes a reasoned bet and states what is unknown | Builds mechanisms that reduce uncertainty for many teams |
| Quality | Meets the bar | Defines the bar for the work, and explains it | Sets and maintains quality standards across teams |
| Influence | Within the project | Across functions without authority | Across the organization; shapes how decisions are made |
| Scope | A feature or flow | A product area or an ambiguous initiative | Multiple areas or the function |
| Mentoring | Shares knowledge when asked | Coaches regularly and raises others' judgment | Builds growth paths and team capability |
| Failure mode | Executes well on the wrong thing | Over-relies on personal judgment, becomes a bottleneck | Distance from the work; abstract direction |

:::warning Seniority is not confidence or volume
Seniority is not louder opinions, more polished files or more meetings. A senior designer often produces fewer artifacts because more time goes to framing, alignment and decisions. They are also *more* comfortable saying "I do not know" and "I was wrong." Confidence without evidence is a risk, not a trait to emulate.
:::

## Owning ambiguous problems

### What ambiguity looks like

Ambiguity appears as a vague brief ("improve onboarding"), conflicting goals, unclear ownership, missing data, or a problem that spans several teams. Mid-level work waits for clarity. Senior work *produces* it.

### A practical approach

:::framework Taking ownership of an ambiguous problem
**What it is.** A sequence for converting an unclear problem into a bounded, owned piece of work. This is the book's own synthesis.

**Problem it addresses.** Ambiguous problems either stall or get solved at the wrong scope.

**When to use it.** When asked to "look into" something, when a problem crosses teams, or when no one owns it.

**When not to use it.** When the problem is well defined; extra framing becomes overhead.

**How to apply it.**
1. **Restate the problem** in your own words, with who, goal, barrier and consequence ([[ch:05]]). Check it with the person who raised it.
2. **Find the decision-makers.** Who decides what success is, and who can say yes to changes? Ambiguity is often an ownership problem.
3. **Bound it.** Propose a scope for the first cycle: what is in, what is out, what you will not decide.
4. **List unknowns and rank them** by how much they could change the plan.
5. **Propose a learning plan with a time box** and the decisions it will inform.
6. **Agree on checkpoints** with stakeholders, including what you will show and when.
7. **Write it down** in a one-page brief that others can correct.

**Limitations.** A well-bounded brief can hide that the boundary is wrong. Revisit the scope when evidence changes, and say so openly.
:::

The one-page brief is itself an influence tool. It makes you the person with a clear picture, and invites correction early, when it is cheap.

## Making decisions with incomplete information

Senior designers are not paid to be certain. They are paid to decide well when certainty is unavailable.

### Principles

1. **Distinguish reversible from irreversible decisions** ([[ch:01]]). Move quickly on reversible ones; invest in the rest.
2. **Decide what you would need to know** to change your mind, and whether it is obtainable in time.
3. **Choose, record and review.** Write the decision, the reasoning, the alternatives and the conditions under which you would revisit it. Review it later, so that you learn.
4. **Separate the quality of the decision from the quality of the outcome.** A good decision can have a bad outcome through bad luck, and a poor decision can be rescued by luck. Reviewing only outcomes teaches the wrong lessons.
5. **Be explicit about confidence.** "I am fairly confident about X, less about Y" is more useful than uniform certainty.

:::example Hypothetical: a decision record
**Decision.** Use a side panel, not a modal, for editing shipment details.
**Context.** Users compare against the list while editing; many fields; frequent use.
**Options.** Modal (consistent with other editing), full page (more space), side panel (retains context).
**Evidence.** Observation of three users (small sample) who consulted the list while editing; engineering confirms panel is feasible within the component library.
**Decision.** Side panel, as a documented variant.
**Confidence.** Moderate. Evidence is small but consistent, and the decision is reversible.
**Revisit if.** Usage data shows frequent abandonment, or accessibility review finds problems that cannot be resolved in the pattern.
**Owner and date.** (name, date)

Such a record takes ten minutes and saves repeated debate.
:::

## Defining quality standards and design principles

A senior designer is accountable not only for their own work but for what "good" means in their area. That requires making quality *explicit*, since implicit standards live in the heads of a few people and erode as teams grow.

### Principles vs standards vs guidelines

| Term | What it is | Example |
|---|---|---|
| Principle | A statement of values that guides trade-offs | "Show the reason for every blocked action." |
| Standard | A rule that is checkable | "Every disabled control has an accessible explanation." |
| Guideline | Advice with room for judgment | "Prefer inline editing for single-field changes." |

Principles are only useful if they help decide something. "Be simple" does not; "When efficiency for experts conflicts with discoverability for new users, favor efficiency on frequent paths and discoverability on rare ones" does.

:::framework Writing a design principle that works
**What it is.** A method for creating principles that guide decisions. This is the book's own synthesis.

**Problem it addresses.** Principles written as slogans do not change behavior.

**When to use it.** When a team keeps having the same debate or when quality varies across the product.

**When not to use it.** When the issue is a standard (a rule), not a value.

**How to apply it.**
1. Collect recurring disagreements and past decisions.
2. For each, state the tension ("speed vs safety").
3. Write a principle that says which way to lean and when.
4. Add an example and a counter-example.
5. Test it by applying it to a recent decision. Does it settle it?
6. Review periodically; retire principles that no longer help.

**Limitations.** Principles cannot cover every case. They are tools for discussion, not substitutes for judgment.
:::

Quality is also maintained through **review practices**: design critiques with a decision rule, design QA before release, accessibility checks, and pattern review ([[ch:09]]). Senior designers set up these mechanisms, and also model them by receiving critique openly.

## Prioritizing across multiple initiatives

Seniority brings more requests than capacity. Without a method, you default to whoever asks loudest or whichever work is most interesting.

### A working method

1. **List the commitments and requests**, with the outcome each supports and its deadline.
2. **Separate urgent from important.** Deadlines create pressure but do not equal value.
3. **Assess the cost of delay** for each. Some work loses value quickly; some does not.
4. **Assess where your contribution is distinctive.** Work that someone else could do adequately may be better delegated or supported lightly.
5. **Make trade-offs visible.** Show your lead what you are doing, what you are deferring and the consequences, and ask them to confirm or reprioritize.
6. **Say no with options.** "I cannot do both by the deadline. I can do A fully and B in a reduced form, or B first with A delayed. Which do you prefer?"

Frameworks such as RICE or impact and effort can help structure the conversation. Their scores are estimates, and precise numbers from rough inputs mislead ([[ch:12]]). Use them to surface assumptions, not to settle arguments.

## Influence without authority

Most of a senior designer's influence runs through people who do not report to them: product managers, engineers, leaders and other designers. Authority does not apply. What works?

### Sources of influence

| Source | Meaning | How it is built |
|---|---|---|
| Evidence | You know what is true about users and the product | Research, data, observation; being right over time |
| Clarity | You frame problems and options so others can decide | Written briefs, decision records, simple models |
| Reliability | You do what you say | Following through; honest estimates |
| Understanding | You grasp others' goals and constraints | Listening; asking about constraints before presenting |
| Generosity | You help others succeed | Sharing credit; supporting teammates' goals |
| Visibility of reasoning | People can see how you decide | Showing trade-offs and alternatives, not only conclusions |

### Practices

- **Pre-wire important decisions.** Talk to key people before the meeting so there are no surprises and so you hear their concerns while they can still influence the proposal.
- **Frame in their terms.** An engineer cares about complexity and risk; a product manager about outcomes and scope; a leader about priorities and exposure. Translate the same recommendation accordingly without changing its substance.
- **Offer options, with a recommendation.** Giving people a real choice builds ownership. A recommendation shows leadership.
- **Show the cost of not deciding.** Delays often have costs that are invisible until stated.
- **Disagree with specifics.** "I am concerned that this adds a step for every order; here is what I saw in testing" persuades more than "this is bad UX."
- **Decide how you will disagree and commit.** After a decision is made, support it, and bring data later if it proves wrong.

:::example Hypothetical: a late technical constraint
Engineering reports, near the end of design, that the proposed inline editing for order lines cannot be supported by the current data layer without a significant rewrite.

A weaker response: defend the design, or immediately abandon it. A stronger one: ask what specifically is hard and what the options are; separate what the user needs (fast correction of a quantity) from the interaction (inline editing); propose two or three alternatives with different engineering costs (a row-level edit panel, a constrained inline edit of quantity only, a deferred rewrite); state the user impact of each and your recommendation; and ask engineering to confirm the effort. Outcome: the team chooses the constrained version now, with the fuller version recorded as a candidate for later. The decision is logged with its reasoning.

What the senior designer did: treated the constraint as information, kept the user need fixed while the solution varied, and made the trade-off visible.
:::

## Stakeholder conflict and escalation

Disagreement is normal and often productive. It becomes a problem when it is unresolved, personal, or hidden.

### Handling disagreement

1. **Clarify what the disagreement is about.** Goals, facts, options or values? Different causes need different remedies.
2. **Seek the other person's reasoning.** Ask what they see that you do not.
3. **Find shared criteria.** Agree how the decision will be judged before arguing about options.
4. **Gather evidence** if the disagreement is about facts, and cheaply.
5. **Escalate the decision, not the person.** If no resolution, bring both positions to the person who owns the decision, with the options and trade-offs.

### Communicating risks and escalating

Senior designers are expected to raise important issues early. A usable format:

> **Risk:** what could go wrong.
> **Likelihood and impact:** how likely, how bad, who is affected.
> **Evidence:** what supports this.
> **Options:** what could be done and what each costs.
> **Recommendation:** what you suggest.
> **Decision needed:** from whom, by when.

Raise it to the person who can act, in writing so it is clear, and without alarm. Escalation is about getting the right decision-maker informed with options, not about winning.

## Balancing delivery speed and long-term quality

A product accumulates **design debt**: inconsistencies, workarounds and patterns that were expedient. Some debt is a reasonable trade for speed. Unmanaged debt slows everything.

| Situation | Reasonable stance |
|---|---|
| Time-sensitive launch, reversible choices | Ship a simpler version; record the shortcut and plan to revisit |
| Hard-to-reverse structure (data model, navigation, permissions) | Invest now; shortcuts are costly to undo |
| Accessibility or safety issue | Do not defer silently; if scope must cut, make it an explicit, owned decision with a date |
| Inconsistent patterns accumulating | Schedule recurring cleanup tied to feature work |

Record deliberate shortcuts so they are *debt* and not *forgotten defects*. A short list with owner and revisit date turns an accident into a decision.

## Cross-team systems thinking

At senior scope, problems rarely sit inside one team's boundary. Navigation, terminology, permissions, notifications and data models cross teams. Cross-team thinking means:

- **Seeing the whole journey.** The customer experiences one product, not five team backlogs.
- **Finding the seams.** Handoffs between modules are where inconsistency and failures concentrate.
- **Establishing shared artifacts.** A glossary, a pattern library, a model of core entities.
- **Aligning incentives.** Teams are rewarded for their own metrics; shared problems need shared goals or an explicit owner.
- **Choosing where to standardize.** Not everything should be the same. [[ch:09]] discusses how to tell legitimate difference from drift.

## Mentoring and supporting other designers

Mentoring multiplies your impact and sharpens your own thinking. Effective mentoring in a working environment looks like:

- **Questions before answers.** "What are you trying to achieve? What have you considered?" develops judgment; a prescription develops dependency.
- **Specific, timely feedback** tied to goals. "I noticed X; I wonder about Y; what if Z?"
- **Explaining your reasoning**, not just your conclusions, so that others can learn the thinking.
- **Giving real responsibility** with support, and allowing mistakes that are survivable.
- **Making the standards visible**, so people know what good looks like without guessing.
- **Recognizing different strengths.** A designer strong in craft and weak in business reasoning needs different development from the reverse.

Mentoring is not a replacement for managing. If you do not manage the person, be clear about what you can and cannot do.

## From feature ownership to product and organizational impact

Growth in scope usually follows this shape.

1. **Own features.** You deliver well.
2. **Own problem areas.** You decide which problems to address and bring evidence.
3. **Own outcomes.** You are accountable alongside product and engineering for metrics that matter.
4. **Shape how the team works.** You improve processes, standards and capability.
5. **Shape direction across teams.** You influence priorities, structure and strategy.

You do not move by announcing it. Scope is *granted* because others trust your judgment. The practical route is to demonstrate that you can handle a slightly larger problem than the one you hold, with evidence, and then be given it.

### Senior vs staff-level vs principal-level

The distinctions below are indicative and differ widely among organizations; treat them as a map, not a rule. Reilly's discussion of staff-level scope, written for engineering, describes the shift from solving problems to shaping the conditions in which many people solve them [[ref:reilly-staff]].

| Level (indicative) | Typical scope | Typical contribution |
|---|---|---|
| Senior | A product area or ambiguous initiative | Leads a hard problem to an outcome; strong craft and judgment; mentors |
| Staff | Several teams or a cross-cutting domain | Resolves cross-team problems; sets patterns and direction; multiplies others |
| Principal | An organization or major strategy | Shapes company-level design direction; influences executive decisions; long-horizon bets |

Some organizations have no such levels, some have more, and some use titles differently. Check what your organization actually expects, and what *behaviors* distinguish the level above yours.

## Worked case: owning an ambiguous cross-team problem

:::case Hypothetical: inconsistent status vocabulary across modules
This scenario is invented. It shows the practice, not a real outcome.

**Context.** A platform has several modules built by different teams. Each module uses its own status names ("Active," "Open," "In progress") with different meanings. Support reports confusion in cross-module workflows. No team owns the problem.

**Business objective (assumed).** Reduce confusion and support effort, and make cross-module features feasible.

**Ambiguity.** Nobody has asked the designer to do anything. Impact crosses boundaries, and each team has its own reasons for its terms.

**Approach.**
1. **Frame.** Write a one-page brief: the problem, evidence from tickets, an inventory of statuses by module (a quick audit), what is unknown (why teams chose their terms, whether any are tied to regulation or contracts), and a proposal to learn first.
2. **Find the owners.** Identify the product managers and the design system owner, and check who can decide on shared vocabulary.
3. **Bound.** Propose a first scope: the five most-used shared entities, not all.
4. **Learn.** Interview support and two customers about confusing cases; ask each team why their terms exist.
5. **Options.** (a) Common vocabulary enforced by the design system; (b) a mapping layer where modules keep their terms but show equivalents; (c) leave as is but document. Trade-offs: (a) is clean but needs coordination and may break integrations or customer training; (b) is less invasive but adds clutter; (c) costs nothing and does not fix the problem.
6. **Recommend.** (a) for new work and for entities where no legal or contractual meaning is tied to the term, (b) where terms are bound to contracts or regulation, with a plan to review.
7. **Align.** Pre-wire each product manager, bring a proposal for a shared glossary, and ask the design system owner to house it.
8. **Record the decision and the review date.**

**Risks and limitations.** Teams may see it as imposition. Terms may be tied to customer training. The audit shows inconsistency but not harm; the tickets support harm only anecdotally.

**What a senior designer communicates.** "This problem has no owner, but it is costing support time. I propose a small first step: a shared vocabulary for five entities, with exceptions where terms have legal meaning. I need each team's agreement and the design system to hold the glossary. I am not recommending a full rename."

**What changed in scope.** The designer moved from a screen-level view to shaping a shared standard, without authority, by clarity and evidence.
:::

## Common mistakes and misconceptions

:::warning Mistakes to recognize
**1. Mistaking seniority for certainty.** *Why:* confidence is visible. *Sign:* decisions without stated unknowns. *Consequence:* confident errors. *Fix:* state confidence and what would change your mind.

**2. Becoming the bottleneck.** *Why:* you are the best judge. *Sign:* decisions wait for you. *Consequence:* the team slows and others do not grow. *Fix:* make standards explicit and delegate decisions within them.

**3. Fighting every battle.** *Why:* high standards. *Sign:* constant escalation. *Consequence:* lost credibility. *Fix:* choose battles by irreversibility and user impact.

**4. Relying on authority you do not have.** *Why:* title expectations. *Sign:* "because I said so" reasoning. *Consequence:* resistance. *Fix:* use evidence, clarity and understanding of others' goals.

**5. Hiding trade-offs.** *Why:* wanting to appear decisive. *Sign:* presenting one option as the only one. *Consequence:* later surprise and distrust. *Fix:* show alternatives and costs.

**6. Treating process as seniority.** *Why:* process is visible. *Sign:* many frameworks, few decisions. *Consequence:* overhead. *Fix:* use the smallest process that reduces the risk.

**7. Going to the executive level too early.** *Why:* impatience. *Sign:* bypassing peers. *Consequence:* damaged relationships. *Fix:* exhaust the direct route; escalate decisions with options, transparently.

**8. Staying only in your own lane.** *Why:* comfort. *Sign:* no engagement with metrics or strategy. *Consequence:* a scope ceiling. *Fix:* take one adjacent topic (metrics, a technical constraint) and learn it enough to discuss.
:::

## Trade-offs and decision criteria

| Decision | Lean toward A | Lean toward B |
|---|---|---|
| Decide alone or consult | Alone: reversible, within your area, time-critical | Consult: affects others, hard to reverse, needs buy-in |
| Escalate or resolve | Resolve: a shared goal and a clear path | Escalate: a standoff on a consequential decision |
| Invest in quality or speed | Quality: hard-to-reverse, safety or accessibility | Speed: reversible, learning is the goal |
| Standardize or tailor | Standardize: the shared experience matters | Tailor: tasks differ materially |
| Do the work or enable others | Do: a one-off, critical path | Enable: recurring need, others can learn |
| Present one option or several | One: low stakes | Several: contested, consequential decisions |

## Senior-level application

The essence of the senior practice described here can be summarized in a few habits:

- **Define the problem before the solution.**
- **Be explicit about what is known, assumed and unknown.**
- **Record decisions and revisit them.**
- **Make trade-offs visible and show alternatives.**
- **Influence through evidence, clarity and reliability.**
- **Raise risks early, with options.**
- **Raise the standard around you** by writing it down and by mentoring.
- **Look across boundaries** and decide where to standardize.
- **Take on slightly more than your current scope** and show you can carry it.

None of these require a title. All can be practiced now.

## Checklists and heuristics

:::checklist Ambiguous problem brief
- [ ] The problem is restated with who, goal, barrier and consequence.
- [ ] Decision-makers and owners are identified.
- [ ] The first-cycle scope is bounded (in, out, not deciding).
- [ ] Unknowns are ranked, and a time-boxed learning plan exists.
- [ ] Checkpoints and what will be shown are agreed.
- [ ] The brief is one page and open to correction.
:::

:::checklist Before escalating
- [ ] I tried to resolve it directly and understood the other position.
- [ ] I can state the disagreement in neutral terms.
- [ ] I have options, trade-offs and a recommendation.
- [ ] I know who owns the decision and what I need from them.
- [ ] The other party has seen the framing, so there is no surprise.
:::

## Practice exercises

:::exercise Write a decision record
Choose a recent significant design decision. Write a decision record: context, options, evidence, decision, confidence, conditions to revisit, owner. Share it with a colleague who disagreed at the time.

*Evaluation criteria:* The record names at least two real alternatives. Confidence is stated and justified. The "revisit if" conditions are observable.
:::

:::exercise Draft an ambiguous problem brief
Identify an unowned problem you have noticed. Write a one-page brief using the checklist. Share it with one product manager and one engineer, and record their corrections.

*Evaluation criteria:* The brief contains no solution in the problem statement. At least one correction changes the scope or an assumption.
:::

:::exercise Map your influence
For a project where you needed influence, list each stakeholder, what they care about, how they were informed, and where you were surprised. Identify one pre-wiring step you skipped.

*Evaluation criteria:* Stakeholder goals are stated in their terms, not yours. The skipped step is specific.
:::

:::exercise Scope evidence
Using the scope table in this chapter, write one concrete example from the last year for each dimension where you operated at the senior level, and name the dimension with least evidence. Write one step to build it.

*Evaluation criteria:* Examples are events, not traits. The weakest dimension is named honestly.
:::

## Reflection questions

- Which decisions in your current work are waiting for you, and which could be delegated if standards were explicit?
- Where do you rely on authority, or the appearance of confidence, in place of evidence?
- What problem sits between teams and has no owner? Who would need to agree to fix it?
- If your manager described your scope in one sentence, would it match what you do?
- Which of your past decisions deserves a review, to separate its quality from its outcome?

## Chapter summary

- Senior practice differs in kind from mid-level work: it defines problems, makes bets under uncertainty, sets the quality bar and changes what others do.
- Seniority is judgment and scope, not confidence, volume or polish.
- Take ownership of ambiguity by framing, finding owners, bounding scope and writing a one-page brief.
- Record decisions, state confidence, and review them to separate decision quality from outcome.
- Make quality explicit through principles, standards and review practices.
- Influence without authority comes from evidence, clarity, reliability and understanding others' goals.
- Escalate decisions, not people, with options and a recommendation.
- Manage design debt as a conscious trade-off, not an accident.
- Scope grows when others trust your judgment on a slightly larger problem.

## Knowledge check

:::check Recall: decision quality
Why separate the quality of a decision from the quality of its outcome?
---
Outcomes depend on luck and on factors outside your control. If you review only outcomes you will learn the wrong lessons: you may repeat a poor decision that happened to work, or abandon a sound one that happened to fail. Records of the reasoning and evidence allow you to judge the decision itself.
:::

:::check Application: no
Your lead asks you to take on a third initiative with the same deadline. What do you do?
---
Make the trade-off visible. Describe what you are doing, what would slip, and offer options (reduced scope, a different sequence, extra support). Ask them to choose. Avoid silently overcommitting and avoid an unqualified refusal.
:::

:::check Scenario: disagreement with a product manager
A product manager wants a feature your evidence does not support. What are your steps?
---
Clarify the disagreement (goals, facts, options or values), ask about their reasoning, agree on criteria for the decision, propose the cheapest test of the disputed assumption, and if still unresolved, take both positions with options to the decision owner. Keep the framing neutral and do not surprise them.
:::

:::check Trade-off: quality vs speed
When would you accept a shortcut under time pressure, and when would you refuse?
---
Accept it for reversible choices where learning is the aim, and record it as deliberate debt. Resist it for hard-to-reverse structure, and for accessibility or safety issues. If scope must be cut in those areas, make it an explicit owned decision with a date.
:::

:::check Interpretation: levels
A colleague says, "I am senior because I produce the most polished designs." What is the issue?
---
Polish is craft, which matters but does not define senior practice. The distinguishing features are scope, judgment, handling ambiguity, influence and outcomes. Ask about decisions shaped, problems reframed, and results.
:::

covery",definition:"Work that reduces uncertainty about whether to build something and what it should be.",why:"Runs alongside delivery rather than before it.",chapters:["05"]},{term:"Impact",definition:"A change in a business or customer result that can be plausibly connected to the work.",why:"Usually shared among many contributors; claim contribution, not sole credit.",chapters:["01","13"],contrast:"Outputs vs outcomes: outputs are things you produce (screens, specs); outcomes are changes in user behavior or results. Impact is the downstream business effect."},{term:"Information architecture",definition:"The structure, grouping, labeling and navigation of information.",why:"Determines findability and how users model the product.",chapters:["02","07"]},{term:"Journey map",definition:"A visualization of a person’s experience over time across a goal, including thoughts and emotions.",why:"Good for finding cross-touchpoint gaps.",chapters:["02","07"],contrast:"User flow vs journey map: a flow shows screens and decisions inside a product; a journey map shows a person’s experience across time and channels."},{term:"Jobs to Be Done",definition:"A lens that explains why people adopt products by the progress they are trying to make in a circumstance.",why:"Useful for framing; it is a perspective, not a validated measurement method.",chapters:["05"]},{term:"Outcome",definition:"A change in user or business behavior that the team is trying to cause.",why:"Roadmaps built on outcomes stay flexible about solutions.",chapters:["01","12"]},{term:"Output",definition:"A deliverable the team produces.",why:"Outputs are necessary and not sufficient evidence of value.",chapters:["01"]},{term:"Problem space",definition:"The set of user needs, contexts and constraints that make a problem worth solving.",why:"Protects against jumping to solutions.",chapters:["01","05"]},{term:"Product roadmap",definition:"A communicated plan of what the team intends to pursue and roughly when.",why:"Sho   <style>:root{--paper:#fff;--bg:#fbfbfa;--wash:#f4f4f2;--ink:#18181b;--ink-soft:#62656e;--terracotta:#2f5bd8;--brand-deep:#2a4fc0;--rule:#e8e8e5;--tint:#eef3ff;--amber:#946200;--sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:var(--sans);--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--measure:40rem;--top:0rem;--side:17rem;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:2rem;-webkit-text-size-adjust:100%}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--brand-deep);text-underline-offset:.2em;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.5rem 1rem;z-index:100}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{font-family:var(--sans);color:var(--ink);line-height:1.2;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2rem,1.5rem + 2vw,2.75rem);margin:.5rem 0 1rem;letter-spacing:-.03em;line-height:1.1}
h2{font-size:1.5rem;margin:3rem 0 1rem}
h3{font-size:1.1875rem;margin:2rem 0 .75rem;letter-spacing:-.01em}
h4{font-size:1rem}

/* top bar */
.top{display:none;position:sticky;top:0;z-index:30;gap:1rem;align-items:center;height:var(--top);padding:0 1.5rem;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:block;font:600 .9375rem/1.2 var(--sans);letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand span{color:var(--ink-soft);font-weight:400}
.quick{margin-left:auto}
.quick input[type=search]{font:inherit;font-size:.875rem;padding:.45rem .8rem;border:1px solid var(--rule);background:var(--bg);border-radius:8px;width:min(16rem,45vw);color:var(--ink)}
.quick input[type=search]:focus{outline:none;border-color:var(--ink-soft);background:var(--paper);box-shadow:none}
.menu{display:none;font:inherit;font-size:.875rem;font-weight:500;border:1px solid var(--rule);background:var(--paper);padding:.4rem .8rem;border-radius:8px;color:var(--ink)}

/* layout */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr) 15rem}
.side{position:sticky;top:var(--top);align-self:start;height:calc(100vh - var(--top));overflow:auto;padding:1.5rem 1rem 3rem 1.5rem;background:#0f1013;color:#e9e9ec;font-size:.875rem;line-height:1.4;scrollbar-width:thin;scrollbar-color:#2c2e35 transparent}
.side ul,.side ol{list-style:none;margin:0;padding:0}
.side-brand{display:block;margin:0 0 2rem;padding:0 .75rem;font:600 1.0625rem/1.2 var(--sans);letter-spacing:-.015em;color:#fff;text-decoration:none}
.side-brand span{margin-top:.2rem;font-size:.8125rem;font-weight:400;letter-spacing:0;color:#8b8d97}
.side a.side-brand{display:block;padding:0 .75rem;background:none;color:#fff}
.side a.side-brand span{display:block}
.side-h{font:500 .75rem/1.35 var(--sans);color:#7d7f89;margin:2rem 0 .5rem .75rem}
.side-brand+.side-h{margin-top:0}
.side ol.chapters{margin:0}
.side a{display:flex;gap:.75rem;align-items:baseline;padding:.5rem .75rem;border-radius:8px;text-decoration:none;color:#b4b6be;transition:background .12s,color .12s}
.side a:hover{color:#fff;background:#18191d}
.side a[aria-current]{color:#fff;font-weight:600;background:#23252b}
.side a:focus-visible{outline:2px solid #5a5c66;outline-offset:-2px}
.side .n{flex:none;min-width:1.25rem;font-size:.75rem;font-variant-numeric:tabular-nums;color:#6c6e78}
.side a[aria-current] .n{color:#b4b6be}
.side a.planned{color:#6c6e78}
.side a.planned:hover{color:#9a9ca6}
.side em{display:none}
.tick{color:var(--terracotta)}
main{padding:3.5rem clamp(1.5rem,4vw,4rem) 8rem;min-width:0}
main:focus,main:focus-visible{outline:none}
main>*{max-width:var(--measure);margin-inline:auto}
main>.hero,main>.part,main>.notice{max-width:48rem}

.right{position:sticky;top:5rem;align-self:start;margin:5rem 1.5rem 2rem 0;padding:0;font-size:.8125rem;line-height:1.4;max-height:calc(100vh - 7rem);overflow:auto;scrollbar-width:thin}
.right .side-h{font:600 .75rem var(--sans);color:var(--ink);margin:0 0 .75rem;padding:0}
.right .bar{display:none}
.toc{list-style:none;padding:0;margin:0}
.toc a{display:block;padding:.35rem 0;color:var(--ink-soft);text-decoration:none}
.toc .l3 a{padding-left:1rem}
.toc a:hover{color:var(--ink)}
.toc a[aria-current]{color:var(--ink);font-weight:600}
/* intro */
.eyebrow{font:500 .8125rem var(--sans);color:var(--ink-soft);margin:0}
.sub,.lede{font-size:1.1875rem;color:var(--ink-soft);line-height:1.6;margin:0 0 1.5rem}
.hero h1{font-size:clamp(2.25rem,1.5rem + 3vw,3.25rem);letter-spacing:-.035em;line-height:1.05;margin:.75rem 0 1rem}
.hero .lede{max-width:36rem}
.bar{height:4px;background:var(--rule);border-radius:99px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--terracotta);width:0}
.bar.small{margin-top:1rem}
.progress-row{max-width:24rem;margin-top:2rem}
.progress-row p{font-size:.8125rem;color:var(--ink-soft);margin:.4rem 0 1.25rem}
.btn{display:inline-flex;align-items:center;font:500 .875rem var(--sans);padding:.55rem 1rem;border-radius:8px;background:var(--ink);color:#fff;border:1px solid var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{background:#000;color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--wash)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.25rem 0}
.notice{background:var(--bg);border:1px solid var(--rule);padding:.9rem 1.1rem;margin:2rem auto;font-size:.875rem;line-height:1.55;border-radius:8px;color:var(--ink-soft)}
.notice strong{color:var(--ink)}

/* home: chapter list */
.part{margin-top:3rem}
.part h2{font:600 .75rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 .5rem;padding:0 0 .75rem;border-bottom:1px solid var(--rule)}
.cards{display:block}
.card{position:relative;display:grid;grid-template-columns:2.5rem 1fr;column-gap:.5rem;padding:1.25rem 0;border-bottom:1px solid var(--rule)}
.card>*{grid-column:2}
.card .meta{grid-column:1;grid-row:1/4;display:block;margin:0}
.card .meta span{display:none}
.card .meta .num{display:block;font:500 .875rem var(--sans);font-variant-numeric:tabular-nums;color:var(--ink-soft);padding-top:.25rem}
.card .meta .rt{display:none}
.card h3{grid-row:1;margin:0 0 .25rem;font-size:1.1875rem}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:after{content:"";position:absolute;inset:0}
.card:not(.planned):hover h3 a{color:var(--brand-deep)}
.card p{margin:0;font-size:.9375rem;color:var(--ink-soft);line-height:1.55}
.card.planned h3,.card.planned p{color:var(--ink-soft);opacity:.75}
.card details{position:relative;z-index:1;font-size:.875rem;margin-top:.6rem}
.card summary{cursor:pointer;color:var(--ink-soft)}
.card summary:hover{color:var(--ink)}
.card details ul{padding-left:1.2rem;color:var(--ink-soft)}
.pill{display:inline-block;font:500 .75rem var(--sans);padding:.1rem .5rem;border-radius:99px;background:var(--wash);color:var(--ink-soft)}
.pill.ok{background:var(--tint);color:var(--brand-deep)}
.plain{list-style:none;padding:0}

/* chapter */
.chapter>.eyebrow{margin-bottom:.25rem}
.prose{font-size:1.0625rem;line-height:1.8;color:#2a2b30}
