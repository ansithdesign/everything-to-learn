.prose h2{margin:5rem auto 1.25rem;font-size:1.75rem}
.prose h3{margin:3rem auto 1rem;font-size:1.25rem}
.prose h2,.prose h3{position:relative}
.anchor{margin-left:.4rem;opacity:0;text-decoration:none;font:400 .9rem var(--sans);color:var(--ink-soft)}
h2:hover .anchor,h3:hover .anchor,.anchor:focus{opacity:1}
.prose p{margin:1.35em auto}
.prose li{margin:.6rem 0}
.prose ul,.prose ol{padding-left:1.5rem}
.prose li::marker{color:var(--ink-soft)}
.prose strong{font-weight:600;color:var(--ink)}
.prose blockquote{margin:3rem auto;padding:0 0 0 1.5rem;border-left:2px solid var(--terracotta);font-size:1.1875rem;color:var(--ink-soft);font-style:italic}
.prose hr{border:0;height:3.5rem;margin:0 auto}
.prose img{max-width:100%;height:auto}
.cite a{text-decoration:none;font:600 .7em var(--sans);color:var(--brand-deep);vertical-align:super;line-height:0}
code{font-family:var(--mono);font-size:.85em;background:var(--wash);padding:.12em .35em;border-radius:4px}
pre.code{font-family:var(--mono);font-size:.8125rem;line-height:1.65;background:var(--wash);border:0;border-radius:8px;padding:1rem 1.15rem;overflow:auto;max-width:100%}
pre.code code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:3rem auto;max-width:100%;font-family:var(--sans)}
table{border-collapse:collapse;font-size:.875rem;line-height:1.5;width:100%;min-width:32rem}
th,td{border-bottom:1px solid var(--rule);padding:.85rem 1rem .85rem 0;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600;font-size:.8125rem;color:var(--ink-soft);background:none}
main>table{min-width:0}

/* callouts: one quiet style, label differentiates */
.box{margin:3rem auto;padding:1.35rem 1.5rem;background:var(--wash);border:0;border-radius:12px;font-family:var(--sans)}
.box>*:first-child{margin-top:0}
.box>*:last-child{margin-bottom:0}
.box p,.box li{font-size:.9375rem;line-height:1.7;margin:.65rem 0;max-width:none}
.box ul,.box ol{padding-left:1.25rem}
.box-label{font:600 .75rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 .5rem!important}
.box-label span{margin-left:.5rem;color:var(--ink-soft);text-transform:none;letter-spacing:0;font-weight:400;font-size:.8125rem}
.box-objectives,.box-definition{background:var(--tint);border-color:transparent}
.box-objectives .box-label,.box-definition .box-label{color:var(--brand-deep)}
.box-warning{background:#fff8e6;border-color:transparent}
.box-warning .box-label{color:var(--amber)}
.box-example,.box-case,.box-scenario,.box-exercise,.box-check{background:var(--wash)}
.box-pull{border:0;background:none;padding:0;font-size:1.35rem;line-height:1.45;font-weight:500;letter-spacing:-.015em;max-width:none}
.box details{margin-top:.8rem}
.box summary{cursor:pointer;font-weight:600;font-size:.875rem}
input[type=checkbox]{accent-color:var(--terracotta);margin-right:.5rem;width:1rem;height:1rem;vertical-align:-.15em}
.box ul:has(input){list-style:none;padding-left:0}

/* end of chapter */
.after{margin-top:5rem}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:5rem auto 0;max-width:var(--measure)}
.pn{display:block;padding:1.1rem 1.25rem;background:var(--wash);border:1px solid transparent;border-radius:8px;text-decoration:none;font-size:.9375rem;font-weight:500;line-height:1.35;color:var(--ink)}
.pn:hover{border-color:var(--ink-soft)}
.pn small{display:block;color:var(--ink-soft);font-size:.75rem;font-weight:400;margin-bottom:.25rem}
.pn:last-child{text-align:right}
textarea,select,input[type=search]{font:inherit;font-size:.9375rem;width:100%;padding:.6rem .75rem;border:1px solid var(--rule);background:var(--paper);border-radius:8px;color:var(--ink)}
textarea:focus,select:focus,input[type=search]:focus{outline:none;border-color:var(--ink-soft)}
.hint{font-size:.8125rem;color:var(--ink-soft)}
.filters{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;max-width:none}
.filters label{font-size:.8125rem;color:var(--ink-soft);flex:1 1 10rem}
.results{padding-left:1.2rem}
.results li{margin:1.1rem 0}
.results p{margin:.2rem 0;font-size:.9rem;color:var(--ink-soft)}
mark{background:#fdeaa3;color:inherit;padding:0 .1em;border-radius:2px}
.index{columns:2;column-gap:2rem;list-style:none;padding:0}
.gloss div{border-top:1px solid var(--rule);padding:1.1rem 0}
.gloss dt{font:600 1.0625rem var(--sans);letter-spacing:-.01em}
.gloss dd{margin:.3rem 0 0}
.gloss p{margin:.4rem 0;font-size:.9375rem}
.contrast{background:var(--wash);padding:.55rem .85rem;border-radius:6px}
.refs li{margin:1.2rem 0}
.refs p{margin:.2rem 0}
.links{font-size:.8125rem;color:var(--ink-soft);word-break:break-word}
.rm{display:grid;grid-template-columns:9rem 1fr;gap:.3rem 1rem;margin:0;font-size:.9rem}
.rm dt{color:var(--ink-soft)}
.rm dd{margin:0}
.comp{border-top:1px solid var(--rule)}
.assess{display:grid;gap:.6rem;margin-top:.8rem}
.assess label{font-size:.8125rem;color:var(--ink-soft)}
.note{white-space:pre-wrap}
.plain-h{font-size:1.125rem}

/* responsive */
@media(max-width:1200px){.layout{grid-template-columns:var(--side) minmax(0,1fr)}.right{display:none}}
@media(max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}
.top{display:flex;position:fixed;top:.75rem;right:.75rem;left:auto;height:auto;padding:0;border:0;background:none;z-index:40}
.brand,.quick{display:none}
.menu{display:inline-block;flex:none;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.side{display:none;position:fixed;inset:0;height:auto;z-index:25;padding:4rem 1.25rem 3rem}
.side a{padding:.7rem .5rem .7rem 1.1rem;font-size:1rem}
body.nav-open .side{display:block}
main{padding:4rem 1.25rem 4rem}
.prose{font-size:1.0625rem;line-height:1.7}
.rm{grid-template-columns:1fr}
.index{columns:1}
.pager{grid-template-columns:1fr}
.quick{flex:1}.quick input[type=search]{width:100%}}
@media print{body{background:#fff;color:#000;font-size:11pt}
.top,.side,.right,.after .actions,.after textarea,.after .hint,.pager,.anchor,.menu{display:none!important}
.layout{display:block}
main{padding:0}
.box{break-inside:avoid;background:none}
.box details:not([open])>*:not(summary){display:block}
a{color:#000}
.prose h2{break-after:avoid}
.prose a[href^=http]:after{content:" (" attr(href) ")";font-size:.8em}}

/* reading bar */
#readbar{position:fixed;top:0;left:var(--side);right:0;padding-right:15rem;z-index:20;height:3.75rem;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:none}
body.reading #readbar{display:block}
#readbar .in{height:100%;max-width:var(--measure);margin:0 auto;display:flex;align-items:center;gap:1.5rem;min-width:0}
#readbar .now{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem;line-height:1.25}
#readbar .ch{font-size:.9375rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readbar .sec{font-size:.8125rem;font-weight:400;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readbar .eta{flex:none;display:flex;align-items:center;gap:.65rem;font-size:.8125rem;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
#readbar .ring{position:relative;order:2;grid-area:1/1;display:block}
#readbar .trk{fill:none;stroke:var(--rule);stroke-width:4.5}
#readbar .arc{fill:none;stroke:var(--terracotta);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .15s linear}
#readbar .pct{display:none}
body.reading main{padding-top:6rem}
@media(max-width:1200px){#readbar{padding-right:0}#readbar .in{max-width:none;padding:0 clamp(1.25rem,4vw,4rem)}}
@media(max-width:860px){#readbar{left:0;padding-right:5rem}#readbar .in{padding:0 1.25rem}body.reading main{padding-top:5rem}}
@media print{#readbar{display:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<script>(function(){function f(){var a=document.querySelector('#sidenav a[aria-current]');if(a){var n=document.getElementById('sidenav'),r=a.getBoundingClientRect(),q=n.getBoundingClientRect();if(r.top<q.top+40||r.bottom>q.bottom-40)n.scrollTop+=r.top-q.top-q.height/3}}addEventListener('hashchange',function(){setTimeout(f,50)});addEventListener('load',function(){setTimeout(f,150)})})()</script>
<script>(function(){
var bar,now,left,fill,words=0,wpm=220,heads=[],prose=null,raf=0;
function mk(){bar=document.createElement('div');bar.id='readbar';bar.setAttribute('aria-hidden','true');bar.innerHTML='<div class="in"><div class="now"><span class="ch"></span><b class="sec"></b></div><div class="eta"><span class="txt"></span><svg class="ring" viewBox="0 0 36 36" width="22" height="22"><circle class="trk" cx="18" cy="18" r="15"/><circle class="arc" cx="18" cy="18" r="15" transform="rotate(-90 18 18)"/></svg><span class="pct"></span></div></div>';document.body.appendChild(bar);now=bar.querySelector('.sec');left=bar.querySelector('.txt');fill=bar.querySelector('.arc');bar.ch=bar.querySelector('.ch');bar.pct=bar.querySelector('.pct')}
function setup(){
 var p=document.querySelector('.chapter .prose');
 if(p===prose)return;
 prose=p;
 if(!p){document.body.classList.remove('reading');return}
 if(!bar)mk();
 document.body.classList.add('reading');
 heads=[].slice.call(p.querySelectorAll('h2,h3'));
 words=(p.textContent||'').trim().split(/\s+/).length;
 var m=(document.querySelector('.chapter .eyebrow')||{}).textContent||'';m=m.match(/(\d+)\s*min/);
 wpm=m?Math.max(120,words/+m[1]):220;
 update();
}
function clean(h){return (h.textContent||'').replace(/#|¶/g,'').replace(/^\s*\d+\.\s*/,'').trim()}
function update(){
 raf=0;
 if(!prose)return;
 var r=prose.getBoundingClientRect(),vh=innerHeight,total=r.height-vh*0.6;
 var pr=Math.min(1,Math.max(0,(-r.top+vh*0.25)/Math.max(1,r.height-vh*0.5)));
 var cur=null;for(var i=0;i<heads.length;i++){if(heads[i].getBoundingClientRect().top<140)cur=heads[i];else break}
 var t=document.querySelector('.chapter h1'),ey=(document.querySelector('.chapter .eyebrow')||{}).textContent||'',cn=ey.match(/Chapter\s+\d+/);
 bar.ch.textContent=(cn?cn[0].replace(/\s+/,' ')+' · ':'')+((t&&t.textContent)||'');
 now.textContent=cur?clean(cur):'Introduction';
 var mins=Math.ceil(words*(1-pr)/wpm);
 left.textContent=pr>=0.98?'Finished':(mins<=1?'< 1 min left':mins+' min left');
 bar.pct.textContent=Math.round(pr*100)+'%';
 fill.style.strokeDashoffset=94.25*(1-pr);
}
function sched(){if(!raf)raf=requestAnimationFrame(update)}
addEventListener('scroll',sched,{passive:true});addEventListener('resize',sched);
addEventListener('hashchange',function(){setTimeout(function(){prose=undefined;setup()},80)});
setInterval(function(){setup();sched()},500);
})()</script>
